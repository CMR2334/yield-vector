   the title wrapped mid-phrase straight into the button. Keep the title whole
   and let the button drop to its own line instead. */
@media (max-width: 560px) {
  .form-section .card-header { flex-wrap: wrap; row-gap: var(--space-2); }
  .form-section .card-header h2 { white-space: nowrap; }
}

.form-grid {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
  gap: var(--space-4);
  /* Stretch each field to fill its cell so the input within can pin to
     the bottom — that way labels of different lengths (one-liner vs
     wrapped two-liner) don't push their inputs onto different baselines. */
  align-items: stretch;
}

.field {
  display: flex;
  flex-direction: column;
  gap: 6px;
  /* `min-width: 0` lets the field shrink below the intrinsic size of its
     contents (e.g. long hint text). Without this, flex/grid items have
     `min-width: auto` which forces the cell wider than the parent and
     creates the modal-wide horizontal-scroll bug on phones. */
  min-width: 0;
}
/* Round 58: one step lighter (--text-secondary → --text-tertiary) and one
   weight step down (600 → 500) so these read as quiet wayfinding — never
   competing with the darker, heavier input VALUE text below. */
.field label, .field-label {
  font-size: 12px;
  font-weight: 500;
  color: var(--text-tertiary);
  text-transform: uppercase;
  letter-spacing: 0.02em;
  line-height: 1.25;
}
/* OFFER-FORM ONLY: the dense 2-column offer modal needs reserved label
   height + bottom-pinned inputs so a 2-line label and a 1-line label in
   the same row keep their inputs on one baseline. Scoped to #offer-form
   so it doesn't distort the single-column Settings forms (which have
   hints in varying positions and were rendering at uneven heights). */
#offer-form .field label { min-height: 30px; display: flex; align-items: flex-end; }
/* Round 58: the bottom-pin rule above is meant for the GROUP-level label
   ("Offer type *") sitting outside a box, but `label` also matches every
   individual segment `<label>` inside a nested .radio-group (Offer type,
   DD-requirement mode, Funded/Open date) — its `align-items: flex-end`
   was winning over .radio-group label's own `align-items: center` (same
   specificity elsewhere, but here the shared #offer-form .field ID+class
   prefix ties them, and source order decided it), bottom-anchoring text
   in the pill instead of centering it. Needed one more class than the
   rule above to win on specificity within #offer-form; the plain
   `.radio-group label` rule (~line 1808) already centers correctly for
   the one segmented control outside #offer-form (Settings → Default lock
   interval start), so this override only needs to exist here. */
#offer-form .field .radio-group label {
  min-height: 40px;
  display: flex;
  align-items: center;
  justify-content: center;
}
#offer-form .field > .input,
#offer-form .field > .select,
#offer-form .field > .textarea,
#offer-form .field > .input-group,
#offer-form .field > .radio-group {
  margin-top: auto;
}

/* ============================================================
   FIELD-BOX — single-value text/number/date/select container
   ============================================================
   Fintech-settings-style pattern (owner-provided reference, Round 57):
   the label moves INSIDE a rounded bordered "well" that sits above the
   value on its own line, borderless input beneath it. Scoped to fields
   whose primary control is a single input/select/textarea (or an
   .input-group wrapping one) — radio-groups, checkbox stacks, and the
   color picker keep their existing look (per AGENTS.md: don't touch
   what isn't broken, and those controls don't map to a "label above
   value" shape). Uses the app's own --card-soft/--border-soft "recessed
   panel" pairing already established by .ddm-panel/table styling — NOT
   the reference screenshot's literal colors. */
.field-box {
  display: flex;
  flex-direction: column;
  gap: 6px;
  width: 100%;
  min-width: 0;
  box-sizing: border-box;
  padding: 10px 18px;
  background: var(--card-soft);
  border: 1px solid var(--border-soft);
  border-radius: var(--radius-lg);
  transition: border-color 0.15s, box-shadow 0.15s;
}
.field-box:focus-within {
  border-color: var(--accent);
  box-shadow: 0 0 0 3px var(--accent-soft);
}
/* Label inside the box: small, muted, normal weight, sits above the
   value — overrides the uppercase/letter-spaced look used by labels
   OUTSIDE a box (radio-group headings, checkbox rows, etc). Round 58:
   color matched to the same --text-tertiary muted tone as the outside-box
   group labels (was --text-secondary, one shade darker than the group
   labels — now both label registers read as the same quiet wayfinding). */
.field-box label, .field-box .field-label {
  font-size: 12px;
  font-weight: 500;
  color: var(--text-tertiary);
  text-transform: none;
  letter-spacing: 0;
  line-height: 1.3;
  min-height: 0;
  display: block;
}
.field-box:focus-within label { color: var(--accent); }
/* The control itself becomes borderless/transparent — the box IS the
   border now. Re-declared with higher specificity than the base
   .input/.select/.textarea rule rather than stripping border there,
   since plain (non-boxed) inputs don't exist in this app after R57 but
   the base rule is kept for any future non-boxed use. */
/* Round 58: value text is regular weight (was 500) and one shade lighter
   than heading-tone --text — --text-strong is the app's dedicated
   body-strong tone (see :root, ~line 28), staying comfortably darker than
   every label so values remain the unmistakable primary data at a glance. */
.field-box .input,
.field-box .select,
.field-box .textarea,
.field-box input,
.field-box select,
.field-box textarea {
  border: none;
  background: transparent;
  padding: 0;
  border-radius: 0;
  font-size: 16px;
  font-weight: 400;
  color: var(--text-strong);
  min-height: 0;
  height: auto;
  line-height: 1.35;
}
.field-box .input:focus,
.field-box .select:focus,
.field-box .textarea:focus,
.field-box input:focus,
.field-box select:focus,
.field-box textarea:focus {
  outline: none;
  box-shadow: none;
  border: none;
}
/* .input-group PREFIX inside a box: the base .input-group mechanism
   (below, ~line 1571) absolutely-positions .input-prefix over the input
   and relies on padding-left to clear it — that padding number was tuned
   for the OLD bordered input box, and 16px wasn't enough clearance for a
   flush-left "$" once real digits render at the same offset (R57 bug:
   prefix glyph overlapped the value's first digit, only visible once a
   value existed — an empty input has nothing to collide with). Rather
   than re-tune a magic padding number against a floating glyph, make
   .input-group a normal flex row instead so the prefix sits in-flow as
   a static flex item — no absolute positioning, no overlap possible by
   construction. No app usage ever combines prefix + suffix in the same
   .input-group (checked), so this flex row is safe to apply unconditio-
   nally; suffix keeps the base absolute-right mechanism (confirmed
   rendering correctly — narrow suffix values don't collide with it) and
   still works fine as an out-of-flow absolutely-positioned child of a
   flex container. Avoided :has() deliberately — unconditional flex needs
   no feature-detection and covers both prefix-only and suffix-only
   groups identically. */
.field-box .input-group {
  margin-top: 1px;
  display: flex;
  align-items: baseline;
}
.field-box .input-group.with-suffix .input { padding-right: 48px; }
.field-box .input-group .input-suffix { right: 0; }
.field-box .input-group .input-prefix {
  position: static;
  flex: 0 0 auto;
  transform: none;
  /* R62→R69: tie the "$" to the value. Owner re-flagged the gap as still too
     wide, so halve it (4px → 2px) — the "$" now sits right against the first
     digit. Value tone (--text-strong) so it parses as part of the amount. */
  margin-right: 2px;
  font-size: 16px;
  color: var(--text-strong);
}
.field-box .input-group .input {
  flex: 1 1 auto;
  min-width: 0;
  padding-left: 0;
}
.field-box .textarea { resize: vertical; min-height: 60px; }
/* Native date/number appearance stripping still applies (see the
   MODAL FORM CONTAINMENT block below) — the box wrapper doesn't change
   that need, just where the border now lives. */
.field-box .input[type="date"],
.field-box .input[type="datetime-local"],
.field-box .input[type="time"],
.field-box .input[type="number"] {
  -webkit-appearance: none;
  appearance: none;
  min-height: 0 !important;
  height: auto !important;
  padding: 0 !important;
}
/* #offer-form's bottom-pinned-input baseline hack (above) targeted the
   label/input as separate flex children; now that both live inside one
   .field-box, pin the BOX itself to the bottom of the field cell so
   mixed one-line/two-line labels in the same grid row still keep their
   boxes aligned. */
#offer-form .field > .field-box { margin-top: auto; }
/* #offer-form .field label (R57 bottom-pin rule, ~line 1504) also matches
   labels nested inside a .field-box here — its min-height:30px/flex/
   align-items:flex-end was built for the OUTSIDE-box group-label baseline
   hack, not the in-box label pattern, and was winning the cascade (ID+class
   beats .field-box label's class+class) so every single-line in-box label
   in the offer/commitment/event modals was force-stretched to 30px tall
   instead of sizing to its own ~15.6px line-height — inflating every box by
   the difference and reading as oversized with the label floating away
   from its value (owner feedback, R61). Box-pinning above already replaced
   the need for the label itself to carry baseline alignment inside a box,
   so reset it back to .field-box's own sizing here. */
#offer-form .field-box label { min-height: 0; display: block; align-items: normal; }
/* Settings / non-modal forms: top-align each field so mixed hint presence
   doesn't leave big gaps or uneven heights. */
.form-section .form-grid { align-items: start; }

/* Capital & projection: a deliberate 3-up grid on desktop (2-up on
   tablet) instead of `auto-fit`, which produced 5 cramped columns and
   ragged wrapping. align-items:stretch + bottom-pinned controls keep
   every input in a row on the same baseline even when a hint wraps to
   two lines. The ≤720px flex-column rules below still win on mobile. */
#capital-grid {
  grid-template-columns: repeat(3, minmax(0, 1fr));
  align-items: stretch;
}
#capital-grid .field > .input,
#capital-grid .field > .select,
#capital-grid .field > .input-group,
#capital-grid .field > .radio-group { margin-top: auto; }
@media (max-width: 1024px) {
  #capital-grid { grid-template-columns: repeat(2, minmax(0, 1fr)); }
}
.field-hint { font-size: 12px; color: var(--text-tertiary); margin-top: 2px; }
/* Feature 1 (2026-07-13b): gentle inline warning when a TYPED/pasted date
   violates the field's floor/ceiling (the picker grays these, but typing must not
   be a silent loophole). Reuses the field-hint idiom in a danger tone. Inside a DD
   row (a grid) it spans the full width. */
.field-hint.yv-date-warn { color: var(--danger); font-weight: 500; }
.dd-row > .field-hint.yv-date-warn { grid-column: 1 / -1; margin-top: 0; }

.input, .select, .textarea {
  width: 100%;
  display: block;
  /* Match `.field { min-width: 0 }` so inputs can shrink to the column
     width on narrow screens. Some native widgets (date, number) carry an
     intrinsic min-width that would otherwise overflow the form column.
     `box-sizing: border-box` is set globally on `*`, but re-stating here
     makes the no-overflow contract explicit at the input level. */
  min-width: 0;
  max-width: 100%;
  box-sizing: border-box;
  padding: 10px 12px;
  border: 1.5px solid var(--border);
  background: var(--card);
  border-radius: var(--radius-md);
  font-size: 14px;
  color: var(--text);
  transition: border-color 0.1s, box-shadow 0.1s;
  font-family: inherit;
}
/* Input groups (currency-prefix, days-suffix) wrap the input in a
   relative-position div for the absolutely-positioned prefix/suffix. The
   wrapper itself must stay constrained so the inner input can't overflow
   the field cell on phones — Safari's intrinsic native-control widths
   would otherwise push the right edge past the modal. */
.input-group {
  position: relative;
  width: 100%;
  min-width: 0;
  max-width: 100%;
  box-sizing: border-box;
}
.input:focus, .select:focus, .textarea:focus {
  outline: none;
  border-color: var(--accent);
  box-shadow: 0 0 0 3px rgba(91, 92, 246, 0.15);
}
.input[type="number"] { font-feature-settings: 'tnum' 1; }
/* Native date/time inputs (e.g. Settings → Projection start date) carry an
   intrinsic min-width from the iOS/WebKit UA spinner that overflows the
   field's right edge on mobile despite width:100%. Strip the appearance so
   they collapse to our box — same fix the modal blast-radius applies, but
   these settings fields live outside any modal. The native picker still
   opens on tap. */
.input[type="date"],
.input[type="datetime-local"],
.input[type="time"] {
  -webkit-appearance: none;
  appearance: none;
  width: 100%;
  max-width: 100%;
  min-width: 0;
  box-sizing: border-box;
}
.textarea { resize: vertical; min-height: 72px; }

.input-group .input-prefix { position: absolute; left: 12px; top: 50%; transform: translateY(-50%); color: var(--text-tertiary); font-size: 14px; pointer-events: none; }
.input-group .input-suffix { position: absolute; right: 12px; top: 50%; transform: translateY(-50%); color: var(--text-tertiary); font-size: 13px; pointer-events: none; }
/* R69: tighten the "$"-to-digit gap on the absolute-prefix variant (req-row
   amount, settings, commitment/event money) — the "$" sits at left:12px, so
   28px left-padding left ~7px of dead space before the first digit. 24px
   roughly halves it (~3px) without the glyph colliding with the value. */
.input-group .input { padding-left: 24px; }
.input-group.with-suffix .input { padding-right: 60px; }

/* ============================================================
   MODAL FORM CONTAINMENT — BLAST RADIUS CONTROL
   The Add-Offer modal mixes plain inputs, .input-group wrappers,
   and inline style="grid-column: 1 / -1" annotations. Fields 5+6
   ("Offer expires", "Planned signup date") were overflowing on
   mobile because <input type="date"> in iOS Safari has an intrinsic
   min-width from its native chevron/spinner UI that exceeds
   `width: 100%` even with box-sizing: border-box. The rules below
   are deliberately !important because every other layer has been
   tried — this is the wall.
   ============================================================ */
.modal,
.modal-card,
.modal-body,
.modal .form-grid {
  overflow-x: hidden !important;
}
.modal .field,
.modal .form-grid > *,
.modal .input-group,
.modal .radio-group,
.modal .input,
.modal .select,
.modal .textarea {
  width: 100% !important;
  max-width: 100% !important;
  min-width: 0 !important;
  box-sizing: border-box !important;
  flex-shrink: 1 !important;
}
.modal .field,
.modal .form-grid > * {
  /* Neutralize any inline style="grid-column: 1 / -1" or similar so
     they're no-ops in our flex-column form layout on mobile. */
  grid-column: 1 / -1 !important;
}
/* Native date/time/number widgets carry an intrinsic min-width from
   the WebKit/Blink user-agent stylesheet. Strip the appearance so
   they collapse to the box we give them, not their native size. */
.modal .input[type="date"],
.modal .input[type="datetime-local"],
.modal .input[type="time"],
.modal .input[type="number"] {
  -webkit-appearance: none !important;
  appearance: none !important;
  /* Re-add a minimal indicator so the field still reads as a date/
     number control after appearance:none strips the chevron. The
     native picker still works on tap — this is just visual. */
  background-image: none;
  /* Ensure empty date inputs match the height of text inputs */
  min-height: 44px !important;
  height: 44px !important;
  line-height: normal !important;
  padding-top: 10px !important;
  padding-bottom: 10px !important;
}
/* Field-box (R57) wins the fixed-height tie above by appearing later in
   the cascade at equal specificity: inside a box the control is
   borderless/flush, so the old bordered-input 44px/10px box-model no
   longer applies — the .field-box padding (12px 18px) now carries the
   tap-target height instead. */
.modal .field-box .input[type="date"],
.modal .field-box .input[type="datetime-local"],
.modal .field-box .input[type="time"],
.modal .field-box .input[type="number"] {
  min-height: 0 !important;
  height: auto !important;
  line-height: 1.35 !important;
  padding-top: 0 !important;
  padding-bottom: 0 !important;
}
/* R69 (Item 6): requirement-row number/date inputs are NOT inside a .field-box,
   so the 44px tap-target rule above forced the count "×" and deadline "d" boxes
   to 44px while the sibling text/money inputs sized to the req-row's own 34px —
   leaving those boxes visibly TALLER (owner screenshot). Re-assert the req-row's
   compact 34px height + 6px vertical padding so every control in a requirement
   row shares one height/baseline. Left/right padding (incl. the with-suffix
   26px clearance) is untouched. */
.modal .req-row .input[type="date"],
.modal .req-row .input[type="datetime-local"],
.modal .req-row .input[type="time"],
.modal .req-row .input[type="number"] {
  min-height: 0 !important;
  height: 34px !important;
  line-height: normal !important;
  padding-top: 6px !important;
  padding-bottom: 6px !important;
}

/* DD-requirement controls are meant to read as a compact inline rule
   ("Once per [month] for [3] months"). The blast-radius width:100% above
   would stretch each to full width and stack them awkwardly, so re-assert
   compact widths here (higher specificity + !important beats the wall).
   With these, the row fits "Once per [sel] for [n][unit]" on one line and
   gracefully wraps "Generate dates" beneath instead of stacking giants. */
.modal #ddreq-freq-fields .select {
  width: 112px !important;
  max-width: 112px !important;
  flex: 0 0 auto !important;
}
.modal #ddreq-freq-fields .input-group {
  width: 122px !important;
  max-width: 122px !important;
  flex: 0 0 auto !important;
}
.modal #ddreq-count-fields .input-group {
  width: 138px !important;
  max-width: 138px !important;
}

.checkbox-row { display: flex; align-items: center; gap: var(--space-2); cursor: pointer; padding: 4px 0; }
.checkbox-row input[type="checkbox"] {
  appearance: none;
  -webkit-appearance: none;
  width: 18px; height: 18px;
  border: 2px solid var(--border-strong);
  border-radius: 5px;
  cursor: pointer;
  position: relative;
}
.checkbox-row input[type="checkbox"]:checked { background: var(--accent); border-color: var(--accent); }
.checkbox-row input[type="checkbox"]:checked::after {
  content: '';
  position: absolute;
  left: 4px; top: 0;
  width: 5px; height: 9px;
  border: solid white;
  border-width: 0 2px 2px 0;
  transform: rotate(45deg);
}

.radio-group {
  display: flex;
  flex-wrap: nowrap;
  gap: 0;
  background: var(--bg);
  border-radius: var(--radius-md);
  padding: 3px;
  width: 100%;
}
.radio-group label {
  flex: 1 1 0%;
  min-width: 0;
  display: flex;
  align-items: center;
  justify-content: center;
  text-align: center;
  padding: 8px 12px;
  border-radius: 8px;
  font-size: 13px;
  font-weight: 500;
  color: var(--text-secondary);
  cursor: pointer;
  transition: background 0.1s, color 0.1s;
}
.radio-group input[type="radio"] { display: none; }
.radio-group input[type="radio"]:checked + label { background: var(--card); color: var(--text); box-shadow: var(--shadow-sm); font-weight: 600; }

/* ============================================================
   MODAL / DRAWER
   ============================================================ */
.modal {
  position: fixed;
  inset: 0;
  z-index: 100;
  display: none;
  background: rgba(13, 20, 33, 0.45);
  backdrop-filter: blur(2px);
  align-items: flex-start;
  justify-content: center;
  padding: var(--space-8) var(--space-4);
  overflow-y: auto;
}
.modal.open { display: flex; }

/* Cloud-history restore list */
.sync-hist-list { display: flex; flex-direction: column; gap: var(--space-2); }
.sync-hist-row {
  display: flex; align-items: center; justify-content: space-between; gap: var(--space-3);
  padding: 10px 12px; border: 1px solid var(--border-soft); border-radius: var(--radius-md);
  background: var(--card-soft);
}
.sync-hist-meta { min-width: 0; }
.sync-hist-when { font-size: 13px; font-weight: 600; color: var(--text); }
.sync-hist-counts { font-size: 12px; color: var(--text-secondary); margin-top: 2px; }

.modal-card {
  background: var(--card);
  border-radius: var(--radius-xl);
  width: 100%;
  max-width: 640px;
  box-shadow: var(--shadow-modal);
  overflow: hidden;
  display: flex;
  flex-direction: column;
  max-height: calc(100vh - 64px);
}

.modal-header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: var(--space-5) var(--space-6);
  border-bottom: 1px solid var(--border-soft);
}
.modal-title { font-size: 18px; font-weight: 600; letter-spacing: -0.01em; }
.modal-body {
  padding: var(--space-6);
  overflow-y: auto;
  /* Defensive: if any inner element overflows horizontally on narrow
     viewports, clip it instead of letting the user scroll the whole modal
     left/right. Vertical scroll for long forms is still preserved. */
  overflow-x: hidden;
  flex: 1;
}
.modal-footer {
  padding: var(--space-4) var(--space-6);
  border-top: 1px solid var(--border-soft);
  display: flex;
  justify-content: space-between;
  gap: var(--space-2);
  align-items: center;
}

.advanced-toggle {
  display: flex;
  align-items: center;
  gap: 6px;
  padding: var(--space-3) 0;
  margin: var(--space-4) 0;
  border-top: 1px solid var(--border-soft);
  font-size: 13px;
  color: var(--text-secondary);
  font-weight: 500;
  cursor: pointer;
  width: 100%;
  justify-content: space-between;
}
.advanced-toggle .chevron { transition: transform 0.15s; }
.advanced-toggle[aria-expanded="true"] .chevron { transform: rotate(180deg); }

.advanced-fields { display: none; flex-direction: column; gap: var(--space-4); }
.advanced-fields.open { display: flex; }

/* Transient highlight when a needs-data review row taps through to its field
   (ISSUE 2c) — an accent ring that fades out, reusing the accent tokens. */
@keyframes yv-field-flash {
  0%, 20% { box-shadow: 0 0 0 3px var(--accent-mid); }
  100%    { box-shadow: 0 0 0 3px transparent; }
}
.yv-field-flash {
  animation: yv-field-flash 1.8s ease-out forwards;
  border-radius: var(--radius, 8px);
}

/* ============================================================
   TABLES
   ============================================================ */
.table-wrap { overflow-x: auto; border-radius: var(--radius-lg); border: 1px solid var(--border-soft); }
.form-section .table-wrap {
  margin-left: calc(-1 * var(--space-6));
  margin-right: calc(-1 * var(--space-6));
  border-left: none;
  border-right: none;
  border-radius: 0;
}

table.data-table {
  width: 100%;
  font-size: 13px;
  border-collapse: collapse;
  background: var(--card);
}
.data-table th {
  text-align: left;
  font-weight: 600;
  font-size: 11px;
  color: var(--text-tertiary);
  text-transform: uppercase;
  letter-spacing: 0.02em;
  padding: var(--space-3);
  background: var(--card-soft);
  border-bottom: 1px solid var(--border);
  white-space: nowrap;
}
.data-table td {
  padding: var(--space-3);
  border-bottom: 1px solid var(--border-soft);
  vertical-align: middle;
}
.data-table tbody tr:hover { background: var(--bg); }
.data-table tbody tr:last-child td { border-bottom: none; }

.num { text-align: right; font-feature-settings: 'tnum' 1; }
.row-warn { background: rgba(245, 158, 11, 0.06); }
.row-danger { background: rgba(239, 68, 68, 0.07); }

/* ============================================================
   OPTIMIZE BAR (Plan tab · Optimize segment)
   ============================================================ */
.optimizer-bar {
  background: var(--card);
  border-radius: var(--radius-xl);
  padding: var(--space-5) var(--space-6);
  box-shadow: var(--shadow-card);
  margin-bottom: var(--space-5);
  display: flex;
  flex-wrap: wrap;
  gap: var(--space-4);
  align-items: center;
  justify-content: space-between;
}

.optimizer-summary {
  display: flex;
  gap: var(--space-6);
  flex-wrap: wrap;
}
.optimizer-summary .metric { display: flex; flex-direction: column; gap: 2px; }
.optimizer-summary .metric .label { font-size: 11px; color: var(--text-tertiary); font-weight: 600; text-transform: uppercase; letter-spacing: 0.02em; }
.optimizer-summary .metric .value { font-size: 18px; font-weight: 600; }

/* Shared with the Optimize plan card's head/meta (renderOptimizeSegment). */
.combo-rank { font-size: 11px; font-weight: 700; color: var(--text-tertiary); text-transform: uppercase; letter-spacing: 0.02em; }
.combo-bonus { font-size: 22px; font-weight: 700; letter-spacing: -0.02em; color: var(--success); }
.combo-meta { margin-bottom: var(--space-3); display: flex; flex-wrap: wrap; gap: 10px 20px; align-items: baseline; }
.opt-metric { display: inline-flex; flex-direction: column; gap: 2px; min-width: 0; }
.opt-metric-val { font-size: 15px; font-weight: 700; color: var(--text); letter-spacing: -0.01em; font-feature-settings: 'tnum' 1; white-space: nowrap; }
.opt-metric-lbl { font-size: 10px; font-weight: 600; text-transform: uppercase; letter-spacing: 0.03em; color: var(--text-tertiary); white-space: nowrap; }
.opt-meta-warn { align-self: center; font-size: 12px; font-weight: 600; color: #b45309; }
.opt-meta-danger { align-self: center; font-size: 12px; font-weight: 600; color: var(--danger); }

/* ============================================================
   OPTIMIZE SEGMENT — engine proposal (Plan tab › Optimize)
   ============================================================ */
.opt-plan-card { margin-bottom: var(--space-4); }
.opt-plan-card.invalid { border-color: rgba(232, 113, 113, 0.4); }
.opt-plan-head { display: flex; justify-content: space-between; align-items: flex-start; gap: var(--space-3); margin-bottom: var(--space-2); }
.opt-bonus-cap { font-size: 12px; font-weight: 600; color: var(--text-tertiary); letter-spacing: 0; }
.opt-valid { font-size: 11px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.03em; padding: 3px 9px; border-radius: var(--radius-pill); white-space: nowrap; }
.opt-valid.ok { color: var(--success); background: var(--success-soft); }
.opt-valid.bad { color: #c95555; background: var(--danger-soft); }
.opt-invalid-note { font-size: 13px; color: #c95555; margin-bottom: var(--space-3); }
.opt-sequence { display: flex; flex-direction: column; gap: var(--space-2); }
.opt-seq-row { padding: var(--space-3); background: var(--bg); border-radius: var(--radius-md); position: relative; }
.opt-seq-top { display: flex; justify-content: space-between; align-items: center; gap: var(--space-2); margin-bottom: 4px; }
.opt-seq-name { font-size: 14px; font-weight: 600; color: var(--text); min-width: 0; overflow-wrap: anywhere; }
/* Sign-up bonus pinned to the lower-right corner (item 3). Full comma dollars,
   green like every other bonus figure. The dates/badges rows reserve a
   right-edge gutter so wrapped content can never slide under it. */
.opt-seq-bonus { position: absolute; right: var(--space-3); bottom: var(--space-3); font-size: 13px; font-weight: 700; color: var(--success); font-feature-settings: 'tnum' 1; white-space: nowrap; letter-spacing: -0.01em; }
.opt-op-badge { font-size: 10px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.03em; padding: 2px 7px; border-radius: var(--radius-pill); background: var(--accent-soft); color: var(--accent-strong); white-space: nowrap; flex-shrink: 0; }
.opt-op-badge.create { background: var(--success-soft); color: #0f8a5f; }
.opt-seq-dates { display: flex; flex-wrap: wrap; gap: 4px 12px; font-size: 12px; color: var(--text-secondary); padding-right: 68px; }
.opt-seq-dates strong { color: var(--text); font-weight: 600; font-feature-settings: 'tnum' 1; }
.opt-seq-badges { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 6px; padding-right: 68px; }
.opt-badge { font-size: 11px; padding: 2px 8px; border-radius: var(--radius-pill); background: var(--card-soft); border: 1px solid var(--border); color: var(--text-secondary); }
.opt-badge.warn { background: var(--warning-soft); border-color: rgba(245, 158, 11, 0.3); color: #92400e; }
.opt-badge.ok { background: var(--success-soft); border-color: rgba(16, 185, 129, 0.3); color: #047857; }
.opt-recheck { font-size: 11px; font-weight: 600; padding: 2px 10px; border-radius: var(--radius-pill); background: transparent; border: 1px solid var(--accent-mid); color: var(--accent); cursor: pointer; font-family: inherit; }
.opt-recheck:hover { background: var(--accent-soft); }
.opt-recheck:disabled, .opt-recheck.is-loading { opacity: 0.6; cursor: default; }
.opt-hints { margin-top: var(--space-3); padding-top: var(--space-3); border-top: 1px solid var(--border-soft); }
.opt-hints-title { font-size: 11px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.02em; color: var(--text-tertiary); margin-bottom: 6px; }
.opt-hint { font-size: 12px; color: var(--text-secondary); padding: 2px 0; }
.opt-hint strong { color: var(--text); }
.opt-empty-seq { font-size: 13px; color: var(--text-secondary); padding: var(--space-3); background: var(--bg); border-radius: var(--radius-md); }
.opt-alts { margin-bottom: var(--space-4); }
.opt-alts-title { font-size: 11px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.02em; color: var(--text-tertiary); margin-bottom: var(--space-2); }
.opt-alts-list { display: flex; flex-direction: column; gap: var(--space-2); }
.opt-alt { display: flex; flex-wrap: wrap; align-items: baseline; gap: 8px 20px; width: 100%; padding: var(--space-3); border: 1px solid var(--border); border-radius: var(--radius-md); background: var(--card); cursor: pointer; font-family: inherit; text-align: left; transition: border-color 0.15s, box-shadow 0.15s; }
.opt-alt:hover { border-color: var(--accent-mid); }

   (--danger-deep) — reads as "your entered schedule already breaches", distinct

/* About & diagnostics (Settings) */
.about-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(140px, 1fr)); gap: var(--space-2); margin-bottom: var(--space-3); }

.about-label { font-size: 11px; text-transform: uppercase; letter-spacing: 0.02em; color: var(--text-tertiary); }

.diag-head { display: flex; justify-content: space-between; align-items: baseline; gap: var(--space-2); }

.diag-ctx { font-size: 11px; color: var(--text-secondary); margin-top: 2px; font-family: ui-monospace, SFMono-Regular, Menlo, monospace; }

/* Full-screen render-failure recovery panel */
.error-state { max-width: 520px; margin: 12vh auto 0; padding: var(--space-6); text-align: center; }
.error-state h1 { font-size: 20px; margin: 0 0 var(--space-3); color: var(--text-primary); }

.error-state-actions { display: flex; gap: var(--space-2); justify-content: center; margin-top: var(--space-4); flex-wrap: wrap; }

.toolbar {

/* Plan-tab segmented control (Planner · Timeline · Optimize) — the

.plan-segmented {

.plan-seg-btn:hover { color: var(--text); }
.plan-seg-btn.active {

.section-header {
  display: flex;
  justify-content: space-between;
  align-items: center;

  margin-bottom: var(--space-4);

.section-header h2 { font-size: 22px; font-weight: 700; letter-spacing: -0.02em; }
.section-header p { font-size: 14px; color: var(--text-secondary); }

.row-action-buttons { display: flex; gap: var(--space-1); justify-content: flex-end; }

/* ============================================================
   TOUCH TARGETS
   ============================================================
   Several controls are deliberately small for visual density (the include /
   done circles 22px, the Upcoming pager 24px, the sync chip 23px on mobile,
   icon buttons 36px) — all well under the 44pt comfortable-tap minimum. Each
   gets an invisible, centered 44x44 hit area from an absolutely-positioned
   pseudo-element: out of flow, so no element's rendered box, position, or size
   changes — only the region that accepts the tap. Scoped to coarse pointers so
   mouse hover targets stay exactly as drawn.
   ::before, NOT ::after — .offer-include already uses ::after for its glyph.
   The 18px .checkbox-row checkboxes are deliberately EXCLUDED. They stack 38px
   apart inside the event/commitment modals, so a centered 44px band overlapped
   its neighbour by 6px and a tap 10px under "Include in projection" silently
   toggled "Display on Overview chart" instead. They need no expansion anyway:
   .checkbox-row is a <label> wrapping the input, so the full-width row — glyph
   AND text — is already the tap target.
   The bottom nav's 34pt row height is deliberately NOT touched here: raising
   it changes visible layout, so it stays an owner decision.
   ============================================================ */
@media (pointer: coarse) {
  .offer-include,
  .action-check,
  .upcoming-pg-btn,
  .btn-icon,
  .sync-indicator { position: relative; }

  .offer-include::before,
  .action-check::before,
  .upcoming-pg-btn::before,
  .sync-indicator::before {
    content: '';
    position: absolute;
    left: 50%;
    top: 50%;
    width: 44px;
    height: 44px;
    transform: translate(-50%, -50%);
  }

  /* .btn-icon buttons often sit in tight adjacent pairs (edit/delete,
     edit/duplicate) with only a few px of gap between 36px buttons — a
     full 44px-wide centered hit band overlaps its neighbor's, so a tap in
     the sliver between them hits the wrong control. Expand vertically only;
     horizontally the hit area stays at the button's own width (left:0;
     right:0 spans exactly the element, no extra reach into the gap), so
     adjacent bands meet without crossing. Still ≥44pt tall. */
  .btn-icon::before {
    content: '';
    position: absolute;
    left: 0;
    right: 0;
    top: 50%;
    height: 44px;
    transform: translateY(-50%);
  }

/* ============================================================
   RESPONSIVE
   ============================================================ */
/* 804px, not 720px: the desktop header (wordmark + 5 nav pills + sync chip +
   "Add offer") has an intrinsic minimum of 805px, so every viewport in the
   721–804 band scrolled sideways with "Add offer" hanging off the edge —
   iPad mini portrait (744pt) lives in that band. The compact header + bottom
   nav now take over one pixel below where the desktop header stops fitting. */
@media (max-width: 804px) {

  /* Tighter gutters than desktop, but still inset-aware (see the base rule). */
  .app-header { padding: env(safe-area-inset-top, 0px) max(var(--space-4), env(safe-area-inset-right, 0px)) 0 max(var(--space-4), env(safe-area-inset-left, 0px)); }
  .mobile-nav { display: flex; }
  .fab { display: flex; }
  .app-main {
    /* Bottom padding clears BOTH the fixed mobile nav AND the FAB that floats
       above it (bottom = nav+safe+12, height 56). Without the FAB allowance the
       last offer card scrolled under the button (~36px overlap at 375px).
       Side gutters take the larger of the design gutter and the display-cutout
       inset (landscape). */
    padding: var(--space-4) max(var(--space-4), env(safe-area-inset-right, 0px)) calc(var(--bottom-nav-height) + env(safe-area-inset-bottom, 0px) + 12px + 56px + var(--space-3)) max(var(--space-4), env(safe-area-inset-left, 0px));
  }
  .hero { padding: var(--space-4) var(--space-3); border-radius: var(--radius-lg); }
  .hero-amount { font-size: 36px; }
  .hero-label { font-size: 13px; letter-spacing: 0.02em; } /* R62: match tightened desktop value */
  .overview-grid .card-header h2 { font-size: 13px; } /* R69 Item E: keep the unified headers matched to .hero-label at mobile */
  .stat-card { padding: var(--space-4); }
  .stat-value { font-size: 22px; }
  /* Mobile portrait timeline: narrower sticky label column; single
     scroll container handles both axes, Y-axis stays frozen. */
  .timeline-row-label {
    flex: 0 0 85px;
    width: 85px;
    font-size: 12px;
    padding: 5px 8px 6px;
  }
  .timeline-row-label > span:first-child {
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
    line-height: 1.35;
  }
  .timeline-row-label .sub { font-size: 10px; }
  /* The axis row's date range ("JUL 29 → DEC 11" ≈ 106px) is wider than the
     narrow mobile label column (69px of content), so it was ellipsised at
     every mobile width — a fixed, always-truncated string. It wraps to a
     second line instead: the 32px row has room for two 11px lines, the label
     column keeps the width every other row is aligned to, and the fix holds
     for any date pair rather than one measured string. */
  .timeline-row-label.axis {
    white-space: normal;
    text-overflow: clip;
    /* Two 11px lines need 25px of content box; the row's fixed 32px height
       (which must match the axis track for alignment) leaves that only with
       the tighter vertical padding. */
    line-height: 1.15;
    padding-top: 2px;

  .modal { padding: 0; align-items: flex-end; }
  .modal-card { max-width: 100%; width: 100%; max-height: 92vh; border-radius: var(--radius-xl) var(--radius-xl) 0 0; }
  .modal-header { padding: var(--space-4); }

}

@media (max-width: 480px) {
  .hero-amount { font-size: 34px; }

     Cancel · Save). At <=480px the modal is full-width and that row no longer
     fits on one line — let it wrap so the primary Save button never spills off
     the right edge and out of reach. Desktop keeps the single row (the 640px

   vertical space when the user is working in a chart or reading a
   long list. Landscape (handled below) keeps the header sticky since
   landscape phone screens are short and quick nav access matters. */
@media (max-width: 804px) and (orientation: portrait) {
  .app-header { position: static; top: auto; }
}

/* ============================================================
   LANDSCAPE on phones / small tablets
   Vertical real-estate is the constraint. Compact the header, hero,
   and timeline rows so column titles aren't truncated and the chart
   isn't hidden behind the bottom nav.
   ============================================================ */
@media (max-width: 1024px) and (orientation: landscape) {
  :root {
    --header-height: 50px;
    --bottom-nav-height: 56px;

  .app-header { height: calc(50px + env(safe-area-inset-top, 0px)); }
  .mobile-nav { height: 56px; }
  .mobile-nav .nav-btn { padding: 4px 8px; font-size: 10px; }
  .mobile-nav .nav-btn svg { width: 18px; height: 18px; }
  .app-main {
    /* Same FAB allowance as portrait — without it the last paragraph of a
       page could never be scrolled out from under the floating + button
       (nav 56 + 12 gap + 56 FAB). Side gutters clear the landscape cutout. */
    padding: var(--space-3) max(var(--space-4), env(safe-area-inset-right, 0px)) calc(var(--bottom-nav-height) + env(safe-area-inset-bottom, 0px) + 12px + 56px + var(--space-3)) max(var(--space-4), env(safe-area-inset-left, 0px));
  }
  .hero {
    padding: var(--space-4);
    border-radius: var(--radius-lg);
  }
  .hero-amount { font-size: 28px; line-height: 1; }
  .hero-meta { font-size: 12px; gap: 8px; }
  /* Section titles: keep readable but tighter top margin so they don't
     eat the visible chart area. */
  .section-header { margin-bottom: var(--space-3); }
  .section-header h2 { font-size: 18px; }
  /* Stat cards row: tighter padding so a 2x or 3x grid fits. */
  .stat-card { padding: var(--space-3); }
  .stat-value { font-size: 20px; }
  .stat-label { font-size: 11px; }
  /* Timeline rows: no longer compress in landscape — 38 px was too short
     for the sub line to fit without clipping. Use the same min-height as
     portrait so content is never clipped regardless of orientation. */
  .timeline-row-label, .timeline-row-track { min-height: 44px; }
  .timeline-row-label { padding-top: 5px; padding-bottom: 6px; }
  .timeline-row-label.axis, .timeline-row-track.axis { min-height: 32px; }
  /* Modal: cap at 480 px centered so inputs feel proportional rather
     than stretched edge-to-edge across a 720+ px landscape viewport.
     Single-column form is non-negotiable here — 2-column grids on a
     short landscape phone crash labels into adjacent inputs. */
  .modal { padding: var(--space-3); align-items: center; }
  .modal-card {
    max-height: 92vh;
    max-width: 480px;
    width: calc(100% - 32px);
    margin: auto;
    border-radius: var(--radius-xl);
  }
  .modal-body {
    overflow-y: auto;
    overflow-x: hidden;
    padding: var(--space-4);
  }
  .modal-header, .modal-footer { padding: var(--space-3) var(--space-4); }
  /* Force single-column flex (NOT grid) so every field is the same
     width, no matter what `style="grid-column"` annotations the source
     puts on individual fields. */
  .form-grid {
    display: flex;
    flex-direction: column;
    gap: 12px;
  }
  .field { width: 100%; min-width: 0; max-width: 100%; }
  .field > * { max-width: 100%; min-width: 0; box-sizing: border-box; }
  .input, .select, .textarea, .input-group { width: 100%; max-width: 100%; min-width: 0; box-sizing: border-box; }
  /* Spanned grid-column overrides on individual fields are no-ops in a
     flex column — neutralize them defensively in case any inline style
     makes them try to behave like grid items. */
  .field[style*="grid-column"] { grid-column: auto !important; }
}

@media (min-width: 880px) {
  .planner-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(340px, 1fr));
    gap: var(--space-4);
  }
}

/* Two-up starts at 560px, not 481px. An offer card's min-content width is
   ~235–270px (driven by the bank/offer name and the 2-col stat grid), so a
   two-column `1fr 1fr` needed ~519px of viewport and every width in the
   481–518 band pushed the grid — and the whole page — into sideways scroll.
   560px keeps ~40px of headroom for longer bank names than the QA fixture's,
   and minmax(0, 1fr) stops one wide card from forcing unequal tracks that
   overflow the row. */
@media (min-width: 560px) and (max-width: 879px) {
  .planner-grid {
    display: grid;
    grid-template-columns: minmax(0, 1fr) minmax(0, 1fr);
    gap: var(--space-4);
  }
}

@media (max-width: 559px) {
  .planner-grid { display: flex; flex-direction: column; gap: var(--space-4); }
}

/* ============================================================

   Converting the classic <script> to <script type="module"> moved the
   top-level const/function declarations out of global scope. Re-attach the
   names the DevTools console and the corpus/regression harness reference.
   NOT used for event dispatch (dispatch is delegation-based — design §5).
   ============================================================ */
window.App = App;
window.Sync = Sync;
window.YieldVector = { App, Sync, parseDocPost, testDocParser, testDocParserRegressions, testFeasibilityPins, testOptimizerPins, render };
// Documented bare-console workflow (comments :11825/:11890, doc-samples/README.md:176): keep these callable un-namespaced from DevTools.
window.testDocParser = testDocParser;
window.testDocParserRegressions = testDocParserRegressions;
// Combo-feasibility hotfix pins (C2/C3/C-template) — console + Node harness callable.
window.testFeasibilityPins = testFeasibilityPins;
// Planner optimizer pins — console + Node harness callable.
window.testOptimizerPins = testOptimizerPins;

/* ============================================================
   INIT
   ============================================================ */
window.addEventListener('DOMContentLoaded', () => App.init());

// Wire up FAB explicitly since it lives outside of view re-renders
document.addEventListener('click', (e) => {
  if (e.target && e.target.id === 'fab-add') showOfferModal();
});

/* ============================================================
   SERVICE WORKER (Path B — offline capability; design §1 + contract §5d)
   Registers ./sw.js, which precaches index.html + all 19 versioned module
   URLs and serves them network-first with a cache fallback, so an offline
   reload boots the split app from Cache Storage.

   controllerchange reload policy (once-flag guards against reload loops):
   • FIRST install (no controller served THIS load) — the page already loaded
     fresh from the network, so a claim reload is pointless: skip it.
   • REAL update (a new worker supersedes the one that served us) — reload so
     the page never runs under a stale controller (the iOS standalone-PWA
     case), but never mid-edit: if a modal is open, defer until it closes so
     the owner's unsaved form edits survive (state persists only on save).
   Registration failures are swallowed (no console noise).
   ============================================================ */
if ('serviceWorker' in navigator) {
  // Captured before the SW can claim: false on a first install (page is
  // already fresh from network), true only when a later worker supersedes the
  // one that served us — i.e. a genuine update worth reloading for.
  const _hadController = !!navigator.serviceWorker.controller;
  let _swReloaded = false;
  // The app's one modal surface: #modal-root gains/loses the `open` class
  // (js/modals-forms.js showOfferModal…/closeModal). A reload while it is open
  // would discard the owner's in-progress form edits.
  const _modalOpen = () => {
    const m = document.getElementById('modal-root');
    return !!(m && m.classList.contains('open'));
  };
  const _reloadOnce = () => {
    if (_swReloaded) return;          // once-flag: never loop reloads
    _swReloaded = true;
    location.reload();
  };
  navigator.serviceWorker.addEventListener('controllerchange', () => {
    if (_swReloaded) return;
    if (!_hadController) return;      // first install: already fresh — no reload
    if (!_modalOpen()) { _reloadOnce(); return; }
    // Update landed mid-edit. Defer, then reload the instant the modal closes
    // — poll-free, by observing #modal-root's class attribute. The pending
    // update converges without clobbering unsaved edits; if the modal never
    // reopens-and-stays, the next natural navigation runs under the new worker.
    const root = document.getElementById('modal-root');
    if (!root) { _reloadOnce(); return; }
    const obs = new MutationObserver(() => {
      if (!_modalOpen()) { obs.disconnect(); _reloadOnce(); }
    });
    obs.observe(root, { attributes: true, attributeFilter: ['class'] });
  });
  window.addEventListener('load', () => {
    navigator.serviceWorker.register('./sw.js').catch(() => {});
  });
}

</script>

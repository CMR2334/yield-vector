  const sameYear = dt.getFullYear() === TODAY.getFullYear();
  return dt.toLocaleDateString('en-US', sameYear
    ? { month: 'short', day: 'numeric' }
    : { month: 'short', day: 'numeric', year: 'numeric' });
}

function formatDateLong(d) {
  const dt = d instanceof Date ? d : parseDate(d);
  if (!dt) return '—';
  return dt.toLocaleDateString('en-US', { weekday: 'short', month: 'short', day: 'numeric', year: 'numeric' });
}

function relativeDays(d) {
  const dt = parseDate(d);
  if (!dt) return '';
  const n = daysBetween(TODAY, dt);
  if (n === 0) return 'today';
  if (n === 1) return 'tomorrow';
  if (n === -1) return 'yesterday';
  if (n > 0) return `in ${n} days`;
  return `${-n} days ago`;
}

/* ============================================================
   CURRENCY FORMATTING
   ============================================================ */
function formatCurrency(n, opts = {}) {
  if (n === null || n === undefined || isNaN(n)) return '—';
  const sign = n < 0 ? '-' : '';
  const abs = Math.abs(n);
  return sign + '$' + Math.round(abs).toLocaleString('en-US');
}

function formatCurrencyDecimal(n) {
  if (n === null || n === undefined || isNaN(n)) return '—';
  const sign = n < 0 ? '-' : '';
  return sign + '$' + Math.abs(n).toLocaleString('en-US', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
}

function formatCompactCurrency(n) {
  if (n === null || n === undefined || isNaN(n)) return '—';
  const sign = n < 0 ? '-' : '';
  const abs = Math.abs(n);
  if (abs >= 1_000_000) return `${sign}$${(abs / 1_000_000).toFixed(abs >= 10_000_000 ? 0 : 1)}M`;
  if (abs >= 10_000) return `${sign}$${Math.round(abs / 1000)}K`;
  if (abs >= 1000) return `${sign}$${(abs / 1000).toFixed(1)}K`;
  return `${sign}$${Math.round(abs)}`;
}

function formatPercent(n, digits = 1) {
  if (n === null || n === undefined || isNaN(n)) return '—';
  return (n * 100).toFixed(digits) + '%';
}

/* ============================================================
   DISPLAY <-> STORAGE BOUNDARY HELPERS (R62)
   ============================================================
   Storage/sync formats NEVER change: dates stay ISO `YYYY-MM-DD`
   strings in state/localStorage/Gist and in every internal
   comparison; money stays a plain Number in state. These four
   helpers are the SINGLE conversion point at the render/read
   boundary — the display value (M-D-YYYY dates, comma-grouped
   money) exists only inside input/render code, and is parsed
   straight back to canonical ISO / Number before it ever reaches
   state. Do not scatter ad-hoc toLocaleString/replace conversions;
   route through these so a missed site can't corrupt an offer. */

// ISO `YYYY-MM-DD` -> owner's display format `M-D-YYYY` (no leading
// zeros). Empty -> ''. Anything not ISO-shaped is returned unchanged
// so a stray already-humanized string never gets mangled.
function formatDateDisplay(iso) {
  if (!iso) return '';
  const m = String(iso).match(/^(\d{4})-(\d{2})-(\d{2})$/);
  if (!m) return String(iso);
  return `${Number(m[2])}-${Number(m[3])}-${m[1]}`;
}

// Accepts the display format `M-D-YYYY` (owner's), tolerates
// `M/D/YYYY` and a pasted ISO `YYYY-MM-DD`, and returns canonical
// ISO `YYYY-MM-DD` — or null if it can't be understood. This is the
// ONLY thing that reads a yv-date field's typed/displayed value back
// into state, so it must never hand a non-ISO string downstream.
function parseDateInput(str) {
  if (str == null) return null;
  const s = String(str).trim();
  if (!s) return null;
  // Pasted / stored ISO first (YYYY-MM-DD or YYYY/MM/DD).
  let m = s.match(/^(\d{4})[-/](\d{1,2})[-/](\d{1,2})$/);
  if (m) return _isoFromYMD(+m[1], +m[2], +m[3]);
  // Owner's M-D-YYYY (hyphen) or tolerated M/D/YYYY (slash).
  m = s.match(/^(\d{1,2})[-/](\d{1,2})[-/](\d{4})$/);
  if (m) return _isoFromYMD(+m[3], +m[1], +m[2]);
  return null;
}
// Build an ISO date only if the Y/M/D make a real calendar date;
// reject overflow (e.g. 13-40-2026, 2-30-2026) so bad input becomes
// null rather than a silently rolled-over date.
function _isoFromYMD(y, mo, d) {
  if (!(y >= 1000 && y <= 9999 && mo >= 1 && mo <= 12 && d >= 1 && d <= 31)) return null;
  const dt = new Date(y, mo - 1, d);
  if (dt.getFullYear() !== y || dt.getMonth() !== mo - 1 || dt.getDate() !== d) return null;
  return `${y}-${String(mo).padStart(2, '0')}-${String(d).padStart(2, '0')}`;
}

// Number or numeric string -> thousands-grouped display string,
// e.g. 25000 -> "25,000", -1234.5 -> "-1,234.5". Preserves a
// trailing "." and in-progress decimals while typing, and a leading
// "-". Non-numeric characters ($, spaces, stray commas) are stripped
// first so it's safe to re-run on its own output.
function formatMoneyInput(val) {
  if (val === '' || val == null) return '';
  let s = String(val).replace(/[^0-9.\-]/g, '');
  if (s === '' || s === '-' || s === '.' || s === '-.') return s;
  const neg = s.startsWith('-');
  s = s.replace(/-/g, '');
  // Keep only the first '.'; fold any extras into the fractional part.
  const dot = s.indexOf('.');
  let intPart, fracPart = null;
  if (dot === -1) { intPart = s; }
  else { intPart = s.slice(0, dot); fracPart = s.slice(dot + 1).replace(/\./g, ''); }
  intPart = intPart.replace(/^0+(?=\d)/, ''); // drop leading zeros but keep a lone 0
  if (intPart === '') intPart = fracPart === null && dot === -1 ? '' : '0';
  const grouped = intPart.replace(/\B(?=(\d{3})+(?!\d))/g, ',');
  let out = (neg ? '-' : '') + grouped;
  if (dot !== -1) out += '.' + fracPart;
  return out;
}

// Comma-grouped / $-prefixed money display string -> plain Number.
// Strips $, spaces, commas. Returns null for empty (matching the
// existing readOfferForm `num('')===null` contract); returns NaN for
// genuinely non-numeric text so callers using `Number.isFinite`/`||`
// behave exactly as they did with the old bare `Number(value)`.
function parseMoneyInput(str) {
  if (str === '' || str == null) return null;
  const cleaned = String(str).replace(/[$,\s]/g, '');
  if (cleaned === '' || cleaned === '-' || cleaned === '.' || cleaned === '-.') return null;
  return Number(cleaned);
}

/* ============================================================
   ID GENERATOR
   ============================================================ */
function uid(prefix = 'id') {
  return `${prefix}_${Date.now().toString(36)}_${Math.random().toString(36).slice(2, 8)}`;
}

/* ============================================================
   STATE MANAGEMENT
   ============================================================ */
const App = {
  state: null,
  view: 'overview',
  filters: {
    timelineShowCancelled: false,
    timelineShowCompleted: true,
    offersStatus: 'all',
    offersSearch: '',
    offersAdvanced: false
  },
  optimizer: { results: null, candidates: [], evaluated: 0, infeasibleCount: 0, lastRunAt: null },

  init() {
    installErrorHandlers();
    try {
      const saved = this.load();
      this.state = saved || this.defaultState();
      // Snapshot the state's freshness AS LOADED, before any save (the fresh
      // seed below, the projection roll) can re-stamp _lastModified this
      // session. The first-sync equal-state exemption reads this so a device
      // that was perfectly in sync at load still silently seeds lineage even
      // after a system date-roll bumps local's live _lastModified.
      Sync.loadedModified = (saved && saved._lastModified) || 0;
      // Restore the persisted dirty marker: if localStorage holds edits that
      // never reached the cloud (_dirtySince set), this device is dirty even
      // across a reload, so the CAS conflict path won't silently adopt over
      // them.
      Sync.localDirty = Boolean(this.state && this.state._dirtySince);
      if (!saved) {
        // Fresh device: seeding sample data is not a user edit, so save it
        // system (no dirty marker) — otherwise a brand-new device would
        // conflict-prompt instead of cleanly adopting real cloud data on its
        // first sync.
        this.state = seedSampleData(this.state);
        this.save({ system: true });
      }
      // Migrate offers to the two-field status model + sync legacy status,
      // and mint stable per-DD ids for feed item keys (never array index).
      (this.state.offers || []).forEach(o => { normalizeOfferStatus(o); migrateDdIds(o); });
      // Seed the manifestVersion high-water mark from the loaded state so the
      // feed version never regresses below what a prior session already shipped.
      _manifestHwm = Number(this.state._manifestVersion) || 0;
      this.rollProjectionStartIfStale();
      setupPwa();
      if (Sync.isConfigured()) Sync.setStatus('synced'); // optimistic until startup pull replies
      else Sync.setStatus('unconfigured');
      render();
      bindGlobalEvents();
      // Async pull — runs after first paint, doesn't block UI
      if (Sync.isConfigured()) {
        setTimeout(() => Sync.startupSync(), 50);
      }
      // Lazy-load the DD-method datapoints (re-renders cards when ready).
      setTimeout(() => DDMethods.load(), 80);
    } catch (e) {
      // A throw during boot must not leave a blank screen — show a
      // self-contained recovery panel that reads the diag log directly.
      logError(ErrCode.RENDER, e, 'App.init');
      const root = document.getElementById('app');
      if (root) root.innerHTML = renderErrorState(e);
    }
  },

  // Auto-roll the projection start date forward to today whenever it
  // falls behind. Called on init, on visibilitychange (tab back from
  // background), and once a minute via setInterval (covers the case
  // where the app is left open overnight). Returns true if the state
  // changed, so callers can re-render. We only advance — never roll
  // backward — so a user explicitly setting a future start date in
  // Settings is preserved.
  rollProjectionStartIfStale() {
    if (!this.state || !this.state.settings) return false;
    const today = isoDate(new Date());
    const cur = this.state.settings.projectionStartDate;
    if (!cur || cur < today) {
      this.state.settings.projectionStartDate = today;
      // System save: an automatic date-roll is NOT a user edit, so it must not
      // set the dirty marker (else a clean-but-stale device trips the conflict
      // dialog and a reflexive Cancel clobbers the cloud — see App.save).
      this.save({ system: true });
      return true;
    }
    return false;
  },

  defaultState() {
    return {
      version: 1,
      settings: {
        currentLiquidCapital: 200000,
        minimumCashBuffer: 20000,
        projectionStartDate: isoDate(TODAY),
        projectionHorizonMode: 'auto',  // 'auto' | '3months' | '6months' | '1year' | '2years' | 'custom'
        projectionHorizonDays: 365,     // used only when mode === 'custom'
        maxOptimizerCandidates: 15,
        defaultLockStartsFrom: 'funded date',
        // Global DD transfer-timing model (business days per leg). The
        // round trip is initiate → +inDays → posts as DD → +seasonDays
        // → sent back → +backDays → returns to origin. Default 1/1/1
        // ("season 1 business day").
        ddTransfer: { inDays: 1, seasonDays: 1, backDays: 1 },
        // Banks the user can transfer money FROM (for DD-method ranking).
        sourceBanks: []
      },
      offers: [],
      commitments: [],
      events: []
    };
  },

  load() {
    try {
      const raw = localStorage.getItem(STORAGE_KEY);
      if (!raw) return null;
      const parsed = JSON.parse(raw);
      if (!parsed || typeof parsed !== 'object') return null;
      return parsed;
    } catch (e) {
      logError(ErrCode.PARSE, e, 'App.load: localStorage state');
      return null;
    }
  },

  // {system:true} marks a purely-automatic save (projection-date roll,
  // fresh-device seed) — it stamps _lastModified and schedules the push as
  // usual, but does NOT set the dirty marker. Without this, a stale-but-clean
  // device whose date auto-rolled would look "dirty" and trip the CAS conflict
  // dialog; a reflexive Cancel would then clobber the cloud with stale data
  // despite ZERO user edits. Default (user/import/reset saves) marks dirty.
  save({ system = false } = {}) {
    try {
      // Stamp last-modified so cloud sync can resolve "who's newer"
      this.state._lastModified = Date.now();
      // Mark unsynced local edits so the CAS push can tell "this device is
      // just stale" from "both sides changed" on a head divergence. Persist
      // the marker WITH the state (_dirtySince) so it survives a reload —
      // a volatile flag alone would reset to false on reopen while
      // localStorage still holds edits that never reached the cloud, and the
      // next CAS check would then wrongly treat this device as clean and
      // discard them. _dirtySince rides along in the payload; it does NOT
      // affect _lastModified/"who's newer" semantics. Keep the earliest
      // dirty time (don't churn it on every keystroke-save).
      if (!system) {
        if (!this.state._dirtySince) this.state._dirtySince = new Date().toISOString();
        Sync.localDirty = true;
      }
      localStorage.setItem(STORAGE_KEY, JSON.stringify(this.state));
      Sync.schedulePush();
    } catch (e) {
      logError(ErrCode.STORAGE, e, 'App.save');
      toast('Could not save: storage unavailable', 'danger');
    }
  },

  setView(view) {
    if (this.view === view) return;
    this.view = view;
    render();
    window.scrollTo({ top: 0, behavior: 'instant' });
  },

  update(updater) {
    updater(this.state);
    this.save();
    render();
  }
};

/* ============================================================
   OFFER DERIVED FIELDS
   ============================================================ */
function effectiveFundingDate(offer) {
  // User-entered date as-is (Saturday stays Saturday). This is what the
  // form remembers; callers that need the actual bank-processing day go
  // through bizDayISO() below.
  return offer.optionalPlannedFundingDate || offer.plannedSignupDate;
}

// Shift a YYYY-MM-DD to the next business day if it falls on a weekend
// or US federal bank holiday. Used to model "bank doesn't process money
// movement on weekends" for derived action dates (fund posts, withdrawal
// eligible). Anchor dates the user entered (open date, signup date)
// stay as-is — only dates DERIVED from them shift.
function bizDayISO(d) {
  if (!d) return '';
  const dt = d instanceof Date ? d : parseDate(d);
  if (!dt) return '';
  return isoDate(nextBusinessDay(dt));
}

function depositDeadline(offer) {
  // Bank's stated deadline — literal calendar date. If it falls on
  // a weekend, the user needs to deposit BEFORE it (no shift here).
  if (!offer.plannedSignupDate || offer.daysAfterSignupAllowedBeforeDeposit == null) return null;
  return isoDate(addDays(parseDate(offer.plannedSignupDate), Number(offer.daysAfterSignupAllowedBeforeDeposit)));
}

function withdrawalEligibleDate(offer) {
  // STANDARD direct deposit: no bank-imposed hold. Each DD just needs to
  // hit the account; the money is "tied up" only for its transfer round
  // trip. The overall "funds are fully back" date = the LATEST round-trip
  // return across all DDs.
  if (offer.offerType === 'direct-deposit') {
    const rets = (offer.directDeposits || [])
      .map(dd => ddRoundTrip(dd))
      .filter(Boolean)
      .map(rt => rt.returnDate.getTime());
    if (rets.length === 0) return '';
    return isoDate(new Date(Math.max(...rets)));
  }
  // HELD + DD and NEW FUNDS HELD share the same hold model: a held lump sum
  // (requiredFundingAmount) governed by daysFundsMustRemain from the chosen
  // anchor. The qualifying DDs are modeled separately (see generateProjection);
  // they do NOT drive the hold window. Anchor:
  //   'open date'   → bank counts from the account open date (US Bank
  //                   style). Open date itself stays as user-entered.
  //   'funded date' → bank counts from when funds actually posted.
  const anchorRaw = offer.lockStartsFrom === 'open date'
    ? offer.plannedSignupDate
    : bizDayISO(effectiveFundingDate(offer));
  if (!anchorRaw || offer.daysFundsMustRemain == null) return null;
  const calc = addDays(parseDate(anchorRaw), Number(offer.daysFundsMustRemain));
  return bizDayISO(calc);
}

function lockStartDate(offer) {
  // STANDARD direct deposit: money first leaves the origin account at the
  // EARLIEST DD initiation. Each DD ties up its own amount over its own
  // round trip (modeled in generateProjection); this is just the start
  // of the overall tied-up window for display (card "Fund date",
  // timeline bar start).
  if (offer.offerType === 'direct-deposit') {
    const starts = (offer.directDeposits || [])
      .map(dd => parseDate(dd.plannedDate))
      .filter(Boolean)
      .map(d => d.getTime());
    if (starts.length === 0) return '';
    return isoDate(new Date(Math.min(...starts)));
  }
  // HELD + DD and NEW FUNDS HELD: the held lump sum is unavailable from when
  // the bank PROCESSES the deposit (the planned funding date; Saturday-planned
  // funding won't post until Monday). The qualifying DDs are tracked
  // separately and don't move this date.
  return bizDayISO(effectiveFundingDate(offer));
}

function safeToCloseDate(offer) {
  // Approximation: withdrawalEligible + a small grace period; or use explicit field if present
  const we = withdrawalEligibleDate(offer);
  if (!we) return null;
  // Keep separate as concept; actual safe-to-close varies by bank policy
  return null;
}

function simpleReturn(offer) {
  if (!offer.requiredFundingAmount || !offer.signupBonusAmount) return null;
  return offer.signupBonusAmount / offer.requiredFundingAmount;
}

// Total capital-time (dollar-days) a DD offer ties up: Σ(amount_i × heldDays_i).
// STANDARD DD: heldDays_i = the transfer round-trip for that DD (which is
// longer when initiated before a weekend/holiday). HELD+DD: each DD's
// amount is held from when it lands until the shared withdrawal-eligible
// date. Returns { dollarDays, weightedDays, totalAmount } or null.
function ddCapitalTime(offer) {
  const dds = (offer.directDeposits || []).filter(dd => dd && dd.plannedDate && Number(dd.amount) > 0);
  if (dds.length === 0) return null;
  let dollarDays = 0, totalAmount = 0;
  if (offer.offerType === 'direct-deposit') {
    for (const dd of dds) {
      const rt = ddRoundTrip(dd);
      if (!rt || rt.heldDays <= 0) continue;
      const amt = Number(dd.amount);
      dollarDays += amt * rt.heldDays;
      totalAmount += amt;
    }
  } else { // held-and-dd
    const we = parseDate(withdrawalEligibleDate(offer));
    if (!we) return null;
    // Held lump sum: requiredFundingAmount from the funding date → withdrawal.
    const fundStart = parseDate(lockStartDate(offer));
    const fundAmt = Number(offer.requiredFundingAmount) || 0;
    if (fundStart && fundAmt > 0) {
      const heldDays = daysBetween(fundStart, we);
      if (heldDays > 0) { dollarDays += fundAmt * heldDays; totalAmount += fundAmt; }
    }
    // Each qualifying DD from when it lands → withdrawal.
    for (const dd of dds) {
      const eff = parseDate(directDepositEffectiveDate(dd));
      if (!eff) continue;
      const held = daysBetween(eff, we);
      if (held <= 0) continue;
      const amt = Number(dd.amount);
      dollarDays += amt * held;
      totalAmount += amt;
    }
  }
  if (dollarDays <= 0 || totalAmount <= 0) return null;
  return { dollarDays, totalAmount, weightedDays: dollarDays / totalAmount };
}

function annualizedReturn(offer) {
  const bonus = Number(offer.signupBonusAmount);
  if (!bonus || bonus < 0) {
    // Allow $0 bonus to yield 0% rather than null below; but a missing
    // bonus is a null.
    if (offer.signupBonusAmount == null) return null;
  }
  // DIRECT-DEPOSIT family: weight each DD's ROI by dollar-days (amount ×
  // days held) so a DD dragged longer by a weekend/holiday, or a bigger
  // DD, pulls the blended rate appropriately. The single closed form
  //   bonus × 365 / Σ(amount_i × heldDays_i)
  // is exactly the amount-and-time-weighted average of the per-DD
  // annualized ROIs, and reduces to the standard formula for one DD.
  if (offer.offerType === 'direct-deposit' || offer.offerType === 'held-and-dd') {
    const ct = ddCapitalTime(offer);
    if (!ct || !offer.signupBonusAmount) return null;
    return Number(offer.signupBonusAmount) * 365 / ct.dollarDays;
  }
  // NEW FUNDS HELD: annualize on actual days unavailable (business-day
  // aware lockStart → withdrawalEligible), matching the "Days tied up"
  // card stat. Fall back to the stated hold count when dates are absent.
  const r = simpleReturn(offer);
  if (r == null) return null;
  let days = null;
  const ls = parseDate(lockStartDate(offer));
  const we = parseDate(withdrawalEligibleDate(offer));
  if (ls && we) days = daysBetween(ls, we);
  if (!days || days <= 0) days = Number(offer.daysFundsMustRemain) || 0;
  if (!days || days <= 0) return null;
  return r * 365 / days;
}

function isOfferComplete(offer) {
  // Standard direct deposit has NO bank-imposed hold, so it does not
  // require daysFundsMustRemain. Every other type does.
  const isStandardDD = offer.offerType === 'direct-deposit';
  const baseOk = Boolean(
    offer.bankName &&
    offer.requiredFundingAmount > 0 &&
    offer.signupBonusAmount >= 0 &&
    offer.plannedSignupDate &&
    parseDate(offer.plannedSignupDate) &&
    (isStandardDD || (offer.daysFundsMustRemain != null && offer.daysFundsMustRemain >= 0))
  );
  if (!baseOk) return false;
  if (offer.offerType === 'direct-deposit' || offer.offerType === 'held-and-dd') {
    const ddsOk = Array.isArray(offer.directDeposits)
      && offer.directDeposits.length > 0
      && offer.directDeposits.every(dd =>
        dd && dd.plannedDate && parseDate(dd.plannedDate) && Number(dd.amount) > 0);
    if (!ddsOk) return false;
    // Held + DD: the held lump sum needs a funding date (it drives the
    // chart + hold window). Standard direct-deposit has no held lump sum.
    if (offer.offerType === 'held-and-dd'
      && !(offer.optionalPlannedFundingDate && parseDate(offer.optionalPlannedFundingDate))) return false;
    return true;
  }
  return true;
}

function offerIssues(offer) {
  const issues = [];
  const isStandardDD = offer.offerType === 'direct-deposit';
  if (!offer.bankName) issues.push('Bank name is required');
  if (!offer.requiredFundingAmount || offer.requiredFundingAmount <= 0) issues.push('Required funding amount must be > 0');
  if (offer.signupBonusAmount == null || offer.signupBonusAmount < 0) issues.push('Bonus amount required');
  if (!offer.plannedSignupDate || !parseDate(offer.plannedSignupDate)) issues.push(offer.accountStatus === 'open' ? 'Signup date required' : 'Planned signup date required');
  if (!isStandardDD && (offer.daysFundsMustRemain == null || offer.daysFundsMustRemain < 0)) issues.push('Hold-through day is required');
  if (offer.offerType === 'direct-deposit' || offer.offerType === 'held-and-dd') {
    if (!Array.isArray(offer.directDeposits) || offer.directDeposits.length === 0) {
      issues.push('At least one direct deposit is required');
    } else if (!offer.directDeposits.every(dd => dd && dd.plannedDate && parseDate(dd.plannedDate) && Number(dd.amount) > 0)) {
      issues.push('Each direct deposit needs a date and amount > 0');
    }
  }
  if (offer.offerType === 'held-and-dd'
    && !(offer.optionalPlannedFundingDate && parseDate(offer.optionalPlannedFundingDate))) {
    issues.push('Planned funding date is required for Held + DD');
  }
  return issues;
}

function offerIsActiveForProjection(offer, includedOverride = null) {
  // Returns whether this offer should affect the projection.
  if (!isOfferComplete(offer)) return false;
  if (offer.status === 'completed' || offer.status === 'skipped') return false;
  if (includedOverride !== null) return includedOverride.has(offer.id);
  if (CONFIRMED_OFFER_STATUSES.has(offer.status)) return true;
  return Boolean(offer.includeInScenario);
}

/* ============================================================
   PROJECTION ENGINE
   ============================================================
   Generates a daily cash projection over the configured horizon.

   For each day in [projectionStartDate, projectionStartDate + horizonDays):
     availableCapital =
         currentLiquidCapital
       + cumulative net of all included Capital Events with date <= day
       - sum of confirmed commitments active on this day
       - sum of hypothetical commitments active on this day

   Interval convention:
     A commitment with startDate=A and endDate=B ties up funds on each day d
     where A <= d < B. If a deposit lands March 1 and is withdrawal-eligible
     May 1, the funds are tied up March 1 through April 30 (61 days).

   Sources of commitments:
     1. Manual/explicit Capital Commitments (with includeInProjection true).
     2. Bonus Offers that are considered active:
        - status in {applied, funded} → counted as confirmed
        - status in {prospect, selected} with includeInScenario → counted
          as hypothetical
        Suppressed if a non-cancelled commitment with sourceBonusOfferId
        already covers the offer.

   The optimizer can pass an `includedOfferIds` set to override which
   prospect/selected offers contribute (used to evaluate combinations).
   ============================================================ */
// Compute the effective projection horizon in days based on the user's
// chosen mode. 'auto' = 30 days past the latest active date in the system
// (commitment ends, withdrawal-eligible dates, included events), with a
// 30-day floor. Modes other than 'custom' are fixed-day shorthands.
function effectiveHorizonDays(state) {
  const settings = state.settings || {};
  const mode = settings.projectionHorizonMode || 'auto';
  const start = parseDate(settings.projectionStartDate) || TODAY;
  if (mode === '3months') return 90;
  if (mode === '6months') return 180;
  if (mode === '1year') return 365;
  if (mode === '2years') return 730;
  if (mode === 'custom') return Math.max(30, Math.min(1825, Number(settings.projectionHorizonDays) || 365));
  // 'auto' — exactly 30 days past the latest withdrawal-eligible date of
  // offers that are ACTIVE in the projection. Confirmed offers count
  // unconditionally; unconfirmed offers (prospect/selected) only count
  // if the user has checked includeInScenario. This matches what's
  // actually plotted on the chart, so the X-axis can't extend out to
  // some prospect offer the user hasn't opted in to.
  // Hard clamp: end = lastActionDate + 30 days. No baseline padding,
  // no extra fudge factor anywhere. If no active offer, 30-day floor.
  let lastAction = null;
  const debug = [];
  for (const o of state.offers || []) {
    if (!offerIsActiveForProjection(o)) continue;
    const we = withdrawalEligibleDate(o);
    const d = we ? parseDate(we) : null;
    if (d && (lastAction == null || d > lastAction)) lastAction = d;
    if (d) debug.push({ id: o.id, status: o.status, withdrawal: we });
  }
  // Expose for inspection from the console: App.state && window._horizonDebug
  if (typeof window !== 'undefined') window._horizonDebug = { lastAction, considered: debug };
  if (!lastAction) return 30;
  const days = daysBetween(start, addDays(lastAction, 30));
  return Math.max(30, Math.min(180, days));
}

function generateProjection(state, options = {}) {
  const settings = state.settings;
  const horizon = effectiveHorizonDays(state);
  const start = parseDate(settings.projectionStartDate) || TODAY;
  const buffer = Number(settings.minimumCashBuffer) || 0;
  const liquid = Number(settings.currentLiquidCapital) || 0;

  const includedOverride = options.includedOfferIds
    ? new Set(options.includedOfferIds)
    : null;
  const earlyExit = options.earlyExit || false;

  // Pre-build day skeleton
  const days = new Array(horizon);
  const dayMs = 86400000;
  const startMs = start.getTime();
  for (let i = 0; i < horizon; i++) {
    days[i] = {
      date: new Date(startMs + i * dayMs),
      dateISO: '',
      dayIndex: i,
      startingLiquidCapital: liquid,
      confirmedTiedUp: 0,
      hypotheticalTiedUp: 0,
      totalTiedUp: 0,
      netEventsToDate: 0,
      availableCapital: liquid,
      belowBuffer: false,
      shortfall: false
    };
  }

  // Helper: find day index for a Date (clamped)
  function indexFor(date) {
    if (!date) return -1;
    const idx = Math.floor((startOfDay(date).getTime() - startMs) / dayMs);
    return idx;
  }

  // Helper: apply a commitment over its active range
  function applyCommitment(amount, startDate, endDate, kind) {
    const sIdx = indexFor(startDate);
    const eIdx = indexFor(endDate);
    if (eIdx < 0) return; // ends before horizon starts
    if (sIdx >= horizon) return; // starts after horizon ends
    // Active days: [max(sIdx,0), min(eIdx, horizon)) — endDate exclusive
    const from = Math.max(sIdx, 0);
    const to = Math.min(eIdx, horizon);
    for (let i = from; i < to; i++) {
      if (kind === 'confirmed') days[i].confirmedTiedUp += amount;
      else days[i].hypotheticalTiedUp += amount;
    }
  }

  // 1. Manual capital commitments
  const offerIdsWithCommitments = new Set();
  for (const c of state.commitments) {
    if (!c.includeInProjection) continue;
    if (c.status === 'cancelled') continue;
    const amount = Number(c.amount);
    if (!amount || amount <= 0) continue;
    const cs = parseDate(c.startDate);
    const ce = parseDate(c.endDate);
    if (!cs || !ce || cs >= ce) continue;
    if (c.sourceBonusOfferId) offerIdsWithCommitments.add(c.sourceBonusOfferId);
    const kind = (c.status === 'confirmed' || c.status === 'completed') ? 'confirmed' : 'hypothetical';
    if (c.status === 'completed') continue; // completed commitments no longer tie up funds
    applyCommitment(amount, cs, ce, kind);
  }

  // 2. Virtual commitments from bonus offers
  for (const o of state.offers) {
    if (!offerIsActiveForProjection(o, includedOverride)) continue;
    if (offerIdsWithCommitments.has(o.id)) continue; // suppressed by explicit commitment
    const kind = CONFIRMED_OFFER_STATUSES.has(o.status) ? 'confirmed' : 'hypothetical';
    // STANDARD direct deposit: each DD ties up its own amount only for
    // its transfer round trip (initiation → return to origin). No shared
    // hold — money is out of the origin account exactly while in transit
    // + seasoning. DDs initiated before weekends/holidays tie up longer.
    if (o.offerType === 'direct-deposit' && Array.isArray(o.directDeposits) && o.directDeposits.length > 0) {
      for (const dd of o.directDeposits) {
        const rt = ddRoundTrip(dd);
        const amt = Number(dd.amount) || 0;
        if (!rt || amt <= 0) continue;
        if (rt.initiate >= rt.returnDate) continue;
        applyCommitment(amt, rt.initiate, rt.returnDate, kind);
      }
      continue;
    }
    // HELD + DD: two distinct capital commitments, both tied up through the
    // bonus hold (withdrawal-eligible) date:
    //   1. the held LUMP SUM (requiredFundingAmount) from the funding date, and
    //   2. each qualifying DD's amount from when it lands.
    // Previously only (2) was modeled, so the held funds never hit the chart.
    if (o.offerType === 'held-and-dd' && Array.isArray(o.directDeposits) && o.directDeposits.length > 0) {
      const we = parseDate(withdrawalEligibleDate(o));
      if (!we) continue;
      const fundStart = parseDate(lockStartDate(o));
      const fundAmt = Number(o.requiredFundingAmount) || 0;
      if (fundStart && fundAmt > 0 && fundStart < we) applyCommitment(fundAmt, fundStart, we, kind);
      for (const dd of o.directDeposits) {
        const eff = parseDate(directDepositEffectiveDate(dd));
        const amt = Number(dd.amount) || 0;
        if (!eff || amt <= 0 || eff >= we) continue;
        applyCommitment(amt, eff, we, kind);
      }
      continue;
    }
    // New funds held: single block over the lock window.
    const start = parseDate(lockStartDate(o));
    const end = parseDate(withdrawalEligibleDate(o));
    if (!start || !end || start >= end) continue;
    applyCommitment(Number(o.requiredFundingAmount), start, end, kind);
  }

  // 3. Capital events — accumulate net through each day. Recurring
  // events expand into one instance per occurrence in the horizon
  // window; one-time events produce a single instance. The downstream
  // running-sum loop doesn't know or care which is which.
  const horizonEndDate = new Date(startMs + (horizon - 1) * dayMs);
  const validEvents = [];
  for (const e of state.events) {
    if (!e.includeInProjection) continue;
    const instances = expandEventInstances(e, start, horizonEndDate);
    for (const inst of instances) {
      const idx = indexFor(inst.date);
      if (idx >= 0 && idx < horizon) validEvents.push({ idx, amount: inst.amount });
    }
  }
  validEvents.sort((a, b) => a.idx - b.idx);

  let cumul = 0;
  let evIdx = 0;
  for (let i = 0; i < horizon; i++) {
    while (evIdx < validEvents.length && validEvents[evIdx].idx <= i) {
      cumul += validEvents[evIdx].amount;
      evIdx++;
    }
    const d = days[i];
    d.netEventsToDate = cumul;
    d.totalTiedUp = d.confirmedTiedUp + d.hypotheticalTiedUp;
    d.availableCapital = d.startingLiquidCapital + cumul - d.totalTiedUp;
    d.belowBuffer = d.availableCapital < buffer;
    d.shortfall = d.availableCapital < 0;
    d.dateISO = isoDate(d.date);
    if (earlyExit && d.shortfall) {
      // Optimizer hint: still finish for stats, but mark early-exit info
    }
  }

  return days;
}

/* ============================================================
   PROJECTION SUMMARY (for the Overview view)
   ============================================================ */
function summarizeProjection(projection, settings) {
  if (!projection.length) return {};
  let lowest = projection[0];
  let lowestIdx = 0;
  let shortfallDays = 0;
  let belowBufferDays = 0;
  for (let i = 0; i < projection.length; i++) {
    const d = projection[i];
    if (d.availableCapital < lowest.availableCapital) { lowest = d; lowestIdx = i; }
    if (d.shortfall) shortfallDays++;
    if (d.belowBuffer) belowBufferDays++;
  }
  return {
    today: projection[0],
    lowest,
    lowestIdx,
    shortfallDays,
    belowBufferDays,
    feasible: shortfallDays === 0,
    horizonDays: projection.length
  };
}

/* ============================================================
   OFFER → COMMITMENT CONVERSION
   ============================================================ */
function convertOfferToCommitment(offer) {
  const start = lockStartDate(offer);
  const end = withdrawalEligibleDate(offer);
  if (!start || !end) return null;
  return {
    id: uid('cmt'),
    commitmentName: offer.offerName ? `${offer.bankName} — ${offer.offerName}` : offer.bankName,
    sourceBonusOfferId: offer.id,
    amount: Number(offer.requiredFundingAmount),
    startDate: start,
    endDate: end,
    type: 'minimum balance',
    status: CONFIRMED_OFFER_STATUSES.has(offer.status) ? 'confirmed' : 'hypothetical',
    includeInProjection: true,
    expectedBonus: Number(offer.signupBonusAmount) || 0,
    notes: ''
  };
}

/* ============================================================
   OPTIMIZER
   ============================================================
   Brute-force search over candidate offers (status in
   {prospect, selected}, complete, dates within projection horizon).

   For up to maxOptimizerCandidates offers, evaluate every 2^n subset.
   For each subset:
     - Generate the daily projection with that subset selected.
     - A combination is feasible if availableCapital >= 0 every day.
     - Track total bonus, lowest available capital, days below buffer,
       and any breach dates.

   Ranking (feasible only):
     1. Highest total expected bonus.
     2. Highest blended annualized return.
     3. Highest lowest-available-capital (largest safety margin).

   Note: For n=15 this is 32,768 evaluations × 365 days ≈ 12M ops,
   which is fast in modern JS. We always run synchronously and then
   render. If candidates exceed the configured limit, we ask the user
   to deselect some via the planner cards.
   ============================================================ */
function runOptimizer(state) {
  const horizonStart = parseDate(state.settings.projectionStartDate) || TODAY;
  const horizonEnd = addDays(horizonStart, effectiveHorizonDays(state));

  const candidates = state.offers.filter(o => {
    if (!HYPOTHETICAL_OFFER_STATUSES.has(o.status)) return false;
    if (!isOfferComplete(o)) return false;
    const start = parseDate(lockStartDate(o));
    const end = parseDate(withdrawalEligibleDate(o));
    if (!start || !end) return false;
    if (end <= horizonStart || start >= horizonEnd) return false;
    return true;
  });

  const max = state.settings.maxOptimizerCandidates || 15;

  if (candidates.length > max) {
    return {
      tooMany: true,
      candidateCount: candidates.length,
      max,
      candidates,
      results: [],
      evaluated: 0,
      infeasibleCount: 0
    };
  }

  const buffer = Number(state.settings.minimumCashBuffer) || 0;
  const total = 1 << candidates.length;
  const results = [];
  let infeasibleCount = 0;

  for (let mask = 0; mask < total; mask++) {
    const includedIds = [];
    let totalBonus = 0;
    let totalRequired = 0;
    let weightedAnnReturnNum = 0;
    let weightedAnnReturnDen = 0;
    for (let i = 0; i < candidates.length; i++) {
      if (mask & (1 << i)) {
        const o = candidates[i];
        includedIds.push(o.id);
        totalBonus += Number(o.signupBonusAmount) || 0;
        totalRequired += Number(o.requiredFundingAmount) || 0;
        const ar = annualizedReturn(o);
        if (ar != null) {
          // Weight by capital × duration (dollar-days) to get a blended
          // rate. DD offers use their actual round-trip dollar-days;
          // held offers use required funding × stated hold days.
          let weight;
          if (o.offerType === 'direct-deposit' || o.offerType === 'held-and-dd') {
            const ct = ddCapitalTime(o);
            weight = ct ? ct.dollarDays : 0;
          } else {
            weight = Number(o.requiredFundingAmount) * Number(o.daysFundsMustRemain || 0);
          }
          if (weight > 0) {
            weightedAnnReturnNum += ar * weight;
            weightedAnnReturnDen += weight;
          }
        }
      }
    }

    const proj = generateProjection(state, { includedOfferIds: includedIds });
    let lowest = Infinity;
    let belowBufferDays = 0;
    let shortfallDays = 0;
    const breachDates = [];
    for (const d of proj) {
      if (d.availableCapital < lowest) lowest = d.availableCapital;
      if (d.shortfall) { shortfallDays++; breachDates.push(d.dateISO); }
      else if (d.belowBuffer) belowBufferDays++;
    }
    const feasible = shortfallDays === 0 && belowBufferDays === 0;
    if (!feasible) infeasibleCount++;
    results.push({
      mask,
      includedIds,
      offerCount: includedIds.length,
      totalBonus,
      totalRequired,
      lowestAvailable: lowest,
      belowBufferDays,
      shortfallDays,
      feasible,
      blendedAnnReturn: weightedAnnReturnDen > 0 ? weightedAnnReturnNum / weightedAnnReturnDen : null,
      breachDates: breachDates.slice(0, 5)
    });
  }

  // Rank feasible: bonus desc → annReturn desc → lowestAvailable desc
  const feasibleResults = results
    .filter(r => r.feasible && r.offerCount > 0)
    .sort((a, b) => {
      if (b.totalBonus !== a.totalBonus) return b.totalBonus - a.totalBonus;
      const ar = (a.blendedAnnReturn ?? 0), br = (b.blendedAnnReturn ?? 0);
      if (br !== ar) return br - ar;
      return b.lowestAvailable - a.lowestAvailable;
    });

  return {
    tooMany: false,
    candidates,
    results: feasibleResults.slice(0, 10),
    allResults: results,
    evaluated: total,
    infeasibleCount,
    candidateCount: candidates.length
  };
}

/* ============================================================
   RENDERING — top-level shell
   ============================================================ */
function render() {
  const root = document.getElementById('app');
  try {
    // Idempotent status normalization covers every state path (load, sync
    // pull, inline edits) in one place — guarantees subStatus/accountStatus
    // exist and the legacy shadow status is in sync before anything renders.
    if (App.state && App.state.offers) App.state.offers.forEach(normalizeOfferStatus);
    // Preserve focus + caret on inputs across full re-renders. Without this,
    // typing/backspacing in the search box loses focus on every keystroke
    // because innerHTML destroys the input element.
    const focused = document.activeElement;
    const focusedId = focused && focused.id ? focused.id : null;
    const selStart = focused && focused.selectionStart != null ? focused.selectionStart : null;
    const selEnd = focused && focused.selectionEnd != null ? focused.selectionEnd : null;

    root.innerHTML = renderShell();

    if (focusedId) {
      const el = document.getElementById(focusedId);
      if (el) {
        el.focus({ preventScroll: true });
        try { if (selStart != null && el.setSelectionRange) el.setSelectionRange(selStart, selEnd); } catch {}
      }
    }
    bindViewEvents();
    // Re-render charts that need actual DOM measurements
    renderChartsAfterMount();
  } catch (e) {
    // Never blank the screen on a render bug — log it and show a
    // recoverable error panel instead.
    logError(ErrCode.RENDER, e, 'render:' + (App.view || '?'));
    if (root) root.innerHTML = renderErrorState(e);
  }
}

/* Self-contained recovery UI. Must not depend on renderShell()/state being
   healthy, since it's shown precisely when those threw. Reads the diag log
   straight from localStorage so it works even mid-boot. */
function renderErrorState(err) {
  const msg = (err && err.message) ? err.message : String(err || 'Unknown error');
  return `
    <div class="error-state">
      <h1>Yield Vector hit a snag</h1>
      <p>The view failed to render, but your data is safe in local storage. Try reloading. If it keeps happening, copy the diagnostics below when reporting it.</p>
      <pre class="error-state-msg">${escapeHtml(msg)}</pre>
      <div class="error-state-actions">
        <button class="btn btn-primary" onclick="location.reload()">Reload</button>
        <button class="btn btn-secondary" data-action="copy-diag">Copy diagnostics</button>
      </div>
      <p class="error-state-foot">Build v${escapeHtml(APP_VERSION)}</p>
    </div>`;
}

  const includedOffers = App.state.offers.filter(o => offerIsActiveForProjection(o));
  const expectedBonusTotal = includedOffers.reduce((s, o) => s + (Number(o.signupBonusAmount) || 0), 0);
  const tiedUpToday = today ? today.totalTiedUp : 0;
  const liquidCapital = App.state.settings.currentLiquidCapital;

  const heroAvailable = today ? today.availableCapital : liquidCapital;
  const heroLowest = lowest ? lowest.availableCapital : heroAvailable;
  const buffer = Number(App.state.settings.minimumCashBuffer) || 0;

  // Tone for any "lowest" or "available" dollar value: red if it would go
  // negative, buffer-yellow if it dips into the buffer zone (positive but
  // under the buffer floor), normal text otherwise. Used for both the hero
  // amount and the inline "Lowest $X" line.
  function shortfallTone(v) {
    if (v < 0) return 'var(--danger)';
    if (v < buffer) return '#c88b2c'; // matches .stat-value.warn / Buffer line
    return 'var(--text)';
  }
  const heroAmountTone = shortfallTone(heroAvailable);
  const heroLowestTone = shortfallTone(heroLowest);

  const lowestPill = summary.shortfallDays > 0
    ? `<span class="pill danger">${summary.shortfallDays} shortfall day${summary.shortfallDays === 1 ? '' : 's'}</span>`
    : summary.belowBufferDays > 0
      ? `<span class="pill warn">${summary.belowBufferDays} day${summary.belowBufferDays === 1 ? '' : 's'} below buffer</span>`
      : `<span class="pill">Healthy through horizon</span>`;

  const ACTIONS_PER_PAGE = 6;
  const allUpcomingActions = computeUpcomingActions(App.state, 200);
  const upcomingPageCount = Math.max(1, Math.ceil(allUpcomingActions.length / ACTIONS_PER_PAGE));
  if (typeof App._upcomingPage !== 'number') App._upcomingPage = 0;
  App._upcomingPage = Math.min(App._upcomingPage, upcomingPageCount - 1);

        <span class="chart-legend-item"><span class="legend-swatch" style="background:#2d9cdb;"></span> Direct deposit</span>

        <span class="chart-legend-item"><span class="legend-line dashed" style="color:var(--warning);"></span> Buffer (${formatCompactCurrency(App.state.settings.minimumCashBuffer)})</span>
      </div>

      <section class="card overview-main">
        <div class="card-header">
          <h2>Upcoming actions</h2>
          ${upcomingPageCount > 1 ? `
            <div class="upcoming-pager">
              <button class="upcoming-pg-btn" data-action="upcoming-prev" ${App._upcomingPage === 0 ? 'disabled' : ''} aria-label="Previous">‹</button>
              <span class="upcoming-pg-label">${App._upcomingPage + 1} / ${upcomingPageCount}</span>
              <button class="upcoming-pg-btn" data-action="upcoming-next" ${App._upcomingPage === upcomingPageCount - 1 ? 'disabled' : ''} aria-label="Next">›</button>
            </div>
          ` : ''}
        </div>
        ${upcomingActions.length === 0
          ? `<div style="padding:var(--space-6);text-align:center;color:var(--text-tertiary);font-size:14px;">No upcoming dates yet. Add an offer to get started.</div>`
          : `<div class="action-list upcoming-fade" key="${App._upcomingPage}">${upcomingActions.map(renderActionRow).join('')}</div>`}
      </section>

      <aside class="card snapshot-card overview-aside">
        <div class="snapshot-title">At a glance</div>
        <div class="snapshot-grid">
          <div class="snap snap-active"><span class="snap-v">${App.state.offers.filter(o => o.accountStatus !== 'closed' && WORKING_SUB_STATUSES.has(o.subStatus)).length}</span><span class="snap-l">Working toward SUB</span></div>
          <div class="snap snap-actions"><span class="snap-v">${computeActionsRequired(App.state)}</span><span class="snap-l">Actions required</span></div>
          <div class="snap snap-confirmed"><span class="snap-v">${App.state.commitments.filter(c => c.status === 'confirmed' && c.includeInProjection).length + App.state.offers.filter(o => CONFIRMED_OFFER_STATUSES.has(o.status)).length}</span><span class="snap-l">Confirmed</span></div>
          <div class="snap snap-events"><span class="snap-v">${App.state.events.filter(e => e.includeInProjection).length}</span><span class="snap-l">Events</span></div>
          <div class="snap snap-bonus"><span class="snap-v${(() => { const t = formatCurrency(expectedBonusTotal); return t.length >= 8 ? ' snap-v-sm' : ''; })()}">${formatCurrency(expectedBonusTotal)}</span><span class="snap-l">Bonus pool</span></div>
        </div>
      </aside>
    </div>
  `;
}

function statCard(label, value, meta = '', variant = '', action = null) {
  // When `action` is provided, the card becomes a clickable navigation
  // surface. data-action routes through onClick(); role/tabindex make it
  // keyboard-accessible. CSS in `.stat-card[data-action]` adds the
  // pointer + hover-lift affordance.
  const navAttrs = action
    ? `data-action="${action}" role="button" tabindex="0"`
    : '';
  return `
    <div class="stat-card" ${navAttrs}>
      <div class="stat-label">${label}</div>
      <div class="stat-value ${variant}">${value}</div>
      ${meta ? `<div class="stat-meta">${meta}</div>` : ''}
    </div>
  `;
}

/* ============================================================
   REMINDER / ACTION ITEM MODEL — ONE SHARED BUILDER
   ============================================================
   buildReminderItems(state) is the SINGLE source of every actionable
   date in the planner. All three surfaces consume its output so they can
   never diverge again (step-3 P1; step-6 feed-contract v2):
     • computeReminderFeed     — schema-2 machine feed (Gist → iOS Shortcut
                                 / ICS worker); emits ALL future items, no
                                 horizon; adds tombstones + manifestVersion.
     • computeUpcomingActions  — the overview "Upcoming actions" LIST; keeps
                                 its 90-day horizon filter (by design).
     • computeActionsRequired  — the at-a-glance headline COUNT; counts WORK
                                 items only, from today forward (no UPPER
                                 horizon, but past-due items drop).
   RECONCILIATION INVARIANT (see computeActionsRequired / computeUpcomingActions):
   count = the WORK items from this builder (isWork===true) due today or later
   (no upper horizon); the LIST = every builder item within [today, today+90].
   Both derive from the same items[] and both drop past-due dates, so the
   headline count and the visible list agree by construction — a committed
   offer past its funding date reads count 0 / list 0, never count 1 / list 0.

   Each built item carries BOTH the feed fields and the list fields:
     id         — stable across syncs (offer/commitment/event id + kind);
                  per-DD items use a persisted per-DD id, never array index.
     kind       — feed semantic tag (offer-expires | deposit-deadline |
                  dd-initiate | dd-window-end | debit-deadline | withdrawal |
                  commitment-end | inflow | outflow).
     dueDate    — ISO YYYY-MM-DD (feed stamps 09:00 local on emit).
     title,notes— Reminder title/body (planner-owned; the consumer must not
                  overwrite a user's added notes — see the build guide).
     isWork     — true for to-dos the user must perform (deposit/DD/debit);
                  false for informational dates (expiry, withdrawal, events).
     listLabel/tag/name/sub/color/targetKind/targetId — LIST-row fields.

   GATE RULES (step-6 [3], step-3 P1) — keyed on the MODERN status fields
   (accountStatus / subStatus), NOT the legacy deriveLegacyStatus shadow
   (the legacy 'approved→funded' mapping used to hide funding deadlines the
   moment an account opened). offer-expires shows for prospects too (owner
   wants prospect expiries visible); WORK items (deposit/dd/debit) emit only
   when the offer is committed (subStatus approved or on-track) — met-waiting
   is excluded because the work is already done. The legacy-status shadow is
   NOT read here at all (it stays elsewhere per R38; deriveLegacyStatus is
   untouched).
*/
// subStatus values for which the account is committed and requirement WORK
// (deposit / DD initiations / debit purchases) is still outstanding.
const WORK_ITEM_SUB_STATUSES = new Set(['approved', 'on-track']);

// The "all DDs by" window-end date for a DD-family offer, where derivable.
// Frequency mode ("N DDs, one every <period>") → signup + periods×period.
// Count mode → the latest planned DD effective (posting) date. Returns an
// ISO string or '' when it can't be derived. Distinct from any single
// dd-initiate date (it's the deadline the whole set must be complete by).
function ddWindowEndDate(offer) {
  if (offer.offerType !== 'direct-deposit' && offer.offerType !== 'held-and-dd') return '';
  const req = offer.ddRequirement;
  if (req && req.mode === 'frequency') {
    const start = parseDate(offer.plannedSignupDate);
    const periods = Math.max(1, Number(req.freqPeriods) || 1);
    if (!start) return '';
    const d = new Date(start);
    if (req.freqEvery === 'week') d.setDate(d.getDate() + periods * 7);
    else if (req.freqEvery === '2weeks') d.setDate(d.getDate() + periods * 14); // UI's biweekly option
    else if (req.freqEvery === 'day') d.setDate(d.getDate() + periods);
    else d.setMonth(d.getMonth() + periods); // 'month' default
    return isoDate(d);
  }
  // Count mode: the last DD must have POSTED — use the max effective date.
  const effs = (offer.directDeposits || [])
    .map(dd => directDepositEffectiveDate(dd))
    .filter(Boolean)
    .sort();
  return effs.length ? effs[effs.length - 1] : '';
}

// THE ONE SHARED ITEM BUILDER. Pure (no state mutation) so the render-time
// list/count callers can invoke it freely; the feed layers tombstones and
// manifestVersion on top.
function buildReminderItems(state) {
  const items = [];
  const nm = (o) => `${o.bankName}${o.offerName ? ' — ' + o.offerName : ''}`;

  for (const o of state.offers || []) {
    if (!o.id) continue;
    // Terminal offers (marked done or dropped, incl. closed-and-done which
    // deriveLegacyStatus maps to 'completed') are out of every surface.
    if (o.status === 'completed' || o.status === 'skipped') continue;
    const name = nm(o);
    const color = offerColorHex(o);
    // Committed = account is being pursued and requirement WORK is still
    // open (approved/on-track). Keyed on the MODERN field, never the legacy
    // shadow. capitalLive additionally includes met-waiting: requirements
    // are done but funds are still locked, so the withdrawal/release date is
    // still worth surfacing (matches the pre-v2 legacy 'funded' behavior for
    // that informational item without re-reading the legacy shadow).
    const committed = WORK_ITEM_SUB_STATUSES.has(o.subStatus);
    const capitalLive = WORKING_SUB_STATUSES.has(o.subStatus);

    // offer-expires — informational and INTENTIONALLY NOT gated on
    // offerIsActiveForProjection: the owner wants a prospect's expiry visible
    // even when it's excluded from the capital scenario (his live BMO offer is
    // prospect + includeInScenario:false and would otherwise vanish). Scenario
    // inclusion governs capital modeling, not expiry visibility. Shows for any
    // non-terminal offer (terminal already skipped above) that isn't confirmed/
    // applied (once confirmed the deadline no longer matters). Work items and
    // withdrawal below keep the stricter committed/capital-live gates.
    if (o.offerExpirationDate && !CONFIRMED_OFFER_STATUSES.has(o.status)) {
      const due = o.offerExpirationDate.slice(0, 10);
      if (/^\d{4}-\d{2}-\d{2}$/.test(due)) items.push({
        id: `yv-offer-${o.id}-expires`,
        ownerId: o.id, kind: 'offer-expires', dueDate: due, isWork: false,
        title: `${name} — offer expires`,
        notes: `Bonus ${formatCompactCurrency(o.signupBonusAmount)}; required funding ${formatCompactCurrency(o.requiredFundingAmount)}.`,
        listLabel: 'Offer expires', tag: 'warn', name,
        sub: `${formatCompactCurrency(o.signupBonusAmount)} bonus`,
        color, targetKind: 'offer', targetId: o.id
      });
    }

    // deposit-deadline (WORK) — the lump-sum funding a committed offer still
    // owes. Emits ONLY for committed offers (approved/on-track); prospects
    // and met-waiting do not. This is the step-3 P1 gate fix: keyed on the
    // modern field so it stays visible exactly when the account is open and
    // funding is pending (the legacy status hid it as 'funded'). Restricted to
    // the fund-a-lump types: only a STANDARD direct-deposit offer has NO lump
    // sum — its money movement IS the DDs, already covered by dd-initiate +
    // dd-window-end — so a "fund $X" item there is spurious. Everything else
    // (new-funds-held, held-and-dd, and legacy offers whose offerType is
    // absent/'other' — which the app defaults to new-funds-held) funds a lump,
    // so gate on "not standard direct-deposit" rather than an allow-list that
    // would wrongly drop the undefined-offerType legacy/seed case.
    const fundsLump = o.offerType !== 'direct-deposit';
    const dd = fundsLump ? depositDeadline(o) : null;
    if (dd && committed) {
      const due = dd.slice(0, 10);
      if (/^\d{4}-\d{2}-\d{2}$/.test(due)) items.push({
        id: `yv-offer-${o.id}-deposit`,
        ownerId: o.id, kind: 'deposit-deadline', dueDate: due, isWork: true,
        title: `${name} — fund ${formatCompactCurrency(o.requiredFundingAmount)}`,
        notes: `Deposit by this date to qualify for the ${formatCompactCurrency(o.signupBonusAmount)} bonus.`,
        listLabel: 'Deposit deadline', tag: 'danger', name,
        sub: `Fund ${formatCompactCurrency(o.requiredFundingAmount)}`,
        color, targetKind: 'offer', targetId: o.id
      });
    }

    // dd-initiate (WORK) — one per planned DD with a future plannedDate.
    // Uses the persisted per-DD id (dd.id) minted at DD-row creation so
    // completion state stays glued to the right DD across insert/reorder.
    if (committed && (o.offerType === 'direct-deposit' || o.offerType === 'held-and-dd')) {
      for (const dep of (o.directDeposits || [])) {
        if (!dep || !dep.id || !dep.plannedDate) continue;
        const due = String(dep.plannedDate).slice(0, 10);
        if (!/^\d{4}-\d{2}-\d{2}$/.test(due)) continue;
        items.push({
          id: `yv-${o.id}-dd-${dep.id}`,
          ownerId: o.id, kind: 'dd-initiate', dueDate: due, isWork: true,
          title: `${name} — initiate DD ${formatCompactCurrency(dep.amount)}`,
          notes: `Start this direct deposit so it posts in time for the ${formatCompactCurrency(o.signupBonusAmount)} bonus.`,
          listLabel: 'Initiate DD', tag: 'danger', name,
          sub: `Initiate ${formatCompactCurrency(dep.amount)}`,
          color, targetKind: 'offer', targetId: o.id
        });
      }
      // dd-window-end — informational: the date all required DDs must be
      // done by (where derivable). Not a separate to-do beyond the DDs
      // themselves, so isWork:false.
      const winEnd = ddWindowEndDate(o);
      if (winEnd) {
        const due = winEnd.slice(0, 10);
        if (/^\d{4}-\d{2}-\d{2}$/.test(due)) items.push({
          id: `yv-offer-${o.id}-dd-window`,
          ownerId: o.id, kind: 'dd-window-end', dueDate: due, isWork: false,
          title: `${name} — all DDs complete by`,
          notes: `All qualifying direct deposits must have posted by this date.`,
          listLabel: 'All DDs by', tag: 'warn', name,
          sub: 'All DDs complete', color, targetKind: 'offer', targetId: o.id
        });
      }
    }

    // debit-deadline (WORK) — qualifying debit-card purchases by a date.
    // Counts as debitRequirement.count work items; the dated item carries
    // the byDate when present.
    if (committed && o.debitRequirement && o.debitRequirement.required && o.debitRequirement.byDate) {
      const due = String(o.debitRequirement.byDate).slice(0, 10);
      if (/^\d{4}-\d{2}-\d{2}$/.test(due)) {
        const cnt = Number(o.debitRequirement.count) || 0;
        items.push({
          id: `yv-offer-${o.id}-debit`,
          ownerId: o.id, kind: 'debit-deadline', dueDate: due, isWork: true,
          workCount: cnt > 0 ? cnt : 1,
          title: `${name} — ${cnt || 1} debit purchase${cnt === 1 ? '' : 's'}`,
          notes: `Make the required qualifying debit-card purchase${cnt === 1 ? '' : 's'} by this date.`,
          listLabel: 'Debit purchases', tag: 'danger', name,
          sub: `${cnt || 1} debit txn${cnt === 1 ? '' : 's'}`,
          color, targetKind: 'offer', targetId: o.id
        });
      }
    }

    // withdrawal / lock-release — informational: funds free up. Keyed on the
    // modern field: any offer whose capital is still live (approved/on-track/
    // met-waiting) and whose hold has a computable release date (prospects
    // have no live account to release from).
    const we = withdrawalEligibleDate(o);
    if (we && capitalLive) {
      const due = we.slice(0, 10);
      if (/^\d{4}-\d{2}-\d{2}$/.test(due)) items.push({
        id: `yv-offer-${o.id}-withdraw`,
        ownerId: o.id, kind: 'withdrawal', dueDate: due, isWork: false,
        title: `${name} — withdraw ${formatCompactCurrency(o.requiredFundingAmount)}`,
        notes: `Funds released; bonus ${formatCompactCurrency(o.signupBonusAmount)}.`,
        listLabel: 'Withdrawal', tag: 'success', name,
        sub: `Release ${formatCompactCurrency(o.requiredFundingAmount)}`,
        color, targetKind: 'offer', targetId: o.id
      });
    }
  }

  for (const c of state.commitments || []) {
    if (!c.id) continue;
    if (c.status === 'cancelled' || c.status === 'completed') continue;
    if (!c.endDate) continue;
    const due = String(c.endDate).slice(0, 10);
    if (!/^\d{4}-\d{2}-\d{2}$/.test(due)) continue;
    items.push({
      id: `yv-cmt-${c.id}-end`,
      ownerId: c.id, kind: 'commitment-end', dueDate: due, isWork: false,
      title: `${c.commitmentName} — release`,
      notes: `${formatCurrency(c.amount)} (${c.type}).`,
      listLabel: 'Commitment release', tag: 'success', name: c.commitmentName,
      sub: formatCompactCurrency(c.amount), color: '', targetKind: 'commitment', targetId: c.id
    });
  }

  // inflow / outflow events — informational. Respect BOTH flags exactly as
  // the list historically did (includeInProjection AND showInUpcoming), and
  // surface only the NEXT instance of a recurring event (from today), so the
  // feed and the list agree on which occurrence they mean. A generous
  // look-ahead finds the next instance even for a distant recurrence; the
  // list re-applies its own 90-day cutoff on the resulting date.
  const FEED_EVENT_HORIZON = addDays(TODAY, 366 * 5);
  for (const e of state.events || []) {
    if (!e.id) continue;
    if (!e.includeInProjection) continue;
    if (e.showInUpcoming === false) continue;
    const next = nextEventInstance(e, TODAY, FEED_EVENT_HORIZON);
    if (!next) continue;
    const amt = Number(next.amount);
    const isRecurring = e.recurrence && e.recurrence.kind && e.recurrence.kind !== 'none';
    const label = e.eventName + (isRecurring ? ` (${e.recurrence.kind === 'custom' ? `every ${e.recurrence.everyDays || 7}d` : e.recurrence.kind})` : '');
    items.push({
      id: `yv-evt-${e.id}`,
      ownerId: e.id, kind: amt >= 0 ? 'inflow' : 'outflow',
      dueDate: isoDate(next.date), isWork: false,
      title: e.eventName,
      notes: `${formatCurrency(amt)}${e.category ? ' (' + e.category + ')' : ''}.`,
      listLabel: amt >= 0 ? 'Inflow' : 'Outflow', tag: amt >= 0 ? 'success' : '',
      name: label, sub: formatCurrency(amt), color: '', targetKind: 'event', targetId: e.id
    });
  }

  items.sort((a, b) => a.dueDate.localeCompare(b.dueDate));
  return items;
}

/* Reminder feed (contract v2): a stable, machine-readable snapshot emitted
   into App.state._feed on every push so the same JSON the cloud Sync writes
   to the Gist also carries the feed. A consumer (iOS Shortcut / ICS worker)
   reads it and merges into its surface — preserving user-added notes/alarms/
   completion via per-item stable `id`s.

   Contract v2 (see docs/assessments/2026-07-05/step6-reminders-redesign.md):
     schema:2, generatedAt, manifestVersion (monotonic; survives restore-
     from-history via a max(prev+1, minutes-since-epoch) clock component),
     feedStatus ('ok'|'stale'|'error'), lastGoodGeneratedAt,
     items:[{id,kind,title,dueDate,notes}], removed:[{id,tombstonedAt,reason}].
   `risk` is intentionally OMITTED (computed risk is a later phase; the guide
   treats it as optional). Tombstones: when an offer/commitment is deleted or
   a previously-emitted id permanently disappears, its id moves to removed[]
   (retained a fixed 90 days for now; ack-based retention arrives with
   consumer heartbeats later). Previously-emitted ids live in state._feedEmitted
   so a disappearance can be detected on the next compute.

   NOTE: this function MUTATES state (manifestVersion, _feedEmitted,
   _feedRemoved) — call it only on the push/persist path (Sync.push /
   createGist / safeSync), never from a render loop. The item universe comes
   from the shared buildReminderItems() so the feed can never drift from the
   in-app list/count. */
const FEED_TOMBSTONE_TTL_MS = 90 * 24 * 60 * 60 * 1000; // fixed 90-day retention
// Session high-water mark for manifestVersion (see computeReminderFeed). Seeded
// from the loaded state on init so it survives a reload; can only ever rise.
let _manifestHwm = 0;
function computeReminderFeed(state) {
  const built = buildReminderItems(state);
  const generatedAt = new Date().toISOString();
  const stampTime = (d) => d.slice(0, 10) + 'T09:00:00';

  // Monotonic manifestVersion. Three terms guarantee it only ever grows:
  //   • minutes-since-epoch — advances across sessions/devices (a device
  //     that hasn't pushed in a while still lands a higher number).
  //   • prev + 1 — climbs on rapid same-minute pushes.
  //   • session high-water mark + 1 — the RESTORE guard. restoreState()
  //     swaps in an OLD snapshot whose _manifestVersion is small; without
  //     this a same-minute restore could regress below a number already
  //     shipped this session. The HWM (module-scoped, seeded from the loaded
  //     state on init) can never be lowered by a restored snapshot, so a
  //     restore-from-history still produces a strictly-higher version.
  const minutesEpoch = Math.floor(Date.now() / 60000);
  const prevVersion = Number(state._manifestVersion) || 0;
  const manifestVersion = Math.max(prevVersion + 1, minutesEpoch, _manifestHwm + 1);
  _manifestHwm = manifestVersion;
  state._manifestVersion = manifestVersion;

  // Tombstones. Diff the ids we emit now against the ids we emitted last
  // time (state._feedEmitted). Any id that was live and is now gone gets a
  // tombstone, reason inferred from whether its owning record still exists.
  const liveIds = new Set(built.map(it => it.id));
  const offerIds = new Set((state.offers || []).map(o => o.id));
  const cmtIds = new Set((state.commitments || []).map(c => c.id));
  const evtIds = new Set((state.events || []).map(e => e.id));
  const prevEmitted = (state._feedEmitted && typeof state._feedEmitted === 'object') ? state._feedEmitted : {};

  let removed = Array.isArray(state._feedRemoved) ? state._feedRemoved.slice() : [];
  const alreadyTombstoned = new Set(removed.map(r => r.id));
  // A tombstoned id that RE-appears (offer un-deleted / status flips back) is
  // resurrected — drop its tombstone so the consumer stops deleting it.
  removed = removed.filter(r => !liveIds.has(r.id));
  const reasonFor = (id, ownerId) => {
    // ownerId was recorded when the id was last emitted; if that record is
    // gone the item was deleted, otherwise it was superseded by a status/
    // date change that made the item no longer apply.
    if (ownerId && !offerIds.has(ownerId) && !cmtIds.has(ownerId) && !evtIds.has(ownerId)) {
      if (id.startsWith('yv-cmt-')) return 'commitment-deleted';
      if (id.startsWith('yv-evt-')) return 'event-deleted';
      return 'offer-deleted';
    }
    return 'superseded';
  };
  for (const id in prevEmitted) {
    if (liveIds.has(id)) continue;
    if (alreadyTombstoned.has(id)) continue;
    removed.push({ id, tombstonedAt: generatedAt, reason: reasonFor(id, prevEmitted[id]) });
  }
  // Retain tombstones for a fixed 90-day TTL (ack-based retention is a later
  // phase once consumer heartbeats exist).
  const cutoff = Date.now() - FEED_TOMBSTONE_TTL_MS;
  removed = removed.filter(r => {
    const t = Date.parse(r.tombstonedAt);
    return !Number.isFinite(t) || t >= cutoff;
  });
  state._feedRemoved = removed;

  // Record what we emitted this round (id → ownerId) for the next diff.
  const emittedNow = {};
  for (const it of built) emittedNow[it.id] = it.ownerId || '';
  state._feedEmitted = emittedNow;

  const lastGoodGeneratedAt = generatedAt; // this compute succeeded
  return {
    schema: 2,
    generatedAt,
    manifestVersion,
    feedStatus: 'ok',
    lastGoodGeneratedAt,
    items: built.map(it => ({
      id: it.id,
      kind: it.kind,
      title: it.title,
      dueDate: stampTime(it.dueDate),
      notes: it.notes
    })),
    removed
  };
}

// Compute the feed for the push/persist path, but never ship absent or
// silently-stale on failure. On a throw: log via ErrCode.RENDER (no more
// silent try{}catch{}), and REUSE the last good feed marked feedStatus
// 'stale' so a consumer can tell the producer is degraded rather than act
// on nothing. If there is no last-good feed to reuse, return a minimal
// feedStatus:'error' envelope. Returns the feed to store in state._feed.
function computeFeedSafely(state) {
  try {
    return computeReminderFeed(state);
  } catch (e) {
    logError(ErrCode.RENDER, e, 'reminder-feed');
    const lastGood = state && state._feed;
    if (lastGood && lastGood.items) {
      return { ...lastGood, feedStatus: 'stale', generatedAt: new Date().toISOString() };
    }
    return {
      schema: 2,
      generatedAt: new Date().toISOString(),
      manifestVersion: Number(state && state._manifestVersion) || 0,
      feedStatus: 'error',
      lastGoodGeneratedAt: (lastGood && lastGood.lastGoodGeneratedAt) || null,
      items: [],
      removed: (state && Array.isArray(state._feedRemoved)) ? state._feedRemoved : []
    };
  }
}

// "Actions required": the headline count of discrete to-dos still owed on
// committed offers. Counts the WORK items from the shared builder (deposit,
// each future DD initiation, debit purchases) that are still ACTIONABLE
// (due today or later). No UPPER horizon — a work item past the list's 90-day
// window still counts — but a work item whose deadline has already PASSED is
// dropped, exactly as the list drops d < TODAY, so the headline count and the
// visible list can never disagree (a committed offer past its funding date
// must read count 0 / list 0, not count 1 / list 0). Prospects/applied
// contribute ZERO (owner decision, step-6 [4]); met-waiting/earned/closed
// offers have no outstanding work (excluded by the builder's committed gate).
function computeActionsRequired(state) {
  const todayISO = isoDate(TODAY);
  let n = 0;
  for (const it of buildReminderItems(state)) {
    if (!it.isWork) continue;
    // Past-due work items drop from the count just as they drop from the list
    // (string compare is safe on canonical YYYY-MM-DD).
    if (it.dueDate < todayISO) continue;
    // debit-deadline is one dated item standing in for N purchases.
    n += Number(it.workCount) || 1;
  }
  return n;
}

// The overview "Upcoming actions" LIST: every builder item within the
// 90-day horizon (the horizon filter is by design — the FEED keeps the full
// future). Reconciles with computeActionsRequired by construction: same
// items[], count = the isWork subset regardless of horizon, list = all
// within horizon.
function computeUpcomingActions(state, limit = 12) {
  const horizonEnd = addDays(TODAY, 90);
  const items = [];
  for (const it of buildReminderItems(state)) {
    const d = parseDate(it.dueDate);
    if (!d || d < TODAY || d > horizonEnd) continue;
    items.push({
      date: d,
      kind: it.listLabel,
      name: it.name,
      sub: it.sub,
      tag: it.tag,
      color: it.color,
      targetKind: it.targetKind,
      targetId: it.targetId
    });
  }
  // Builder already sorts by dueDate; keep a stable date sort for the Date
  // objects (identical ordering) and page.
  items.sort((a, b) => a.date - b.date);
  return items.slice(0, limit);
}

/* Targeted update for the Upcoming-Actions pager. A full render() would
   rebuild every section on the overview page, which (a) burns work and
   (b) reflows enough surrounding DOM that the document's scroll position
   gets nudged upward when the new page has fewer rows. Swapping just the
   action-list innerHTML keeps the section height pinned (min-height in CSS)
   and the page stays exactly where the user left it. */
function updateUpcomingPage(nextPage) {
  const ACTIONS_PER_PAGE = 6;
  const all = computeUpcomingActions(App.state, 200);
  const pageCount = Math.max(1, Math.ceil(all.length / ACTIONS_PER_PAGE));
  const clamped = Math.max(0, Math.min(pageCount - 1, nextPage));
  if (clamped === App._upcomingPage) return;
  App._upcomingPage = clamped;
  const slice = all.slice(clamped * ACTIONS_PER_PAGE, (clamped + 1) * ACTIONS_PER_PAGE);
  const list = document.querySelector('.action-list');
  if (list) {
    list.innerHTML = slice.map(renderActionRow).join('');
    // Re-trigger the fade-in animation for the new page
    list.classList.remove('upcoming-fade');
    void list.offsetWidth; // force reflow so the animation restarts
    list.classList.add('upcoming-fade');
    list.setAttribute('key', clamped);
  }
  // Update pager controls in place
  const pager = document.querySelector('.upcoming-pager');
  if (pager) {
    const prev = pager.querySelector('[data-action="upcoming-prev"]');
    const next = pager.querySelector('[data-action="upcoming-next"]');
    const label = pager.querySelector('.upcoming-pg-label');
    if (prev) prev.toggleAttribute('disabled', clamped === 0);
    if (next) next.toggleAttribute('disabled', clamped === pageCount - 1);
    if (label) label.textContent = `${clamped + 1} / ${pageCount}`;
  }
}

function renderActionRow(item) {
  const month = item.date.toLocaleDateString('en-US', { month: 'short' }).toUpperCase();
  const day = item.date.getDate();
  return `
    <div class="action-row${item.color ? ' has-color' : ''}${item.targetKind ? ' clickable' : ''}"${item.color ? ` style="--offer-color:${item.color};"` : ''}${item.targetKind ? ` data-action="open-action-target" data-target-kind="${item.targetKind}" data-target-id="${escapeAttr(item.targetId)}" role="button" tabindex="0"` : ''}>
      <div class="action-day">
        <span class="month">${month}</span>
        <span class="day">${day}</span>
      </div>
      <div class="action-body">
        <div class="action-title">${escapeHtml(item.name)}</div>
        <div class="action-sub">${escapeHtml(item.sub)} · ${relativeDays(item.date)}</div>
      </div>
      <span class="action-tag ${item.tag || ''}">${escapeHtml(item.kind)}</span>
    </div>
  `;
}

function renderPlanner() {
  const offers = App.state.offers
    .filter(o => o.status !== 'completed' && o.status !== 'skipped')
    .slice()
    .sort((a, b) => {
      const ar = annualizedReturn(a) ?? 0;
      const br = annualizedReturn(b) ?? 0;
      return br - ar;
    });

  const proj = generateProjection(App.state);
  const summary = summarizeProjection(proj, App.state.settings);
  const includedCount = offers.filter(o => offerIsActiveForProjection(o)).length;
  const includedBonus = offers.filter(o => offerIsActiveForProjection(o)).reduce((s, o) => s + (o.signupBonusAmount || 0), 0);

  const candidates = offers.filter(o => HYPOTHETICAL_OFFER_STATUSES.has(o.status) && isOfferComplete(o));

  const optResult = App.optimizer.results;

  return `
    <div class="section-header">
      <div>
        <h2>Planner</h2>
        <p>Toggle offers in or out and see your cash projection update live.</p>
      </div>
      <div style="display:flex;gap:var(--space-2);">
        <button class="btn btn-secondary planner-add-btn" data-action="add-offer">+ Add offer</button>
      </div>
    </div>

    <div class="optimizer-bar">
      <div class="optimizer-summary">
        <div class="metric">
          <span class="label">Selected</span>
          <span class="value">${includedCount} <span style="font-size:13px;color:var(--text-tertiary);font-weight:500;">of ${offers.length}</span></span>
        </div>
        <div class="metric">
          <span class="label">Expected bonus</span>
          <span class="value" style="color:var(--success);">${formatCurrency(includedBonus)}</span>
        </div>
        <div class="metric">
          <span class="label">Lowest projected</span>
          <span class="value" style="${summary.shortfallDays > 0 ? 'color:var(--danger);' : (summary.belowBufferDays > 0 ? 'color:#c88b2c;' : 'color:#0ea968;')}">${summary.lowest ? formatCompactCurrency(summary.lowest.availableCapital) : '—'}</span>
        </div>
        <div class="metric">
          <span class="label">Candidates for optimizer</span>
          <span class="value">${candidates.length}</span>
        </div>
      </div>
      <div style="display:flex;gap:var(--space-2);align-items:center;flex-wrap:wrap;">
        <button class="btn btn-primary" data-action="run-optimizer">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg>
          Find feasible combinations
        </button>
        ${optResult ? `<button class="btn btn-ghost btn-sm" data-action="clear-optimizer">Clear results</button>` : ''}
      </div>
    </div>

    ${optResult ? renderOptimizerResults(optResult) : ''}

    ${offers.length === 0
      ? renderEmptyState('No offers yet', 'Add a bonus to start planning. We will compute the funding/withdrawal dates and tied-up cash for you.', 'add-offer', 'Add your first offer')

  //                  untouched, sets status 'pending', keeps the dirty marker;
  //                  the next foreground sync re-detects. Logged here.
  //   'adopt'      — user chose the cloud → caller adopts remote (discarding
  //                  this device's unsynced edits).
  //   'keep-local' — user chose to keep local → caller pushes local up
  //                  (overwrite intent), routed through the CAS push.
  resolveDirtyConflict(remote, side, { unknownLineage = false } = {}) {
    // No UI available (a background auto-sync) → never silently pick a side.
    if (typeof document !== 'undefined' && document.hidden) {
      if (side === 'pull') {
        logError(ErrCode.SYNC_PULL, new Error('remote newer with local edits, no UI to resolve'), 'pull-conflict-deferred');
      } else {
        logError(ErrCode.SYNC_PUSH, new Error('head divergence with local edits, no UI to resolve'), 'cas-conflict-deferred');
      }
      return 'defer';
    }
    const rO = (remote && Array.isArray(remote.offers)) ? remote.offers.length : 0;
    const lO = (App.state && Array.isArray(App.state.offers)) ? App.state.offers.length : 0;
    const counts = `\n\n• Cloud: ${rO} offer${rO === 1 ? '' : 's'}\n• This device: ${lO} offer${lO === 1 ? '' : 's'}`;
    const msg = unknownLineage
      ? `First sync on this device's new version: the cloud and this device differ.${counts}\n\nRecommended: Adopt cloud (OK).\nChoose Keep this device (Cancel) ONLY if you made changes here that never synced.`
      : `Sync conflict.\n\nThe cloud has changes from another device AND this device has unsynced edits.${counts}\n\nOK  = Adopt the cloud (discard this device's recent edits) — safe default.\nCancel = Keep this device's edits and overwrite the cloud.`;
    const adopt = confirm(msg);
    return adopt ? 'adopt' : 'keep-local';
  },

  // Is the local state trivial (nothing a user could lose)? Must cover EVERY
  // user-editable collection — offers, commitments, standalone cash-flow
  // events, and user-entered source banks — so a device holding only, say,
  // events doesn't silently adopt the cloud and lose them. Also never trivial
  // if the device is dirty (a pending unsynced edit is by definition
  // something to lose, regardless of counts). Used to skip the unknown-lineage
  // prompt and silently adopt an untouched fresh install.
  _trivialLocalState() {
    if (this.localDirty) return false;
    const s = App.state;
    if (!s) return true;
    const len = (a) => (Array.isArray(a) ? a.length : 0);
    return len(s.offers) === 0
        && len(s.commitments) === 0
        && len(s.events) === 0
        && len(s.settings && s.settings.sourceBanks) === 0;
  },

  // THE UNIFIED FIRST-SYNC RULE. While lineage is unknown (no _baseRevision),
  // any sync encounter with an EXISTING, DIVERGENT cloud state prompts ONCE
  // (recommend Adopt) — timestamps carry zero signal in this window, so this
  // replaces the old per-direction legacy-timestamp inferences. After any
  // resolution (adopt seeds lineage; keep-local pushes and the PATCH seeds it)
  // the rule never fires again. Called by BOTH safeSync and push before their
  // normal (known-lineage) logic. Adopts in-place when it decides to adopt.
  // Returns: 'n/a' (lineage known, or no real cloud state, or same state —
  // caller proceeds with normal logic), 'adopted' (handled — caller returns),
  // 'deferred' (background, no UI — caller sets 'pending' and returns), or
  // 'keep-local' (user kept local — caller pushes it up, force).
  resolveFirstSync({ remote, cloudHead, side }) {
    const baseRev = App.state && App.state._baseRevision;
    if (baseRev) return 'n/a';                 // lineage known — normal path
    if (!(cloudHead && remote)) return 'n/a';  // fresh/empty cloud — normal path

    const adoptCloud = () => {
      App.state = remote;
      // Adopted cloud payload may predate schema v2 — migrate before persist/
      // render so requirements[]/scalars exist (idempotent; the one-time backup
      // guard means repeat adoptions don't churn yv-backup-pre-v2).
      migrateOffersToSchemaV2(App.state);
      App.state._baseRevision = cloudHead;
      this.markClean();
      try { localStorage.setItem(STORAGE_KEY, JSON.stringify(App.state)); } catch {}
      this.lastSyncAt = Date.now();
      this.setStatus('synced');
      render();
    };

    const remoteMod = (remote && remote._lastModified) || 0;
    const localMod = (App.state && App.state._lastModified) || 0;
    // Silently adopt + seed lineage (no prompt, no toast — nothing to lose)
    // when any of:
    //   • equal live timestamps — same state right now; OR
    //   • the state we LOADED matched the cloud and only system stamps have
    //     moved local since (a projection date-roll re-stamps _lastModified,
    //     which would otherwise defeat the equal check and force a needless
    //     prompt). Gated on !localDirty so a genuine user edit since load still
    //     prompts; OR
    //   • trivial local state (no offers/commitments — an untouched install).
    // adoptCloud() calls markClean(), so an equal-stamp encounter also clears a
    // stale dirty marker (e.g. a PATCH that landed but whose response was lost).
    if (remoteMod === localMod ||
        (!this.localDirty && remoteMod === this.loadedModified) ||
        this._trivialLocalState()) {
      adoptCloud();
      return 'adopted';
    }
    // Divergent, non-trivial, unknown lineage → ask ONCE.
    const decision = this.resolveDirtyConflict(remote, side, { unknownLineage: true });
    if (decision === 'defer') return 'deferred';
    if (decision === 'adopt') {
      adoptCloud();
      toast('Adopted cloud — this device was behind after an update');
      return 'adopted';
    }
    return 'keep-local';  // caller pushes local up (force)
  },

  getConfig() {
    try { return JSON.parse(localStorage.getItem(SYNC_CONFIG_KEY)) || null; }
    catch { return null; }
  },
  setConfig(cfg) {
    if (cfg) localStorage.setItem(SYNC_CONFIG_KEY, JSON.stringify(cfg));
    else localStorage.removeItem(SYNC_CONFIG_KEY);
  },
  // Optional DoC-import Worker URL (Phase 7 v2). Stored in the same local sync-
  // config blob (device-local, never in the public state payload synced to the
  // Gist), but independent of the Gist credentials: it is read/written on its
  // own key and deliberately survives a sync disconnect, since it's a separate
  // integration. Empty string / null when unconfigured — the whole URL-import
  // feature is gated on this being a non-empty https URL.
  getDocWorkerUrl() {
    const c = this.getConfig();
    const u = c && typeof c.docWorkerUrl === 'string' ? c.docWorkerUrl.trim() : '';
    return u;
  },
  setDocWorkerUrl(url) {
    const c = this.getConfig() || {};
    const clean = (url == null ? '' : String(url)).trim();
    if (clean) c.docWorkerUrl = clean;
    else delete c.docWorkerUrl;
    // Persist even if there are no Gist credentials yet — the URL is standalone.
    if (Object.keys(c).length) localStorage.setItem(SYNC_CONFIG_KEY, JSON.stringify(c));
    else localStorage.removeItem(SYNC_CONFIG_KEY);
  },
  // Optional shared secret for the DoC Worker (matches the Worker's
  // WORKER_SECRET; sent as the X-YV-Key header). Same storage + privacy
  // guarantees as the URL: device-local in SYNC_CONFIG_KEY, NEVER in App.state,
  // so it is never synced to the Gist or written to a JSON export, and it
  // survives a sync disconnect. Empty when unconfigured (then no header is sent
  // and the Worker's secret gate must also be unset for fetches to work).
  getDocWorkerSecret() {
    const c = this.getConfig();
    return c && typeof c.docWorkerSecret === 'string' ? c.docWorkerSecret.trim() : '';
  },
  setDocWorkerSecret(secret) {
    const c = this.getConfig() || {};
    const clean = (secret == null ? '' : String(secret)).trim();
    if (clean) c.docWorkerSecret = clean;
    else delete c.docWorkerSecret;
    if (Object.keys(c).length) localStorage.setItem(SYNC_CONFIG_KEY, JSON.stringify(c));
    else localStorage.removeItem(SYNC_CONFIG_KEY);
  },
  isConfigured() {
    const c = this.getConfig();
    return Boolean(c && c.token && c.gistId);
  },
  setStatus(s, err = null) {
    this.status = s;
    this.lastError = err;
    updateSyncIndicator();
  },

  // Schedule a debounced push after local edits.
  schedulePush(delayMs = 2500) {
    if (!this.isConfigured()) { this.setStatus('unconfigured'); return; }
    if (this.pushTimer) clearTimeout(this.pushTimer);
    this.setStatus('pending');
    this.pushTimer = setTimeout(() => this.push({ silent: true }), delayMs);
  },

  // Timestamp-aware sync: pulls from Gist; if remote newer, replaces local
  // (after flushing any pending push). If local newer, pushes. Safe to call
  // from startup, focus, and visibilitychange. Throttled by SAFE_SYNC_COOLDOWN.
  _lastSafeSyncAt: 0,
  async safeSync({ force = false, reason = '' } = {}) {
    if (!this.isConfigured()) { this.setStatus('unconfigured'); return; }
    const SAFE_SYNC_COOLDOWN = 5000;
    const now = Date.now();
    if (!force && now - this._lastSafeSyncAt < SAFE_SYNC_COOLDOWN) return;
    this._lastSafeSyncAt = now;

    const cfg = this.getConfig();
    // If a debounced push is queued, the user has unsaved local edits — flush
    // them first so we don't clobber them by pulling.
    if (this.pushTimer) {
      clearTimeout(this.pushTimer);
      this.pushTimer = null;
      await this.push({ silent: true });
    }

    this.setStatus('syncing');
    try {
      const data = await ghGet(`https://api.github.com/gists/${cfg.gistId}`, cfg.token);
      const file = data.files[SYNC_FILENAME] || Object.values(data.files || {})[0];
      let remote = null;
      if (file) {
        const content = file.truncated
          ? await (await fetch(file.raw_url)).text()
          : file.content;
        if (content && content.trim()) {
          try { remote = JSON.parse(content); } catch (e) { remote = null; logError(ErrCode.PARSE, e, 'startupSync: cloud payload'); }
        }
      }
      const remoteModified = (remote && remote._lastModified) || 0;
      const localModified = (App.state && App.state._lastModified) || 0;
      // Reuse the same GET response for the lineage head (no extra request).
      const cloudHead = revisionOf(data);

      // UNIFIED FIRST-SYNC RULE (unknown lineage). Runs before the timestamp
      // branching because timestamps carry NO signal while lineage is unknown
      // — a divergent cloud must be resolved by one prompt regardless of which
      // side's stamp is newer (this is the pull-side twin of the push guard;
      // the old per-direction legacy inferences are gone). 'n/a' → fall through
      // to the normal known-lineage logic below.
      const first = this.resolveFirstSync({ remote, cloudHead, side: 'pull' });
      if (first === 'adopted') return;
      if (first === 'deferred') { this.setStatus('pending'); return; }
      if (first === 'keep-local') { await this.push({ silent: true, force: true }); return; }

      if (remote && remoteModified > localModified) {
        // Remote is newer. If this device has NO unsynced edits, adopt the
        // cloud (below). But if it's dirty (_dirtySince set — e.g. a failed or
        // deferred push, or a reload with unsynced edits), a blind adopt would
        // silently discard exactly the edits the dirty marker exists to
        // protect — the mirror image of the push-side clobber. Route through
        // the SAME shared conflict resolver as the push side.
        const adoptRemote = () => {
          App.state = remote;
          // Cloud payload may predate v2 — migrate before persist/render.
          migrateOffersToSchemaV2(App.state);
          App.state._baseRevision = cloudHead;
          this.markClean();
          try { localStorage.setItem(STORAGE_KEY, JSON.stringify(App.state)); } catch {}
          this.lastSyncAt = Date.now();
          this.setStatus('synced');
          render();
          if (reason) toast(`Pulled latest from cloud (${reason})`);
        };
        if (!this.localDirty) {
          adoptRemote();
        } else {
          const decision = this.resolveDirtyConflict(remote, 'pull');
          if (decision === 'defer') {
            // Leave local state untouched; keep the dirty marker so the next
            // foreground sync re-detects and asks.
            this.setStatus('pending');
          } else if (decision === 'adopt') {
            adoptRemote();
            toast('Adopted cloud — this device’s recent edits were discarded');
          } else {
            // 'keep-local' — the user chose to keep this device's edits and
            // overwrite the cloud. Push them up with overwrite intent (force
            // past the CAS so we don't re-prompt for the same decision — the
            // single shared dialog above already covered it).
            await this.push({ silent: true, force: true });
          }
        }
      } else if (!remote || localModified > remoteModified) {
        // Local newer or remote empty — push up. Skip if remoteModified > 0
        // and local seeded with no edits (avoids overwriting with sample data
        // on a fresh device); only push if local has been touched.
        if (remoteModified > 0 && localModified === 0) {
          // Local is fresh / unsaved — pull remote rather than push
          App.state = remote;
          // Cloud payload may predate v2 — migrate before persist/render.
          migrateOffersToSchemaV2(App.state);
          App.state._baseRevision = cloudHead;
          this.markClean();
          try { localStorage.setItem(STORAGE_KEY, JSON.stringify(App.state)); } catch {}
          this.lastSyncAt = Date.now();
          this.setStatus('synced');
          render();
          if (reason) toast(`Pulled latest from cloud (${reason})`);
        } else {
          // Local newer → push through the CAS push (guards against a stale
          // device clobbering data the cloud gained since our last pull).
          await this.push({ silent: true });
        }
      } else {
        // Timestamps equal (common on the first run of a new build against an
        // already-synced device). Nothing to transfer, but seed our lineage
        // from the GET response we already have — otherwise _baseRevision
        // stays falsy and the CAS guard is silently disabled on the next
        // push. Persist without re-stamping _lastModified and without pushing.
        if (cloudHead && App.state && App.state._baseRevision !== cloudHead) {
          App.state._baseRevision = cloudHead;
        }
        // Equal stamps mean this device's edit is provably already in the
        // cloud, so clear any lingering dirty marker — otherwise a PATCH that
        // landed but whose response was lost leaves the device falsely dirty
        // and it would raise bogus conflict prompts on later syncs.
        this.markClean();
        try { localStorage.setItem(STORAGE_KEY, JSON.stringify(App.state)); } catch {}
        this.lastSyncAt = Date.now();
        this.setStatus('synced');
      }
    } catch (e) {
      this.setStatus('error', e.message);
      console.warn('safeSync failed', e);
    }
  },

  async startupSync() {
    if (this.startupDone) return;
    this.startupDone = true;
    return this.safeSync({ force: true });
  },

  async pull({ silent = false } = {}) {
    if (!this.isConfigured()) { toast('Sync not configured', 'danger'); return; }
    const cfg = this.getConfig();
    this.setStatus('syncing');
    try {
      const data = await ghGet(`https://api.github.com/gists/${cfg.gistId}`, cfg.token);
      const file = data.files[SYNC_FILENAME] || Object.values(data.files || {})[0];
      if (!file) throw new Error('Gist has no file yet');
      const content = file.truncated
        ? await (await fetch(file.raw_url)).text()
        : file.content;
      if (!content || !content.trim()) throw new Error('Gist file is empty');
      const remote = JSON.parse(content);
      // Manual pull is an explicit user action to adopt the cloud, so it
      // adopts unconditionally — but if this device has unsynced edits, warn
      // first so the user doesn't silently discard them.
      if (this.localDirty && !silent) {
        if (!confirm('This device has unsynced edits. Pulling replaces them with the cloud copy and cannot be undone here (use "Restore from history" to recover a prior cloud revision).\n\nPull and discard this device’s edits?')) {
          this.setStatus('synced');
          return;
        }
      }
      App.state = remote;
      // Manually-pulled cloud payload may predate v2 — migrate before persist/
      // render (idempotent; backup guard prevents churn on repeat pulls).
      migrateOffersToSchemaV2(App.state);
      // Record the cloud head as our lineage so later CAS pushes compare
      // correctly (manual pull is a pull-adopt path like the others).
      App.state._baseRevision = revisionOf(data);
      this.markClean();
      try { localStorage.setItem(STORAGE_KEY, JSON.stringify(App.state)); } catch {}
      this.lastSyncAt = Date.now();
      this.setStatus('synced');
      render();
      if (!silent) toast('Pulled from cloud');
    } catch (e) {
      logError(ErrCode.SYNC_PULL, e, 'Sync.pull');
      this.setStatus('error', e.message);
      if (!silent) toast('Pull failed: ' + e.message, 'danger');
    }
  },

  // Single unified push. All push paths (App.save debounce, safeSync's
  // local-newer branch, the manual "Push now" button) route through here so
  // there is ONE place that talks to the Gist. It is a compare-and-swap:
  // unless {force} is set, it GETs the gist first and, if the cloud head has
  // moved off our lineage (_baseRevision) OR our lineage is unknown while a
  // real cloud state exists, it treats that as a conflict and either silently
  // adopts the cloud (this device was just stale) or asks the user (this
  // device has unsynced edits) — the guard that stops a stale device from
  // clobbering newer data. The pre-check FAILS CLOSED: if the cloud GET fails
  // we DEFER (status 'pending', dirty marker kept) rather than fall back to an
  // unguarded PATCH, so a flaky network can't bypass the guard. {force:true}
  // skips the CAS check and is reachable ONLY after an explicit user
  // "overwrite" decision or an explicit make-this-the-truth action: (1) the
  // push-side CAS conflict dialog's overwrite branch (falls through to the
  // PATCH below, in-place), (2) the pull-side (safeSync) conflict resolver's
  // 'keep-local' branch — both route through the ONE shared
  // resolveDirtyConflict() dialog, so a force here never double-prompts — and
  // (3) restoreState. NEVER from a plain manual push.
  async push({ silent = false, force = false } = {}) {
    if (!this.isConfigured()) { if (!silent) toast('Sync not configured', 'danger'); return; }
    const cfg = this.getConfig();
    this.setStatus('syncing');
    try {
      // Stamp last-modified + reminder feed snapshot just before sending so
      // remote reflects the upload. The feed is what an iOS Shortcut will
      // read to build merge-style Reminders entries.
      App.state._lastModified = Date.now();
      App.state._feed = computeFeedSafely(App.state);
      try { localStorage.setItem(STORAGE_KEY, JSON.stringify(App.state)); } catch {}

      if (!force) {
        // Compare-and-swap pre-check. Peek at the cloud before PATCHing.
        let cloudData = null;
        try {
          cloudData = await ghGet(`https://api.github.com/gists/${cfg.gistId}`, cfg.token);
        } catch (e) {
          // FAIL CLOSED. If we can't read the cloud head we cannot prove this
          // push is safe, so we never blind-PATCH — a fail-open would bypass
          // the whole guard exactly when the network is flaky.
          logError(ErrCode.SYNC_PUSH, e, 'cas-precheck-failed');
          // A permanent failure (401/403 expired/revoked PAT, 404 deleted or
          // wrong gist id) will never self-heal by retrying — surface it as an
          // error so the indicator turns red and the manual "Push now" path can
          // show "Push failed: HTTP <code>" so the user knows to fix creds.
          // Transient/network-ish failures keep the defer-and-retry: 'pending',
          // dirty marker kept, next cycle retries.
          if (e && (e.status === 401 || e.status === 403 || e.status === 404)) {
            this.setStatus('error', e.message);
            if (!silent) toast('Push failed: ' + e.message, 'danger');
          } else {
            this.setStatus('pending');
          }
          return;
        }
        const cloudHead = revisionOf(cloudData);
        const baseRev = App.state && App.state._baseRevision;
        const remote = cloudHead ? await parseGistState(cloudData) : null;

        // UNKNOWN LINEAGE → the unified first-sync rule (shared with safeSync).
        // Prompts once on a divergent existing cloud, silently adopts/seeds
        // otherwise; only an empty/fresh cloud falls through to the seed PATCH.
        if (!baseRev) {
          const first = this.resolveFirstSync({ remote, cloudHead, side: 'push' });
          if (first === 'adopted') return;
          if (first === 'deferred') { this.setStatus('pending'); return; }
          // 'keep-local' → fall through to PATCH (overwrite intent).
          // 'n/a'        → empty/fresh cloud → fall through to seed PATCH.
        } else if (cloudHead && cloudHead !== baseRev && remote) {
          // KNOWN LINEAGE, head moved off ours → marker-based CAS. Timestamps
          // get NO vote (a re-stamp forges newness); the persisted dirty marker
          // is the only signal.
          const adoptCloud = () => {
            App.state = remote;
            // Cloud payload may predate v2 — migrate before persist/render.
            migrateOffersToSchemaV2(App.state);
            App.state._baseRevision = cloudHead;
            this.markClean();
            try { localStorage.setItem(STORAGE_KEY, JSON.stringify(App.state)); } catch {}
            this.lastSyncAt = Date.now();
            this.setStatus('synced');
            render();
          };
          if (!this.localDirty) {
            // Merely stale (no unsynced edits) — cloud is authoritative.
            adoptCloud();
            toast('Cloud had newer data — updated this device instead of overwriting');
            return;
          }
          // Both sides changed — shared resolver. 'defer' → 'pending';
          // 'adopt' → take cloud; 'keep-local' → fall through to PATCH.
          const decision = this.resolveDirtyConflict(remote, 'push');
          if (decision === 'defer') { this.setStatus('pending'); return; }
          if (decision === 'adopt') {
            adoptCloud();
            toast('Adopted cloud — this device’s recent edits were discarded');
            return;
          }
          // 'keep-local' → fall through to PATCH (overwrite).
        }
      }

      // Scrub _dirtySince from the UPLOADED copy only. If we shipped our own
      // non-null marker, an old-build device (which has no markClean) would
      // pull and store it verbatim, then after IT upgrades believe itself
      // dirty during a later divergence and offer to overwrite newer cloud
      // data. The wire copy is a shallow clone with _dirtySince:null; the
      // LOCAL App.state keeps its marker until the PATCH actually succeeds
      // (markClean in the success tail — a failed PATCH must stay dirty).
      const wire = { ...App.state, _dirtySince: null };
      const body = JSON.stringify({
        files: { [SYNC_FILENAME]: { content: JSON.stringify(wire, null, 2) } }
      });
      const patched = await ghFetch(`https://api.github.com/gists/${cfg.gistId}`, cfg.token, 'PATCH', body);
      // The PATCH response carries the updated gist (incl. history); record the
      // new head as our lineage so the next CAS check compares correctly, and
      // persist it so lineage survives a reload. Our edits are now on the
      // cloud, so this device is no longer dirty.
      const newRev = revisionOf(patched);
      if (newRev) App.state._baseRevision = newRev;
      this.markClean();
      try { localStorage.setItem(STORAGE_KEY, JSON.stringify(App.state)); } catch {}
      this.lastSyncAt = Date.now();
      this.setStatus('synced');
      if (!silent) toast('Pushed to cloud');
    } catch (e) {
      logError(ErrCode.SYNC_PUSH, e, 'Sync.push');
      this.setStatus('error', e.message);
      if (!silent) toast('Push failed: ' + e.message, 'danger');
    }
  },

  async createGist(token) {
    // Convenience: create a private Gist seeded with current state + feed.
    App.state._lastModified = Date.now();
    App.state._feed = computeFeedSafely(App.state);
    try { localStorage.setItem(STORAGE_KEY, JSON.stringify(App.state)); } catch {}
    const body = JSON.stringify({
      description: 'Yield Vector sync',
      public: false,
      files: { [SYNC_FILENAME]: { content: JSON.stringify(App.state, null, 2) } }
    });
    const data = await ghFetch('https://api.github.com/gists', token, 'POST', body);
    // Seed lineage from the creation response so the brand-new Gist starts
    // with known lineage (otherwise _baseRevision stays falsy and the CAS
    // guard is disabled until the first pull). The local state is now on the
    // cloud, so this device is clean.
    App.state._baseRevision = revisionOf(data);
    this.markClean();
    try { localStorage.setItem(STORAGE_KEY, JSON.stringify(App.state)); } catch {}
    return data.id;
  },

  // ---- Revision history / recovery -------------------------------------
  // GitHub keeps every Gist revision, so an accidental overwrite (e.g. a
  // stale device pushing over newer data) is recoverable. listHistory()
  // returns the revisions newest-first; fetchRevision() pulls one version's
  // parsed state; restoreState() makes a chosen revision current everywhere.
  async listHistory() {
    if (!this.isConfigured()) throw new Error('Sync not configured');
    const cfg = this.getConfig();
    const data = await ghGet(`https://api.github.com/gists/${cfg.gistId}`, cfg.token);
    return Array.isArray(data.history) ? data.history : [];
  },
  async fetchRevision(version) {
    const cfg = this.getConfig();
    const data = await ghGet(`https://api.github.com/gists/${cfg.gistId}/${version}`, cfg.token);
    const file = (data.files && (data.files[SYNC_FILENAME] || Object.values(data.files)[0])) || null;
    if (!file) return null;
    const content = file.truncated ? await (await fetch(file.raw_url)).text() : file.content;
    if (!content || !content.trim()) return null;
    try { return JSON.parse(content); } catch (e) { logError(ErrCode.PARSE, e, 'fetchRevision'); return null; }
  },
  // Replace local state with a recovered revision and push it up so it
  // becomes the current version on every device (push stamps a fresh
  // _lastModified, so other devices pull it on their next sync).
  async restoreState(state) {
    App.state = state;
    // A restored cloud-history revision may predate schema v2 — migrate before
    // it becomes the pushed/rendered truth (idempotent: a caller that already
    // migrated, e.g. restorePreV2Backup, gets a no-op here).
    migrateOffersToSchemaV2(App.state);
    // A restore is an explicit "make THIS the truth" action, so clear any
    // inherited lineage and force the push past the CAS check — otherwise a
    // cloud that looks newer could decline the restore itself. The forced
    // push records the fresh head as _baseRevision, which then BLOCKS a stale
    // device's later auto-push (its lineage won't match) — this is the
    // "restore won't recur-clobber" guarantee.
    App.state._baseRevision = null;
    try { localStorage.setItem(STORAGE_KEY, JSON.stringify(App.state)); } catch {}
    await this.push({ silent: true, force: true });
    this.lastSyncAt = Date.now();
    this.setStatus('synced');
    render();
  },

  disconnect() {
    if (this.pushTimer) clearTimeout(this.pushTimer);
    // Preserve the optional DoC-import Worker URL + secret across a sync
    // disconnect — they're a separate integration, not Gist credentials, so
    // dropping them here would silently break URL import when someone just
    // resets cloud sync.
    const keepWorkerUrl = this.getDocWorkerUrl();
    const keepWorkerSecret = this.getDocWorkerSecret();
    this.setConfig(null);
    if (keepWorkerUrl) this.setDocWorkerUrl(keepWorkerUrl);
    if (keepWorkerSecret) this.setDocWorkerSecret(keepWorkerSecret);
    this.lastSyncAt = 0;
    this.setStatus('unconfigured');
  }
};

// Head revision SHA of a Gist API response (newest history entry). Used as
// the lineage marker (_baseRevision) for compare-and-swap sync. Returns null
// if the response has no history (unknown lineage → callers degrade soft).
function revisionOf(gistData) {
  const h = gistData && Array.isArray(gistData.history) ? gistData.history : null;
  return (h && h[0] && h[0].version) || null;
}

// Parse the synced state file out of a Gist API response. Mirrors the
// truncated-file handling used elsewhere. Returns null on missing/empty/bad
// payload (logged as a parse error) so callers can fall back.
async function parseGistState(gistData) {
  const file = (gistData && gistData.files &&
    (gistData.files[SYNC_FILENAME] || Object.values(gistData.files)[0])) || null;
  if (!file) return null;
  const content = file.truncated ? await (await fetch(file.raw_url)).text() : file.content;
  if (!content || !content.trim()) return null;
  try { return JSON.parse(content); }
  catch (e) { logError(ErrCode.PARSE, e, 'parseGistState: cloud payload'); return null; }
}

async function ghGet(url, token) {
  const r = await fetch(url, {
    headers: {
      Authorization: `token ${token}`,
      Accept: 'application/vnd.github+json'
    }
  });
  if (!r.ok) {
    const t = await r.text().catch(() => '');
    const err = new Error(`HTTP ${r.status}${t ? ': ' + t.slice(0, 80) : ''}`);
    err.status = r.status;  // structured so callers can branch (e.g. auth vs transient)
    throw err;
  }
  return r.json();
}

async function ghFetch(url, token, method, body) {
  const r = await fetch(url, {
    method,
    headers: {
      Authorization: `token ${token}`,
      Accept: 'application/vnd.github+json',
      'Content-Type': 'application/json'
    },
    body
  });
  if (!r.ok) {
    const t = await r.text().catch(() => '');
    const err = new Error(`HTTP ${r.status}${t ? ': ' + t.slice(0, 80) : ''}`);
    err.status = r.status;
    throw err;
  }
  return r.json();
}

function relativeTimeShort(ts) {
  if (!ts) return '';
  const diff = Math.max(0, Date.now() - ts);
  if (diff < 10000) return 'just now';
  if (diff < 60000) return `${Math.floor(diff / 1000)}s ago`;
  if (diff < 3600000) return `${Math.floor(diff / 60000)}m ago`;
  if (diff < 86400000) return `${Math.floor(diff / 3600000)}h ago`;
  return `${Math.floor(diff / 86400000)}d ago`;
}

function renderSyncIndicator() {
  const rel = Sync.lastSyncAt ? relativeTimeShort(Sync.lastSyncAt) : '';
  const labels = {
    synced: rel ? `Synced ${rel}` : 'Synced',
    syncing: 'Syncing…',
    pending: 'Pending',
    error: 'Sync error',
    unconfigured: 'Not synced'
  };
  const title = Sync.lastError
    ? `Error: ${Sync.lastError}. Click to fix.`
    : (Sync.status === 'synced' && Sync.lastSyncAt
      ? `Last synced ${new Date(Sync.lastSyncAt).toLocaleTimeString()}. Click for sync settings.`
      : `Click for sync settings.`);
  return `
    <button class="sync-indicator" data-status="${Sync.status}" data-action="open-sync" title="${escapeAttr(title)}">
      <span class="sync-dot"></span>
      <span class="sync-text">${labels[Sync.status] || 'Sync'}</span>
    </button>
  `;
}

function updateSyncIndicator() {
  // Patch in place to avoid full re-render
  const old = document.querySelector('.sync-indicator');
  if (!old) return;
  const wrap = document.createElement('div');
  wrap.innerHTML = renderSyncIndicator();
  const next = wrap.firstElementChild;
  old.replaceWith(next);
}

/* ============================================================
   PWA: runtime-generated icon + manifest, no external assets
   ============================================================ */
function setupPwa() {
  // Yield Vector home-screen icon — pixel-identical (modulo raster vs.
  // vector) to the inline SVG brand mark in renderHeader(). The header
  // SVG is a 22×22 viewBox; this canvas is 180×180. Every coordinate
  // below is the header coord × (180/22) ≈ 8.18181818, so the icon
  // and the header read as the same mark at two scales.
  //
  // Header reference (LOCKED — keep in sync if either is edited):
  //   - rect 22×22, rx=6
  //   - chip gradient (BL→TR, x1=0 y1=22 x2=22 y2=0):
  //       0%   #1e1b4b     45%  #4338ca
  //       80%  #7c3aed    100%  #b69cff
  //   - shimmer (x1=0 y1=0 x2=14 y2=14):
  //       0%   rgba(255,255,255,0.18)
  //       100% rgba(255,255,255,0)
  //   - arrow shaft:  M 5.5 16.5 Q 9 12 16 6.5    stroke=#fff w=2 round
  //   - arrowhead:    M 10.8 7.2 L 16.5 6 L 15.3 12  same stroke
  const c = document.createElement('canvas');
  c.width = 180; c.height = 180;
  const ctx = c.getContext('2d');
  const W = 180;
  const S = W / 22;            // header→canvas scale
  const R = 6 * S;             // 49.09 — corner radius

  // Round-corner clip (rx=6 in header, rx=49 here)
  ctx.save();
  ctx.beginPath();
  ctx.moveTo(R, 0);
  ctx.lineTo(W - R, 0);
  ctx.quadraticCurveTo(W, 0, W, R);
  ctx.lineTo(W, W - R);
  ctx.quadraticCurveTo(W, W, W - R, W);
  ctx.lineTo(R, W);
  ctx.quadraticCurveTo(0, W, 0, W - R);
  ctx.lineTo(0, R);
  ctx.quadraticCurveTo(0, 0, R, 0);
  ctx.closePath();
  ctx.clip();

  // Chip gradient: corner-to-corner, bottom-left → top-right
  const grad = ctx.createLinearGradient(0, W, W, 0);
  grad.addColorStop(0.00, '#1e1b4b');
  grad.addColorStop(0.45, '#4338ca');
  grad.addColorStop(0.80, '#7c3aed');
  grad.addColorStop(1.00, '#b69cff');
  ctx.fillStyle = grad;
  ctx.fillRect(0, 0, W, W);

  // Upper-left shimmer overlay — same stops/extent as the header SVG
  const shimmer = ctx.createLinearGradient(0, 0, 14 * S, 14 * S);
  shimmer.addColorStop(0, 'rgba(255,255,255,0.18)');
  shimmer.addColorStop(1, 'rgba(255,255,255,0)');
  ctx.fillStyle = shimmer;
  ctx.fillRect(0, 0, W, W);

  // White arrow — same Bezier shaft + chevron arrowhead as the header.
  // Stroke width 2 in header → 2 × S ≈ 16.36 here.
  ctx.strokeStyle = '#ffffff';
  ctx.lineWidth = 2 * S;
  ctx.lineCap = 'round';
  ctx.lineJoin = 'round';
  // Shaft: M 5.5 16.5 Q 9 12 16 6.5
  ctx.beginPath();
  ctx.moveTo(5.5 * S, 16.5 * S);
  ctx.quadraticCurveTo(9 * S, 12 * S, 16 * S, 6.5 * S);
  ctx.stroke();
  // Arrowhead: M 10.8 7.2 L 16.5 6 L 15.3 12
  ctx.beginPath();
  ctx.moveTo(10.8 * S, 7.2 * S);
  ctx.lineTo(16.5 * S, 6 * S);
  ctx.lineTo(15.3 * S, 12 * S);
  ctx.stroke();

  ctx.restore();

  const dataUrl = c.toDataURL('image/png');
  const apple = document.getElementById('apple-icon');
  const fav = document.getElementById('favicon');
  if (apple) apple.href = dataUrl;
  if (fav) fav.href = dataUrl;
  // Sync the <meta name="theme-color"> too — it controls the iOS Safari
  // status-bar tint and the Android task-switcher header. Pick a color
  // pulled from the chip's mid-gradient so the OS chrome harmonizes
  // with the icon rather than being the old standalone accent.
  const themeMeta = document.querySelector('meta[name="theme-color"]');
  if (themeMeta) themeMeta.setAttribute('content', '#4338ca');
  // Web App Manifest (Android/Chrome)
  const manifest = {
    name: 'Yield Vector',
    short_name: 'Yield Vector',
    display: 'standalone',
    start_url: location.pathname,
    scope: location.pathname,
    background_color: '#f5f5f7',
    theme_color: '#4338ca',
    icons: [
      { src: dataUrl, sizes: '180x180', type: 'image/png', purpose: 'any maskable' }
    ]
  };
  const blob = new Blob([JSON.stringify(manifest)], { type: 'application/manifest+json' });
  const m = document.getElementById('manifest');
  if (m) m.href = URL.createObjectURL(blob);
}

/* ============================================================
   DATE UTILITIES
   ============================================================ */
function startOfDay(d) {
  const x = new Date(d);
  x.setHours(0, 0, 0, 0);
  return x;
}

/* ============================================================
   RECURRING CAPITAL EVENTS
   ============================================================
   Capital events may carry a `recurrence` object describing how often
   they repeat:
     { kind: 'none' | 'weekly' | 'biweekly' | 'monthly' | 'custom',
       everyDays: number,    // only used when kind === 'custom'
       endDate:  'YYYY-MM-DD' (optional — empty means "through horizon")
     }
   expandEventInstances() materializes all instances within a window so
   the projection engine and chart marker code can treat each one as
   an independent event without knowing it came from a recurring rule.
*/
function expandEventInstances(e, horizonStartDate, horizonEndDate) {
  const startDate = parseDate(e.date);
  if (!startDate) return [];
  const amount = Number(e.amount);
  if (!Number.isFinite(amount) || amount === 0) return [];
  const rec = e.recurrence || {};
  const kind = rec.kind || 'none';
  const startMs = horizonStartDate ? horizonStartDate.getTime() : -Infinity;
  const endMs = horizonEndDate ? horizonEndDate.getTime() : Infinity;
  if (kind === 'none') {
    const t = startDate.getTime();
    if (t < startMs || t > endMs) return [];
    return [{ date: startDate, amount }];
  }
  // Recurrence end: either user-set or projection horizon end
  const recEnd = rec.endDate ? parseDate(rec.endDate) : null;
  const stopMs = recEnd ? Math.min(recEnd.getTime(), endMs) : endMs;
  let stepDays = 0, monthly = false;
  if (kind === 'weekly') stepDays = 7;
  else if (kind === 'biweekly') stepDays = 14;
  else if (kind === 'monthly') monthly = true;
  else if (kind === 'custom') stepDays = Math.max(1, Math.min(365, Number(rec.everyDays) || 7));
  else return [{ date: startDate, amount }];

  const instances = [];
  let cur = new Date(startDate);
  // Hard upper bound — even daily for 5 years is 1825 iterations
  for (let n = 0; n < 2000; n++) {
    const t = cur.getTime();
    if (t > stopMs) break;
    if (t >= startMs) instances.push({ date: new Date(cur), amount });
    if (monthly) cur = new Date(cur.getFullYear(), cur.getMonth() + 1, cur.getDate());
    else cur = new Date(cur.getTime() + stepDays * 86400000);
  }
  return instances;
}

// Convenience for "Upcoming Actions": just the next instance from now.
function nextEventInstance(e, fromDate, horizonEndDate) {
  const instances = expandEventInstances(e, fromDate, horizonEndDate);
  return instances.length > 0 ? instances[0] : null;
}

function parseDate(s) {
  if (!s) return null;
  if (s instanceof Date) return startOfDay(s);
  const m = String(s).match(/^(\d{4})-(\d{2})-(\d{2})/);
  if (!m) return null;
  const d = new Date(+m[1], +m[2] - 1, +m[3]);
  return isNaN(d) ? null : d;
}

/* ============================================================
   US FEDERAL BANK HOLIDAYS (computed per year, cached)
   ============================================================
   The 11 Federal Reserve / ACH holidays. Computed dynamically so
   the business-day math stays correct indefinitely. Fixed-date
   holidays follow the "observed" rule: if the date falls on Sat,
   the observance is Fri; if on Sun, the observance is Mon. (This
   matches the official OPM and Fed observance rules.) Floating
   holidays (MLK, Presidents, Memorial, Labor, Columbus, Thanksgiving)
   compute their nth-weekday and need no observed shift since they
   always fall on a weekday.
*/
function _nthWeekdayOfMonth(year, month, weekday, n) {
  // month: 0-11, weekday: 0=Sun..6=Sat, n: 1-based
  const first = new Date(year, month, 1);
  const offset = (weekday - first.getDay() + 7) % 7;
  return new Date(year, month, 1 + offset + (n - 1) * 7);
}
function _lastWeekdayOfMonth(year, month, weekday) {
  const last = new Date(year, month + 1, 0); // last day of month
  const offset = (last.getDay() - weekday + 7) % 7;
  return new Date(year, month, last.getDate() - offset);
}
function _observed(d) {
  // Sat → Fri; Sun → Mon. Weekdays unchanged.
  const day = d.getDay();
  if (day === 0) return new Date(d.getFullYear(), d.getMonth(), d.getDate() + 1);
  if (day === 6) return new Date(d.getFullYear(), d.getMonth(), d.getDate() - 1);
  return d;
}
const _holidayCache = {};
function usFederalHolidays(year) {
  if (_holidayCache[year]) return _holidayCache[year];
  const dates = [
    _observed(new Date(year, 0, 1)),                  // New Year's Day
    _nthWeekdayOfMonth(year, 0, 1, 3),                // MLK Day — 3rd Mon Jan
    _nthWeekdayOfMonth(year, 1, 1, 3),                // Presidents Day — 3rd Mon Feb
    _lastWeekdayOfMonth(year, 4, 1),                  // Memorial Day — last Mon May
    _observed(new Date(year, 5, 19)),                 // Juneteenth (federal since 2021)
    _observed(new Date(year, 6, 4)),                  // Independence Day
    _nthWeekdayOfMonth(year, 8, 1, 1),                // Labor Day — 1st Mon Sep
    _nthWeekdayOfMonth(year, 9, 1, 2),                // Columbus Day — 2nd Mon Oct
    _observed(new Date(year, 10, 11)),                // Veterans Day
    _nthWeekdayOfMonth(year, 10, 4, 4),               // Thanksgiving — 4th Thu Nov
    _observed(new Date(year, 11, 25))                 // Christmas
  ];
  const set = new Set(dates.map(d => {
    const y = d.getFullYear();
    const m = String(d.getMonth() + 1).padStart(2, '0');
    const dd = String(d.getDate()).padStart(2, '0');
    return `${y}-${m}-${dd}`;
  }));
  _holidayCache[year] = set;
  return set;
}
function isUsBankHoliday(d) {
  const dt = d instanceof Date ? d : parseDate(d);
  if (!dt) return false;
  const y = dt.getFullYear();
  const m = String(dt.getMonth() + 1).padStart(2, '0');
  const dd = String(dt.getDate()).padStart(2, '0');
  return usFederalHolidays(y).has(`${y}-${m}-${dd}`);
}
function isBusinessDay(d) {
  const dt = d instanceof Date ? d : parseDate(d);
  if (!dt) return false;
  const day = dt.getDay();
  if (day === 0 || day === 6) return false; // weekend
  return !isUsBankHoliday(dt);
}
function nextBusinessDay(d) {
  let x = d instanceof Date ? new Date(d) : parseDate(d);
  if (!x) return null;
  while (!isBusinessDay(x)) x.setDate(x.getDate() + 1);
  return x;
}
function previousBusinessDay(d) {
  let x = d instanceof Date ? new Date(d) : parseDate(d);
  if (!x) return null;
  while (!isBusinessDay(x)) x.setDate(x.getDate() - 1);
  return x;
}
// Advance n BUSINESS days from d (each step skips weekends/holidays).
// addBusinessDays(Fri, 1) === Mon. n=0 returns d unchanged.
function addBusinessDays(d, n) {
  let x = d instanceof Date ? new Date(d) : parseDate(d);
  if (!x) return null;
  let added = 0;
  while (added < n) {
    x.setDate(x.getDate() + 1);
    if (isBusinessDay(x)) added++;
  }
  return x;
}

// Global DD transfer model (Settings → "DD transfer timing"). The
// round-trip for one direct deposit is: initiate → posts as a DD after
// `inDays` business days → seasons `seasonDays` business days in the
// account → sent back → returns to origin after `backDays` business
// days. Default 1/1/1 ("season 1 business day") so a Monday-initiated
// DD round-trips in ~3 days and a Friday-initiated one in ~5 (the
// weekend extends it). Weekends/holidays at any leg push the next leg
// out, which is the whole point of business-day awareness.
function ddTransferConfig() {
  const s = (App.state && App.state.settings) || {};
  const t = s.ddTransfer || {};
  return {
    inDays: Number.isFinite(t.inDays) ? t.inDays : 1,
    seasonDays: Number.isFinite(t.seasonDays) ? t.seasonDays : 1,
    backDays: Number.isFinite(t.backDays) ? t.backDays : 1
  };
}

// For one DD (initiated on its planned date), compute the full round
// trip. Returns { initiate, post, returnInitiate, returnDate, heldDays }
// where heldDays = calendar days the money is OUT of the origin account
// (from initiation through the day it lands back). null if no date.
function ddRoundTrip(dd) {
  const initiate = dd && dd.plannedDate ? parseDate(dd.plannedDate) : null;
  if (!initiate) return null;
  const { inDays, seasonDays, backDays } = ddTransferConfig();
  const post = addBusinessDays(initiate, inDays);
  const returnInitiate = addBusinessDays(post, seasonDays);
  const returnDate = addBusinessDays(returnInitiate, backDays);
  const heldDays = daysBetween(initiate, returnDate);
  return { initiate, post, returnInitiate, returnDate, heldDays };
}

// Suggested LATEST-safe funding date for an offer: the deposit deadline
// (signup + daysAfterSignupAllowedBeforeDeposit) minus a 1-day buffer,
// then walked BACKWARD to the nearest business day if that lands on a
// weekend/holiday. Keeps you safely before the deadline while funding
// on a day the bank actually processes money. Returns a Date or null
// when there isn't enough info to compute it.
function suggestedFundingDate(signupISO, daysAfterDeposit) {
  const signup = parseDate(signupISO);
  const n = Number(daysAfterDeposit);
  if (!signup || !Number.isFinite(n) || n <= 0) return null;
  const deadline = addDays(signup, n);          // last allowed deposit day
  const buffered = addDays(deadline, -1);        // 1-day safety buffer
  // If the buffered day already precedes signup (tiny windows), clamp
  // to the next business day on/after signup instead.
  if (buffered <= signup) return nextBusinessDay(signup);
  return previousBusinessDay(buffered);
}

// Given a directDeposits[] entry { plannedDate, amount }, return the
// effective (actual processing) date as a YYYY-MM-DD string — same as
// planned if it's a business day, otherwise the next business day.
function directDepositEffectiveDate(dd) {
  if (!dd || !dd.plannedDate) return '';
  const planned = parseDate(dd.plannedDate);
  if (!planned) return '';
  return isoDate(nextBusinessDay(planned));
}

/* ============================================================
   CUSTOM DATE PICKER (color-coded popover)
   ============================================================
   Replaces the native <input type="date"> on offer-modal date fields
   with a month grid whose business days are shaded by an optimality
   metric. Two modes (set via data-picker-mode on the input):
     'dd'    — shade business days by the DD round-trip hold (green =
               shortest, red = longest); for picking DD initiation dates.
     'plain' — business days green ("posts same business day"), weekend/
               holiday amber ("will shift to next business day"); for
               funding/signup dates.
   The input stays a readonly text field whose .value is the YYYY-MM-DD
   string (so FormData / readDdRowsFromForm keep working unchanged). The
   popover is appended to <body> with position:fixed so the modal's
   overflow can't clip it.
   ============================================================ */
const DatePicker = {
  el: null, input: null, mode: 'plain', vY: 0, vM: 0,
  ensure() {
    if (this.el) return;
    const d = document.createElement('div');
    d.className = 'yv-dp';
    d.style.display = 'none';
    document.body.appendChild(d);
    this.el = d;
    d.addEventListener('mousedown', (e) => e.preventDefault()); // keep input focus
    d.addEventListener('click', (e) => this.onClick(e));
    document.addEventListener('mousedown', (e) => {
      if (this.el.style.display === 'none') return;
      if (!this.el.contains(e.target) && e.target !== this.input) this.close();
    });
    window.addEventListener('resize', () => this.close());
  },
  open(input) {
    this.ensure();
    this.input = input;
    this.mode = input.dataset.pickerMode || 'plain';
    // input.value holds the M-D-YYYY display string; parse back to ISO
    // (parseDateInput also tolerates a pasted ISO) before seeding the grid.
    const cur = parseDate(parseDateInput(input.value)) || TODAY;
    this.vY = cur.getFullYear(); this.vM = cur.getMonth();
    this.el.style.display = 'block';
    this.render();
    this.place();   // decide + anchor ONCE per open
  },
  close() { if (this.el) this.el.style.display = 'none'; this.input = null; },
  // Anchor the popover once on open. The above/below decision uses a FIXED
  // height estimate (not the live offsetHeight) so it doesn't change between
  // a 5-row and 6-row month. We anchor by a fixed EDGE (top when below,
  // bottom when above) so adding a 6th row grows the grid in one direction
  // instead of flipping the whole popover across the field.
  place() {
    const r = this.input.getBoundingClientRect();
    const el = this.el;
    el.style.position = 'fixed';
    // Measure the ACTUAL rendered size (responsive width on narrow screens).
    const w = el.offsetWidth || 280;
    const h = el.offsetHeight || 320;
    const vw = window.innerWidth, vh = window.innerHeight;
    // Horizontal: anchor to the field's left, but clamp fully into the
    // viewport with an 8px margin so it can never hang off either edge.
    const left = Math.max(8, Math.min(r.left, vw - w - 8));
    el.style.left = left + 'px';
    // Vertical: below if it fits, else above; clamp so it never spills past
    // the top or bottom of the screen either.
    const roomBelow = vh - r.bottom;
    if (roomBelow >= h + 8 || r.top < h + 8) {
      const top = Math.max(8, Math.min(r.bottom + 6, vh - h - 8));
      el.style.top = top + 'px'; el.style.bottom = 'auto';
    } else {
      const bottom = Math.max(8, Math.min(vh - r.top + 6, vh - h - 8));
      el.style.bottom = bottom + 'px'; el.style.top = 'auto';
    }
  },
  // For the visible month, compute per-business-day hold (dd mode) to find
  // the min/max so coloring is relative to what's achievable that month.
  monthStats() {
    if (this.mode !== 'dd') return { min: 0, max: 0, held: {} };
    const y = this.vY, m = this.vM, held = {};
    let min = Infinity, max = -Infinity;
    const dim = new Date(y, m + 1, 0).getDate();
    for (let d = 1; d <= dim; d++) {
      const date = new Date(y, m, d);
      if (!isBusinessDay(date)) continue;
      const rt = ddRoundTrip({ plannedDate: isoDate(date) });
      if (!rt) continue;
      held[d] = rt.heldDays;
      if (rt.heldDays < min) min = rt.heldDays;
      if (rt.heldDays > max) max = rt.heldDays;
    }
    return { min, max, held };
  },
  render() {
    const y = this.vY, m = this.vM;
    const stats = this.monthStats();
    const monthName = new Date(y, m, 1).toLocaleDateString('en-US', { month: 'long', year: 'numeric' });
    const selected = parseDate(parseDateInput(this.input && this.input.value));
    const firstPad = new Date(y, m, 1).getDay();
    const dim = new Date(y, m + 1, 0).getDate();
    let cells = '';
    for (let i = 0; i < firstPad; i++) cells += '<span></span>';
    for (let d = 1; d <= dim; d++) {
      const date = new Date(y, m, d);
      const biz = isBusinessDay(date), holi = isUsBankHoliday(date);
      let cls = 'yv-dp-day';
      let badge = '';
      if (!biz) {
        cls += this.mode === 'plain' ? ' amber' : ' muted';
      } else if (this.mode === 'dd') {
        const h = stats.held[d];
        if (h != null) {
          if (h <= stats.min) cls += ' good';
          else if (h >= stats.max && stats.max > stats.min) cls += ' bad';
          else cls += ' mid';
          badge = `<i>${h}d</i>`;
        }
      } else {
        cls += ' good';
      }
      if (holi) cls += ' holiday';
      if (selected && selected.getFullYear() === y && selected.getMonth() === m && selected.getDate() === d) cls += ' sel';
      cells += `<button type="button" class="${cls}" data-day="${isoDate(date)}"><b>${d}</b>${badge}</button>`;
    }
    // Pad with trailing empty cells so the grid is ALWAYS 6 rows (42
    // cells) — keeps the popover a constant height across months without
    // relying on min-height stretching (which caused the overflow bug).
    const totalCells = firstPad + dim;
    for (let i = totalCells; i < 42; i++) cells += '<span></span>';
    const legend = this.mode === 'dd'
      ? `<div class="yv-dp-legend"><span><i class="s good"></i>shortest</span><span><i class="s mid"></i>mid</span><span><i class="s bad"></i>longest</span></div>`
      : `<div class="yv-dp-legend"><span><i class="s good"></i>posts same day</span><span><i class="s amber"></i>shifts to next business day</span></div>`;
    this.el.innerHTML =
      `<div class="yv-dp-head"><button type="button" data-nav="-1">‹</button><span>${monthName}</span><button type="button" data-nav="1">›</button></div>`
      + `<div class="yv-dp-dow">${['S','M','T','W','T','F','S'].map(x => `<span>${x}</span>`).join('')}</div>`
      + `<div class="yv-dp-grid">${cells}</div>`
      + legend
      + `<div class="yv-dp-foot"><button type="button" data-today="1">Today</button><button type="button" data-clear="1">Clear</button></div>`;
  },
  onClick(e) {
    const nav = e.target.closest('[data-nav]');
    if (nav) {
      this.vM += parseInt(nav.dataset.nav, 10);
      if (this.vM < 0) { this.vM = 11; this.vY--; }
      if (this.vM > 11) { this.vM = 0; this.vY++; }
      // Re-render only — do NOT re-anchor. The popover keeps its fixed
      // edge so a 5↔6 row month change grows the grid in place instead
      // of flipping the whole popover above/below the field.
      this.render();
      return;
    }
    if (e.target.closest('[data-today]')) {
      this.vY = TODAY.getFullYear(); this.vM = TODAY.getMonth();
      this.setValue(isoDate(TODAY)); return;
    }
    if (e.target.closest('[data-clear]')) { this.setValue(''); return; }
    const day = e.target.closest('[data-day]');
    if (day) this.setValue(day.dataset.day);
  },
  setValue(iso) {
    if (!this.input) return;
    // Grid hands us canonical ISO (or '' for Clear); show the owner's
    // M-D-YYYY display format. Every reader parses back via parseDateInput.
    this.input.value = iso ? formatDateDisplay(iso) : '';
    this.input.dispatchEvent(new Event('input', { bubbles: true }));
    this.input.dispatchEvent(new Event('change', { bubbles: true }));
    this.close();
  }
};

/* ============================================================
   DD-METHOD DATAPOINTS (Doctor of Credit)
   ============================================================
   Lazy-loads dd-methods.json (1,150+ destination banks, each with the
   source methods that code as a direct deposit + their DP counts). For a
   given offer bank, ranks methods by DP count and flags which are the
   user's own source banks (settings.sourceBanks). Same-origin fetch —
   the file is committed alongside index.html and served by GitHub Pages,
   so it works offline-after-first-load (browser cache) and survives
   across sessions (it's in the repo, not anyone's context).
   ============================================================ */
const DDMethods = {
  data: null, loading: false, loaded: false, failed: false,
  load() {
    if (this.loading || this.loaded) return;
    this.loading = true;
    fetch('dd-methods.json')
      .then(r => r.ok ? r.json() : Promise.reject())
      .then(j => { this.data = j; this.loaded = true; this.loading = false; render(); })
      .catch(() => { this.loading = false; this.failed = true; });
  },
  slug(s) { return (s || '').toLowerCase().replace(/[^a-z0-9]/g, ''); },
  // Find the DoC entry for an offer bank name (exact slug, else fuzzy
  // prefix/contains match — "Chase Bank" ↔ "chase").
  lookup(bankName) {
    if (!this.data || !this.data.banks) return null;
    const sl = this.slug(bankName);
    if (!sl) return null;
    const banks = this.data.banks;
    if (banks[sl]) return banks[sl];
    let best = null, bestLen = 0;
    for (const k in banks) {
      if (sl.length >= 4 && (sl.startsWith(k) || k.startsWith(sl)) && k.length > bestLen) { best = banks[k]; bestLen = k.length; }
    }
    return best;
  },
  // Ranked methods for an offer bank + which are the user's source banks,
  // plus the fallback signals (best-of-mine, none-of-mine).
  forOffer(bankName, sourceBanks) {
    const entry = this.lookup(bankName);
    if (!entry) return null;
    const mine = (sourceBanks || []).map(b => this.slug(b)).filter(Boolean);
    const isMine = (method) => {
      const ms = this.slug(method);
      return mine.some(x => ms === x || (x.length >= 3 && (ms.startsWith(x) || x.startsWith(ms))));
    };
    // Only methods with at least one DoC datapoint are useful evidence —
    // a method listed with dps:0 (e.g. "American Express 0") is noise.
    const works = (entry.works || []).filter(w => w.dps > 0).map(w => ({ ...w, mine: isMine(w.method) }));
    return {
      name: entry.name,
      top3: works.slice(0, 3),
      myBest: works.filter(w => w.mine).sort((a, b) => b.dps - a.dps)[0] || null,
      topHasMine: works.slice(0, 3).some(w => w.mine),
      anyMine: works.some(w => w.mine),
      hasSourceBanks: (sourceBanks || []).length > 0
    };
  }
};

function isoDate(d) {
  if (!d) return '';
  const dt = d instanceof Date ? d : parseDate(d);
  if (!dt) return '';
  const y = dt.getFullYear();
  const m = String(dt.getMonth() + 1).padStart(2, '0');
  const dd = String(dt.getDate()).padStart(2, '0');
  return `${y}-${m}-${dd}`;
}

function addDays(d, n) {
  const dt = new Date(d);
  dt.setDate(dt.getDate() + n);
  return dt;
}

// Add `n` calendar months to a Date, CLAMPING the day to the target month's
// last day rather than rolling over (Jan 31 + 1mo → Feb 28/29, never Mar 3).
// Uses the same local-midnight constructor idiom as parseDate (no UTC/string
// parsing), so it composes with isoDate() safely. `n` may be negative.
function addMonthsClamped(d, n) {
  const dt = d instanceof Date ? d : parseDate(d);
  if (!dt) return null;
  const y = dt.getFullYear();
  const m = dt.getMonth() + n;      // may be <0 or >11; Date normalizes the year
  const day = dt.getDate();
  // Last day of the target month: day 0 of the *following* month.
  const lastDay = new Date(y, m + 1, 0).getDate();
  return new Date(y, m, Math.min(day, lastDay));
}

function daysBetween(a, b) {
  const ms = startOfDay(b) - startOfDay(a);
  return Math.round(ms / 86400000);
}

function formatDateShort(d) {
  const dt = d instanceof Date ? d : parseDate(d);
  if (!dt) return '—';
  return dt.toLocaleDateString('en-US', { month: 'short', day: 'numeric' });
}

function formatDateMedium(d) {
  const dt = d instanceof Date ? d : parseDate(d);
  if (!dt) return '—';
  const sameYear = dt.getFullYear() === TODAY.getFullYear();
  return dt.toLocaleDateString('en-US', sameYear
    ? { month: 'short', day: 'numeric' }
    : { month: 'short', day: 'numeric', year: 'numeric' });
}

function formatDateLong(d) {
  const dt = d instanceof Date ? d : parseDate(d);
  if (!dt) return '—';
  return dt.toLocaleDateString('en-US', { weekday: 'short', month: 'short', day: 'numeric', year: 'numeric' });
}

function relativeDays(d) {
  const dt = parseDate(d);
  if (!dt) return '';
  const n = daysBetween(TODAY, dt);
  if (n === 0) return 'today';
  if (n === 1) return 'tomorrow';
  if (n === -1) return 'yesterday';
  if (n > 0) return `in ${n} days`;
  return `${-n} days ago`;
}

/* ============================================================
   CURRENCY FORMATTING
   ============================================================ */
function formatCurrency(n, opts = {}) {
  if (n === null || n === undefined || isNaN(n)) return '—';
  const sign = n < 0 ? '-' : '';
  const abs = Math.abs(n);
  return sign + '$' + Math.round(abs).toLocaleString('en-US');
}

function formatCurrencyDecimal(n) {
  if (n === null || n === undefined || isNaN(n)) return '—';
  const sign = n < 0 ? '-' : '';
  return sign + '$' + Math.abs(n).toLocaleString('en-US', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
}

function formatCompactCurrency(n) {
  if (n === null || n === undefined || isNaN(n)) return '—';
  const sign = n < 0 ? '-' : '';
  const abs = Math.abs(n);
  if (abs >= 1_000_000) return `${sign}$${(abs / 1_000_000).toFixed(abs >= 10_000_000 ? 0 : 1)}M`;
  if (abs >= 10_000) return `${sign}$${Math.round(abs / 1000)}K`;
  if (abs >= 1000) return `${sign}$${(abs / 1000).toFixed(1)}K`;
  return `${sign}$${Math.round(abs)}`;
}

function formatPercent(n, digits = 1) {
  if (n === null || n === undefined || isNaN(n)) return '—';
  return (n * 100).toFixed(digits) + '%';
}

/* ============================================================
   DISPLAY <-> STORAGE BOUNDARY HELPERS (R62)
   ============================================================
   Storage/sync formats NEVER change: dates stay ISO `YYYY-MM-DD`
   strings in state/localStorage/Gist and in every internal
   comparison; money stays a plain Number in state. These four
   helpers are the SINGLE conversion point at the render/read
   boundary — the display value (M-D-YYYY dates, comma-grouped
   money) exists only inside input/render code, and is parsed
   straight back to canonical ISO / Number before it ever reaches
   state. Do not scatter ad-hoc toLocaleString/replace conversions;
   route through these so a missed site can't corrupt an offer. */

// ISO `YYYY-MM-DD` -> owner's display format `M-D-YYYY` (no leading
// zeros). Empty -> ''. Anything not ISO-shaped is returned unchanged
// so a stray already-humanized string never gets mangled.
function formatDateDisplay(iso) {
  if (!iso) return '';
  const m = String(iso).match(/^(\d{4})-(\d{2})-(\d{2})$/);
  if (!m) return String(iso);
  return `${Number(m[2])}-${Number(m[3])}-${m[1]}`;
}

// Accepts the display format `M-D-YYYY` (owner's), tolerates
// `M/D/YYYY` and a pasted ISO `YYYY-MM-DD`, and returns canonical
// ISO `YYYY-MM-DD` — or null if it can't be understood. This is the
// ONLY thing that reads a yv-date field's typed/displayed value back
// into state, so it must never hand a non-ISO string downstream.
function parseDateInput(str) {
  if (str == null) return null;
  const s = String(str).trim();
  if (!s) return null;
  // Pasted / stored ISO first (YYYY-MM-DD or YYYY/MM/DD).
  let m = s.match(/^(\d{4})[-/](\d{1,2})[-/](\d{1,2})$/);
  if (m) return _isoFromYMD(+m[1], +m[2], +m[3]);
  // Owner's M-D-YYYY (hyphen) or tolerated M/D/YYYY (slash).
  m = s.match(/^(\d{1,2})[-/](\d{1,2})[-/](\d{4})$/);
  if (m) return _isoFromYMD(+m[3], +m[1], +m[2]);
  return null;
}
// Build an ISO date only if the Y/M/D make a real calendar date;
// reject overflow (e.g. 13-40-2026, 2-30-2026) so bad input becomes
// null rather than a silently rolled-over date.
function _isoFromYMD(y, mo, d) {
  if (!(y >= 1000 && y <= 9999 && mo >= 1 && mo <= 12 && d >= 1 && d <= 31)) return null;
  const dt = new Date(y, mo - 1, d);
  if (dt.getFullYear() !== y || dt.getMonth() !== mo - 1 || dt.getDate() !== d) return null;
  return `${y}-${String(mo).padStart(2, '0')}-${String(d).padStart(2, '0')}`;
}

// Number or numeric string -> thousands-grouped display string,
// e.g. 25000 -> "25,000", -1234.5 -> "-1,234.5". Preserves a
// trailing "." and in-progress decimals while typing, and a leading
// "-". Non-numeric characters ($, spaces, stray commas) are stripped
// first so it's safe to re-run on its own output.
function formatMoneyInput(val) {
  if (val === '' || val == null) return '';
  let s = String(val).replace(/[^0-9.\-]/g, '');
  if (s === '' || s === '-' || s === '.' || s === '-.') return s;
  const neg = s.startsWith('-');
  s = s.replace(/-/g, '');
  // Keep only the first '.'; fold any extras into the fractional part.
  const dot = s.indexOf('.');
  let intPart, fracPart = null;
  if (dot === -1) { intPart = s; }
  else { intPart = s.slice(0, dot); fracPart = s.slice(dot + 1).replace(/\./g, ''); }
  intPart = intPart.replace(/^0+(?=\d)/, ''); // drop leading zeros but keep a lone 0
  if (intPart === '') intPart = fracPart === null && dot === -1 ? '' : '0';
  const grouped = intPart.replace(/\B(?=(\d{3})+(?!\d))/g, ',');
  let out = (neg ? '-' : '') + grouped;
  if (dot !== -1) out += '.' + fracPart;
  return out;
}

// Comma-grouped / $-prefixed money display string -> plain Number.
// Strips $, spaces, commas. Returns null for empty (matching the
// existing readOfferForm `num('')===null` contract); returns NaN for
// genuinely non-numeric text so callers using `Number.isFinite`/`||`
// behave exactly as they did with the old bare `Number(value)`.
function parseMoneyInput(str) {
  if (str === '' || str == null) return null;
  const cleaned = String(str).replace(/[$,\s]/g, '');
  if (cleaned === '' || cleaned === '-' || cleaned === '.' || cleaned === '-.') return null;
  return Number(cleaned);
}

/* ============================================================
   ID GENERATOR
   ============================================================ */
function uid(prefix = 'id') {
  return `${prefix}_${Date.now().toString(36)}_${Math.random().toString(36).slice(2, 8)}`;
}

/* ============================================================
   STATE MANAGEMENT
   ============================================================ */
const App = {
  state: null,
  view: 'overview',
  filters: {
    timelineShowCancelled: false,
    timelineShowCompleted: true,
    offersStatus: 'all',
    offersSearch: '',
    offersSort: 'default',
    offersAdvanced: false
  },
  optimizer: { results: null, candidates: [], evaluated: 0, infeasibleCount: 0, lastRunAt: null },

  init() {
    installErrorHandlers();
    try {
      const saved = this.load();
      this.state = saved || this.defaultState();
      // Snapshot the state's freshness AS LOADED, before any save (the fresh
      // seed below, the projection roll) can re-stamp _lastModified this
      // session. The first-sync equal-state exemption reads this so a device
      // that was perfectly in sync at load still silently seeds lineage even
      // after a system date-roll bumps local's live _lastModified.
      Sync.loadedModified = (saved && saved._lastModified) || 0;
      // Restore the persisted dirty marker: if localStorage holds edits that
      // never reached the cloud (_dirtySince set), this device is dirty even
      // across a reload, so the CAS conflict path won't silently adopt over
      // them.
      Sync.localDirty = Boolean(this.state && this.state._dirtySince);
      if (!saved) {
        // Fresh device: seeding sample data is not a user edit, so save it
        // system (no dirty marker) — otherwise a brand-new device would
        // conflict-prompt instead of cleanly adopting real cloud data on its
        // first sync.
        this.state = seedSampleData(this.state);
        this.save({ system: true });
      }
      // Migrate offers to the two-field status model + sync legacy status,
      // mint stable per-DD ids for feed item keys (never array index), and
      // convert the debit requirement's absolute byDate → relative withinDays.
      (this.state.offers || []).forEach(o => {
        normalizeOfferStatus(o); migrateDdIds(o);
        migrateDebitRequirement(o); reconcileDebitWithinDays(o);
      });
      // Schema v2: add the requirements[] layer + churn/fee/promo scalar fields
      // and derive rows from the now-normalized legacy fields. One-time full-
      // state backup to 'yv-backup-pre-v2' happens inside (before first mutation);
      // no save/schedulePush here — persistence waits for the next user save.
      migrateOffersToSchemaV2(this.state);
      // Seed the manifestVersion high-water mark from the loaded state so the
      // feed version never regresses below what a prior session already shipped.
      _manifestHwm = Number(this.state._manifestVersion) || 0;
      this.rollProjectionStartIfStale();
      setupPwa();
      if (Sync.isConfigured()) Sync.setStatus('synced'); // optimistic until startup pull replies
      else Sync.setStatus('unconfigured');
      render();
      bindGlobalEvents();
      // Async pull — runs after first paint, doesn't block UI
      if (Sync.isConfigured()) {
        setTimeout(() => Sync.startupSync(), 50);
      }
      // Lazy-load the DD-method datapoints (re-renders cards when ready).
      setTimeout(() => DDMethods.load(), 80);
    } catch (e) {
      // A throw during boot must not leave a blank screen — show a
      // self-contained recovery panel that reads the diag log directly.
      logError(ErrCode.RENDER, e, 'App.init');
      const root = document.getElementById('app');
      if (root) root.innerHTML = renderErrorState(e);
    }
  },

  // Auto-roll the projection start date forward to today whenever it
  // falls behind. Called on init, on visibilitychange (tab back from
  // background), and once a minute via setInterval (covers the case
  // where the app is left open overnight). Returns true if the state
  // changed, so callers can re-render. We only advance — never roll
  // backward — so a user explicitly setting a future start date in
  // Settings is preserved.
  rollProjectionStartIfStale() {
    if (!this.state || !this.state.settings) return false;
    const today = isoDate(new Date());
    const cur = this.state.settings.projectionStartDate;
    if (!cur || cur < today) {
      this.state.settings.projectionStartDate = today;
      // System save: an automatic date-roll is NOT a user edit, so it must not
      // set the dirty marker (else a clean-but-stale device trips the conflict
      // dialog and a reflexive Cancel clobbers the cloud — see App.save).
      this.save({ system: true });
      return true;
    }
    return false;
  },

  defaultState() {
    return {
      version: 1,
      settings: {
        currentLiquidCapital: 200000,
        minimumCashBuffer: 20000,
        projectionStartDate: isoDate(TODAY),
        projectionHorizonMode: 'auto',  // 'auto' | '3months' | '6months' | '1year' | '2years' | 'custom'
        projectionHorizonDays: 365,     // used only when mode === 'custom'
        maxOptimizerCandidates: 15,
        defaultLockStartsFrom: 'funded date',
        // Global DD transfer-timing model (business days per leg). The
        // round trip is initiate → +inDays → posts as DD → +seasonDays
        // → sent back → +backDays → returns to origin. Default 1/1/1
        // ("season 1 business day").
        ddTransfer: { inDays: 1, seasonDays: 1, backDays: 1 },
        // Banks the user can transfer money FROM (for DD-method ranking).
        sourceBanks: []
      },
      offers: [],
      commitments: [],
      events: [],
      // F5: reusable offer templates (terms only, personal data stripped).
      // Root-level so localStorage + Gist sync carry them; never read by
      // buildReminderItems, so they can't emit feed items.
      templates: []
    };
  },

  load() {
    try {
      const raw = localStorage.getItem(STORAGE_KEY);
      if (!raw) return null;
      const parsed = JSON.parse(raw);
      if (!parsed || typeof parsed !== 'object') return null;
      return parsed;
    } catch (e) {
      logError(ErrCode.PARSE, e, 'App.load: localStorage state');
      return null;
    }
  },

  // {system:true} marks a purely-automatic save (projection-date roll,
  // fresh-device seed) — it stamps _lastModified and schedules the push as
  // usual, but does NOT set the dirty marker. Without this, a stale-but-clean
  // device whose date auto-rolled would look "dirty" and trip the CAS conflict
  // dialog; a reflexive Cancel would then clobber the cloud with stale data
  // despite ZERO user edits. Default (user/import/reset saves) marks dirty.
  save({ system = false } = {}) {
    try {
      // Stamp last-modified so cloud sync can resolve "who's newer"
      this.state._lastModified = Date.now();
      // Mark unsynced local edits so the CAS push can tell "this device is
      // just stale" from "both sides changed" on a head divergence. Persist
      // the marker WITH the state (_dirtySince) so it survives a reload —
      // a volatile flag alone would reset to false on reopen while
      // localStorage still holds edits that never reached the cloud, and the
      // next CAS check would then wrongly treat this device as clean and
      // discard them. _dirtySince rides along in the payload; it does NOT
      // affect _lastModified/"who's newer" semantics. Keep the earliest
      // dirty time (don't churn it on every keystroke-save).
      if (!system) {
        if (!this.state._dirtySince) this.state._dirtySince = new Date().toISOString();
        Sync.localDirty = true;
      }
      localStorage.setItem(STORAGE_KEY, JSON.stringify(this.state));
      Sync.schedulePush();
    } catch (e) {
      logError(ErrCode.STORAGE, e, 'App.save');
      toast('Could not save: storage unavailable', 'danger');
    }
  },

  setView(view) {
    if (this.view === view) return;
    this.view = view;
    render();
    window.scrollTo({ top: 0, behavior: 'instant' });
  },

  update(updater) {
    updater(this.state);
    this.save();
    render();
  }
};

/* ============================================================
   OFFER DERIVED FIELDS
   ============================================================ */
function effectiveFundingDate(offer) {
  // User-entered date as-is (Saturday stays Saturday). This is what the
  // form remembers; callers that need the actual bank-processing day go
  // through bizDayISO() below.
  return offer.optionalPlannedFundingDate || offer.plannedSignupDate;
}

// Shift a YYYY-MM-DD to the next business day if it falls on a weekend
// or US federal bank holiday. Used to model "bank doesn't process money
// movement on weekends" for derived action dates (fund posts, withdrawal
// eligible). Anchor dates the user entered (open date, signup date)
// stay as-is — only dates DERIVED from them shift.
function bizDayISO(d) {
  if (!d) return '';
  const dt = d instanceof Date ? d : parseDate(d);
  if (!dt) return '';
  return isoDate(nextBusinessDay(dt));
}

function depositDeadline(offer) {
  // Bank's stated deadline — literal calendar date. If it falls on
  // a weekend, the user needs to deposit BEFORE it (no shift here).
  if (!offer.plannedSignupDate || offer.daysAfterSignupAllowedBeforeDeposit == null) return null;
  return isoDate(addDays(parseDate(offer.plannedSignupDate), Number(offer.daysAfterSignupAllowedBeforeDeposit)));
}

// Derived debit-completion deadline (literal calendar date, same no-shift
// convention as depositDeadline): the qualifying debit purchases must be
// done within `debitRequirement.withinDays` of the planned sign-up date.
// Returns an ISO string, or '' when it can't be derived (no requirement,
// no day-count, or no sign-up date yet — an undated offer emits nothing).
function debitDeadlineISO(offer) {
  const dr = offer && offer.debitRequirement;
  if (!dr || !dr.required) return '';
  const days = Number(dr.withinDays);
  if (!Number.isFinite(days) || days <= 0) return '';
  const signup = parseDate(offer.plannedSignupDate);
  if (!signup) return '';
  return isoDate(addDays(signup, days));
}

function withdrawalEligibleDate(offer) {
  // STANDARD direct deposit: no bank-imposed hold. Each DD just needs to
  // hit the account; the money is "tied up" only for its transfer round
  // trip. The overall "funds are fully back" date = the LATEST round-trip
  // return across all DDs.
  if (offer.offerType === 'direct-deposit') {
    const rets = (offer.directDeposits || [])
      .map(dd => ddRoundTrip(dd))
      .filter(Boolean)
      .map(rt => rt.returnDate.getTime());
    if (rets.length === 0) return '';
    return isoDate(new Date(Math.max(...rets)));
  }
  // HELD + DD and NEW FUNDS HELD share the same hold model: a held lump sum
  // (requiredFundingAmount) governed by daysFundsMustRemain from the chosen
  // anchor. The qualifying DDs are modeled separately (see generateProjection);
  // they do NOT drive the hold window. Anchor:
  //   'open date'   → bank counts from the account open date (US Bank
  //                   style). Open date itself stays as user-entered.
  //   'funded date' → bank counts from when funds actually posted.
  const anchorRaw = offer.lockStartsFrom === 'open date'
    ? offer.plannedSignupDate
    : bizDayISO(effectiveFundingDate(offer));
  if (!anchorRaw || offer.daysFundsMustRemain == null) return null;
  const calc = addDays(parseDate(anchorRaw), Number(offer.daysFundsMustRemain));
  return bizDayISO(calc);
}

function lockStartDate(offer) {
  // STANDARD direct deposit: money first leaves the origin account at the
  // EARLIEST DD initiation. Each DD ties up its own amount over its own
  // round trip (modeled in generateProjection); this is just the start
  // of the overall tied-up window for display (card "Fund date",
  // timeline bar start).
  if (offer.offerType === 'direct-deposit') {
    const starts = (offer.directDeposits || [])
      .map(dd => parseDate(dd.plannedDate))
      .filter(Boolean)
      .map(d => d.getTime());
    if (starts.length === 0) return '';
    return isoDate(new Date(Math.min(...starts)));
  }
  // HELD + DD and NEW FUNDS HELD: the held lump sum is unavailable from when
  // the bank PROCESSES the deposit (the planned funding date; Saturday-planned
  // funding won't post until Monday). The qualifying DDs are tracked
  // separately and don't move this date.
  return bizDayISO(effectiveFundingDate(offer));
}

/* ============================================================
   ACCOUNT LIFECYCLE (F3) — a DERIVED VIEW over the existing status
   model (accountStatus/subStatus). Nothing here forks or stores new
   lifecycle state; every function reads the same fields the chips,
   selects, and projection already use. The 4-stage pipeline, the
   expected-bonus window, and safeToCloseDate are all pure projections.
   ============================================================ */

// When an offer has no bonus_post_min/max_days, the expected-bonus window
// falls back to this "typical" span (labeled as such in the UI so the user
// knows it's a heuristic, not a bank-stated figure). ~3–3.5 months is the
// common posting lag DoC reports for checking bonuses.
const DEFAULT_BONUS_POST_MIN_DAYS = 90;
const DEFAULT_BONUS_POST_MAX_DAYS = 105;

// The four pipeline stages, in order. 'inactive' is a fifth pseudo-stage for
// offers whose subStatus isn't on the earn path (prospect/applied/denied/
// didnt-track/archived) — the strip renders neutral and the chip carries the
// specifics. Closed always wins (a closed account is terminal regardless of sub).
const LIFECYCLE_STAGES = ['meeting', 'waiting', 'earned', 'closed'];
const LIFECYCLE_STAGE_LABELS = {
  meeting: 'Meeting Requirements',
  waiting: 'Waiting for Bonus',
  earned: 'Bonus Earned',
  closed: 'Closed'
};

// Map the (accountStatus, subStatus) pair onto a pipeline stage. DERIVED — never
// stored. Closed account → 'closed' (terminal). Otherwise by subStatus:
//   approved/on-track → meeting; met-waiting → waiting; earned → earned.
// Everything else (prospect/applied/denied/didnt-track/archived on an open or
// closed-pre-account state) → 'inactive' (neutral strip + chip carries detail).
function lifecycleStage(offer) {
  if (!offer) return 'inactive';
  if (offer.accountStatus === 'closed' && !PRE_ACCOUNT_SUB_STATUSES.has(offer.subStatus)) return 'closed';
  switch (offer.subStatus) {
    case 'approved':
    case 'on-track': return 'meeting';
    case 'met-waiting': return 'waiting';
    case 'earned': return 'earned';
    default: return 'inactive';
  }
}

// Human caption mirroring the current lifecycle context, shown under the strip.
// Returns '' for inactive so no nonsense caption appears for prospect/denied/etc.
function lifecycleCaption(offer) {
  const stage = lifecycleStage(offer);
  switch (stage) {

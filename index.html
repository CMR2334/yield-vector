<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#5b5cf6">
<title>Yield Vector</title>
<!-- iOS PWA: lets the page launch full-screen when added to Home Screen -->
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Yield Vector">
<meta name="mobile-web-app-capable" content="yes">
<meta name="format-detection" content="telephone=no">
<!-- Icon + manifest hrefs are set at runtime via canvas-generated PNG -->
<link rel="apple-touch-icon" id="apple-icon" href="">
<link rel="icon" id="favicon" href="">
<link rel="manifest" id="manifest" href="">
<style>
/* ============================================================
   DESIGN TOKENS
   ============================================================ */
:root {
  --bg: #f5f5f7;
  --bg-elevated: #ffffff;
  --card: #ffffff;
  --card-soft: #fafafc;

  --text: #1c2030;
  --text-secondary: #5b6374;
  --text-tertiary: #9099a8;
  --text-inverse: #ffffff;

  --accent: #5b5cf6;
  --accent-hover: #4f50e0;
  --accent-soft: #eef0fe;
  --accent-mid: #c8c9fa;
  --accent-strong: #3f40c4;

  --warning: #f59e0b;
  --warning-soft: #fff5e0;
  --danger: #ef4444;
  --danger-soft: #fee5e5;
  --success: #10b981;
  --success-soft: #d6f5e7;

  --border: #e5e7eb;
  --border-soft: #eef0f2;
  --border-strong: #d1d5db;

  --radius-sm: 8px;
  --radius-md: 12px;
  --radius-lg: 16px;
  --radius-xl: 20px;
  --radius-pill: 999px;

  --space-1: 4px;
  --space-2: 8px;
  --space-3: 12px;
  --space-4: 16px;
  --space-5: 20px;
  --space-6: 24px;
  --space-7: 28px;
  --space-8: 32px;
  --space-10: 40px;
  --space-12: 48px;
  --space-16: 64px;

  --shadow-sm: 0 1px 2px rgba(15, 23, 42, 0.04);
  --shadow-card: 0 1px 3px rgba(15, 23, 42, 0.04), 0 4px 16px rgba(15, 23, 42, 0.05);
  --shadow-card-hover: 0 1px 3px rgba(15, 23, 42, 0.06), 0 12px 28px rgba(15, 23, 42, 0.08);
  --shadow-modal: 0 24px 64px rgba(15, 23, 42, 0.18);
  --shadow-fab: 0 8px 24px rgba(91, 92, 246, 0.35);

  --font-sans: -apple-system, BlinkMacSystemFont, 'SF Pro Display', 'SF Pro Text', 'Segoe UI', Roboto, 'Helvetica Neue', sans-serif;
  --font-mono: 'SF Mono', 'Menlo', 'Monaco', 'Consolas', monospace;

  --header-height: 64px;
  --bottom-nav-height: 70px;
  --content-max-width: 1280px;
}

/* ============================================================
   RESET & BASE
   ============================================================ */
* { box-sizing: border-box; margin: 0; padding: 0; }

html { -webkit-text-size-adjust: 100%; }

body {
  font-family: var(--font-sans);
  font-size: 15px;
  line-height: 1.5;
  color: var(--text);
  background: var(--bg);
  -webkit-font-smoothing: antialiased;
  -moz-osx-font-smoothing: grayscale;
  font-feature-settings: 'tnum' 1, 'cv11' 1;
  min-height: 100vh;
  overflow-x: hidden;
}

button { font: inherit; color: inherit; background: none; border: none; cursor: pointer; }
input, select, textarea { font: inherit; color: inherit; }
ul, ol { list-style: none; }
a { color: inherit; text-decoration: none; }

/* ============================================================
   LAYOUT
   ============================================================ */
.app-shell {
  display: flex;
  flex-direction: column;
  min-height: 100vh;
}

.app-header {
  position: sticky;
  top: 0;
  z-index: 30;
  display: flex;
  align-items: center;
  gap: var(--space-6);
  height: var(--header-height);
  padding: 0 var(--space-6);
  background: rgba(245, 245, 247, 0.85);
  backdrop-filter: saturate(1.6) blur(14px);
  -webkit-backdrop-filter: saturate(1.6) blur(14px);
  border-bottom: 1px solid var(--border-soft);
}

.brand {
  display: flex;
  align-items: center;
  gap: 6px;
}

.brand-arrow {
  flex-shrink: 0;
  display: block;
}

.brand-name {
  /* Hold the deep indigo across most of "Yield" and only let the lift bloom
     during "Vector" — sharper diagonal, late stops. */
  background: linear-gradient(115deg, #312e81 0%, #4338ca 58%, #5b4fd8 78%, #7c5fef 92%, #a78bfa 100%);
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
  background-clip: text;
  font-weight: 700;
  font-size: 17px;
  letter-spacing: -0.025em;
  line-height: 1;
}

.primary-nav {
  display: flex;
  gap: var(--space-1);
  margin-left: var(--space-6);
}

.nav-btn {
  padding: 8px 14px;
  border-radius: var(--radius-pill);
  font-size: 14px;
  font-weight: 500;
  color: var(--text-secondary);
  transition: background 0.15s, color 0.15s;
}

.nav-btn:hover { color: var(--text); background: var(--accent-soft); }
.nav-btn.active { color: var(--accent); background: var(--accent-soft); font-weight: 600; }

.header-trailing {
  margin-left: auto;
  display: flex;
  gap: var(--space-3);
  align-items: center;
}
.header-actions {
  display: flex;
  gap: var(--space-2);
  align-items: center;
}

/* Overview "side panel" layout: actions wide on left, snapshot narrow on
   right. Items align to top so they don't stretch awkwardly. */
.overview-side {
  display: grid;
  grid-template-columns: minmax(0, 2fr) minmax(0, 1fr);
  gap: var(--space-4);
  align-items: start;
}
@media (max-width: 720px) {
  .overview-side { grid-template-columns: 1fr; }
}

.snapshot-card {
  padding: var(--space-5);
  background: var(--card-soft);
  border: 1px solid var(--border-soft);
  box-shadow: none;
}
.snapshot-title {
  font-size: 12px;
  font-weight: 600;
  text-transform: uppercase;
  letter-spacing: 0.06em;
  color: var(--text-tertiary);
  margin-bottom: var(--space-3);
}
.snapshot-grid {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: var(--space-2);
}
.snap {
  display: flex;
  flex-direction: column;
  gap: 2px;
  padding: var(--space-3);
  background: var(--card);
  border-radius: var(--radius-md);
  border: 1px solid var(--border-soft);
}
.snap-l { font-size: 11px; color: var(--text-tertiary); font-weight: 500; }
.snap-v { font-size: 17px; font-weight: 700; letter-spacing: -0.01em; color: var(--text); font-feature-settings: 'tnum' 1; }

/* Sync indicator pill in the header — visible on every screen size */
.sync-indicator {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  padding: 6px 12px;
  border-radius: var(--radius-pill);
  font-size: 12px;
  font-weight: 500;
  cursor: pointer;
  background: var(--card-soft);
  color: var(--text-secondary);
  border: 1px solid var(--border-soft);
  transition: background 0.15s, border-color 0.15s, color 0.15s;
  white-space: nowrap;
}
.sync-indicator:hover { background: var(--accent-soft); border-color: var(--accent-mid); color: var(--accent); }
.sync-dot {
  width: 8px; height: 8px;
  border-radius: 50%;
  background: var(--text-tertiary);
  flex-shrink: 0;
}
.sync-indicator[data-status="synced"] .sync-dot { background: var(--success); box-shadow: 0 0 0 3px rgba(16, 185, 129, 0.15); }
.sync-indicator[data-status="syncing"] .sync-dot { background: var(--warning); animation: sync-pulse 1.1s ease-in-out infinite; }
.sync-indicator[data-status="pending"] .sync-dot { background: var(--warning); box-shadow: 0 0 0 3px rgba(245, 158, 11, 0.18); }
.sync-indicator[data-status="error"] .sync-dot { background: var(--danger); box-shadow: 0 0 0 3px rgba(239, 68, 68, 0.18); }
.sync-indicator[data-status="unconfigured"] .sync-dot { background: var(--text-tertiary); }
.sync-indicator[data-status="error"] { color: var(--danger); border-color: rgba(239, 68, 68, 0.25); background: var(--danger-soft); }

@keyframes sync-pulse {
  0%, 100% { opacity: 1; transform: scale(1); }
  50% { opacity: 0.5; transform: scale(0.85); }
}

@media (max-width: 480px) {
  .sync-indicator .sync-text { display: none; }
  .sync-indicator { padding: 8px; }
}

.app-main {
  flex: 1;
  padding: var(--space-8) var(--space-6) var(--space-12);
  max-width: var(--content-max-width);
  width: 100%;
  margin: 0 auto;
}

/* Mobile bottom nav */
.mobile-nav {
  display: none;
  position: fixed;
  bottom: 0;
  left: 0;
  right: 0;
  height: var(--bottom-nav-height);
  background: rgba(255, 255, 255, 0.95);
  backdrop-filter: saturate(1.6) blur(14px);
  border-top: 1px solid var(--border-soft);
  padding: 8px 4px calc(8px + env(safe-area-inset-bottom));
  z-index: 30;
  justify-content: space-around;
}

.mobile-nav .nav-btn {
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 2px;
  padding: 6px 8px;
  font-size: 11px;
  background: transparent;
  border-radius: var(--radius-md);
  color: var(--text-tertiary);
  font-weight: 500;
}

.mobile-nav .nav-btn.active {
  color: var(--accent);
  background: transparent;
}

.mobile-nav .nav-btn svg { width: 22px; height: 22px; stroke-width: 1.7; }

.fab {
  position: fixed;
  display: none;
  bottom: calc(var(--bottom-nav-height) + 12px);
  right: 16px;
  width: 56px;
  height: 56px;
  border-radius: 50%;
  background: var(--accent);
  color: white;
  box-shadow: var(--shadow-fab);
  z-index: 25;
  align-items: center;
  justify-content: center;
  transition: transform 0.15s;
}
.fab:active { transform: scale(0.95); }

/* ============================================================
   BUTTONS
   ============================================================ */
.btn {
  display: inline-flex;
  align-items: center;
  gap: var(--space-2);
  padding: 9px 16px;
  border-radius: var(--radius-pill);
  font-size: 14px;
  font-weight: 500;
  transition: background 0.12s, color 0.12s, transform 0.05s, box-shadow 0.12s;
  white-space: nowrap;
  border: 1px solid transparent;
}
.btn:active { transform: translateY(0.5px); }

.btn-primary { background: var(--accent); color: white; }
.btn-primary:hover { background: var(--accent-hover); }

.btn-secondary { background: var(--bg-elevated); color: var(--text); border-color: var(--border); }
.btn-secondary:hover { background: var(--card-soft); border-color: var(--border-strong); }

.btn-ghost { color: var(--text-secondary); padding: 8px 12px; }
.btn-ghost:hover { background: var(--accent-soft); color: var(--accent); }

.btn-danger { color: var(--danger); }
.btn-danger:hover { background: var(--danger-soft); }

.btn-sm { padding: 6px 12px; font-size: 13px; }
.btn-lg { padding: 12px 22px; font-size: 15px; }

.btn-icon {
  width: 36px; height: 36px;
  border-radius: var(--radius-md);
  padding: 0;
  display: inline-grid;
  place-items: center;
  color: var(--text-secondary);
  transition: background 0.12s, color 0.12s;
}
.btn-icon:hover { background: var(--accent-soft); color: var(--accent); }

/* ============================================================
   CARDS
   ============================================================ */
.card {
  background: var(--card);
  border-radius: var(--radius-xl);
  padding: var(--space-6);
  box-shadow: var(--shadow-card);
}

.card-soft { background: var(--card-soft); border: 1px solid var(--border-soft); box-shadow: none; }

.card-title {
  font-size: 13px;
  font-weight: 600;
  text-transform: uppercase;
  letter-spacing: 0.06em;
  color: var(--text-tertiary);
  margin-bottom: var(--space-4);
}

.card-header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: var(--space-3);
  margin-bottom: var(--space-4);
}

.card-header h2 {
  font-size: 18px;
  font-weight: 600;
  letter-spacing: -0.01em;
}

/* ============================================================
   OVERVIEW: HERO
   ============================================================ */
.hero {
  background: var(--card);
  border-radius: var(--radius-xl);
  padding: var(--space-8);
  box-shadow: var(--shadow-card);
  margin-bottom: var(--space-6);
}

.hero-numbers {
  display: flex;
  flex-direction: column;
  gap: var(--space-2);
  margin-bottom: var(--space-6);
}

/* Tile-style label — same casing/letter-spacing as the stat-card labels
   below so the hero reads as the leading tile in a coherent row. */
.hero-label {
  font-size: 12px;
  font-weight: 600;
  text-transform: uppercase;
  letter-spacing: 0.06em;
  color: var(--text-tertiary);
}

.hero-amount {
  font-size: 56px;
  font-weight: 700;
  letter-spacing: -0.03em;
  line-height: 1;
  color: var(--text);
}

/* Match the dollar sign exactly to the numerals — same size, same weight,
   no superscript baseline shift. */
.hero-amount .currency-symbol { font-weight: 700; opacity: 1; margin-right: 2px; font-size: 1em; vertical-align: baseline; }

.hero-meta {
  font-size: 15px;
  color: var(--text-secondary);
  display: flex;
  flex-wrap: wrap;
  gap: 12px;
  align-items: center;
}

.hero-meta .pill {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  padding: 4px 10px;
  border-radius: var(--radius-pill);
  font-size: 13px;
  background: var(--accent-soft);
  color: var(--accent);
  font-weight: 500;
}
.hero-meta .pill.warn { background: var(--warning-soft); color: #b45309; }
.hero-meta .pill.danger { background: var(--danger-soft); color: var(--danger); }

/* ============================================================
   CHART
   ============================================================ */
.chart-wrap {
  position: relative;
  width: 100%;
  margin-top: var(--space-4);
}

.chart-svg { width: 100%; display: block; overflow: visible; }
.chart-svg text {
  font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Display', 'SF Pro Text', 'Segoe UI', Roboto, 'Helvetica Neue', sans-serif;
  font-feature-settings: 'tnum' 1;
  -webkit-font-smoothing: antialiased;
}

/* On mobile the chart gets cramped — let it overflow horizontally with
   a min-width so users can scroll across instead of squinting. */
@media (max-width: 720px) {
  .chart-wrap {
    overflow-x: auto;
    overflow-y: hidden;
    -webkit-overflow-scrolling: touch;
    margin-left: calc(-1 * var(--space-4));
    margin-right: calc(-1 * var(--space-4));
    padding: 0 var(--space-4);
    scrollbar-width: thin;
  }
  .chart-svg { min-width: 720px; }
}

.chart-tooltip {
  position: absolute;
  pointer-events: none;
  background: rgba(13, 20, 33, 0.94);
  color: white;
  padding: 10px 14px;
  border-radius: 10px;
  font-size: 12px;
  line-height: 1.5;
  transform: translate(-50%, -110%);
  white-space: nowrap;
  box-shadow: 0 6px 20px rgba(0,0,0,0.18);
  opacity: 0;
  transition: opacity 0.1s;
  z-index: 5;
}
.chart-tooltip.visible { opacity: 1; }
/* On mobile we use position:fixed and JS-clamped left/top — let the box wrap
   so a long event name can't push the tooltip past the screen edge. */
@media (max-width: 720px) {
  .chart-tooltip {
    white-space: normal;
    max-width: min(320px, calc(100vw - 24px));
  }
}
.chart-tooltip .tt-date { font-weight: 600; margin-bottom: 4px; opacity: 0.85; }
.chart-tooltip .tt-row { display: flex; justify-content: space-between; gap: 16px; }
.chart-tooltip .tt-row .label { opacity: 0.7; }

.chart-legend {
  display: flex;
  flex-wrap: wrap;
  gap: var(--space-4);
  margin-top: var(--space-4);
  font-size: 12px;
  color: var(--text-secondary);
}
.chart-legend-item { display: inline-flex; align-items: center; gap: 6px; }
.legend-swatch { width: 10px; height: 10px; border-radius: 3px; display: inline-block; }
.legend-line { width: 16px; height: 2px; display: inline-block; border-radius: 1px; }
.legend-line.dashed { border-top: 2px dashed currentColor; height: 0; }

/* ============================================================
   GRID & STAT CARDS
   ============================================================ */
.grid {
  display: grid;
  gap: var(--space-4);
}

.grid-cols-1 { grid-template-columns: 1fr; }
.grid-cols-2 { grid-template-columns: repeat(2, minmax(0, 1fr)); }
.grid-cols-3 { grid-template-columns: repeat(3, minmax(0, 1fr)); }
.grid-cols-4 { grid-template-columns: repeat(4, minmax(0, 1fr)); }

.stat-card {
  background: var(--card);
  border-radius: var(--radius-lg);
  padding: var(--space-5);
  box-shadow: var(--shadow-card);
  display: flex;
  flex-direction: column;
  gap: var(--space-2);
  transition: box-shadow 0.18s;
}
.stat-card:hover { box-shadow: var(--shadow-card-hover); }
.stat-label { font-size: 12px; color: var(--text-tertiary); font-weight: 600; text-transform: uppercase; letter-spacing: 0.06em; }
.stat-value { font-size: 26px; font-weight: 600; letter-spacing: -0.02em; line-height: 1.15; }
/* Mid amber — sits between the Offer-expires tag's pale background
   (#fff5e0) and its deep brown text (#b45309). Used when Lowest projected
   touches the buffer zone (positive but below buffer). */
.stat-value.warn { color: #e0a23a; }
/* Lighter red — softened from raw #ef4444 to match the Deposit Deadline tag */
.stat-value.danger { color: #e87171; }
/* Brighter mint green, in lockstep with .action-tag.success */
.stat-value.success { color: #0ea968; }
/* Slightly deeper than the prior #8284f7 — closer to the wordmark indigo */
.stat-value.accent { color: #6c6ce5; }
/* Same mid amber as .stat-value.warn so "healthy but lighten" reads coherent */
.stat-value.lighten { color: #e0a23a; }
.stat-meta { font-size: 12px; color: var(--text-tertiary); margin-top: var(--space-1); }

/* ============================================================
   UPCOMING ACTIONS
   ============================================================ */
.action-list {
  display: flex;
  flex-direction: column;
  gap: var(--space-1);
  /* Reserve a full page worth of vertical space so paging to a partial last
     page doesn't shrink the card and yank the page upward. 6 rows × ~52px. */
  min-height: 312px;
}
@media (max-width: 480px) {
  .action-list { min-height: 360px; } /* mobile rows wrap an extra line */
}

.action-row {
  display: grid;
  grid-template-columns: 56px minmax(0, 1fr) auto;
  align-items: center;
  gap: var(--space-3);
  padding: var(--space-3) var(--space-4);
  border-radius: var(--radius-md);
  transition: background 0.1s;
}
.action-row:hover { background: var(--bg); }

/* Mobile: tighter columns, tag wraps under the title so nothing collides */
@media (max-width: 480px) {
  .action-row {
    grid-template-columns: 48px minmax(0, 1fr);
    gap: var(--space-2);
    padding: var(--space-2) var(--space-3);
  }
  .action-row .action-tag {
    grid-column: 2;
    grid-row: 2;
    justify-self: start;
    margin-top: 2px;
    font-size: 10px;
    padding: 2px 7px;
  }
}

/* iOS calendar-icon-style date block: bright red month, large dark day */
.action-day {
  text-align: center;
  line-height: 1;
  padding: 2px 0;
}
.action-day .month {
  display: block;
  font-size: 10px;
  font-weight: 700;
  color: #ff3b30;  /* iOS systemRed */
  text-transform: uppercase;
  letter-spacing: 0.04em;
  line-height: 1.4;
  margin-bottom: 1px;
}
.action-day .day {
  display: block;
  font-size: 24px;
  /* Mac Calendar feel: semibold, not heavy bold */
  font-weight: 500;
  color: var(--text);
  line-height: 1;
  letter-spacing: 0;
  /* Proportional (not tabular) figures so a narrow "1" doesn't carry extra
     left-side bearing — under tabular-nums "16" looked right-shifted vs
     "30" because the "1" sat in a fixed-width box with empty space on
     its left. Proportional widths size each number to its actual glyphs
     so the block centers naturally in the 56px cell. */
  font-variant-numeric: proportional-nums;
  font-feature-settings: 'pnum' 1;
}
.action-day .month { font-weight: 600; }

.action-body { display: flex; flex-direction: column; gap: 2px; min-width: 0; }
.action-title { font-weight: 500; font-size: 14px; color: var(--text); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.action-sub { font-size: 12px; color: var(--text-tertiary); }

.action-tag {
  font-size: 11px;
  padding: 3px 8px;
  border-radius: var(--radius-pill);
  background: var(--accent-soft);
  /* Default (Outflow / generic) — slightly deeper purple, in lockstep with
     the Tied-up-today stat color so the two read as the same hue. */
  color: #6c6ce5;
  font-weight: 600;
  text-transform: uppercase;
  letter-spacing: 0.04em;
}
.action-tag.warn { background: var(--warning-soft); color: #b45309; }
/* Brighter mint green — softer than #10b981, deeper than #059669; the same
   tone is used by .stat-value.success so Selected bonuses and the Withdrawal
   tag read as one hue. */
.action-tag.success { background: var(--success-soft); color: #0ea968; }
/* Lightened red — matches .stat-value.danger so Lowest Projected and the
   Deposit Deadline tag read as the same shade. */
.action-tag.danger { background: var(--danger-soft); color: #e87171; }

.upcoming-pager { display: inline-flex; align-items: center; gap: 6px; }
.upcoming-pg-btn {
  width: 24px; height: 24px; border-radius: 50%;
  background: var(--accent-soft); color: var(--accent);
  font-size: 14px; font-weight: 600; line-height: 1;
  display: inline-flex; align-items: center; justify-content: center;
  border: none; cursor: pointer; transition: background 0.12s, opacity 0.12s;
}
.upcoming-pg-btn:hover:not(:disabled) { background: var(--accent-mid); }
.upcoming-pg-btn:disabled { opacity: 0.35; cursor: default; }
.upcoming-pg-label { font-size: 12px; color: var(--text-tertiary); font-variant-numeric: tabular-nums; min-width: 30px; text-align: center; }
.upcoming-fade { animation: upcoming-fade-in 0.22s ease-out; }
@keyframes upcoming-fade-in {
  from { opacity: 0; transform: translateY(4px); }
  to { opacity: 1; transform: translateY(0); }
}

/* ============================================================
   OFFER CARDS
   ============================================================ */
.offer-card {
  background: var(--card);
  border-radius: var(--radius-lg);
  padding: var(--space-5);
  box-shadow: var(--shadow-card);
  border: 1.5px solid transparent;
  transition: border-color 0.15s, box-shadow 0.15s, transform 0.05s;
  position: relative;
}
.offer-card.included { border-color: var(--accent); }
.offer-card.draft { opacity: 0.85; border-style: dashed; border-color: var(--warning); }

.offer-card-header {
  display: flex;
  align-items: flex-start;
  gap: var(--space-3);
  margin-bottom: var(--space-4);
}

.offer-include {
  appearance: none;
  -webkit-appearance: none;
  width: 22px; height: 22px;
  border: 2px solid var(--border-strong);
  border-radius: 7px;
  cursor: pointer;
  position: relative;
  flex-shrink: 0;
  margin-top: 2px;
  transition: background 0.1s, border-color 0.1s;
}
.offer-include:checked {
  background: var(--accent);
  border-color: var(--accent);
}
.offer-include:checked::after {
  content: '';
  position: absolute;
  left: 5px; top: 1px;
  width: 6px; height: 11px;
  border: solid white;
  border-width: 0 2.5px 2.5px 0;
  transform: rotate(45deg);
}
.offer-include:disabled { opacity: 0.5; cursor: not-allowed; }

.offer-name { font-size: 16px; font-weight: 600; line-height: 1.25; letter-spacing: -0.01em; }
.offer-bank { font-size: 13px; color: var(--text-tertiary); margin-top: 2px; }

.offer-stats {
  display: grid;
  grid-template-columns: repeat(2, 1fr);
  gap: var(--space-3) var(--space-4);
  padding: var(--space-3) 0;
  border-top: 1px solid var(--border-soft);
  border-bottom: 1px solid var(--border-soft);
  margin-bottom: var(--space-4);
}
.offer-stat { display: flex; flex-direction: column; }
.offer-stat-label { font-size: 11px; color: var(--text-tertiary); font-weight: 600; text-transform: uppercase; letter-spacing: 0.05em; }
.offer-stat-value { font-size: 15px; font-weight: 600; color: var(--text); margin-top: 2px; }
.offer-stat-value.success { color: var(--success); }
.offer-stat-value.muted { color: var(--text-tertiary); font-weight: 500; }

.offer-dates { font-size: 13px; color: var(--text-secondary); margin-bottom: var(--space-3); display: flex; flex-direction: column; gap: 2px; }

.offer-chips {
  display: flex;
  flex-wrap: wrap;
  gap: var(--space-2);
  margin-bottom: var(--space-3);
}

.chip {
  font-size: 11px;
  padding: 3px 9px;
  border-radius: var(--radius-pill);
  background: var(--bg);
  color: var(--text-secondary);
  font-weight: 600;
  text-transform: uppercase;
  letter-spacing: 0.04em;
}
.chip-accent { background: var(--accent-soft); color: var(--accent); }
.chip-warn { background: var(--warning-soft); color: #b45309; }
.chip-success { background: var(--success-soft); color: #047857; }
.chip-danger { background: var(--danger-soft); color: var(--danger); }
.chip-muted { background: var(--bg); color: var(--text-tertiary); }

.offer-actions {
  display: flex;
  gap: var(--space-1);
  align-items: center;
  flex-wrap: wrap;
  margin-top: auto;
}

/* ============================================================
   TIMELINE
   ============================================================ */
.timeline-wrap {
  background: var(--card);
  border-radius: var(--radius-xl);
  padding: var(--space-6);
  box-shadow: var(--shadow-card);
  overflow-x: auto;
  -webkit-overflow-scrolling: touch;
}

.timeline-svg-wrap { position: relative; }

.timeline-row {
  display: grid;
  grid-template-columns: 240px 1fr;
  align-items: stretch;
  border-bottom: 1px solid var(--border-soft);
  min-height: 44px;
}
.timeline-row:last-child { border-bottom: none; }

.timeline-row-label {
  display: flex;
  flex-direction: column;
  justify-content: center;
  padding: var(--space-2) var(--space-3);
  font-size: 13px;
  font-weight: 500;
  color: var(--text);
  border-right: 1px solid var(--border-soft);
  background: var(--card);
}
.timeline-row-label .sub { font-size: 11px; color: var(--text-tertiary); margin-top: 2px; }

.timeline-row-track {
  position: relative;
  display: block;
  height: 100%;
  min-height: 44px;
}

.tl-bar {
  position: absolute;
  top: 50%;
  height: 22px;
  transform: translateY(-50%);
  border-radius: 7px;
  display: flex;
  align-items: center;
  padding: 0 8px;
  font-size: 11px;
  font-weight: 600;
  color: var(--accent-strong);
  background: var(--accent-soft);
  border: 1.5px solid var(--accent-mid);
  white-space: nowrap;
  overflow: hidden;
}
.tl-bar.confirmed { background: rgba(91, 92, 246, 0.16); border-color: var(--accent); color: var(--accent-strong); }
.tl-bar.hypothetical { background: repeating-linear-gradient(45deg, rgba(91,92,246,0.10), rgba(91,92,246,0.10) 6px, rgba(91,92,246,0.18) 6px, rgba(91,92,246,0.18) 12px); border: 1.5px dashed var(--accent); color: var(--accent-strong); }
.tl-bar.completed { background: var(--bg); border-color: var(--border-strong); color: var(--text-tertiary); }
.tl-bar.cancelled { opacity: 0.4; }

.tl-axis {
  position: relative;
  height: 32px;
  border-bottom: 1px solid var(--border);
  font-size: 11px;
  color: var(--text-tertiary);
}
.tl-axis-tick { position: absolute; transform: translateX(-50%); padding-top: 4px; font-weight: 500; }
.tl-axis-tick::before {
  content: '';
  position: absolute;
  top: -4px; left: 50%;
  width: 1px; height: 6px;
  background: var(--border-strong);
}

.tl-grid-line {
  position: absolute;
  top: 0; bottom: 0;
  width: 1px;
  background: var(--border-soft);
}

.tl-today {
  position: absolute;
  top: 0; bottom: 0;
  width: 1px;
  background: var(--accent);
  pointer-events: none;
}
.tl-today::before {
  content: 'Today';
  position: absolute;
  top: -16px;
  left: 0;
  transform: translateX(-50%);
  background: var(--accent);
  color: white;
  font-size: 10px;
  font-weight: 600;
  padding: 1px 6px;
  border-radius: 4px;
  white-space: nowrap;
}
/* Only the axis row gets the "Today" pill — suppress on data bars */
.timeline-row-track .tl-today::before {
  content: none;
}

.tl-shortfall-band {
  position: absolute;
  top: 0; bottom: 0;
  background: rgba(239, 68, 68, 0.08);
  border-left: 1px dashed rgba(239, 68, 68, 0.5);
  border-right: 1px dashed rgba(239, 68, 68, 0.5);
  pointer-events: none;
}

/* ============================================================
   FORMS
   ============================================================ */
.form-section {
  background: var(--card);
  border-radius: var(--radius-xl);
  padding: var(--space-6);
  box-shadow: var(--shadow-card);
}

.form-section + .form-section { margin-top: var(--space-4); }

.form-section h2 {
  font-size: 17px;
  font-weight: 600;
  letter-spacing: -0.01em;
  margin-bottom: var(--space-1);
}
.form-section .section-desc { font-size: 13px; color: var(--text-secondary); margin-bottom: var(--space-5); }

.form-grid {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
  gap: var(--space-4);
}

.field { display: flex; flex-direction: column; gap: 6px; }
.field label, .field-label { font-size: 12px; font-weight: 600; color: var(--text-secondary); text-transform: uppercase; letter-spacing: 0.04em; }
.field-hint { font-size: 12px; color: var(--text-tertiary); margin-top: 2px; }
.field-error { font-size: 12px; color: var(--danger); margin-top: 2px; }

.input, .select, .textarea {
  width: 100%;
  padding: 10px 12px;
  border: 1.5px solid var(--border);
  background: var(--card);
  border-radius: var(--radius-md);
  font-size: 14px;
  color: var(--text);
  transition: border-color 0.1s, box-shadow 0.1s;
  font-family: inherit;
}
.input:focus, .select:focus, .textarea:focus {
  outline: none;
  border-color: var(--accent);
  box-shadow: 0 0 0 3px rgba(91, 92, 246, 0.15);
}
.input[type="number"] { font-feature-settings: 'tnum' 1; }
.textarea { resize: vertical; min-height: 72px; }

.input-group { position: relative; }
.input-group .input-prefix { position: absolute; left: 12px; top: 50%; transform: translateY(-50%); color: var(--text-tertiary); font-size: 14px; pointer-events: none; }
.input-group .input-suffix { position: absolute; right: 12px; top: 50%; transform: translateY(-50%); color: var(--text-tertiary); font-size: 13px; pointer-events: none; }
.input-group .input { padding-left: 28px; }
.input-group.with-suffix .input { padding-right: 60px; }

.checkbox-row { display: flex; align-items: center; gap: var(--space-2); cursor: pointer; padding: 4px 0; }
.checkbox-row input[type="checkbox"] {
  appearance: none;
  -webkit-appearance: none;
  width: 18px; height: 18px;
  border: 2px solid var(--border-strong);
  border-radius: 5px;
  cursor: pointer;
  position: relative;
}
.checkbox-row input[type="checkbox"]:checked { background: var(--accent); border-color: var(--accent); }
.checkbox-row input[type="checkbox"]:checked::after {
  content: '';
  position: absolute;
  left: 4px; top: 0;
  width: 5px; height: 9px;
  border: solid white;
  border-width: 0 2px 2px 0;
  transform: rotate(45deg);
}

.radio-group {
  display: flex;
  gap: 0;
  background: var(--bg);
  border-radius: var(--radius-md);
  padding: 3px;
  width: 100%;
}
.radio-group label {
  flex: 1;
  text-align: center;
  padding: 8px 12px;
  border-radius: 8px;
  font-size: 13px;
  font-weight: 500;
  color: var(--text-secondary);
  cursor: pointer;
  transition: background 0.1s, color 0.1s;
}
.radio-group input[type="radio"] { display: none; }
.radio-group input[type="radio"]:checked + label { background: var(--card); color: var(--text); box-shadow: var(--shadow-sm); font-weight: 600; }

/* ============================================================
   MODAL / DRAWER
   ============================================================ */
.modal {
  position: fixed;
  inset: 0;
  z-index: 100;
  display: none;
  background: rgba(13, 20, 33, 0.45);
  backdrop-filter: blur(2px);
  align-items: flex-start;
  justify-content: center;
  padding: var(--space-8) var(--space-4);
  overflow-y: auto;
}
.modal.open { display: flex; }

.modal-card {
  background: var(--card);
  border-radius: var(--radius-xl);
  width: 100%;
  max-width: 640px;
  box-shadow: var(--shadow-modal);
  overflow: hidden;
  display: flex;
  flex-direction: column;
  max-height: calc(100vh - 64px);
}

.modal-header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: var(--space-5) var(--space-6);
  border-bottom: 1px solid var(--border-soft);
}
.modal-title { font-size: 18px; font-weight: 600; letter-spacing: -0.01em; }
.modal-body { padding: var(--space-6); overflow-y: auto; flex: 1; }
.modal-footer {
  padding: var(--space-4) var(--space-6);
  border-top: 1px solid var(--border-soft);
  display: flex;
  justify-content: space-between;
  gap: var(--space-2);
  align-items: center;
}

.advanced-toggle {
  display: flex;
  align-items: center;
  gap: 6px;
  padding: var(--space-3) 0;
  margin: var(--space-4) 0;
  border-top: 1px solid var(--border-soft);
  font-size: 13px;
  color: var(--text-secondary);
  font-weight: 500;
  cursor: pointer;
  width: 100%;
  justify-content: space-between;
}
.advanced-toggle .chevron { transition: transform 0.15s; }
.advanced-toggle[aria-expanded="true"] .chevron { transform: rotate(180deg); }

.advanced-fields { display: none; flex-direction: column; gap: var(--space-4); }
.advanced-fields.open { display: flex; }

/* ============================================================
   TABLES
   ============================================================ */
.table-wrap { overflow-x: auto; border-radius: var(--radius-lg); border: 1px solid var(--border-soft); }

table.data-table {
  width: 100%;
  font-size: 13px;
  border-collapse: collapse;
  background: var(--card);
}
.data-table th {
  text-align: left;
  font-weight: 600;
  font-size: 11px;
  color: var(--text-tertiary);
  text-transform: uppercase;
  letter-spacing: 0.06em;
  padding: var(--space-3);
  background: var(--card-soft);
  border-bottom: 1px solid var(--border);
  white-space: nowrap;
}
.data-table td {
  padding: var(--space-3);
  border-bottom: 1px solid var(--border-soft);
  vertical-align: middle;
}
.data-table tbody tr:hover { background: var(--bg); }
.data-table tbody tr:last-child td { border-bottom: none; }

.num { text-align: right; font-feature-settings: 'tnum' 1; }
.row-warn { background: rgba(245, 158, 11, 0.06); }
.row-danger { background: rgba(239, 68, 68, 0.07); }

/* ============================================================
   PLANNER OPTIMIZER
   ============================================================ */
.optimizer-bar {
  background: var(--card);
  border-radius: var(--radius-xl);
  padding: var(--space-5) var(--space-6);
  box-shadow: var(--shadow-card);
  margin-bottom: var(--space-5);
  display: flex;
  flex-wrap: wrap;
  gap: var(--space-4);
  align-items: center;
  justify-content: space-between;
}

.optimizer-summary {
  display: flex;
  gap: var(--space-6);
  flex-wrap: wrap;
}
.optimizer-summary .metric { display: flex; flex-direction: column; gap: 2px; }
.optimizer-summary .metric .label { font-size: 11px; color: var(--text-tertiary); font-weight: 600; text-transform: uppercase; letter-spacing: 0.05em; }
.optimizer-summary .metric .value { font-size: 18px; font-weight: 600; }

.combo-card {
  background: var(--card);
  border-radius: var(--radius-lg);
  padding: var(--space-5);
  box-shadow: var(--shadow-card);
  border: 2px solid transparent;
  cursor: pointer;
  transition: border-color 0.12s, transform 0.05s, box-shadow 0.12s;
}
.combo-card:hover { border-color: var(--accent-mid); }
.combo-card:active { transform: scale(0.997); }
.combo-card.selected { border-color: var(--accent); box-shadow: var(--shadow-card-hover), 0 0 0 4px rgba(91, 92, 246, 0.12); }
.recommended-tag { color: var(--accent); font-weight: 700; }

.combo-header { display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: var(--space-3); gap: var(--space-3); }
.combo-rank { font-size: 11px; font-weight: 700; color: var(--text-tertiary); text-transform: uppercase; letter-spacing: 0.06em; }
.combo-bonus { font-size: 22px; font-weight: 700; letter-spacing: -0.02em; color: var(--success); }
.combo-meta { font-size: 12px; color: var(--text-secondary); margin-bottom: var(--space-3); display: flex; flex-wrap: wrap; gap: 12px; }
.combo-meta span { display: inline-flex; align-items: center; gap: 4px; }
.combo-offers { display: flex; flex-direction: column; gap: 4px; }
.combo-offer { font-size: 13px; padding: 6px 10px; background: var(--bg); border-radius: 6px; display: flex; justify-content: space-between; gap: 8px; }
.combo-offer .name { color: var(--text); font-weight: 500; }
.combo-offer .amount { color: var(--text-tertiary); font-feature-settings: 'tnum' 1; }

/* ============================================================
   EMPTY STATES & MISC
   ============================================================ */
.empty-state {
  text-align: center;
  padding: var(--space-12) var(--space-6);
  color: var(--text-secondary);
}
.empty-state svg { width: 48px; height: 48px; opacity: 0.4; margin-bottom: var(--space-4); }
.empty-state h3 { font-size: 18px; font-weight: 600; color: var(--text); margin-bottom: var(--space-2); }
.empty-state p { font-size: 14px; max-width: 360px; margin: 0 auto var(--space-4); }

.toast {
  position: fixed;
  bottom: 30px;
  left: 50%;
  transform: translateX(-50%) translateY(20px);
  background: rgba(13, 20, 33, 0.94);
  color: white;
  padding: 12px 20px;
  border-radius: var(--radius-pill);
  font-size: 14px;
  font-weight: 500;
  text-align: center;
  box-shadow: 0 12px 32px rgba(0,0,0,0.2);
  opacity: 0;
  pointer-events: none;
  z-index: 200;
  transition: opacity 0.2s, transform 0.2s;
  /* Cap width so the toast doesn't run edge-to-edge on phones */
  max-width: calc(100vw - 32px);
}
.toast.visible { opacity: 1; transform: translateX(-50%) translateY(0); }
.toast.danger { background: var(--danger); }

.divider { height: 1px; background: var(--border-soft); margin: var(--space-5) 0; }

.banner {
  display: flex;
  gap: var(--space-3);
  padding: var(--space-4);
  border-radius: var(--radius-md);
  font-size: 13px;
  background: var(--accent-soft);
  color: var(--accent-strong);
  border: 1px solid rgba(91, 92, 246, 0.2);
  margin-bottom: var(--space-4);
  /* Center vertically; lay icon + text out so the text reads centered relative
     to its full visual block instead of left-stuck against the icon. */
  align-items: center;
  justify-content: center;
  text-align: center;
}
.banner > div { flex: 0 1 auto; }
.banner.warn { background: var(--warning-soft); color: #92400e; border-color: rgba(245, 158, 11, 0.3); }
.banner.danger { background: var(--danger-soft); color: #991b1b; border-color: rgba(239, 68, 68, 0.3); }
.banner svg { flex-shrink: 0; width: 18px; height: 18px; margin-top: 1px; }

.toolbar {
  display: flex;
  gap: var(--space-3);
  flex-wrap: wrap;
  align-items: center;
  margin-bottom: var(--space-5);
}

.section-header {
  display: flex;
  justify-content: space-between;
  align-items: center;
  gap: var(--space-3);
  margin-bottom: var(--space-4);
  flex-wrap: wrap;
}
.section-header h2 { font-size: 22px; font-weight: 700; letter-spacing: -0.02em; }
.section-header p { font-size: 14px; color: var(--text-secondary); }

.row-action-buttons { display: flex; gap: var(--space-1); justify-content: flex-end; }

/* ============================================================
   RESPONSIVE
   ============================================================ */
@media (max-width: 880px) {
  .grid-cols-4 { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  .grid-cols-3 { grid-template-columns: repeat(2, minmax(0, 1fr)); }
}

@media (max-width: 720px) {
  .primary-nav, .header-actions { display: none; }
  .app-header { padding: 0 var(--space-4); }
  .mobile-nav { display: flex; }
  .fab { display: flex; }
  .app-main {
    padding: var(--space-4) var(--space-4) calc(var(--bottom-nav-height) + var(--space-8));
  }
  .hero { padding: var(--space-6); border-radius: var(--radius-lg); }
  .hero-amount { font-size: 44px; }
  .grid-cols-4, .grid-cols-3, .grid-cols-2 { grid-template-columns: 1fr 1fr; }
  .grid-cols-2.mobile-stack { grid-template-columns: 1fr; }
  .stat-card { padding: var(--space-4); }
  .stat-value { font-size: 22px; }
  /* Mobile timeline: pin a narrow label column on the left, give the track a
     fixed wide pixel width so months breathe and the user scrolls
     horizontally instead of seeing crushed/overlapping labels. */
  .timeline-row { grid-template-columns: 120px 640px; }
  .timeline-row-label {
    position: sticky;
    left: 0;
    z-index: 2;
    box-shadow: 1px 0 0 var(--border-soft);
  }
  .modal { padding: 0; align-items: flex-end; }
  .modal-card { max-width: 100%; max-height: 92vh; border-radius: var(--radius-xl) var(--radius-xl) 0 0; }
  .modal-header { padding: var(--space-4); }
  .modal-body { padding: var(--space-4); }
  .modal-footer { padding: var(--space-3) var(--space-4); }
  .form-grid { grid-template-columns: 1fr; }
  .section-header h2 { font-size: 20px; }
  .planner-add-btn { display: none; }
  .timeline-row-label { font-size: 12px; padding: 6px 8px; }
}

@media (max-width: 480px) {
  .grid-cols-4, .grid-cols-3, .grid-cols-2 { grid-template-columns: 1fr; }
  .hero-amount { font-size: 40px; }
}

@media (min-width: 880px) {
  .planner-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(340px, 1fr));
    gap: var(--space-4);
  }
  .combo-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(360px, 1fr));
    gap: var(--space-4);
  }
}

@media (min-width: 481px) and (max-width: 879px) {
  .planner-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: var(--space-4);
  }
  .combo-grid { display: flex; flex-direction: column; gap: var(--space-3); }
}

@media (max-width: 480px) {
  .planner-grid, .combo-grid { display: flex; flex-direction: column; gap: var(--space-4); }
}

/* Visually hidden but accessible */
.sr-only {
  position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px;
  overflow: hidden; clip: rect(0,0,0,0); white-space: nowrap; border: 0;
}
</style>

<script>
'use strict';

/* ============================================================
   CONSTANTS & STORAGE
   ============================================================ */
const STORAGE_KEY = 'capital-planner-v1';
const TODAY = startOfDay(new Date());

const STATUSES = ['prospect', 'selected', 'applied', 'funded', 'completed', 'skipped'];
const STATUS_LABELS = {

/* ============================================================
   CLOUD SYNC (GitHub Gist)
   ============================================================
   Persists state to a private GitHub Gist so the app syncs across
   devices. Each device stores a Personal Access Token (PAT, scope:
   `gist`) and the Gist ID in localStorage. On startup we pull the
   Gist; if its `_lastModified` timestamp is newer than local, the
   remote replaces local. Otherwise we push local up.

   Conflict resolution is last-writer-wins on the `_lastModified`
   timestamp embedded in the state. For a single user across devices
   this is sufficient — the loser's edits are overwritten only if
   they were strictly older than the winner's.

   Token security note: a PAT with only the `gist` scope can only
   read/write your gists. It cannot touch your repos, your account
   settings, or any GitHub-authenticated services. Loss = revoke
   at github.com/settings/tokens.
   ============================================================ */
const SYNC_CONFIG_KEY = 'capital-planner-sync-config-v1';
const SYNC_FILENAME = 'capital-planner.json';

const Sync = {
  status: 'unconfigured',  // 'unconfigured' | 'syncing' | 'synced' | 'pending' | 'error'
  lastError: null,
  lastSyncAt: 0,            // Date.now() of last successful round-trip
  pushTimer: null,
  startupDone: false,

  getConfig() {
    try { return JSON.parse(localStorage.getItem(SYNC_CONFIG_KEY)) || null; }
    catch { return null; }
  },
  setConfig(cfg) {
    if (cfg) localStorage.setItem(SYNC_CONFIG_KEY, JSON.stringify(cfg));
    else localStorage.removeItem(SYNC_CONFIG_KEY);
  },
  isConfigured() {
    const c = this.getConfig();
    return Boolean(c && c.token && c.gistId);
  },
  setStatus(s, err = null) {
    this.status = s;
    this.lastError = err;
    updateSyncIndicator();
  },

  // Schedule a debounced push after local edits.
  schedulePush(delayMs = 2500) {
    if (!this.isConfigured()) { this.setStatus('unconfigured'); return; }
    if (this.pushTimer) clearTimeout(this.pushTimer);
    this.setStatus('pending');
    this.pushTimer = setTimeout(() => this.push({ silent: true }), delayMs);
  },

  // Timestamp-aware sync: pulls from Gist; if remote newer, replaces local
  // (after flushing any pending push). If local newer, pushes. Safe to call
  // from startup, focus, and visibilitychange. Throttled by SAFE_SYNC_COOLDOWN.
  _lastSafeSyncAt: 0,
  async safeSync({ force = false, reason = '' } = {}) {
    if (!this.isConfigured()) { this.setStatus('unconfigured'); return; }
    const SAFE_SYNC_COOLDOWN = 5000;
    const now = Date.now();
    if (!force && now - this._lastSafeSyncAt < SAFE_SYNC_COOLDOWN) return;
    this._lastSafeSyncAt = now;

    const cfg = this.getConfig();
    // If a debounced push is queued, the user has unsaved local edits — flush
    // them first so we don't clobber them by pulling.
    if (this.pushTimer) {
      clearTimeout(this.pushTimer);
      this.pushTimer = null;
      await this.push({ silent: true });
    }

    this.setStatus('syncing');
    try {
      const data = await ghGet(`https://api.github.com/gists/${cfg.gistId}`, cfg.token);
      const file = data.files[SYNC_FILENAME] || Object.values(data.files || {})[0];
      let remote = null;
      if (file) {
        const content = file.truncated
          ? await (await fetch(file.raw_url)).text()
          : file.content;
        if (content && content.trim()) {
          try { remote = JSON.parse(content); } catch { remote = null; }
        }
      }
      const remoteModified = (remote && remote._lastModified) || 0;
      const localModified = (App.state && App.state._lastModified) || 0;

      if (remote && remoteModified > localModified) {
        // Remote wins — replace local
        App.state = remote;
        try { localStorage.setItem(STORAGE_KEY, JSON.stringify(App.state)); } catch {}
        this.lastSyncAt = Date.now();
        this.setStatus('synced');
        render();
        if (reason) toast(`Pulled latest from cloud (${reason})`);
      } else if (!remote || localModified > remoteModified) {
        // Local newer or remote empty — push up. Skip if remoteModified > 0
        // and local seeded with no edits (avoids overwriting with sample data
        // on a fresh device); only push if local has been touched.
        if (remoteModified > 0 && localModified === 0) {
          // Local is fresh / unsaved — pull remote rather than push
          App.state = remote;
          try { localStorage.setItem(STORAGE_KEY, JSON.stringify(App.state)); } catch {}
          this.lastSyncAt = Date.now();
          this.setStatus('synced');
          render();
          if (reason) toast(`Pulled latest from cloud (${reason})`);
        } else {
          await this.push({ silent: true });
        }
      } else {
        this.lastSyncAt = Date.now();
        this.setStatus('synced');
      }
    } catch (e) {
      this.setStatus('error', e.message);
      console.warn('safeSync failed', e);
    }
  },

  async startupSync() {
    if (this.startupDone) return;
    this.startupDone = true;
    return this.safeSync({ force: true });
  },

  async pull({ silent = false } = {}) {
    if (!this.isConfigured()) { toast('Sync not configured', 'danger'); return; }
    const cfg = this.getConfig();
    this.setStatus('syncing');
    try {
      const data = await ghGet(`https://api.github.com/gists/${cfg.gistId}`, cfg.token);
      const file = data.files[SYNC_FILENAME] || Object.values(data.files || {})[0];
      if (!file) throw new Error('Gist has no file yet');
      const content = file.truncated
        ? await (await fetch(file.raw_url)).text()
        : file.content;
      if (!content || !content.trim()) throw new Error('Gist file is empty');
      const remote = JSON.parse(content);
      App.state = remote;
      try { localStorage.setItem(STORAGE_KEY, JSON.stringify(App.state)); } catch {}
      this.lastSyncAt = Date.now();
      this.setStatus('synced');
      render();
      if (!silent) toast('Pulled from cloud');
    } catch (e) {
      this.setStatus('error', e.message);
      if (!silent) toast('Pull failed: ' + e.message, 'danger');
    }
  },

  async push({ silent = false } = {}) {
    if (!this.isConfigured()) { if (!silent) toast('Sync not configured', 'danger'); return; }
    const cfg = this.getConfig();
    this.setStatus('syncing');
    try {
      // Stamp last-modified just before sending so remote reflects the upload
      App.state._lastModified = Date.now();
      try { localStorage.setItem(STORAGE_KEY, JSON.stringify(App.state)); } catch {}
      const body = JSON.stringify({
        files: { [SYNC_FILENAME]: { content: JSON.stringify(App.state, null, 2) } }
      });
      await ghFetch(`https://api.github.com/gists/${cfg.gistId}`, cfg.token, 'PATCH', body);
      this.lastSyncAt = Date.now();
      this.setStatus('synced');
      if (!silent) toast('Pushed to cloud');
    } catch (e) {
      this.setStatus('error', e.message);
      if (!silent) toast('Push failed: ' + e.message, 'danger');
    }
  },

  async createGist(token) {
    // Convenience: create a private Gist seeded with current state.
    App.state._lastModified = Date.now();
    try { localStorage.setItem(STORAGE_KEY, JSON.stringify(App.state)); } catch {}
    const body = JSON.stringify({
      description: 'Yield Vector sync',
      public: false,
      files: { [SYNC_FILENAME]: { content: JSON.stringify(App.state, null, 2) } }
    });
    const data = await ghFetch('https://api.github.com/gists', token, 'POST', body);
    return data.id;
  },

  disconnect() {
    if (this.pushTimer) clearTimeout(this.pushTimer);
    this.setConfig(null);
    this.lastSyncAt = 0;
    this.setStatus('unconfigured');
  }
};

async function ghGet(url, token) {
  const r = await fetch(url, {
    headers: {
      Authorization: `token ${token}`,
      Accept: 'application/vnd.github+json'
    }
  });
  if (!r.ok) {
    const t = await r.text().catch(() => '');
    throw new Error(`HTTP ${r.status}${t ? ': ' + t.slice(0, 80) : ''}`);
  }
  return r.json();
}

async function ghFetch(url, token, method, body) {
  const r = await fetch(url, {
    method,
    headers: {
      Authorization: `token ${token}`,
      Accept: 'application/vnd.github+json',
      'Content-Type': 'application/json'
    },
    body
  });
  if (!r.ok) {
    const t = await r.text().catch(() => '');
    throw new Error(`HTTP ${r.status}${t ? ': ' + t.slice(0, 80) : ''}`);
  }
  return r.json();
}

function relativeTimeShort(ts) {
  if (!ts) return '';
  const diff = Math.max(0, Date.now() - ts);
  if (diff < 10000) return 'just now';
  if (diff < 60000) return `${Math.floor(diff / 1000)}s ago`;
  if (diff < 3600000) return `${Math.floor(diff / 60000)}m ago`;
  if (diff < 86400000) return `${Math.floor(diff / 3600000)}h ago`;
  return `${Math.floor(diff / 86400000)}d ago`;
}

function renderSyncIndicator() {
  const rel = Sync.lastSyncAt ? relativeTimeShort(Sync.lastSyncAt) : '';
  const labels = {
    synced: rel ? `Synced ${rel}` : 'Synced',
    syncing: 'Syncing…',
    pending: 'Pending',
    error: 'Sync error',
    unconfigured: 'Not synced'
  };
  const title = Sync.lastError
    ? `Error: ${Sync.lastError}. Click to fix.`
    : (Sync.status === 'synced' && Sync.lastSyncAt
      ? `Last synced ${new Date(Sync.lastSyncAt).toLocaleTimeString()}. Click for sync settings.`
      : `Click for sync settings.`);
  return `
    <button class="sync-indicator" data-status="${Sync.status}" data-action="open-sync" title="${escapeAttr(title)}">
      <span class="sync-dot"></span>
      <span class="sync-text">${labels[Sync.status] || 'Sync'}</span>
    </button>
  `;
}

function updateSyncIndicator() {
  // Patch in place to avoid full re-render
  const old = document.querySelector('.sync-indicator');
  if (!old) return;
  const wrap = document.createElement('div');
  wrap.innerHTML = renderSyncIndicator();
  const next = wrap.firstElementChild;
  old.replaceWith(next);
}

/* ============================================================
   PWA: runtime-generated icon + manifest, no external assets
   ============================================================ */
function setupPwa() {
  // Yield Vector home-screen icon: two-tier diagonal split (Wealthfront-
  // inspired) with a subtle white upward-vector mark.
  const c = document.createElement('canvas');
  c.width = 180; c.height = 180;
  const ctx = c.getContext('2d');
  const W = 180, R = 38;

  // Round corners via clip
  ctx.save();
  ctx.beginPath();
  ctx.moveTo(R, 0);
  ctx.lineTo(W - R, 0);
  ctx.quadraticCurveTo(W, 0, W, R);
  ctx.lineTo(W, W - R);
  ctx.quadraticCurveTo(W, W, W - R, W);
  ctx.lineTo(R, W);
  ctx.quadraticCurveTo(0, W, 0, W - R);
  ctx.lineTo(0, R);
  ctx.quadraticCurveTo(0, 0, R, 0);
  ctx.closePath();
  ctx.clip();

  // Smooth diagonal gradient — violet top-left fading to deep indigo bottom-right
  const grad = ctx.createLinearGradient(0, 0, W, W);
  grad.addColorStop(0, '#a78bfa');
  grad.addColorStop(0.38, '#7c6ef5');
  grad.addColorStop(0.65, '#6366f1');
  grad.addColorStop(1, '#312e81');
  ctx.fillStyle = grad;
  ctx.fillRect(0, 0, W, W);

  // Subtle luminosity highlight to give depth without harshness
  const shimmer = ctx.createLinearGradient(0, 0, W * 0.7, W * 0.7);
  shimmer.addColorStop(0, 'rgba(255,255,255,0.14)');
  shimmer.addColorStop(1, 'rgba(255,255,255,0)');
  ctx.fillStyle = shimmer;
  ctx.fillRect(0, 0, W, W);

  // White vector mark — tapered parallelogram shaft + triangular arrowhead.
  // Same geometric language used inside the header brand chip so the icon
  // and the header read as one mark at two scales.
  ctx.fillStyle = '#ffffff';
  ctx.shadowColor = 'rgba(0,0,0,0.22)';
  ctx.shadowBlur = 8;
  ctx.shadowOffsetY = 2;
  // Tapered shaft: wider at base, narrower near the arrowhead
  ctx.beginPath();
  ctx.moveTo(36, 144);
  ctx.lineTo(52, 128);
  ctx.lineTo(128, 52);
  ctx.lineTo(116, 64);
  ctx.closePath();
  ctx.fill();
  ctx.shadowBlur = 0;
  // Triangular arrowhead (top-right corner)
  ctx.beginPath();
  ctx.moveTo(106, 28);
  ctx.lineTo(152, 28);
  ctx.lineTo(152, 74);
  ctx.closePath();
  ctx.fill();

  ctx.restore();

  const dataUrl = c.toDataURL('image/png');
  const apple = document.getElementById('apple-icon');
  const fav = document.getElementById('favicon');
  if (apple) apple.href = dataUrl;
  if (fav) fav.href = dataUrl;
  // Web App Manifest (Android/Chrome)
  const manifest = {
    name: 'Yield Vector',
    short_name: 'Yield Vector',
    display: 'standalone',
    start_url: location.pathname,
    scope: location.pathname,
    background_color: '#f5f5f7',
    theme_color: '#5b5cf6',
    icons: [
      { src: dataUrl, sizes: '180x180', type: 'image/png', purpose: 'any maskable' }
    ]
  };
  const blob = new Blob([JSON.stringify(manifest)], { type: 'application/manifest+json' });
  const m = document.getElementById('manifest');
  if (m) m.href = URL.createObjectURL(blob);
}

/* ============================================================
   DATE UTILITIES
   ============================================================ */
function startOfDay(d) {
  const x = new Date(d);
  x.setHours(0, 0, 0, 0);
  return x;
}

function parseDate(s) {
  if (!s) return null;
  if (s instanceof Date) return startOfDay(s);
  const m = String(s).match(/^(\d{4})-(\d{2})-(\d{2})/);
  if (!m) return null;
  const d = new Date(+m[1], +m[2] - 1, +m[3]);
  return isNaN(d) ? null : d;
}

function isoDate(d) {
  if (!d) return '';
  const dt = d instanceof Date ? d : parseDate(d);
  if (!dt) return '';
  const y = dt.getFullYear();
  const m = String(dt.getMonth() + 1).padStart(2, '0');
  const dd = String(dt.getDate()).padStart(2, '0');
  return `${y}-${m}-${dd}`;
}

function addDays(d, n) {
  const dt = new Date(d);
  dt.setDate(dt.getDate() + n);
  return dt;
}

function daysBetween(a, b) {
  const ms = startOfDay(b) - startOfDay(a);
  return Math.round(ms / 86400000);
}

function formatDateShort(d) {
  const dt = d instanceof Date ? d : parseDate(d);
  if (!dt) return '—';
  return dt.toLocaleDateString('en-US', { month: 'short', day: 'numeric' });
}

function formatDateMedium(d) {
  const dt = d instanceof Date ? d : parseDate(d);
  if (!dt) return '—';
  const sameYear = dt.getFullYear() === TODAY.getFullYear();
  return dt.toLocaleDateString('en-US', sameYear
    ? { month: 'short', day: 'numeric' }
    : { month: 'short', day: 'numeric', year: 'numeric' });
}

function formatDateLong(d) {
  const dt = d instanceof Date ? d : parseDate(d);
  if (!dt) return '—';
  return dt.toLocaleDateString('en-US', { weekday: 'short', month: 'short', day: 'numeric', year: 'numeric' });
}

function relativeDays(d) {
  const dt = parseDate(d);
  if (!dt) return '';
  const n = daysBetween(TODAY, dt);
  if (n === 0) return 'today';
  if (n === 1) return 'tomorrow';
  if (n === -1) return 'yesterday';
  if (n > 0) return `in ${n} days`;
  return `${-n} days ago`;
}

/* ============================================================
   CURRENCY FORMATTING
   ============================================================ */
function formatCurrency(n, opts = {}) {
  if (n === null || n === undefined || isNaN(n)) return '—';
  const sign = n < 0 ? '-' : '';
  const abs = Math.abs(n);
  return sign + '$' + Math.round(abs).toLocaleString('en-US');
}

function formatCurrencyDecimal(n) {
  if (n === null || n === undefined || isNaN(n)) return '—';
  const sign = n < 0 ? '-' : '';
  return sign + '$' + Math.abs(n).toLocaleString('en-US', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
}

function formatCompactCurrency(n) {
  if (n === null || n === undefined || isNaN(n)) return '—';
  const sign = n < 0 ? '-' : '';
  const abs = Math.abs(n);
  if (abs >= 1_000_000) return `${sign}$${(abs / 1_000_000).toFixed(abs >= 10_000_000 ? 0 : 1)}M`;
  if (abs >= 10_000) return `${sign}$${Math.round(abs / 1000)}K`;
  if (abs >= 1000) return `${sign}$${(abs / 1000).toFixed(1)}K`;
  return `${sign}$${Math.round(abs)}`;
}

function formatPercent(n, digits = 1) {
  if (n === null || n === undefined || isNaN(n)) return '—';
  return (n * 100).toFixed(digits) + '%';
}

function uid(prefix = 'id') {

        projectionHorizonDays: 365,     // used only when mode === 'custom'

      },

    try {
      const raw = localStorage.getItem(STORAGE_KEY);

      const parsed = JSON.parse(raw);
      if (!parsed || typeof parsed !== 'object') return null;
      return parsed;
    } catch (e) {
      console.warn('Failed to load state', e);
      return null;
    }

    try {
      // Stamp last-modified so cloud sync can resolve "who's newer"
      this.state._lastModified = Date.now();
      localStorage.setItem(STORAGE_KEY, JSON.stringify(this.state));
      Sync.schedulePush();
    } catch (e) {

    this.view = view;

    updater(this.state);
    this.save();
    render();
  }
};

/* ============================================================
   OFFER DERIVED FIELDS
   ============================================================ */
function effectiveFundingDate(offer) {
  return offer.optionalPlannedFundingDate || offer.plannedSignupDate;
}

function depositDeadline(offer) {
  if (!offer.plannedSignupDate || offer.daysAfterSignupAllowedBeforeDeposit == null) return null;
  return isoDate(addDays(parseDate(offer.plannedSignupDate), Number(offer.daysAfterSignupAllowedBeforeDeposit)));
}

function withdrawalEligibleDate(offer) {
  // The day-count anchor depends on lockStartsFrom:
  //   'open date'   → days are measured from when the account is opened
  //                   (e.g. US Bank: "60 days from account open"). Funding
  //                   later means a shorter actual lock.
  //   'funded date' → days are measured from the actual funding date
  //                   (e.g. Citi: "keep $50k for 60 days from deposit").
  const anchor = offer.lockStartsFrom === 'open date'
    ? offer.plannedSignupDate
    : effectiveFundingDate(offer);
  if (!anchor || offer.daysFundsMustRemain == null) return null;
  return isoDate(addDays(parseDate(anchor), Number(offer.daysFundsMustRemain)));
}

function lockStartDate(offer) {
  // Money is only actually unavailable from when it's deposited, regardless
  // of what the bank uses to anchor the day count. Always return the funding
  // date here so the projection reflects real cash availability.
  return effectiveFundingDate(offer);
}

function safeToCloseDate(offer) {
  // Approximation: withdrawalEligible + a small grace period; or use explicit field if present
  const we = withdrawalEligibleDate(offer);
  if (!we) return null;
  // Keep separate as concept; actual safe-to-close varies by bank policy
  return null;
}

function simpleReturn(offer) {
  if (!offer.requiredFundingAmount || !offer.signupBonusAmount) return null;
  return offer.signupBonusAmount / offer.requiredFundingAmount;
}

function annualizedReturn(offer) {
  const r = simpleReturn(offer);
  if (r == null || !offer.daysFundsMustRemain || offer.daysFundsMustRemain <= 0) return null;
  return r * 365 / offer.daysFundsMustRemain;
}

function isOfferComplete(offer) {
  return Boolean(
    offer.bankName &&
    offer.requiredFundingAmount > 0 &&
    offer.signupBonusAmount >= 0 &&
    offer.plannedSignupDate &&
    offer.daysFundsMustRemain != null &&
    offer.daysFundsMustRemain >= 0 &&
    parseDate(offer.plannedSignupDate)
  );
}

function offerIssues(offer) {
  const issues = [];
  if (!offer.bankName) issues.push('Bank name is required');
  if (!offer.requiredFundingAmount || offer.requiredFundingAmount <= 0) issues.push('Required funding amount must be > 0');
  if (offer.signupBonusAmount == null || offer.signupBonusAmount < 0) issues.push('Bonus amount required');
  if (!offer.plannedSignupDate || !parseDate(offer.plannedSignupDate)) issues.push('Planned signup date required');
  if (offer.daysFundsMustRemain == null || offer.daysFundsMustRemain < 0) issues.push('Days funds must remain required');
  return issues;
}

function offerIsActiveForProjection(offer, includedOverride = null) {
  // Returns whether this offer should affect the projection.
  if (!isOfferComplete(offer)) return false;
  if (offer.status === 'completed' || offer.status === 'skipped') return false;
  if (includedOverride !== null) return includedOverride.has(offer.id);
  if (CONFIRMED_OFFER_STATUSES.has(offer.status)) return true;
  return Boolean(offer.includeInScenario);
}

/* ============================================================
   PROJECTION ENGINE
   ============================================================
   Generates a daily cash projection over the configured horizon.

   For each day in [projectionStartDate, projectionStartDate + horizonDays):
     availableCapital =
         currentLiquidCapital
       + cumulative net of all included Capital Events with date <= day
       - sum of confirmed commitments active on this day
       - sum of hypothetical commitments active on this day

   Interval convention:
     A commitment with startDate=A and endDate=B ties up funds on each day d
     where A <= d < B. If a deposit lands March 1 and is withdrawal-eligible
     May 1, the funds are tied up March 1 through April 30 (61 days).

   Sources of commitments:
     1. Manual/explicit Capital Commitments (with includeInProjection true).
     2. Bonus Offers that are considered active:
        - status in {applied, funded} → counted as confirmed
        - status in {prospect, selected} with includeInScenario → counted
          as hypothetical
        Suppressed if a non-cancelled commitment with sourceBonusOfferId
        already covers the offer.

   The optimizer can pass an `includedOfferIds` set to override which
   prospect/selected offers contribute (used to evaluate combinations).
   ============================================================ */
// Compute the effective projection horizon in days based on the user's
// chosen mode. 'auto' = 30 days past the latest active date in the system
// (commitment ends, withdrawal-eligible dates, included events), with a
// 30-day floor. Modes other than 'custom' are fixed-day shorthands.
function effectiveHorizonDays(state) {
  const settings = state.settings || {};
  const mode = settings.projectionHorizonMode || 'auto';
  const start = parseDate(settings.projectionStartDate) || TODAY;
  if (mode === '3months') return 90;
  if (mode === '6months') return 180;
  if (mode === '1year') return 365;
  if (mode === '2years') return 730;
  if (mode === 'custom') return Math.max(30, Math.min(1825, Number(settings.projectionHorizonDays) || 365));
  // 'auto' — 30 days past the latest withdrawal-eligible date of active/planned
  // offers, capped at 180 days (6 months). Distant offers stop pushing the
  // horizon further so the chart never zooms out further than half a year.
  let last = addDays(start, 30);
  for (const o of state.offers || []) {
    if (o.status === 'completed' || o.status === 'skipped') continue;
    const we = withdrawalEligibleDate(o);
    const d = we ? parseDate(we) : null;
    if (d && d > last) last = d;
  }
  return Math.max(30, Math.min(180, daysBetween(start, addDays(last, 30))));
}

function generateProjection(state, options = {}) {
  const settings = state.settings;
  const horizon = effectiveHorizonDays(state);
  const start = parseDate(settings.projectionStartDate) || TODAY;
  const buffer = Number(settings.minimumCashBuffer) || 0;
  const liquid = Number(settings.currentLiquidCapital) || 0;

  const includedOverride = options.includedOfferIds
    ? new Set(options.includedOfferIds)
    : null;
  const earlyExit = options.earlyExit || false;

  // Pre-build day skeleton
  const days = new Array(horizon);
  const dayMs = 86400000;
  const startMs = start.getTime();
  for (let i = 0; i < horizon; i++) {
    days[i] = {
      date: new Date(startMs + i * dayMs),
      dateISO: '',
      dayIndex: i,
      startingLiquidCapital: liquid,
      confirmedTiedUp: 0,
      hypotheticalTiedUp: 0,
      totalTiedUp: 0,
      netEventsToDate: 0,
      availableCapital: liquid,
      belowBuffer: false,
      shortfall: false
    };
  }

  // Helper: find day index for a Date (clamped)
  function indexFor(date) {
    if (!date) return -1;
    const idx = Math.floor((startOfDay(date).getTime() - startMs) / dayMs);
    return idx;
  }

  // Helper: apply a commitment over its active range
  function applyCommitment(amount, startDate, endDate, kind) {
    const sIdx = indexFor(startDate);
    const eIdx = indexFor(endDate);
    if (eIdx < 0) return; // ends before horizon starts
    if (sIdx >= horizon) return; // starts after horizon ends
    // Active days: [max(sIdx,0), min(eIdx, horizon)) — endDate exclusive
    const from = Math.max(sIdx, 0);
    const to = Math.min(eIdx, horizon);
    for (let i = from; i < to; i++) {
      if (kind === 'confirmed') days[i].confirmedTiedUp += amount;
      else days[i].hypotheticalTiedUp += amount;
    }
  }

  // 1. Manual capital commitments
  const offerIdsWithCommitments = new Set();
  for (const c of state.commitments) {
    if (!c.includeInProjection) continue;
    if (c.status === 'cancelled') continue;
    const amount = Number(c.amount);
    if (!amount || amount <= 0) continue;
    const cs = parseDate(c.startDate);
    const ce = parseDate(c.endDate);
    if (!cs || !ce || cs >= ce) continue;
    if (c.sourceBonusOfferId) offerIdsWithCommitments.add(c.sourceBonusOfferId);
    const kind = (c.status === 'confirmed' || c.status === 'completed') ? 'confirmed' : 'hypothetical';
    if (c.status === 'completed') continue; // completed commitments no longer tie up funds
    applyCommitment(amount, cs, ce, kind);
  }

  // 2. Virtual commitments from bonus offers
  for (const o of state.offers) {
    if (!offerIsActiveForProjection(o, includedOverride)) continue;
    if (offerIdsWithCommitments.has(o.id)) continue; // suppressed by explicit commitment
    const start = parseDate(lockStartDate(o));
    const end = parseDate(withdrawalEligibleDate(o));
    if (!start || !end || start >= end) continue;
    const kind = CONFIRMED_OFFER_STATUSES.has(o.status) ? 'confirmed' : 'hypothetical';
    applyCommitment(Number(o.requiredFundingAmount), start, end, kind);
  }

  // 3. Capital events — accumulate net through each day
  const validEvents = state.events
    .filter(e => e.includeInProjection && e.date && parseDate(e.date) && typeof e.amount === 'number' && e.amount !== 0)
    .map(e => ({ idx: indexFor(parseDate(e.date)), amount: Number(e.amount) }))
    .filter(e => e.idx < horizon)
    .sort((a, b) => a.idx - b.idx);

  let cumul = 0;
  let evIdx = 0;
  for (let i = 0; i < horizon; i++) {
    while (evIdx < validEvents.length && validEvents[evIdx].idx <= i) {
      cumul += validEvents[evIdx].amount;
      evIdx++;
    }
    const d = days[i];
    d.netEventsToDate = cumul;
    d.totalTiedUp = d.confirmedTiedUp + d.hypotheticalTiedUp;
    d.availableCapital = d.startingLiquidCapital + cumul - d.totalTiedUp;
    d.belowBuffer = d.availableCapital < buffer;
    d.shortfall = d.availableCapital < 0;
    d.dateISO = isoDate(d.date);
    if (earlyExit && d.shortfall) {
      // Optimizer hint: still finish for stats, but mark early-exit info
    }
  }

  return days;
}

/* ============================================================
   PROJECTION SUMMARY (for the Overview view)
   ============================================================ */
function summarizeProjection(projection, settings) {
  if (!projection.length) return {};
  let lowest = projection[0];
  let lowestIdx = 0;
  let shortfallDays = 0;
  let belowBufferDays = 0;
  for (let i = 0; i < projection.length; i++) {
    const d = projection[i];
    if (d.availableCapital < lowest.availableCapital) { lowest = d; lowestIdx = i; }
    if (d.shortfall) shortfallDays++;
    if (d.belowBuffer) belowBufferDays++;
  }
  return {
    today: projection[0],
    lowest,
    lowestIdx,
    shortfallDays,
    belowBufferDays,
    feasible: shortfallDays === 0,
    horizonDays: projection.length
  };
}

/* ============================================================
   OFFER → COMMITMENT CONVERSION
   ============================================================ */
function convertOfferToCommitment(offer) {
  const start = lockStartDate(offer);
  const end = withdrawalEligibleDate(offer);
  if (!start || !end) return null;
  return {
    id: uid('cmt'),
    commitmentName: `${offer.bankName} — ${offer.offerName || 'Bonus'}`,
    sourceBonusOfferId: offer.id,
    amount: Number(offer.requiredFundingAmount),
    startDate: start,
    endDate: end,
    type: 'minimum balance',
    status: CONFIRMED_OFFER_STATUSES.has(offer.status) ? 'confirmed' : 'hypothetical',
    includeInProjection: true,
    expectedBonus: Number(offer.signupBonusAmount) || 0,
    notes: ''
  };
}

/* ============================================================
   OPTIMIZER
   ============================================================
   Brute-force search over candidate offers (status in
   {prospect, selected}, complete, dates within projection horizon).

   For up to maxOptimizerCandidates offers, evaluate every 2^n subset.
   For each subset:
     - Generate the daily projection with that subset selected.
     - A combination is feasible if availableCapital >= 0 every day.
     - Track total bonus, lowest available capital, days below buffer,
       and any breach dates.

   Ranking (feasible only):
     1. Highest total expected bonus.
     2. Highest blended annualized return.
     3. Highest lowest-available-capital (largest safety margin).

   Note: For n=15 this is 32,768 evaluations × 365 days ≈ 12M ops,
   which is fast in modern JS. We always run synchronously and then
   render. If candidates exceed the configured limit, we ask the user
   to deselect some via the planner cards.
   ============================================================ */
function runOptimizer(state) {
  const horizonStart = parseDate(state.settings.projectionStartDate) || TODAY;
  const horizonEnd = addDays(horizonStart, effectiveHorizonDays(state));

  const candidates = state.offers.filter(o => {
    if (!HYPOTHETICAL_OFFER_STATUSES.has(o.status)) return false;
    if (!isOfferComplete(o)) return false;
    const start = parseDate(lockStartDate(o));
    const end = parseDate(withdrawalEligibleDate(o));
    if (!start || !end) return false;
    if (end <= horizonStart || start >= horizonEnd) return false;
    return true;
  });

  const max = state.settings.maxOptimizerCandidates || 15;

  if (candidates.length > max) {
    return {
      tooMany: true,
      candidateCount: candidates.length,
      max,
      candidates,
      results: [],
      evaluated: 0,
      infeasibleCount: 0
    };
  }

  const buffer = Number(state.settings.minimumCashBuffer) || 0;
  const total = 1 << candidates.length;
  const results = [];
  let infeasibleCount = 0;

  for (let mask = 0; mask < total; mask++) {
    const includedIds = [];
    let totalBonus = 0;
    let totalRequired = 0;
    let weightedAnnReturnNum = 0;
    let weightedAnnReturnDen = 0;
    for (let i = 0; i < candidates.length; i++) {
      if (mask & (1 << i)) {
        const o = candidates[i];
        includedIds.push(o.id);
        totalBonus += Number(o.signupBonusAmount) || 0;
        totalRequired += Number(o.requiredFundingAmount) || 0;
        const ar = annualizedReturn(o);
        if (ar != null) {
          // Weight by required capital × duration to get a blended rate
          const weight = Number(o.requiredFundingAmount) * Number(o.daysFundsMustRemain);
          weightedAnnReturnNum += ar * weight;
          weightedAnnReturnDen += weight;
        }
      }
    }

    const proj = generateProjection(state, { includedOfferIds: includedIds });
    let lowest = Infinity;
    let belowBufferDays = 0;
    let shortfallDays = 0;
    const breachDates = [];
    for (const d of proj) {
      if (d.availableCapital < lowest) lowest = d.availableCapital;
      if (d.shortfall) { shortfallDays++; breachDates.push(d.dateISO); }
      else if (d.belowBuffer) belowBufferDays++;
    }
    const feasible = shortfallDays === 0 && belowBufferDays === 0;
    if (!feasible) infeasibleCount++;
    results.push({
      mask,
      includedIds,
      offerCount: includedIds.length,
      totalBonus,
      totalRequired,
      lowestAvailable: lowest,
      belowBufferDays,
      shortfallDays,
      feasible,
      blendedAnnReturn: weightedAnnReturnDen > 0 ? weightedAnnReturnNum / weightedAnnReturnDen : null,
      breachDates: breachDates.slice(0, 5)
    });
  }

  // Rank feasible: bonus desc → annReturn desc → lowestAvailable desc
  const feasibleResults = results
    .filter(r => r.feasible && r.offerCount > 0)
    .sort((a, b) => {
      if (b.totalBonus !== a.totalBonus) return b.totalBonus - a.totalBonus;
      const ar = (a.blendedAnnReturn ?? 0), br = (b.blendedAnnReturn ?? 0);
      if (br !== ar) return br - ar;
      return b.lowestAvailable - a.lowestAvailable;
    });

  return {
    tooMany: false,
    candidates,
    results: feasibleResults.slice(0, 10),
    allResults: results,
    evaluated: total,
    infeasibleCount,
    candidateCount: candidates.length
  };
}

/* ============================================================
   RENDERING — top-level shell
   ============================================================ */
function render() {
  const root = document.getElementById('app');
  // Preserve focus + caret on inputs across full re-renders. Without this,
  // typing/backspacing in the search box loses focus on every keystroke
  // because innerHTML destroys the input element.
  const focused = document.activeElement;
  const focusedId = focused && focused.id ? focused.id : null;
  const selStart = focused && focused.selectionStart != null ? focused.selectionStart : null;
  const selEnd = focused && focused.selectionEnd != null ? focused.selectionEnd : null;

  root.innerHTML = renderShell();

  if (focusedId) {
    const el = document.getElementById(focusedId);
    if (el) {
      el.focus({ preventScroll: true });
      try { if (selStart != null && el.setSelectionRange) el.setSelectionRange(selStart, selEnd); } catch {}
    }
  }
  bindViewEvents();
  // Re-render charts that need actual DOM measurements
  renderChartsAfterMount();
}

function renderShell() {
  return `

    <main class="app-main">${renderActiveView()}</main>

}

        <div class="card-header">
          <h2>Upcoming actions</h2>
          ${upcomingPageCount > 1 ? `
            <div class="upcoming-pager">
              <button class="upcoming-pg-btn" data-action="upcoming-prev" ${App._upcomingPage === 0 ? 'disabled' : ''} aria-label="Previous">‹</button>
              <span class="upcoming-pg-label">${App._upcomingPage + 1} / ${upcomingPageCount}</span>
              <button class="upcoming-pg-btn" data-action="upcoming-next" ${App._upcomingPage === upcomingPageCount - 1 ? 'disabled' : ''} aria-label="Next">›</button>
            </div>
          ` : ''}
        </div>
        ${upcomingActions.length === 0
          ? `<div style="padding:var(--space-6);text-align:center;color:var(--text-tertiary);font-size:14px;">No upcoming dates yet. Add an offer to get started.</div>`
          : `<div class="action-list upcoming-fade" key="${App._upcomingPage}">${upcomingActions.map(renderActionRow).join('')}</div>`}
      </section>

      <aside class="card snapshot-card overview-aside">
        <div class="snapshot-title">At a glance</div>
        <div class="snapshot-grid">
          <div class="snap snap-active"><span class="snap-v">${App.state.offers.filter(o => o.accountStatus !== 'closed' && WORKING_SUB_STATUSES.has(o.subStatus)).length}</span><span class="snap-l">Working toward SUB</span></div>
          <div class="snap snap-actions"><span class="snap-v">${computeActionsRequired(App.state)}</span><span class="snap-l">Actions required</span></div>
          <div class="snap snap-confirmed"><span class="snap-v">${App.state.commitments.filter(c => c.status === 'confirmed' && c.includeInProjection).length + App.state.offers.filter(o => CONFIRMED_OFFER_STATUSES.has(o.status)).length}</span><span class="snap-l">Confirmed</span></div>
          <div class="snap snap-events"><span class="snap-v">${App.state.events.filter(e => e.includeInProjection).length}</span><span class="snap-l">Events</span></div>
          <div class="snap snap-bonus"><span class="snap-v${(() => { const t = formatCurrency(expectedBonusTotal); return t.length >= 8 ? ' snap-v-sm' : ''; })()}">${formatCurrency(expectedBonusTotal)}</span><span class="snap-l">Bonus pool</span></div>
        </div>
      </aside>
    </div>
    ${renderOverviewChurnSection()}
  `;
}

// "Upcoming churn dates" (F6) — a bottom-of-Overview section listing offers that
// can be re-run, split into "Eligible now" and "Upcoming" (within
// CHURN_HORIZON_DAYS). Renders NOTHING at all unless at least one offer is
// marked churnable (churnable===true) — no dead chrome for users who never set
// churnability. Each row taps through to that offer's edit modal via the shared
// open-action-target routing (targetKind:'offer').
//
// SNOOZE: each visible row carries a subtle "Snooze" affordance (inline
// expanding action row: 30 days / 90 days / Indefinitely) that writes
// churn_snoozed_until. Snoozed offers drop out of both buckets and collect at
// the section bottom behind a muted "N snoozed — show" reveal, each with an
// Unsnooze button. The section stays mounted when there's ≥1 visible row OR ≥1
// snoozed offer (so a fully-snoozed section is still reachable to unsnooze);
// it's hidden entirely only when neither exists.
function renderOverviewChurnSection() {
  const offers = App.state.offers || [];
  // Gate: only consider offers when churnability is actually in use.
  if (!offers.some(o => o.churnable === true)) return '';

  const horizon = addDays(TODAY, CHURN_HORIZON_DAYS);
  const eligibleNow = [];
  const upcoming = [];
  const snoozed = [];
  for (const o of offers) {
    if (o.churnable !== true) continue;
    // Snoozed churnable offers are pulled out of the buckets entirely and
    // listed behind the reveal — regardless of whether their eligible date is
    // computable (you snoozed it; you can always unsnooze it).
    if (churnSnoozeActive(o)) { snoozed.push({ o }); continue; }
    const elig = churnEligibleDate(o);
    if (!elig) continue;                       // not computable (missing anchor/wait)
    const d = parseDate(elig);
    if (!d) continue;
    if (d.getTime() <= TODAY.getTime()) eligibleNow.push({ o, elig, d });
    else if (d.getTime() <= horizon.getTime()) upcoming.push({ o, elig, d });
    // Beyond the horizon → not shown here.
  }
  // Mount when there's at least one computable date to list (eligible now or
  // within the horizon) OR at least one snoozed offer (the reveal must stay
  // reachable). Churnable offers whose date isn't yet computable — missing
  // anchor or wait period, and not snoozed — surface that gap on their own
  // cards, not as an empty overview card.
  if (!eligibleNow.length && !upcoming.length && !snoozed.length) return '';
  eligibleNow.sort((a, b) => a.d - b.d);       // soonest first (oldest-eligible first)
  upcoming.sort((a, b) => a.d - b.d);
  snoozed.sort((a, b) => (a.o.bankName || '').localeCompare(b.o.bankName || ''));

  const offerName = (o) => `${o.bankName}${o.offerName ? ' — ' + o.offerName : ''}`;

  // A visible (non-snoozed) row: navigation main area + a subtle snooze menu.
  // The clickable nav div and the snooze controls are SIBLINGS inside a wrap so
  // interacting with the snooze menu never triggers the row's open-offer click.
  const row = (r, isNow) => {
    const o = r.o;
    const months = Number(o.churn_wait_months);
    const waitChip = Number.isFinite(months) && months > 0
      ? `<span class="chip chip-muted churn-wait-chip">${months} mo wait</span>` : '';
    const dateText = isNow ? 'Eligible now' : formatDateDisplay(r.elig);
    const idAttr = escapeAttr(o.id);
    const menuId = `churn-snooze-menu-${idAttr}`;
    return `<div class="churn-row-wrap"${offerColorHex(o) ? ` style="--offer-color:${offerColorHex(o)};"` : ''}>
      <div class="churn-row clickable" data-action="open-action-target" data-target-kind="offer" data-target-id="${idAttr}" role="button" tabindex="0">
        <div class="churn-row-main">
          <div class="churn-row-name">${escapeHtml(offerName(o))}</div>
          <div class="churn-row-date ${isNow ? 'success' : ''}">${escapeHtml(dateText)}</div>
        </div>
        ${waitChip}
      </div>
      <div class="churn-snooze">
        <button type="button" class="btn btn-ghost btn-xs churn-snooze-btn" data-action="churn-snooze-toggle" data-id="${idAttr}" aria-expanded="false" aria-controls="${menuId}" title="Snooze this churn reminder">Snooze</button>
        <div class="churn-snooze-menu" id="${menuId}" hidden>
          <button type="button" class="btn btn-ghost btn-xs" data-action="churn-snooze" data-id="${idAttr}" data-snooze="30">30 days</button>
          <button type="button" class="btn btn-ghost btn-xs" data-action="churn-snooze" data-id="${idAttr}" data-snooze="90">90 days</button>
          <button type="button" class="btn btn-ghost btn-xs" data-action="churn-snooze" data-id="${idAttr}" data-snooze="forever">Indefinitely</button>
        </div>
      </div>
    </div>`;
  };

  // A snoozed row (inside the reveal): shows the until-copy + an Unsnooze button.
  const snoozedRow = (r) => {
    const o = r.o;
    const su = o.churn_snoozed_until;
    const untilText = (su && su !== 'forever' && parseDate(su))
      ? `Snoozed until ${formatDateDisplay(su)}`
      : 'Snoozed indefinitely';
    const idAttr = escapeAttr(o.id);
    return `<div class="churn-row-wrap churn-row-snoozed"${offerColorHex(o) ? ` style="--offer-color:${offerColorHex(o)};"` : ''}>
      <div class="churn-row clickable" data-action="open-action-target" data-target-kind="offer" data-target-id="${idAttr}" role="button" tabindex="0">
        <div class="churn-row-main">
          <div class="churn-row-name">${escapeHtml(offerName(o))}</div>
          <div class="churn-row-date muted">${escapeHtml(untilText)}</div>
        </div>
      </div>
      <div class="churn-snooze">
        <button type="button" class="btn btn-ghost btn-xs churn-unsnooze-btn" data-action="churn-unsnooze" data-id="${idAttr}">Unsnooze</button>
      </div>
    </div>`;
  };

  const bodyParts = [];
  if (eligibleNow.length) {
    bodyParts.push(`<div class="churn-group-label">Eligible now</div>`);
    bodyParts.push(eligibleNow.map(r => row(r, true)).join(''));
  }
  if (upcoming.length) {
    bodyParts.push(`<div class="churn-group-label">Upcoming (next ${CHURN_HORIZON_DAYS} days)</div>`);
    bodyParts.push(upcoming.map(r => row(r, false)).join(''));
  }
  // Snoozed reveal — a muted toggle + a hidden block of snoozed rows. Present
  // only when at least one offer is snoozed.
  if (snoozed.length) {
    const n = snoozed.length;
    bodyParts.push(`<div class="churn-snoozed-reveal-wrap">
      <button type="button" class="btn btn-ghost btn-xs churn-snoozed-toggle" data-action="churn-reveal-toggle" aria-expanded="false" aria-controls="churn-snoozed-list">${n} snoozed — show</button>
      <div class="churn-snoozed-list" id="churn-snoozed-list" hidden>${snoozed.map(snoozedRow).join('')}</div>
    </div>`);
  }
  // Guaranteed non-empty: the section returns early above unless at least one
  // bucket has an entry or an offer is snoozed.
  const body = bodyParts.join('');

  return `
    <section class="card churn-section">
      <div class="section-header">
        <div>
          <h2>Upcoming churn dates</h2>
          <p>Offers you can earn again once their cooling-off period passes.</p>
        </div>
      </div>
      <div class="churn-list">${body}</div>
    </section>
  `;
}

function statCard(label, value, meta = '', variant = '', action = null) {
  // When `action` is provided, the card becomes a clickable navigation
  // surface. data-action routes through onClick(); role/tabindex make it
  // keyboard-accessible. CSS in `.stat-card[data-action]` adds the
  // pointer + hover-lift affordance.
  const navAttrs = action
    ? `data-action="${action}" role="button" tabindex="0"`
    : '';
  return `
    <div class="stat-card" ${navAttrs}>
      <div class="stat-label">${label}</div>
      <div class="stat-value ${variant}">${value}</div>
      ${meta ? `<div class="stat-meta">${meta}</div>` : ''}
    </div>
  `;
}

/* ============================================================
   REMINDER / ACTION ITEM MODEL — ONE SHARED BUILDER
   ============================================================
   buildReminderItems(state) is the SINGLE source of every actionable
   date in the planner. All three surfaces consume its output so they can
   never diverge again (step-3 P1; step-6 feed-contract v2):
     • computeReminderFeed     — schema-2 machine feed (Gist → iOS Shortcut
                                 / ICS worker); emits ALL future items, no
                                 horizon; adds tombstones + manifestVersion.
     • computeUpcomingActions  — the overview "Upcoming actions" LIST; keeps
                                 its 90-day horizon filter (by design).
     • computeActionsRequired  — the at-a-glance headline COUNT; counts WORK
                                 items only, from today forward (no UPPER
                                 horizon, but past-due items drop).
   RECONCILIATION INVARIANT (see computeActionsRequired / computeUpcomingActions):
   count = the WORK items from this builder (isWork===true) due today or later
   (no upper horizon); the LIST = every builder item within [today, today+90].
   Both derive from the same items[] and both drop past-due dates, so the
   headline count and the visible list agree by construction — a committed
   offer past its funding date reads count 0 / list 0, never count 1 / list 0.

   Each built item carries BOTH the feed fields and the list fields:
     id         — stable across syncs (offer/commitment/event id + kind);
                  per-DD items use a persisted per-DD id, never array index.
     kind       — feed semantic tag (offer-expires | deposit-deadline |
                  dd-initiate | dd-window-end | debit-deadline | withdrawal |
                  commitment-end | inflow | outflow).
     dueDate    — ISO YYYY-MM-DD (feed stamps 09:00 local on emit).
     title,notes— Reminder title/body (planner-owned; the consumer must not
                  overwrite a user's added notes — see the build guide).
     isWork     — true for to-dos the user must perform (deposit/DD/debit);
                  false for informational dates (expiry, withdrawal, events).
     listLabel/tag/name/sub/color/targetKind/targetId — LIST-row fields.

   GATE RULES (step-6 [3], step-3 P1) — keyed on the MODERN status fields
   (accountStatus / subStatus), NOT the legacy deriveLegacyStatus shadow
   (the legacy 'approved→funded' mapping used to hide funding deadlines the
   moment an account opened). offer-expires shows for prospects too (owner
   wants prospect expiries visible); WORK items (deposit/dd/debit) emit only
   when the offer is committed (subStatus approved or on-track) — met-waiting
   is excluded because the work is already done. The legacy-status shadow is
   NOT read here at all (it stays elsewhere per R38; deriveLegacyStatus is
   untouched).
*/
// subStatus values for which the account is committed and requirement WORK
// (deposit / DD initiations / debit purchases) is still outstanding.
const WORK_ITEM_SUB_STATUSES = new Set(['approved', 'on-track']);

// The "all DDs by" window-end date for a DD-family offer, where derivable.
// Frequency mode ("N DDs, one every <period>") → signup + periods×period.
// Count mode → the latest planned DD effective (posting) date. Returns an
// ISO string or '' when it can't be derived. Distinct from any single
// dd-initiate date (it's the deadline the whole set must be complete by).
function ddWindowEndDate(offer) {
  if (offer.offerType !== 'direct-deposit' && offer.offerType !== 'held-and-dd') return '';
  const req = offer.ddRequirement;
  if (req && req.mode === 'frequency') {
    const start = parseDate(offer.plannedSignupDate);
    const periods = Math.max(1, Number(req.freqPeriods) || 1);
    if (!start) return '';
    const d = new Date(start);
    if (req.freqEvery === 'week') d.setDate(d.getDate() + periods * 7);
    else if (req.freqEvery === '2weeks') d.setDate(d.getDate() + periods * 14); // UI's biweekly option
    else if (req.freqEvery === 'day') d.setDate(d.getDate() + periods);
    else d.setMonth(d.getMonth() + periods); // 'month' default
    return isoDate(d);
  }
  // Count mode: the last DD must have POSTED — use the max effective date.
  const effs = (offer.directDeposits || [])
    .map(dd => directDepositEffectiveDate(dd))
    .filter(Boolean)
    .sort();
  return effs.length ? effs[effs.length - 1] : '';
}

// THE ONE SHARED ITEM BUILDER. Pure (no state mutation) so the render-time
// list/count callers can invoke it freely; the feed layers tombstones and
// manifestVersion on top.
function buildReminderItems(state) {
  const items = [];
  const nm = (o) => `${o.bankName}${o.offerName ? ' — ' + o.offerName : ''}`;

  for (const o of state.offers || []) {
    if (!o.id) continue;
    // Terminal offers (marked done or dropped, incl. closed-and-done which
    // deriveLegacyStatus maps to 'completed') are out of every surface.
    if (o.status === 'completed' || o.status === 'skipped') continue;
    const name = nm(o);
    const color = offerColorHex(o);
    // Committed = account is being pursued and requirement WORK is still
    // open (approved/on-track). Keyed on the MODERN field, never the legacy
    // shadow. capitalLive additionally includes met-waiting: requirements
    // are done but funds are still locked, so the withdrawal/release date is
    // still worth surfacing (matches the pre-v2 legacy 'funded' behavior for
    // that informational item without re-reading the legacy shadow).
    const committed = WORK_ITEM_SUB_STATUSES.has(o.subStatus);
    const capitalLive = WORKING_SUB_STATUSES.has(o.subStatus);

    // offer-expires — informational and INTENTIONALLY NOT gated on
    // offerIsActiveForProjection: the owner wants a prospect's expiry visible
    // even when it's excluded from the capital scenario (his live BMO offer is
    // prospect + includeInScenario:false and would otherwise vanish). Scenario
    // inclusion governs capital modeling, not expiry visibility. Shows for any
    // non-terminal offer (terminal already skipped above) that isn't confirmed/
    // applied (once confirmed the deadline no longer matters). Work items and
    // withdrawal below keep the stricter committed/capital-live gates.
    if (o.offerExpirationDate && !CONFIRMED_OFFER_STATUSES.has(o.status)) {
      const due = o.offerExpirationDate.slice(0, 10);
      if (/^\d{4}-\d{2}-\d{2}$/.test(due)) items.push({
        id: `yv-offer-${o.id}-expires`,
        ownerId: o.id, kind: 'offer-expires', dueDate: due, isWork: false,
        title: `${name} — offer expires`,
        notes: `Bonus ${formatCompactCurrency(o.signupBonusAmount)}; required funding ${formatCompactCurrency(o.requiredFundingAmount)}.`,
        listLabel: 'Offer expires', tag: 'warn', name,
        sub: `${formatCompactCurrency(o.signupBonusAmount)} bonus`,
        color, targetKind: 'offer', targetId: o.id
      });
    }

    // deposit-deadline (WORK) — the lump-sum funding a committed offer still
    // owes. Emits ONLY for committed offers (approved/on-track); prospects
    // and met-waiting do not. This is the step-3 P1 gate fix: keyed on the
    // modern field so it stays visible exactly when the account is open and
    // funding is pending (the legacy status hid it as 'funded'). Restricted to
    // the fund-a-lump types: only a STANDARD direct-deposit offer has NO lump
    // sum — its money movement IS the DDs, already covered by dd-initiate +
    // dd-window-end — so a "fund $X" item there is spurious. Everything else
    // (new-funds-held, held-and-dd, and legacy offers whose offerType is
    // absent/'other' — which the app defaults to new-funds-held) funds a lump,
    // so gate on "not standard direct-deposit" rather than an allow-list that
    // would wrongly drop the undefined-offerType legacy/seed case.
    const fundsLump = o.offerType !== 'direct-deposit';
    const dd = fundsLump ? depositDeadline(o) : null;
    if (dd && committed) {
      const due = dd.slice(0, 10);
      if (/^\d{4}-\d{2}-\d{2}$/.test(due)) items.push({
        id: `yv-offer-${o.id}-deposit`,
        ownerId: o.id, kind: 'deposit-deadline', dueDate: due, isWork: true,
        title: `${name} — fund ${formatCompactCurrency(o.requiredFundingAmount)}`,
        notes: `Deposit by this date to qualify for the ${formatCompactCurrency(o.signupBonusAmount)} bonus.`,
        listLabel: 'Deposit deadline', tag: 'danger', name,
        sub: `Fund ${formatCompactCurrency(o.requiredFundingAmount)}`,
        color, targetKind: 'offer', targetId: o.id
      });
    }

    // dd-initiate (WORK) — one per planned DD with a future plannedDate.
    // Uses the persisted per-DD id (dd.id) minted at DD-row creation so
    // completion state stays glued to the right DD across insert/reorder.
    if (committed && (o.offerType === 'direct-deposit' || o.offerType === 'held-and-dd')) {
      for (const dep of (o.directDeposits || [])) {
        if (!dep || !dep.id || !dep.plannedDate) continue;
        const due = String(dep.plannedDate).slice(0, 10);
        if (!/^\d{4}-\d{2}-\d{2}$/.test(due)) continue;
        items.push({
          id: `yv-${o.id}-dd-${dep.id}`,
          ownerId: o.id, kind: 'dd-initiate', dueDate: due, isWork: true,
          title: `${name} — initiate DD ${formatCompactCurrency(dep.amount)}`,
          notes: `Start this direct deposit so it posts in time for the ${formatCompactCurrency(o.signupBonusAmount)} bonus.`,
          listLabel: 'Initiate DD', tag: 'danger', name,
          sub: `Initiate ${formatCompactCurrency(dep.amount)}`,
          color, targetKind: 'offer', targetId: o.id
        });
      }
      // dd-window-end — informational: the date all required DDs must be
      // done by (where derivable). Not a separate to-do beyond the DDs
      // themselves, so isWork:false.
      const winEnd = ddWindowEndDate(o);
      if (winEnd) {
        const due = winEnd.slice(0, 10);
        if (/^\d{4}-\d{2}-\d{2}$/.test(due)) items.push({
          id: `yv-offer-${o.id}-dd-window`,
          ownerId: o.id, kind: 'dd-window-end', dueDate: due, isWork: false,
          title: `${name} — all DDs complete by`,
          notes: `All qualifying direct deposits must have posted by this date.`,
          listLabel: 'All DDs by', tag: 'warn', name,
          sub: 'All DDs complete', color, targetKind: 'offer', targetId: o.id
        });
      }
    }

    // debit-deadline (WORK) — qualifying debit-card purchases by a date.
    // Counts as debitRequirement.count work items. The deadline is now
    // DERIVED from sign-up + debitRequirement.withinDays (debitDeadlineISO),
    // so it emits nothing until a sign-up date AND a day-count both exist.
    const debitDue = committed ? debitDeadlineISO(o) : '';
    if (debitDue) {
      const due = String(debitDue).slice(0, 10);
      if (/^\d{4}-\d{2}-\d{2}$/.test(due)) {
        const cnt = Number(o.debitRequirement.count) || 0;
        items.push({
          id: `yv-offer-${o.id}-debit`,
          ownerId: o.id, kind: 'debit-deadline', dueDate: due, isWork: true,
          workCount: cnt > 0 ? cnt : 1,
          title: `${name} — ${cnt || 1} debit purchase${cnt === 1 ? '' : 's'}`,
          notes: `Make the required qualifying debit-card purchase${cnt === 1 ? '' : 's'} by this date.`,
          listLabel: 'Debit purchases', tag: 'danger', name,
          sub: `${cnt || 1} debit txn${cnt === 1 ? '' : 's'}`,
          color, targetKind: 'offer', targetId: o.id
        });
      }
    }

    // requirement-deadline (WORK, step 3) — one per USER-added requirement row
    // with a computable deadline. NO-DUPLICATE RULE: source:'derived' rows
    // mirror legacy fields (funding/DD/debit) that the blocks above already
    // emit deposit-deadline / dd-initiate / debit-deadline items for, so
    // deriving feed items from them too would double-book the same obligation.
    // Only source:'user' rows (e-statements, promo code, extra spend, …) have
    // no legacy equivalent and are the sole new emitters. Done rows emit
    // nothing (the obligation is met). Same committed gate as the other work
    // items so a prospect's requirements don't surface before the account is
    // pursued. Id `yv-offer-<offerId>-req-<rowId>` uses the STABLE row id from
    // step 2 (never an array index) so it participates in the _feedEmitted/
    // _feedRemoved tombstone mechanism automatically via computeReminderFeed.
    if (committed && Array.isArray(o.requirements)) {
      for (const r of o.requirements) {
        if (!r || r.source !== 'user' || !r.id || r.done) continue;
        const dlISO = requirementDeadlineISO(o, r);
        if (!dlISO) continue;
        const due = dlISO.slice(0, 10);
        if (!/^\d{4}-\d{2}-\d{2}$/.test(due)) continue;
        const label = requirementDisplayLabel(r);
        const summary = requirementSummary(r);
        items.push({
          id: `yv-offer-${o.id}-req-${r.id}`,
          ownerId: o.id, kind: 'requirement-deadline', dueDate: due, isWork: true,
          title: `${name} — ${label}`,
          notes: summary ? `${summary}. Complete by this date to qualify for the ${formatCompactCurrency(o.signupBonusAmount)} bonus.`
                         : `Complete by this date to qualify for the ${formatCompactCurrency(o.signupBonusAmount)} bonus.`,
          listLabel: label, tag: 'danger', name,
          sub: summary || label, color, targetKind: 'offer', targetId: o.id
        });
      }
    }

    // withdrawal / lock-release — informational: funds free up. Keyed on the
    // modern field: any offer whose capital is still live (approved/on-track/
    // met-waiting) and whose hold has a computable release date (prospects
    // have no live account to release from).
    const we = withdrawalEligibleDate(o);
    if (we && capitalLive) {
      const due = we.slice(0, 10);
      if (/^\d{4}-\d{2}-\d{2}$/.test(due)) items.push({
        id: `yv-offer-${o.id}-withdraw`,
        ownerId: o.id, kind: 'withdrawal', dueDate: due, isWork: false,
        title: `${name} — withdraw ${formatCompactCurrency(o.requiredFundingAmount)}`,
        notes: `Funds released; bonus ${formatCompactCurrency(o.signupBonusAmount)}.`,
        listLabel: 'Withdrawal', tag: 'success', name,
        sub: `Release ${formatCompactCurrency(o.requiredFundingAmount)}`,
        color, targetKind: 'offer', targetId: o.id
      });
    }

    // expected-bonus-window (F3, informational) — the window in which the
    // sign-up bonus should post, once requirements are met. Emitted ONLY in
    // met-waiting (the "requirements done, watching for the deposit" state);
    // dueDate = window END so a consumer's reminder fires if it hasn't posted
    // by the late edge. lifecycleStage=='waiting' iff subStatus=='met-waiting'.
    if (lifecycleStage(o) === 'waiting') {
      const win = expectedBonusWindow(o);
      if (win && win.endISO) {
        const due = win.endISO.slice(0, 10);
        if (/^\d{4}-\d{2}-\d{2}$/.test(due)) items.push({
          id: `yv-offer-${o.id}-bonuswindow`,
          ownerId: o.id, kind: 'expected-bonus-window', dueDate: due, isWork: false,
          title: `${name} — bonus expected by`,
          notes: `Window ${formatDateDisplay(win.startISO)} – ${formatDateDisplay(win.endISO)}`,
          listLabel: 'Bonus expected', tag: 'success', name,
          sub: `${formatCompactCurrency(o.signupBonusAmount)} bonus`,
          color, targetKind: 'offer', targetId: o.id
        });
      }
    }

    // safe-to-close (F3, informational) — the date after which closing the
    // account is safe (funds released, bonus posted/expected, ETF + deadlines
    // cleared). Emitted when computable AND the account is still open AND the
    // offer is at or past requirements-met (earned or met-waiting) — before
    // that, closing isn't yet on the table. earned+open → legacy 'funded'
    // (survives the terminal skip at loop top); earned+closed is already
    // terminal and excluded.
    if (o.accountStatus === 'open' && (o.subStatus === 'earned' || o.subStatus === 'met-waiting')) {
      const stc = safeToCloseDate(o);
      if (stc) {
        const due = stc.slice(0, 10);
        if (/^\d{4}-\d{2}-\d{2}$/.test(due)) items.push({
          id: `yv-offer-${o.id}-safeclose`,
          ownerId: o.id, kind: 'safe-to-close', dueDate: due, isWork: false,
          title: `${name} — safe to close`,
          notes: `Account can be closed on/after this date (funds released and bonus posted).`,
          listLabel: 'Safe to close', tag: 'success', name,
          sub: 'Close account', color, targetKind: 'offer', targetId: o.id
        });
      }
    }
  }

  // churn-eligible (F6, informational) — the date a churnable offer can be
  // re-run. Its OWN loop over ALL offers (not the committed-offer loop above)
  // BECAUSE the natural churn case is an account you already closed: that offer
  // is terminal (deriveLegacyStatus → 'completed') and the loop above skips it,
  // yet its re-eligibility is exactly what you want reminded of. Emit only when
  // churnable===true AND churnEligibleDate is computable AND that date is within
  // CHURN_FEED_LOOKAHEAD_DAYS ahead OR at most CHURN_FEED_PAST_GRACE_DAYS behind
  // (so a freshly-eligible offer surfaces, but ancient history isn't resurrected).
  // Binds to the STABLE offer id so the tombstone mechanism retires it when the
  // conditions lapse (churnable unset, anchor cleared, or the window passes).
  for (const o of state.offers || []) {
    if (!o.id) continue;
    if (o.churnable !== true) continue;
    if (churnSnoozeActive(o)) continue;   // suppressed while snoozed — a lapsed
                                          // timed snooze re-emits naturally; the
                                          // disappear/reappear rides the existing
                                          // _feedEmitted/_feedRemoved tombstones.
    const elig = churnEligibleDate(o);
    if (!elig) continue;
    const daysOut = daysBetween(TODAY, parseDate(elig));
    if (daysOut > CHURN_FEED_LOOKAHEAD_DAYS || daysOut < -CHURN_FEED_PAST_GRACE_DAYS) continue;
    const due = elig.slice(0, 10);
    if (!/^\d{4}-\d{2}-\d{2}$/.test(due)) continue;
    const name = nm(o);
    const anchorLabel = CHURN_ANCHOR_LABELS[o.churn_anchor] || CHURN_ANCHOR_LABELS.bonus_received;
    const months = Number(o.churn_wait_months);
    const waitTxt = Number.isFinite(months) && months > 0 ? `${months}-month wait` : 'wait';
    items.push({
      id: `yv-offer-${o.id}-churn`,
      ownerId: o.id, kind: 'churn-eligible', dueDate: due, isWork: false,
      title: `${name} — churn eligible`,
      notes: `${waitTxt} from ${anchorLabel}; can be earned again on/after this date.`,
      listLabel: 'Churn eligible', tag: 'success', name,
      sub: 'Re-run offer', color: offerColorHex(o), targetKind: 'offer', targetId: o.id
    });
  }

  for (const c of state.commitments || []) {
    if (!c.id) continue;
    if (c.status === 'cancelled' || c.status === 'completed') continue;
    if (!c.endDate) continue;
    const due = String(c.endDate).slice(0, 10);
    if (!/^\d{4}-\d{2}-\d{2}$/.test(due)) continue;
    items.push({
      id: `yv-cmt-${c.id}-end`,
      ownerId: c.id, kind: 'commitment-end', dueDate: due, isWork: false,
      title: `${c.commitmentName} — release`,
      notes: `${formatCurrency(c.amount)} (${c.type}).`,
      listLabel: 'Commitment release', tag: 'success', name: c.commitmentName,
      sub: formatCompactCurrency(c.amount), color: '', targetKind: 'commitment', targetId: c.id
    });
  }

  // inflow / outflow events — informational. Respect BOTH flags exactly as
  // the list historically did (includeInProjection AND showInUpcoming), and
  // surface only the NEXT instance of a recurring event (from today), so the
  // feed and the list agree on which occurrence they mean. A generous
  // look-ahead finds the next instance even for a distant recurrence; the
  // list re-applies its own 90-day cutoff on the resulting date.
  const FEED_EVENT_HORIZON = addDays(TODAY, 366 * 5);
  for (const e of state.events || []) {
    if (!e.id) continue;
    if (!e.includeInProjection) continue;
    if (e.showInUpcoming === false) continue;
    const next = nextEventInstance(e, TODAY, FEED_EVENT_HORIZON);
    if (!next) continue;
    const amt = Number(next.amount);
    const isRecurring = e.recurrence && e.recurrence.kind && e.recurrence.kind !== 'none';
    const label = e.eventName + (isRecurring ? ` (${e.recurrence.kind === 'custom' ? `every ${e.recurrence.everyDays || 7}d` : e.recurrence.kind})` : '');
    items.push({
      id: `yv-evt-${e.id}`,
      ownerId: e.id, kind: amt >= 0 ? 'inflow' : 'outflow',
      dueDate: isoDate(next.date), isWork: false,
      title: e.eventName,
      notes: `${formatCurrency(amt)}${e.category ? ' (' + e.category + ')' : ''}.`,
      listLabel: amt >= 0 ? 'Inflow' : 'Outflow', tag: amt >= 0 ? 'success' : '',
      name: label, sub: formatCurrency(amt), color: '', targetKind: 'event', targetId: e.id
    });
  }

  items.sort((a, b) => a.dueDate.localeCompare(b.dueDate));
  return items;
}

/* Reminder feed (contract v2): a stable, machine-readable snapshot emitted
   into App.state._feed on every push so the same JSON the cloud Sync writes
   to the Gist also carries the feed. A consumer (iOS Shortcut / ICS worker)
   reads it and merges into its surface — preserving user-added notes/alarms/
   completion via per-item stable `id`s.

   Contract v2 (see docs/assessments/2026-07-05/step6-reminders-redesign.md):
     schema:2, generatedAt, manifestVersion (monotonic; survives restore-
     from-history via a max(prev+1, minutes-since-epoch) clock component),
     feedStatus ('ok'|'stale'|'error'), lastGoodGeneratedAt,
     items:[{id,kind,title,dueDate,notes}], removed:[{id,tombstonedAt,reason}].
   `risk` is intentionally OMITTED (computed risk is a later phase; the guide
   treats it as optional). Tombstones: when an offer/commitment is deleted or
   a previously-emitted id permanently disappears, its id moves to removed[]
   (retained a fixed 90 days for now; ack-based retention arrives with
   consumer heartbeats later). Previously-emitted ids live in state._feedEmitted
   so a disappearance can be detected on the next compute.

   ITEM KINDS (additive — the ENVELOPE shape above is frozen; only the set of
   `kind` values grows, which the iOS Shortcut tolerates because it matches
   reminders by the id/URL, not by kind): offer-expires, deposit-deadline,
   dd-initiate, dd-window-end, debit-deadline, withdrawal, commitment-end,
   inflow, outflow, and (step 3) `requirement-deadline` — one per USER-added
   requirement row (source:'user') with a computable deadline on a committed
   offer, id `yv-offer-<offerId>-req-<rowId>` off the row's STABLE id. Derived
   requirement rows (source:'derived') deliberately emit NOTHING: they mirror
   the legacy funding/DD/debit fields the deposit-deadline / dd-initiate /
   debit-deadline items already cover, so emitting from them too would
   double-book. Done rows emit nothing (obligation met).

   (step 4, lifecycle — both informational, isWork:false):
     • `expected-bonus-window` (id `yv-offer-<offerId>-bonuswindow`) — the
       expected bonus-posting window. dueDate = window END; notes =
       "Window <start> – <end>". Emitted ONLY while subStatus=='met-waiting'
       (requirements met, watching for the deposit).
     • `safe-to-close` (id `yv-offer-<offerId>-safeclose`) — the date after
       which closing the account is safe. dueDate = safeToCloseDate(). Emitted
       only when that date is computable AND accountStatus=='open' AND subStatus
       in {earned, met-waiting}. Both bind to the STABLE offer id, so they
       participate in the _feedEmitted/_feedRemoved tombstone mechanism (a
       status change out of the emitting state tombstones them automatically).

   (step 5, churnability — informational, isWork:false):
     • `churn-eligible` (id `yv-offer-<offerId>-churn`) — the date a churnable
       offer can be re-run. dueDate = churnEligibleDate() (anchor per
       churn_anchor + churn_wait_months, calendar-month clamped). Emitted from
       its OWN loop over ALL offers (NOT the committed-offer loop) so a
       closed-and-done offer — the typical churn case, terminal per
       deriveLegacyStatus — still surfaces its re-eligibility. Gated to
       churnable===true AND computable AND the eligible date within
       CHURN_FEED_LOOKAHEAD_DAYS (60) ahead OR at most
       CHURN_FEED_PAST_GRACE_DAYS (180) behind (past-
       but-recent stays actionable; ancient history isn't resurrected).
       SUPPRESSED while the offer's churn is snoozed (churn_snoozed_until is
       'forever' or a future ISO — churnSnoozeActive()); a lapsed timed snooze
       re-emits naturally. Binds to the STABLE offer id, so unsetting churnable /
       clearing the anchor / snoozing / the window passing tombstones it
       automatically.

   NOTE: this function MUTATES state (manifestVersion, _feedEmitted,
   _feedRemoved) — call it only on the push/persist path (Sync.push /
   createGist / safeSync), never from a render loop. The item universe comes
   from the shared buildReminderItems() so the feed can never drift from the
   in-app list/count. */
const FEED_TOMBSTONE_TTL_MS = 90 * 24 * 60 * 60 * 1000; // fixed 90-day retention
// Session high-water mark for manifestVersion (see computeReminderFeed). Seeded
// from the loaded state on init so it survives a reload; can only ever rise.
let _manifestHwm = 0;
function computeReminderFeed(state) {
  const built = buildReminderItems(state);
  const generatedAt = new Date().toISOString();
  const stampTime = (d) => d.slice(0, 10) + 'T09:00:00';

  // Monotonic manifestVersion. Three terms guarantee it only ever grows:
  //   • minutes-since-epoch — advances across sessions/devices (a device
  //     that hasn't pushed in a while still lands a higher number).
  //   • prev + 1 — climbs on rapid same-minute pushes.
  //   • session high-water mark + 1 — the RESTORE guard. restoreState()
  //     swaps in an OLD snapshot whose _manifestVersion is small; without
  //     this a same-minute restore could regress below a number already
  //     shipped this session. The HWM (module-scoped, seeded from the loaded
  //     state on init) can never be lowered by a restored snapshot, so a
  //     restore-from-history still produces a strictly-higher version.
  const minutesEpoch = Math.floor(Date.now() / 60000);
  const prevVersion = Number(state._manifestVersion) || 0;
  const manifestVersion = Math.max(prevVersion + 1, minutesEpoch, _manifestHwm + 1);
  _manifestHwm = manifestVersion;
  state._manifestVersion = manifestVersion;

  // Tombstones. Diff the ids we emit now against the ids we emitted last
  // time (state._feedEmitted). Any id that was live and is now gone gets a
  // tombstone, reason inferred from whether its owning record still exists.
  const liveIds = new Set(built.map(it => it.id));
  const offerIds = new Set((state.offers || []).map(o => o.id));
  const cmtIds = new Set((state.commitments || []).map(c => c.id));
  const evtIds = new Set((state.events || []).map(e => e.id));
  const prevEmitted = (state._feedEmitted && typeof state._feedEmitted === 'object') ? state._feedEmitted : {};

  let removed = Array.isArray(state._feedRemoved) ? state._feedRemoved.slice() : [];
  const alreadyTombstoned = new Set(removed.map(r => r.id));
  // A tombstoned id that RE-appears (offer un-deleted / status flips back) is
  // resurrected — drop its tombstone so the consumer stops deleting it.
  removed = removed.filter(r => !liveIds.has(r.id));
  const reasonFor = (id, ownerId) => {
    // ownerId was recorded when the id was last emitted; if that record is
    // gone the item was deleted, otherwise it was superseded by a status/
    // date change that made the item no longer apply.
    if (ownerId && !offerIds.has(ownerId) && !cmtIds.has(ownerId) && !evtIds.has(ownerId)) {
      if (id.startsWith('yv-cmt-')) return 'commitment-deleted';
      if (id.startsWith('yv-evt-')) return 'event-deleted';
      return 'offer-deleted';
    }
    return 'superseded';
  };
  for (const id in prevEmitted) {
    if (liveIds.has(id)) continue;
    if (alreadyTombstoned.has(id)) continue;
    removed.push({ id, tombstonedAt: generatedAt, reason: reasonFor(id, prevEmitted[id]) });
  }
  // Retain tombstones for a fixed 90-day TTL (ack-based retention is a later
  // phase once consumer heartbeats exist).
  const cutoff = Date.now() - FEED_TOMBSTONE_TTL_MS;
  removed = removed.filter(r => {
    const t = Date.parse(r.tombstonedAt);
    return !Number.isFinite(t) || t >= cutoff;
  });
  state._feedRemoved = removed;

  // Record what we emitted this round (id → ownerId) for the next diff.
  const emittedNow = {};
  for (const it of built) emittedNow[it.id] = it.ownerId || '';
  state._feedEmitted = emittedNow;

  const lastGoodGeneratedAt = generatedAt; // this compute succeeded
  return {
    schema: 2,
    generatedAt,
    manifestVersion,
    feedStatus: 'ok',
    lastGoodGeneratedAt,
    items: built.map(it => ({
      id: it.id,
      kind: it.kind,
      title: it.title,
      dueDate: stampTime(it.dueDate),
      notes: it.notes
    })),
    removed
  };
}

// Compute the feed for the push/persist path, but never ship absent or
// silently-stale on failure. On a throw: log via ErrCode.RENDER (no more
// silent try{}catch{}), and REUSE the last good feed marked feedStatus
// 'stale' so a consumer can tell the producer is degraded rather than act
// on nothing. If there is no last-good feed to reuse, return a minimal
// feedStatus:'error' envelope. Returns the feed to store in state._feed.
function computeFeedSafely(state) {
  try {
    return computeReminderFeed(state);
  } catch (e) {
    logError(ErrCode.RENDER, e, 'reminder-feed');
    const lastGood = state && state._feed;
    if (lastGood && lastGood.items) {
      return { ...lastGood, feedStatus: 'stale', generatedAt: new Date().toISOString() };
    }
    return {
      schema: 2,
      generatedAt: new Date().toISOString(),
      manifestVersion: Number(state && state._manifestVersion) || 0,
      feedStatus: 'error',
      lastGoodGeneratedAt: (lastGood && lastGood.lastGoodGeneratedAt) || null,
      items: [],
      removed: (state && Array.isArray(state._feedRemoved)) ? state._feedRemoved : []
    };
  }
}

// "Actions required": the headline count of discrete to-dos still owed on
// committed offers. Counts the WORK items from the shared builder (deposit,
// each future DD initiation, debit purchases) that are still ACTIONABLE
// (due today or later). No UPPER horizon — a work item past the list's 90-day
// window still counts — but a work item whose deadline has already PASSED is
// dropped, exactly as the list drops d < TODAY, so the headline count and the
// visible list can never disagree (a committed offer past its funding date
// must read count 0 / list 0, not count 1 / list 0). Prospects/applied
// contribute ZERO (owner decision, step-6 [4]); met-waiting/earned/closed
// offers have no outstanding work (excluded by the builder's committed gate).
function computeActionsRequired(state) {
  const todayISO = isoDate(TODAY);
  let n = 0;
  for (const it of buildReminderItems(state)) {
    if (!it.isWork) continue;
    // Past-due work items drop from the count just as they drop from the list
    // (string compare is safe on canonical YYYY-MM-DD).
    if (it.dueDate < todayISO) continue;
    // debit-deadline is one dated item standing in for N purchases.
    n += Number(it.workCount) || 1;
  }
  return n;
}

// The overview "Upcoming actions" LIST: every builder item within the
// 90-day horizon (the horizon filter is by design — the FEED keeps the full
// future). Reconciles with computeActionsRequired by construction: same
// items[], count = the isWork subset regardless of horizon, list = all
// within horizon.
function computeUpcomingActions(state, limit = 12) {
  const horizonEnd = addDays(TODAY, 90);
  const items = [];
  for (const it of buildReminderItems(state)) {
    const d = parseDate(it.dueDate);
    if (!d || d < TODAY || d > horizonEnd) continue;
    items.push({
      date: d,
      kind: it.listLabel,
      name: it.name,
      sub: it.sub,
      tag: it.tag,
      color: it.color,
      targetKind: it.targetKind,
      targetId: it.targetId
    });
  }
  // Builder already sorts by dueDate; keep a stable date sort for the Date
  // objects (identical ordering) and page.
  items.sort((a, b) => a.date - b.date);
  return items.slice(0, limit);
}

/* Targeted update for the Upcoming-Actions pager. A full render() would
   rebuild every section on the overview page, which (a) burns work and
   (b) reflows enough surrounding DOM that the document's scroll position
   gets nudged upward when the new page has fewer rows. Swapping just the
   action-list innerHTML keeps the section height pinned (min-height in CSS)
   and the page stays exactly where the user left it. */
function updateUpcomingPage(nextPage) {
  const ACTIONS_PER_PAGE = 6;
  const all = computeUpcomingActions(App.state, 200);
  const pageCount = Math.max(1, Math.ceil(all.length / ACTIONS_PER_PAGE));
  const clamped = Math.max(0, Math.min(pageCount - 1, nextPage));
  if (clamped === App._upcomingPage) return;
  App._upcomingPage = clamped;
  const slice = all.slice(clamped * ACTIONS_PER_PAGE, (clamped + 1) * ACTIONS_PER_PAGE);
  const list = document.querySelector('.action-list');
  if (list) {
    list.innerHTML = slice.map(renderActionRow).join('');
    // Re-trigger the fade-in animation for the new page
    list.classList.remove('upcoming-fade');
    void list.offsetWidth; // force reflow so the animation restarts
    list.classList.add('upcoming-fade');
    list.setAttribute('key', clamped);
  }
  // Update pager controls in place
  const pager = document.querySelector('.upcoming-pager');
  if (pager) {
    const prev = pager.querySelector('[data-action="upcoming-prev"]');
    const next = pager.querySelector('[data-action="upcoming-next"]');
    const label = pager.querySelector('.upcoming-pg-label');
    if (prev) prev.toggleAttribute('disabled', clamped === 0);
    if (next) next.toggleAttribute('disabled', clamped === pageCount - 1);
    if (label) label.textContent = `${clamped + 1} / ${pageCount}`;
  }
}

function renderActionRow(item) {
  const month = item.date.toLocaleDateString('en-US', { month: 'short' }).toUpperCase();
  const day = item.date.getDate();
  return `
    <div class="action-row${item.color ? ' has-color' : ''}${item.targetKind ? ' clickable' : ''}"${item.color ? ` style="--offer-color:${item.color};"` : ''}${item.targetKind ? ` data-action="open-action-target" data-target-kind="${item.targetKind}" data-target-id="${escapeAttr(item.targetId)}" role="button" tabindex="0"` : ''}>
      <div class="action-day">
        <span class="month">${month}</span>
        <span class="day">${day}</span>
      </div>
      <div class="action-body">
        <div class="action-title">${escapeHtml(item.name)}</div>
        <div class="action-sub">${escapeHtml(item.sub)} · ${relativeDays(item.date)}</div>
      </div>
      <span class="action-tag ${item.tag || ''}">${escapeHtml(item.kind)}</span>
    </div>
  `;
}

/* ============================================================
   PLANNER VIEW
   ============================================================ */
function renderPlanner() {
  const offers = App.state.offers
    .filter(o => o.status !== 'completed' && o.status !== 'skipped')
    .slice()
    .sort((a, b) => {
      const ar = annualizedReturn(a) ?? 0;
      const br = annualizedReturn(b) ?? 0;
      return br - ar;
    });

  const proj = generateProjection(App.state);
  const summary = summarizeProjection(proj, App.state.settings);
  const includedCount = offers.filter(o => offerIsActiveForProjection(o)).length;
  const includedBonus = offers.filter(o => offerIsActiveForProjection(o)).reduce((s, o) => s + (o.signupBonusAmount || 0), 0);

  const candidates = offers.filter(o => HYPOTHETICAL_OFFER_STATUSES.has(o.status) && isOfferComplete(o));

  const optResult = App.optimizer.results;

  return `
    <div class="section-header">
      <div>
        <h2>Planner</h2>
        <p>Toggle offers in or out and see your cash projection update live.</p>
      </div>
      <div style="display:flex;gap:var(--space-2);">
        <button class="btn btn-secondary planner-add-btn" data-action="add-offer">+ Add offer</button>
      </div>
    </div>

    <div class="optimizer-bar">
      <div class="optimizer-summary">
        <div class="metric">
          <span class="label">Selected</span>
          <span class="value">${includedCount} <span style="font-size:13px;color:var(--text-tertiary);font-weight:500;">of ${offers.length}</span></span>
        </div>
        <div class="metric">
          <span class="label">Expected bonus</span>
          <span class="value" style="color:var(--success);">${formatCurrency(includedBonus)}</span>
        </div>
        <div class="metric">
          <span class="label">Lowest projected</span>
          <span class="value" style="${summary.shortfallDays > 0 ? 'color:var(--danger);' : (summary.belowBufferDays > 0 ? 'color:#c88b2c;' : 'color:#0ea968;')}">${summary.lowest ? formatCompactCurrency(summary.lowest.availableCapital) : '—'}</span>
        </div>
        <div class="metric">
          <span class="label">Candidates for optimizer</span>
          <span class="value">${candidates.length}</span>
        </div>
      </div>
      <div style="display:flex;gap:var(--space-2);align-items:center;flex-wrap:wrap;">
        <button class="btn btn-primary" data-action="run-optimizer">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg>
          Find feasible combinations
        </button>
        ${optResult ? `<button class="btn btn-ghost btn-sm" data-action="clear-optimizer">Clear results</button>` : ''}
      </div>
    </div>

    ${optResult ? renderOptimizerResults(optResult) : ''}

    ${offers.length === 0
      ? renderEmptyState('No offers yet', 'Add a bonus to start planning. We will compute the funding/withdrawal dates and tied-up cash for you.', 'add-offer', 'Add your first offer')
      : `<div class="planner-grid">${offers.map(renderOfferCard).join('')}</div>`
    }
  `;
}

function renderOptimizerResults(result) {
  if (result.tooMany) {
    return `
      <div class="banner warn">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="9"/><line x1="12" y1="8" x2="12" y2="13"/><line x1="12" y1="17" x2="12" y2="17.01"/></svg>
        <div>
          <strong>Too many candidates for brute force:</strong> ${result.candidateCount} offers (limit ${result.max}). Mark some offers as "skipped" or convert them to commitments first, or raise the limit in Settings.
        </div>
      </div>
    `;
  }
  if (result.results.length === 0) {
    return `
      <div class="banner danger">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="9"/><line x1="12" y1="8" x2="12" y2="13"/><line x1="12" y1="17" x2="12" y2="17.01"/></svg>
        <div>
          <strong>No feasible combinations.</strong> Of ${result.evaluated} subsets evaluated, all ${result.infeasibleCount} would breach your buffer or go negative. Try raising your liquid capital, lowering your buffer floor, or removing high-capital offers.
        </div>
      </div>
    `;
  }
  // Compute which combo (if any) matches the user's current includeInScenario state.
  const currentMask = currentlyAppliedComboMask(result.candidates);
  return `
    <section class="card" style="margin-bottom:var(--space-5);">
      <div class="card-header">
        <h2>Top feasible combinations</h2>
        <span style="font-size:12px;color:var(--text-tertiary);">Evaluated ${result.evaluated.toLocaleString()} subsets · ${result.infeasibleCount} infeasible · click a combo to apply it</span>
      </div>
      <div class="combo-grid">
        ${result.results.map((r, i) => renderComboCard(r, i, result.candidates, currentMask)).join('')}
      </div>
      <p style="margin-top:var(--space-3);font-size:12px;color:var(--text-tertiary);">Only combinations that never dip below your buffer are shown. Ranking: highest total bonus → highest blended APY → highest lowest-available cash. <strong>Low cash</strong> is how thin you'd run at the worst point.</p>
    </section>
  `;
}

function currentlyAppliedComboMask(candidates) {
  let mask = 0;
  for (let i = 0; i < candidates.length; i++) {
    const o = App.state.offers.find(x => x.id === candidates[i].id);
    if (o && o.includeInScenario) mask |= (1 << i);
  }
  return mask;
}

function renderComboCard(r, rank, candidates, currentMask) {
  const offers = r.includedIds.map(id => candidates.find(o => o.id === id)).filter(Boolean);
  const isSelected = r.mask === currentMask;
  return `
    <div class="combo-card ${isSelected ? 'selected' : ''}" data-action="apply-combo" data-mask="${r.mask}" role="button" tabindex="0">
      <div class="combo-header">
        <div>
          <div class="combo-rank">#${rank + 1}${rank === 0 ? ' · <span class="recommended-tag">Recommended</span>' : ''}${isSelected ? ' · <span style="color:var(--accent);">Applied</span>' : ''}</div>
          <div class="combo-bonus">${formatCurrency(r.totalBonus)}</div>
        </div>
      </div>
      <div class="combo-meta">
        <span><strong>${formatCompactCurrency(r.totalRequired)}</strong> capital</span>
        <span><strong>${formatCompactCurrency(r.lowestAvailable)}</strong> low cash</span>
        ${r.blendedAnnReturn != null ? `<span><strong>${formatPercent(r.blendedAnnReturn)}</strong> APY blended</span>` : ''}
        ${r.belowBufferDays > 0 ? `<span style="color:#b45309;">${r.belowBufferDays}d below buffer</span>` : ''}
      </div>
      <div class="combo-offers">
        ${offers.map(o => `
          <div class="combo-offer">
            <span class="name">${escapeHtml(o.bankName)}${o.offerName ? ' · ' + escapeHtml(o.offerName) : ''}</span>
            <span class="amount">${formatCompactCurrency(o.signupBonusAmount)} / ${formatCompactCurrency(o.requiredFundingAmount)}</span>
          </div>
        `).join('')}
      </div>
    </div>
  `;
}

// DD-method datapoint panel for an offer card: top 3 source methods (by
// DoC datapoint count) that code as a DD at this offer's bank, with the
// user's own source banks flagged + fallback guidance.
function renderDdMethodPanel(o) {
  if (DDMethods.failed) return '';
  if (!DDMethods.loaded) return `<div class="ddm-panel ddm-loading">Loading DD-method datapoints…</div>`;
  const info = DDMethods.forOffer(o.bankName, App.state.settings.sourceBanks);
  if (!info || info.top3.length === 0) return `<div class="ddm-panel ddm-empty">No DD-method datapoints for ${escapeHtml(o.bankName || 'this bank')} in the DoC list.</div>`;
  // Each "method" is a deposit source (an account type like "Business
  // checking", or a named bank/service like "American Express") that DoC
  // users report posts as a direct deposit at THIS bank. The number is the
  // datapoint count backing it — rendered as a separate "N DP" badge so it
  // never reads as part of the method name ("Business checking 2").
  const rows = info.top3.map(w =>
    `<span class="ddm-pill ${w.mine ? 'mine' : ''}" title="${escapeAttr(w.method)} — ${w.dps} Doctor of Credit datapoint${w.dps === 1 ? '' : 's'} that it posts as a direct deposit here${w.note ? ' · ' + escapeAttr(w.note) : ''}${w.mine ? ' · one of your source banks' : ''}">${w.mine ? '★&nbsp;' : ''}<span class="ddm-method">${escapeHtml(w.method)}</span><span class="ddm-dp">${w.dps} DP</span></span>`
  ).join('');
  let foot = '';
  if (!info.anyMine) {
    foot = info.hasSourceBanks
      ? `<div class="ddm-foot">None of your source banks have datapoints.</div>`
      : `<div class="ddm-foot">Add your source banks in Settings to flag which of yours work.</div>`;
  } else if (!info.topHasMine && info.myBest) {
    foot = `<div class="ddm-foot">Your best option: <strong>★ ${escapeHtml(info.myBest.method)}</strong> (${info.myBest.dps} DP${info.myBest.dps === 1 ? '' : 's'})</div>`;
  }
  return `<div class="ddm-panel">
    <div class="ddm-inner">
      <div class="ddm-left">
        <div class="ddm-title" title="Deposit sources — account types (e.g. 'Business checking') or named banks/services — that Doctor of Credit users report will post as a direct deposit at this bank. 'N DP' is how many datapoints back each; more is stronger evidence.">Top DD methods</div>
      </div>
      <div class="ddm-list">${rows}</div>
    </div>
    ${foot}
  </div>`;
}

// {done, total} requirement counts for an offer — drives the card checklist
// header and the offers-table met/total chip.
function requirementChecklistCounts(o) {
  const reqs = Array.isArray(o.requirements) ? o.requirements : [];
  const total = reqs.length;
  const done = reqs.filter(r => r && r.done).length;
  return { done, total };
}

// Compact requirement checklist on the offer card (step 3). Each row shows a
// checkbox, its title, and the computed deadline date; tapping toggles `done`
// (strikethrough + check, sorts below pending). Pending rows first (soonest
// date first, undated last), then done rows. Renders nothing when the offer has
// no requirement rows.
function renderRequirementChecklist(o) {
  const reqs = Array.isArray(o.requirements) ? o.requirements : [];
  if (reqs.length === 0) return '';
  const rows = reqs.map(r => ({ row: r, dlISO: requirementDeadlineISO(o, r) }));
  rows.sort((a, b) => {
    // Pending above done.
    if (!!a.row.done !== !!b.row.done) return a.row.done ? 1 : -1;
    // Within a group: dated soonest-first, undated last, then stable by label.
    if (a.dlISO && b.dlISO) return a.dlISO.localeCompare(b.dlISO);
    if (a.dlISO) return -1;
    if (b.dlISO) return 1;
    return requirementDisplayLabel(a.row).localeCompare(requirementDisplayLabel(b.row));
  });
  const { done, total } = requirementChecklistCounts(o);
  const checkSvg = `<svg width="10" height="10" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"/></svg>`;
  const items = rows.map(({ row, dlISO }) => `
    <div class="offer-req-item ${row.done ? 'done' : ''}" data-action="toggle-req-done" data-id="${o.id}" data-req-id="${escapeAttr(row.id)}" role="button" tabindex="0" aria-pressed="${row.done ? 'true' : 'false'}" title="${row.done ? 'Mark not done' : 'Mark done'}">
      <span class="offer-req-check">${row.done ? checkSvg : ''}</span>
      <span class="offer-req-label">${escapeHtml(requirementDisplayLabel(row))}</span>
      <span class="offer-req-date">${dlISO ? formatDateMedium(dlISO) : ''}</span>
    </div>`).join('');
  return `
    <div class="offer-req-checklist">
      <div class="offer-req-title">Requirements <span class="offer-req-count">${done}/${total}</span></div>
      ${items}
    </div>`;
}

// Compact 4-stage pipeline strip (F3) — a DERIVED VIEW of the status model
// (lifecycleStage), styled after BonusFlow's filled-progress-segment pattern
// adapted to YV tokens. `slim` is a denser variant for the modal. For an
// 'inactive' subStatus (prospect/denied/etc.) the whole strip renders neutral
// and carries no active fill — the offer's status chip states the specifics.
function renderPipelineStrip(o, opts) {
  const slim = !!(opts && opts.slim);
  const stage = lifecycleStage(o);
  const inactive = stage === 'inactive';
  const activeIdx = inactive ? -1 : LIFECYCLE_STAGES.indexOf(stage);
  const segs = LIFECYCLE_STAGES.map((st, i) => {
    // A stage is "filled" (past/current) when its index <= the active index.
    const state = inactive ? 'idle' : (i < activeIdx ? 'done' : (i === activeIdx ? 'current' : 'idle'));
    return `<div class="yv-pl-seg ${state}">
      <span class="yv-pl-dot"></span>
      <span class="yv-pl-label">${LIFECYCLE_STAGE_LABELS[st]}</span>
    </div>`;
  }).join('');
  const cap = slim ? '' : (() => {
    const c = lifecycleCaption(o);
    return c ? `<div class="yv-pl-caption">${escapeHtml(c)}</div>` : '';
  })();
  return `<div class="yv-pipeline ${slim ? 'slim' : ''} ${inactive ? 'inactive' : ''}" role="img" aria-label="Lifecycle stage: ${inactive ? 'not started' : LIFECYCLE_STAGE_LABELS[stage]}">
    <div class="yv-pl-track">${segs}</div>
    ${cap}
  </div>`;
}

// Expected-bonus window + safe-to-close lines for the card/modal. Shows only
// what's computable for the offer's current lifecycle stage; returns '' when
// neither applies (so no empty box appears for a prospect).
function renderLifecycleInfo(o) {
  const parts = [];
  const stage = lifecycleStage(o);

  // Bonus received (earned + a stored date) OR expected window (waiting/earned).
  if (stage === 'earned' && o.bonus_received_date) {
    parts.push(`<div class="yv-life-line"><span class="yv-life-k">Bonus received</span><span class="yv-life-v success">${escapeHtml(formatDateDisplay(o.bonus_received_date))}</span></div>`);
  } else {
    const win = expectedBonusWindow(o);
    if (win) {
      // Overdue (P3-1): still met-waiting but the window's late edge has passed —
      // a stale future-looking range would mislead, so switch to overdue copy +
      // warning styling. (Feed semantics unchanged — no past-date filter there.)
      const endPast = win.endISO && parseDate(win.endISO) && parseDate(win.endISO).getTime() < TODAY.getTime();
      if (stage === 'waiting' && endPast) {
        parts.push(`<div class="yv-life-line"><span class="yv-life-k">Bonus overdue</span><span class="yv-life-v warn">window ended ${escapeHtml(formatDateDisplay(win.endISO))}</span></div>`);
      } else {
        const flag = win.typical ? ' <span class="yv-life-tag">typical</span>' : (win.estimated ? ' <span class="yv-life-tag">estimated</span>' : '');
        parts.push(`<div class="yv-life-line"><span class="yv-life-k">Expected bonus</span><span class="yv-life-v">${escapeHtml(formatDateDisplay(win.startISO))} ~ ${escapeHtml(formatDateDisplay(win.endISO))}${flag}</span></div>`);
      }
    }
  }

  // Safe-to-close — same gate as the safe-to-close FEED kind so the card and
  // feed agree: account OPEN and at/past requirements-met (earned or met-waiting).
  // Before that, closing isn't on the table, so no line for approved/on-track/
  // denied. Success-styled once the date has passed.
  if (o.accountStatus === 'open' && (o.subStatus === 'earned' || o.subStatus === 'met-waiting')) {
    const stc = safeToCloseDate(o);
    if (stc) {
      const past = parseDate(stc) && parseDate(stc).getTime() <= TODAY.getTime();
      parts.push(`<div class="yv-life-line"><span class="yv-life-k">Safe to close</span><span class="yv-life-v ${past ? 'success' : ''}">${past ? '' : 'after '}${escapeHtml(formatDateDisplay(stc))}</span></div>`);
    }
  }

  // Churnability (F6) — when the offer can be re-run again. Only churnable===true
  // offers get a positive line; churnable===false shows a subtle "Not churnable"
  // (but only alongside other lifecycle context or an explicit note, so a bare
  // prospect never carries a lone negative line); churnable===null stays silent
  // (unknown = no line).
  if (o.churnable === true) {
    const elig = churnEligibleDate(o);
    if (elig) {
      const past = parseDate(elig) && parseDate(elig).getTime() <= TODAY.getTime();
      // While snoozed, append a muted suffix on the SAME line. A timed snooze
      // shows the until-date ("snoozed until 9-1-2026"); a 'forever' snooze (or
      // any active snooze without a resolvable date) shows a bare "snoozed".
      let snoozeSuffix = '';
      if (churnSnoozeActive(o)) {
        const su = o.churn_snoozed_until;
        snoozeSuffix = (su && su !== 'forever' && parseDate(su))
          ? ` <span class="yv-life-snooze">— snoozed until ${escapeHtml(formatDateDisplay(su))}</span>`
          : ` <span class="yv-life-snooze">— snoozed</span>`;
      }
      parts.push(`<div class="yv-life-line"><span class="yv-life-k">Churn</span><span class="yv-life-v ${snoozeSuffix ? '' : (past ? 'success' : '')}">${past ? 'eligible now' : 'eligible ' + escapeHtml(formatDateDisplay(elig))}${snoozeSuffix}</span></div>`);
    } else if (Number(o.churn_wait_months) > 0) {
      // Churnable with a wait set but the anchor date isn't recorded yet.
      const anchorLabel = CHURN_ANCHOR_LABELS[o.churn_anchor] || CHURN_ANCHOR_LABELS.bonus_received;
      parts.push(`<div class="yv-life-line"><span class="yv-life-k">Churn</span><span class="yv-life-v muted">needs ${escapeHtml(anchorLabel)} date</span></div>`);
    } else {
      // Churnable but no cooling-off period recorded → no computable date.
      // Mirror the "needs … date" prompt so the offer surfaces the gap here
      // (the overview section stays absent — nothing computable to list).
      parts.push(`<div class="yv-life-line"><span class="yv-life-k">Churn</span><span class="yv-life-v muted">needs wait period</span></div>`);
    }
  } else if (o.churnable === false && (parts.length > 0 || o.churn_notes)) {
    parts.push(`<div class="yv-life-line"><span class="yv-life-k">Churn</span><span class="yv-life-v muted">not churnable</span></div>`);
  }

  if (parts.length === 0) return '';
  return `<div class="yv-life-info">${parts.join('')}</div>`;
}

// Non-intrusive inline suggestion to advance the lifecycle when all requirements
// are done but the offer is still approved/on-track. One tap sets subStatus=
// 'met-waiting' via the normal save path; a dismiss persists a per-offer flag so
// it never nags again. Renders '' unless shouldSuggestWaiting(o).
function renderLifecycleSuggest(o) {
  if (!shouldSuggestWaiting(o)) return '';
  return `<div class="yv-life-suggest">
    <span class="yv-life-suggest-text">All requirements met — mark as Waiting for Bonus?</span>
    <span class="yv-life-suggest-actions">
      <button class="btn btn-primary btn-xs" data-action="lifecycle-mark-waiting" data-id="${o.id}">Mark waiting</button>
      <button class="btn-icon yv-life-suggest-x" data-action="lifecycle-dismiss-suggest" data-id="${o.id}" aria-label="Dismiss suggestion" title="Dismiss">
        <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><line x1="6" y1="6" x2="18" y2="18"/><line x1="6" y1="18" x2="18" y2="6"/></svg>
      </button>
    </span>
  </div>`;
}

// Expiration/freshness chip for an offer card (display only — the offer-expires
// FEED item is computed separately and untouched). An offer's expiration date
// only governs SIGNING UP, so the chip is shown ONLY for pre-confirmation
// subStatuses — prospect/applied (PRE_ACCOUNT_SUB_STATUSES) — which is exactly
// when the offer-expires feed item also fires (the feed gates on
// !CONFIRMED_OFFER_STATUSES.has(status); prospect→'prospect', applied→'selected'
// are the only non-confirmed, non-completed derived statuses). Reusing that
// canonical set instead of a parallel exclusion list keeps chip and feed from
// ever contradicting: once approved/on-track/met-waiting/earned/closed, the
// expiry no longer matters and neither surface shows it.
// Tone: neutral (muted) while > 14 days out; --warning once ≤ 14 days (incl.
// today); --danger once past. N is calendar days until expiry (today = 0).
function offerExpirationChip(o) {
  if (!o || !o.offerExpirationDate) return '';
  if (!PRE_ACCOUNT_SUB_STATUSES.has(o.subStatus)) return '';
  const exp = parseDate(o.offerExpirationDate);
  if (!exp) return '';
  const n = daysBetween(TODAY, exp); // >0 future, 0 today, <0 past
  const disp = formatDateDisplay(isoDate(exp)); // owner's M-D-YYYY
  if (n < 0) {
    return `<span class="chip chip-danger" title="This offer's advertised expiration date has passed.">Expired ${disp}</span>`;
  }
  if (n === 0) {
    return `<span class="chip chip-warn" title="Offer expires today — act now.">Expires today</span>`;
  }
  const tone = n <= 14 ? 'chip-warn' : 'chip-muted';
  const title = n <= 14
    ? `Offer expires in ${n} day${n === 1 ? '' : 's'} — act soon.`
    : `Offer expires in ${n} days.`;
  return `<span class="chip ${tone}" title="${title}">Expires ${disp} (${n}d)</span>`;
}

// Quiet "Updated <date>" freshness stamp from last_edited. Smallest text tier,
// --text-tertiary — never competes with the card's real content. Returns ''
// when the offer has never been edited (last_edited null/absent — migrated
// offers stay blank until their first save).
function offerUpdatedStamp(o) {
  if (!o || !o.last_edited) return '';
  const d = parseDate(String(o.last_edited).slice(0, 10));
  if (!d) return '';
  const label = daysBetween(TODAY, d) === 0 ? 'Updated today' : `Updated ${formatDateDisplay(isoDate(d))}`;
  return `<div class="offer-updated">${label}</div>`;
}

function renderOfferCard(o) {
  const complete = isOfferComplete(o);
  const issues = offerIssues(o);
  const start = lockStartDate(o);
  const end = withdrawalEligibleDate(o);
  const ar = annualizedReturn(o);
  const sr = simpleReturn(o);
  const isConfirmed = CONFIRMED_OFFER_STATUSES.has(o.status);
  const checked = isConfirmed || o.includeInScenario;
  const disabled = !complete || isConfirmed;

  return `
    <div class="offer-card ${checked && complete ? 'included' : ''} ${!complete ? 'draft' : ''}" ${offerColorHex(o) ? `style="--offer-color:${offerColorHex(o)};"` : ''}>
      <div class="offer-card-header">
        <input type="checkbox" class="offer-include"
          ${checked ? 'checked' : ''}
          ${disabled ? 'disabled' : ''}
          data-action="toggle-include" data-id="${o.id}"
          aria-label="Include in scenario" />
        <div style="flex:1;min-width:0;">
          <div class="offer-name">${escapeHtml(o.bankName || 'Untitled offer')}</div>
          <div class="offer-bank">${escapeHtml(o.offerName || '')}</div>
        </div>
        <button class="btn-icon" data-action="edit-offer" data-id="${o.id}" aria-label="Edit">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M12 20h9"/><path d="M16.5 3.5a2.121 2.121 0 113 3L7 19l-4 1 1-4 12.5-12.5z"/></svg>
        </button>
      </div>
      ${!complete
        ? `<div class="banner warn" style="font-size:12px;padding:8px 10px;margin-bottom:var(--space-3);">Draft — ${escapeHtml(issues[0])}</div>`
        : ''}
      <div class="offer-stats">
        <div class="offer-stat">
          <span class="offer-stat-label">Funding</span>
          <span class="offer-stat-value">${formatCompactCurrency(o.requiredFundingAmount)}</span>
        </div>
        <div class="offer-stat">
          <span class="offer-stat-label">Bonus</span>
          <span class="offer-stat-value success">${formatCompactCurrency(o.signupBonusAmount)}</span>
          ${(o.monthly_fee != null && o.monthly_fee !== '' && Number(o.monthly_fee) > 0) ? `<span class="offer-monthly-fee" title="Monthly account fee${o.fee_waiver_condition ? ' — ' + escapeAttr(o.fee_waiver_condition) : ''}">$${formatMoneyInput(o.monthly_fee)}/mo</span>` : ''}
        </div>
        <div class="offer-stat">
          <span class="offer-stat-label">Days tied up</span>
          ${(() => {
            const isDD = o.offerType === 'direct-deposit' || o.offerType === 'held-and-dd';
            if (isDD) {
              const ct = ddCapitalTime(o);
              if (ct) return `<span class="offer-stat-value" title="Amount-weighted average days each direct deposit is tied up (Σ amount×days ÷ Σ amount). Each DD's round trip accounts for weekends/holidays.">${Math.round(ct.weightedDays)} <span style="font-weight:500;color:var(--text-tertiary);font-size:12px;">wtd avg</span></span>`;
              return `<span class="offer-stat-value muted">—</span>`;
            }
            return `<span class="offer-stat-value" title="Actual days your cash is unavailable: from funded date to withdrawal-eligible date.${o.lockStartsFrom === 'open date' ? ' Bank requires ' + o.daysFundsMustRemain + ' days from account open.' : ''}">${(start && end) ? daysBetween(parseDate(start), parseDate(end)) : (o.daysFundsMustRemain ?? '—')}${o.lockStartsFrom === 'open date' && start && end ? ` <span style="font-weight:500;color:var(--text-tertiary);font-size:12px;">/ ${o.daysFundsMustRemain}</span>` : ''}</span>`;
          })()}
        </div>
        <div class="offer-stat">
          <span class="offer-stat-label">Annualized</span>
          <span class="offer-stat-value ${ar != null ? 'success' : 'muted'}" title="${(o.offerType === 'direct-deposit' || o.offerType === 'held-and-dd') ? 'Dollar-days weighted annualized return = bonus × 365 ÷ Σ(deposit amount × days held). Each DD held-days figure reflects its transfer round trip including weekend/holiday delays.' : 'Annualized return on tied-up capital = (bonus / required funding) × 365 / actual days tied up. Business-day-adjusted lock window.'}">${ar != null ? formatPercent(ar) : '—'}</span>
        </div>
      </div>
      <div class="offer-dates">
        ${start ? `<span><strong>Fund date:</strong> ${formatDateMedium(start)}</span>` : ''}
        ${end ? `<span><strong>Withdrawal date:</strong> ${formatDateMedium(end)}${o.lockStartsFrom === 'open date' ? ` <span style="color:var(--text-tertiary);">(${o.daysFundsMustRemain}d from open)</span>` : ''}</span>` : ''}
      </div>
      ${(o.offerType === 'direct-deposit' || o.offerType === 'held-and-dd') && Array.isArray(o.directDeposits) && o.directDeposits.length > 0 ? `
        <div class="offer-dds">
          ${o.directDeposits.map((dd, i) => {
            const planned = dd.plannedDate ? parseDate(dd.plannedDate) : null;
            const effISO = directDepositEffectiveDate(dd);
            const eff = effISO ? parseDate(effISO) : null;
            const adjusted = planned && eff && planned.getTime() !== eff.getTime();
            return `<div class="offer-dd-row">
              <span class="offer-dd-num">DD ${i + 1}</span>
              <span class="offer-dd-amount">${formatCompactCurrency(dd.amount)}</span>
              <span class="offer-dd-date" title="${adjusted ? 'Planned ' + (planned ? formatDateMedium(planned) : '—') + ' shifted to next business day' : ''}">${eff ? formatDateMedium(eff) : '—'}${adjusted ? ' <span class="offer-dd-adj">⇢</span>' : ''}</span>
            </div>`;
          }).join('')}
        </div>
      ` : ''}
      ${(o.offerType === 'direct-deposit' || o.offerType === 'held-and-dd') ? renderDdMethodPanel(o) : ''}
      ${renderRequirementChecklist(o)}
      ${renderPipelineStrip(o)}
      ${renderLifecycleSuggest(o)}
      ${renderLifecycleInfo(o)}
      <div class="offer-chips">
        <span class="chip chip-offer-type-${(o.offerType && o.offerType !== 'other') ? o.offerType : 'new-funds-held'}" title="${
          o.offerType === 'direct-deposit' ? 'Direct deposit — no hold; money round-trips through the account' :
          o.offerType === 'held-and-dd'    ? 'Held + direct deposit — lump sum held for N days plus qualifying DDs required' :
          'New funds held — lump-sum deposit kept for N days'
        }">${
          o.offerType === 'direct-deposit' ? 'DD' :
          o.offerType === 'held-and-dd'    ? 'Held+DD' :
          'Held'
        }</span>

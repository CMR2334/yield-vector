   the base rule is kept for any future non-boxed use. */
/* Round 58: value text is regular weight (was 500) and one shade lighter
   than heading-tone --text — --text-strong is the app's dedicated
   body-strong tone (see :root, ~line 28), staying comfortably darker than
   every label so values remain the unmistakable primary data at a glance. */
.field-box .input,
.field-box .select,
.field-box .textarea,
.field-box input,
.field-box select,
.field-box textarea {
  border: none;
  background: transparent;
  padding: 0;
  border-radius: 0;
  font-size: 16px;
  font-weight: 400;
  color: var(--text-strong);
  min-height: 0;
  height: auto;
  line-height: 1.35;
}
.field-box .input:focus,
.field-box .select:focus,
.field-box .textarea:focus,
.field-box input:focus,
.field-box select:focus,
.field-box textarea:focus {
  outline: none;
  box-shadow: none;
  border: none;
}
/* .input-group PREFIX inside a box: the base .input-group mechanism
   (below, ~line 1571) absolutely-positions .input-prefix over the input
   and relies on padding-left to clear it — that padding number was tuned
   for the OLD bordered input box, and 16px wasn't enough clearance for a
   flush-left "$" once real digits render at the same offset (R57 bug:
   prefix glyph overlapped the value's first digit, only visible once a
   value existed — an empty input has nothing to collide with). Rather
   than re-tune a magic padding number against a floating glyph, make
   .input-group a normal flex row instead so the prefix sits in-flow as
   a static flex item — no absolute positioning, no overlap possible by
   construction. No app usage ever combines prefix + suffix in the same
   .input-group (checked), so this flex row is safe to apply unconditio-
   nally; suffix keeps the base absolute-right mechanism (confirmed
   rendering correctly — narrow suffix values don't collide with it) and
   still works fine as an out-of-flow absolutely-positioned child of a
   flex container. Avoided :has() deliberately — unconditional flex needs
   no feature-detection and covers both prefix-only and suffix-only
   groups identically. */
.field-box .input-group {
  margin-top: 1px;
  display: flex;
  align-items: baseline;
}
.field-box .input-group.with-suffix .input { padding-right: 48px; }
.field-box .input-group .input-suffix { right: 0; }
.field-box .input-group .input-prefix {
  position: static;
  flex: 0 0 auto;
  transform: none;
  /* R62: tie the "$" to the value — snug gap (reads connected, low end of
     the 4-6px target) and darkened from the muted label tone to the value
     tone (--text-strong) so it parses as part of the amount, not the label. */
  margin-right: 4px;
  font-size: 16px;
  color: var(--text-strong);
}
.field-box .input-group .input {
  flex: 1 1 auto;
  min-width: 0;
  padding-left: 0;
}
.field-box .textarea { resize: vertical; min-height: 60px; }
/* Native date/number appearance stripping still applies (see the
   MODAL FORM CONTAINMENT block below) — the box wrapper doesn't change
   that need, just where the border now lives. */
.field-box .input[type="date"],
.field-box .input[type="datetime-local"],
.field-box .input[type="time"],
.field-box .input[type="number"] {
  -webkit-appearance: none;
  appearance: none;
  min-height: 0 !important;
  height: auto !important;
  padding: 0 !important;
}
/* #offer-form's bottom-pinned-input baseline hack (above) targeted the
   label/input as separate flex children; now that both live inside one
   .field-box, pin the BOX itself to the bottom of the field cell so
   mixed one-line/two-line labels in the same grid row still keep their
   boxes aligned. */
#offer-form .field > .field-box { margin-top: auto; }
/* #offer-form .field label (R57 bottom-pin rule, ~line 1504) also matches
   labels nested inside a .field-box here — its min-height:30px/flex/
   align-items:flex-end was built for the OUTSIDE-box group-label baseline
   hack, not the in-box label pattern, and was winning the cascade (ID+class
   beats .field-box label's class+class) so every single-line in-box label
   in the offer/commitment/event modals was force-stretched to 30px tall
   instead of sizing to its own ~15.6px line-height — inflating every box by
   the difference and reading as oversized with the label floating away
   from its value (owner feedback, R61). Box-pinning above already replaced
   the need for the label itself to carry baseline alignment inside a box,
   so reset it back to .field-box's own sizing here. */
#offer-form .field-box label { min-height: 0; display: block; align-items: normal; }
/* Settings / non-modal forms: top-align each field so mixed hint presence
   doesn't leave big gaps or uneven heights. */
.form-section .form-grid { align-items: start; }

/* Capital & projection: a deliberate 3-up grid on desktop (2-up on
   tablet) instead of `auto-fit`, which produced 5 cramped columns and
   ragged wrapping. align-items:stretch + bottom-pinned controls keep
   every input in a row on the same baseline even when a hint wraps to
   two lines. The ≤720px flex-column rules below still win on mobile. */
#capital-grid {
  grid-template-columns: repeat(3, minmax(0, 1fr));
  align-items: stretch;
}
#capital-grid .field > .input,
#capital-grid .field > .select,
#capital-grid .field > .input-group,
#capital-grid .field > .radio-group { margin-top: auto; }
@media (max-width: 1024px) {
  #capital-grid { grid-template-columns: repeat(2, minmax(0, 1fr)); }
}
.field-hint { font-size: 12px; color: var(--text-tertiary); margin-top: 2px; }
.field-error { font-size: 12px; color: var(--danger); margin-top: 2px; }

.input, .select, .textarea {
  width: 100%;
  display: block;
  /* Match `.field { min-width: 0 }` so inputs can shrink to the column
     width on narrow screens. Some native widgets (date, number) carry an
     intrinsic min-width that would otherwise overflow the form column.
     `box-sizing: border-box` is set globally on `*`, but re-stating here
     makes the no-overflow contract explicit at the input level. */
  min-width: 0;
  max-width: 100%;
  box-sizing: border-box;
  padding: 10px 12px;
  border: 1.5px solid var(--border);
  background: var(--card);
  border-radius: var(--radius-md);
  font-size: 14px;
  color: var(--text);
  transition: border-color 0.1s, box-shadow 0.1s;
  font-family: inherit;
}
/* Input groups (currency-prefix, days-suffix) wrap the input in a
   relative-position div for the absolutely-positioned prefix/suffix. The
   wrapper itself must stay constrained so the inner input can't overflow
   the field cell on phones — Safari's intrinsic native-control widths
   would otherwise push the right edge past the modal. */
.input-group {
  position: relative;
  width: 100%;
  min-width: 0;
  max-width: 100%;
  box-sizing: border-box;
}
.input:focus, .select:focus, .textarea:focus {
  outline: none;
  border-color: var(--accent);
  box-shadow: 0 0 0 3px rgba(91, 92, 246, 0.15);
}
.input[type="number"] { font-feature-settings: 'tnum' 1; }
/* Native date/time inputs (e.g. Settings → Projection start date) carry an
   intrinsic min-width from the iOS/WebKit UA spinner that overflows the
   field's right edge on mobile despite width:100%. Strip the appearance so
   they collapse to our box — same fix the modal blast-radius applies, but
   these settings fields live outside any modal. The native picker still
   opens on tap. */
.input[type="date"],
.input[type="datetime-local"],
.input[type="time"] {
  -webkit-appearance: none;
  appearance: none;
  width: 100%;
  max-width: 100%;
  min-width: 0;
  box-sizing: border-box;
}
.textarea { resize: vertical; min-height: 72px; }

.input-group .input-prefix { position: absolute; left: 12px; top: 50%; transform: translateY(-50%); color: var(--text-tertiary); font-size: 14px; pointer-events: none; }
.input-group .input-suffix { position: absolute; right: 12px; top: 50%; transform: translateY(-50%); color: var(--text-tertiary); font-size: 13px; pointer-events: none; }
.input-group .input { padding-left: 28px; }
.input-group.with-suffix .input { padding-right: 60px; }

/* ============================================================
   MODAL FORM CONTAINMENT — BLAST RADIUS CONTROL
   The Add-Offer modal mixes plain inputs, .input-group wrappers,
   and inline style="grid-column: 1 / -1" annotations. Fields 5+6
   ("Offer expires", "Planned signup date") were overflowing on
   mobile because <input type="date"> in iOS Safari has an intrinsic
   min-width from its native chevron/spinner UI that exceeds
   `width: 100%` even with box-sizing: border-box. The rules below
   are deliberately !important because every other layer has been
   tried — this is the wall.
   ============================================================ */
.modal,
.modal-card,
.modal-body,
.modal .form-grid {
  overflow-x: hidden !important;
}
.modal .field,
.modal .form-grid > *,
.modal .input-group,
.modal .radio-group,
.modal .input,
.modal .select,
.modal .textarea {
  width: 100% !important;
  max-width: 100% !important;
  min-width: 0 !important;
  box-sizing: border-box !important;
  flex-shrink: 1 !important;
}
.modal .field,
.modal .form-grid > * {
  /* Neutralize any inline style="grid-column: 1 / -1" or similar so
     they're no-ops in our flex-column form layout on mobile. */
  grid-column: 1 / -1 !important;
}
/* Native date/time/number widgets carry an intrinsic min-width from
   the WebKit/Blink user-agent stylesheet. Strip the appearance so
   they collapse to the box we give them, not their native size. */
.modal .input[type="date"],
.modal .input[type="datetime-local"],
.modal .input[type="time"],
.modal .input[type="number"] {
  -webkit-appearance: none !important;
  appearance: none !important;
  /* Re-add a minimal indicator so the field still reads as a date/
     number control after appearance:none strips the chevron. The
     native picker still works on tap — this is just visual. */
  background-image: none;
  /* Ensure empty date inputs match the height of text inputs */
  min-height: 44px !important;
  height: 44px !important;
  line-height: normal !important;
  padding-top: 10px !important;
  padding-bottom: 10px !important;
}
/* Field-box (R57) wins the fixed-height tie above by appearing later in
   the cascade at equal specificity: inside a box the control is
   borderless/flush, so the old bordered-input 44px/10px box-model no
   longer applies — the .field-box padding (12px 18px) now carries the
   tap-target height instead. */
.modal .field-box .input[type="date"],
.modal .field-box .input[type="datetime-local"],
.modal .field-box .input[type="time"],
.modal .field-box .input[type="number"] {
  min-height: 0 !important;
  height: auto !important;
  line-height: 1.35 !important;
  padding-top: 0 !important;
  padding-bottom: 0 !important;
}

/* DD-requirement controls are meant to read as a compact inline rule
   ("Once per [month] for [3] months"). The blast-radius width:100% above
   would stretch each to full width and stack them awkwardly, so re-assert
   compact widths here (higher specificity + !important beats the wall).
   With these, the row fits "Once per [sel] for [n][unit]" on one line and
   gracefully wraps "Generate dates" beneath instead of stacking giants. */
.modal #ddreq-freq-fields .select {
  width: 112px !important;
  max-width: 112px !important;
  flex: 0 0 auto !important;
}
.modal #ddreq-freq-fields .input-group {
  width: 122px !important;
  max-width: 122px !important;
  flex: 0 0 auto !important;
}
.modal #ddreq-count-fields .input-group {
  width: 138px !important;
  max-width: 138px !important;
}

.checkbox-row { display: flex; align-items: center; gap: var(--space-2); cursor: pointer; padding: 4px 0; }
.checkbox-row input[type="checkbox"] {
  appearance: none;
  -webkit-appearance: none;
  width: 18px; height: 18px;
  border: 2px solid var(--border-strong);
  border-radius: 5px;
  cursor: pointer;
  position: relative;
}
.checkbox-row input[type="checkbox"]:checked { background: var(--accent); border-color: var(--accent); }
.checkbox-row input[type="checkbox"]:checked::after {
  content: '';
  position: absolute;
  left: 4px; top: 0;
  width: 5px; height: 9px;
  border: solid white;
  border-width: 0 2px 2px 0;
  transform: rotate(45deg);
}

.radio-group {
  display: flex;
  flex-wrap: nowrap;
  gap: 0;
  background: var(--bg);
  border-radius: var(--radius-md);
  padding: 3px;
  width: 100%;
}
.radio-group label {
  flex: 1 1 0%;
  min-width: 0;
  display: flex;
  align-items: center;
  justify-content: center;
  text-align: center;
  padding: 8px 12px;
  border-radius: 8px;
  font-size: 13px;
  font-weight: 500;
  color: var(--text-secondary);
  cursor: pointer;
  transition: background 0.1s, color 0.1s;
}
.radio-group input[type="radio"] { display: none; }
.radio-group input[type="radio"]:checked + label { background: var(--card); color: var(--text); box-shadow: var(--shadow-sm); font-weight: 600; }

/* ============================================================
   MODAL / DRAWER
   ============================================================ */
.modal {
  position: fixed;
  inset: 0;
  z-index: 100;
  display: none;
  background: rgba(13, 20, 33, 0.45);
  backdrop-filter: blur(2px);
  align-items: flex-start;
  justify-content: center;
  padding: var(--space-8) var(--space-4);
  overflow-y: auto;
}
.modal.open { display: flex; }

/* Cloud-history restore list */
.sync-hist-list { display: flex; flex-direction: column; gap: var(--space-2); }
.sync-hist-row {
  display: flex; align-items: center; justify-content: space-between; gap: var(--space-3);
  padding: 10px 12px; border: 1px solid var(--border-soft); border-radius: var(--radius-md);
  background: var(--card-soft);
}
.sync-hist-meta { min-width: 0; }
.sync-hist-when { font-size: 13px; font-weight: 600; color: var(--text); }
.sync-hist-counts { font-size: 12px; color: var(--text-secondary); margin-top: 2px; }

.modal-card {
  background: var(--card);
  border-radius: var(--radius-xl);
  width: 100%;
  max-width: 640px;
  box-shadow: var(--shadow-modal);
  overflow: hidden;
  display: flex;
  flex-direction: column;
  max-height: calc(100vh - 64px);
}

.modal-header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: var(--space-5) var(--space-6);
  border-bottom: 1px solid var(--border-soft);
}
.modal-title { font-size: 18px; font-weight: 600; letter-spacing: -0.01em; }
.modal-body {
  padding: var(--space-6);
  overflow-y: auto;
  /* Defensive: if any inner element overflows horizontally on narrow
     viewports, clip it instead of letting the user scroll the whole modal
     left/right. Vertical scroll for long forms is still preserved. */
  overflow-x: hidden;
  flex: 1;
}
.modal-footer {
  padding: var(--space-4) var(--space-6);
  border-top: 1px solid var(--border-soft);
  display: flex;
  justify-content: space-between;
  gap: var(--space-2);
  align-items: center;
}

.advanced-toggle {
  display: flex;
  align-items: center;
  gap: 6px;
  padding: var(--space-3) 0;
  margin: var(--space-4) 0;
  border-top: 1px solid var(--border-soft);
  font-size: 13px;
  color: var(--text-secondary);
  font-weight: 500;
  cursor: pointer;
  width: 100%;
  justify-content: space-between;
}
.advanced-toggle .chevron { transition: transform 0.15s; }
.advanced-toggle[aria-expanded="true"] .chevron { transform: rotate(180deg); }

.advanced-fields { display: none; flex-direction: column; gap: var(--space-4); }
.advanced-fields.open { display: flex; }

/* ============================================================
   TABLES
   ============================================================ */
.table-wrap { overflow-x: auto; border-radius: var(--radius-lg); border: 1px solid var(--border-soft); }
.form-section .table-wrap {
  margin-left: calc(-1 * var(--space-6));
  margin-right: calc(-1 * var(--space-6));
  border-left: none;
  border-right: none;
  border-radius: 0;
}

table.data-table {
  width: 100%;
  font-size: 13px;
  border-collapse: collapse;
  background: var(--card);
}
.data-table th {
  text-align: left;
  font-weight: 600;
  font-size: 11px;
  color: var(--text-tertiary);
  text-transform: uppercase;
  letter-spacing: 0.02em;
  padding: var(--space-3);
  background: var(--card-soft);
  border-bottom: 1px solid var(--border);
  white-space: nowrap;
}
.data-table td {
  padding: var(--space-3);
  border-bottom: 1px solid var(--border-soft);
  vertical-align: middle;
}
.data-table tbody tr:hover { background: var(--bg); }
.data-table tbody tr:last-child td { border-bottom: none; }

.num { text-align: right; font-feature-settings: 'tnum' 1; }
.row-warn { background: rgba(245, 158, 11, 0.06); }
.row-danger { background: rgba(239, 68, 68, 0.07); }

/* ============================================================
   PLANNER OPTIMIZER
   ============================================================ */
.optimizer-bar {
  background: var(--card);
  border-radius: var(--radius-xl);
  padding: var(--space-5) var(--space-6);
  box-shadow: var(--shadow-card);
  margin-bottom: var(--space-5);
  display: flex;
  flex-wrap: wrap;
  gap: var(--space-4);
  align-items: center;
  justify-content: space-between;
}

.optimizer-summary {
  display: flex;
  gap: var(--space-6);
  flex-wrap: wrap;
}
.optimizer-summary .metric { display: flex; flex-direction: column; gap: 2px; }
.optimizer-summary .metric .label { font-size: 11px; color: var(--text-tertiary); font-weight: 600; text-transform: uppercase; letter-spacing: 0.02em; }
.optimizer-summary .metric .value { font-size: 18px; font-weight: 600; }

.combo-card {
  background: var(--card);
  border-radius: var(--radius-lg);
  padding: var(--space-5);
  box-shadow: var(--shadow-card);
  border: 2px solid transparent;
  cursor: pointer;
  transition: border-color 0.12s, transform 0.05s, box-shadow 0.12s;
}
.combo-card:hover { border-color: var(--accent-mid); }
.combo-card:active { transform: scale(0.997); }
.combo-card.selected { border-color: var(--accent); box-shadow: var(--shadow-card-hover), 0 0 0 4px rgba(91, 92, 246, 0.12); }
.recommended-tag { color: var(--accent); font-weight: 700; }

.combo-header { display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: var(--space-3); gap: var(--space-3); }
.combo-rank { font-size: 11px; font-weight: 700; color: var(--text-tertiary); text-transform: uppercase; letter-spacing: 0.02em; }
.combo-bonus { font-size: 22px; font-weight: 700; letter-spacing: -0.02em; color: var(--success); }
.combo-meta { font-size: 12px; color: var(--text-secondary); margin-bottom: var(--space-3); display: flex; flex-wrap: wrap; gap: 12px; }
.combo-meta span { display: inline-flex; align-items: center; gap: 4px; }
.combo-offers { display: flex; flex-direction: column; gap: 4px; }
.combo-offer { font-size: 13px; padding: 6px 10px; background: var(--bg); border-radius: 6px; display: flex; justify-content: space-between; gap: 8px; }
.combo-offer .name { color: var(--text); font-weight: 500; }
.combo-offer .amount { color: var(--text-tertiary); font-feature-settings: 'tnum' 1; }

/* ============================================================
   EMPTY STATES & MISC
   ============================================================ */
.empty-state {
  text-align: center;
  padding: var(--space-12) var(--space-6);
  color: var(--text-secondary);
}
.empty-state svg { width: 48px; height: 48px; opacity: 0.4; margin-bottom: var(--space-4); }
.empty-state h3 { font-size: 18px; font-weight: 600; color: var(--text); margin-bottom: var(--space-2); }
.empty-state p { font-size: 14px; max-width: 360px; margin: 0 auto var(--space-4); }

.toast {
  position: fixed;
  bottom: 30px;
  left: 50%;
  transform: translateX(-50%) translateY(20px);
  background: rgba(13, 20, 33, 0.94);
  color: white;
  padding: 12px 20px;
  border-radius: var(--radius-pill);
  font-size: 14px;
  font-weight: 500;
  text-align: center;
  box-shadow: 0 12px 32px rgba(0,0,0,0.2);
  opacity: 0;
  pointer-events: none;
  z-index: 200;
  transition: opacity 0.2s, transform 0.2s;
  /* Cap width so the toast doesn't run edge-to-edge on phones */
  max-width: calc(100vw - 32px);
}
.toast.visible { opacity: 1; transform: translateX(-50%) translateY(0); }
.toast.danger { background: var(--danger); }

.divider { height: 1px; background: var(--border-soft); margin: var(--space-5) 0; }

.banner {
  display: flex;
  gap: var(--space-3);
  padding: var(--space-3) var(--space-4);
  border-radius: var(--radius-md);
  font-size: 13px;
  background: var(--accent-soft);
  color: var(--accent-strong);
  border: 1px solid rgba(91, 92, 246, 0.2);
  margin-bottom: var(--space-4);
  align-items: flex-start;
}
.banner > div { flex: 1 1 0; min-width: 0; }
.banner.warn { background: var(--warning-soft); color: #92400e; border-color: rgba(245, 158, 11, 0.3); }
.banner.danger { background: var(--danger-soft); color: #c95555; border-color: rgba(232, 113, 113, 0.3); }
.banner svg { flex-shrink: 0; width: 14px; height: 14px; margin-top: 2px; }

/* About & diagnostics (Settings) */
.about-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(140px, 1fr)); gap: var(--space-2); margin-bottom: var(--space-3); }
.about-item { display: flex; flex-direction: column; gap: 2px; padding: var(--space-2) var(--space-3); background: var(--bg-subtle, rgba(0,0,0,0.03)); border-radius: var(--radius-md); }
.about-label { font-size: 11px; text-transform: uppercase; letter-spacing: 0.02em; color: var(--text-tertiary); }
.about-value { font-size: 14px; font-weight: 600; color: var(--text-primary); font-variant-numeric: tabular-nums; min-width: 0; overflow-wrap: anywhere; }
.diag-empty { font-size: 13px; color: var(--text-secondary); margin: 0; }
.diag-actions { display: flex; gap: var(--space-2); margin-bottom: var(--space-3); flex-wrap: wrap; }
.diag-log { display: flex; flex-direction: column; gap: var(--space-2); max-height: 320px; overflow-y: auto; }
.diag-entry { padding: var(--space-2) var(--space-3); border: 1px solid var(--border, rgba(0,0,0,0.08)); border-radius: var(--radius-md); background: var(--danger-soft); }
.diag-head { display: flex; justify-content: space-between; align-items: baseline; gap: var(--space-2); }
.diag-code { font-size: 11px; font-weight: 700; letter-spacing: 0.03em; color: var(--danger); font-family: ui-monospace, SFMono-Regular, Menlo, monospace; }
.diag-time { font-size: 11px; color: var(--text-tertiary); }
.diag-msg { font-size: 13px; color: var(--text-primary); margin-top: 2px; word-break: break-word; }
.diag-ctx { font-size: 11px; color: var(--text-secondary); margin-top: 2px; font-family: ui-monospace, SFMono-Regular, Menlo, monospace; }

/* Full-screen render-failure recovery panel */
.error-state { max-width: 520px; margin: 12vh auto 0; padding: var(--space-6); text-align: center; }
.error-state h1 { font-size: 20px; margin: 0 0 var(--space-3); color: var(--text-primary); }
.error-state p { font-size: 14px; color: var(--text-secondary); margin: 0 0 var(--space-4); line-height: 1.5; }
.error-state-msg { text-align: left; font-size: 12px; font-family: ui-monospace, SFMono-Regular, Menlo, monospace; background: var(--danger-soft); color: #c95555; padding: var(--space-3); border-radius: var(--radius-md); overflow-x: auto; white-space: pre-wrap; word-break: break-word; }
.error-state-actions { display: flex; gap: var(--space-2); justify-content: center; margin-top: var(--space-4); flex-wrap: wrap; }
.error-state-foot { font-size: 11px; color: var(--text-tertiary); margin-top: var(--space-4); }

.toolbar {
  display: flex;
  gap: var(--space-3);
  flex-wrap: wrap;
  align-items: center;
  margin-bottom: var(--space-5);
}

.section-header {
  display: flex;
  justify-content: space-between;
  align-items: center;
  gap: var(--space-3);
  margin-bottom: var(--space-4);
  flex-wrap: wrap;
}
.section-header h2 { font-size: 22px; font-weight: 700; letter-spacing: -0.02em; }
.section-header p { font-size: 14px; color: var(--text-secondary); }

.row-action-buttons { display: flex; gap: var(--space-1); justify-content: flex-end; }

/* ============================================================
   RESPONSIVE
   ============================================================ */
@media (max-width: 880px) {
  .grid-cols-4 { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  .grid-cols-3 { grid-template-columns: repeat(2, minmax(0, 1fr)); }
}

@media (max-width: 720px) {
  .primary-nav, .header-actions { display: none; }
  .app-header { padding: 0 var(--space-4); }
  .mobile-nav { display: flex; }
  .fab { display: flex; }
  .app-main {
    /* Bottom padding clears BOTH the fixed mobile nav AND the FAB that floats
       above it (bottom = nav+safe+12, height 56). Without the FAB allowance the
       last offer card scrolled under the button (~36px overlap at 375px). */
    padding: var(--space-4) var(--space-4) calc(var(--bottom-nav-height) + env(safe-area-inset-bottom, 0px) + 12px + 56px + var(--space-3));
  }
  .hero { padding: var(--space-4) var(--space-3); border-radius: var(--radius-lg); }
  .hero-amount { font-size: 36px; }
  .hero-label { font-size: 13px; letter-spacing: 0.02em; } /* R62: match tightened desktop value */
  .grid-cols-4, .grid-cols-3, .grid-cols-2 { grid-template-columns: 1fr 1fr; }
  .grid-cols-2.mobile-stack { grid-template-columns: 1fr; }
  .stat-card { padding: var(--space-4); }
  .stat-value { font-size: 22px; }
  /* Mobile portrait timeline: narrower sticky label column; single
     scroll container handles both axes, Y-axis stays frozen. */
  .timeline-row-label {
    flex: 0 0 85px;
    width: 85px;
    font-size: 12px;
    padding: 5px 8px 6px;
  }
  .timeline-row-label > span:first-child {
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
    line-height: 1.35;
  }
  .timeline-row-label .sub { font-size: 10px; }
  .tl-axis-tick { font-size: 10px; }
  .modal { padding: 0; align-items: flex-end; }
  .modal-card { max-width: 100%; width: 100%; max-height: 92vh; border-radius: var(--radius-xl) var(--radius-xl) 0 0; }
  .modal-header { padding: var(--space-4); }
  .modal-body {
    padding: var(--space-4);
    overflow-x: hidden;
    overflow-y: auto;
  }
  .modal-footer { padding: var(--space-4) var(--space-4) calc(var(--space-4) + env(safe-area-inset-bottom, 12px)); }
  /* Same flex-column rule as landscape so every field is uniform width
     regardless of any `style="grid-column"` annotations in the source. */
  .form-grid { display: flex; flex-direction: column; gap: 12px; }
  .field { width: 100%; max-width: 100%; min-width: 0; }
  .field > * { max-width: 100%; min-width: 0; box-sizing: border-box; }
  .input, .select, .textarea, .input-group { width: 100%; max-width: 100%; min-width: 0; box-sizing: border-box; }
  .field[style*="grid-column"] { grid-column: auto !important; }
  .section-header h2 { font-size: 20px; }
  .planner-add-btn { display: none; }
}

@media (max-width: 480px) {
  .grid-cols-4, .grid-cols-3, .grid-cols-2 { grid-template-columns: 1fr; }
  .hero-amount { font-size: 34px; }
  /* Modal action rows carry up to four buttons (Delete · Save as template ·
     Cancel · Save). At <=480px the modal is full-width and that row no longer
     fits on one line — let it wrap so the primary Save button never spills off
     the right edge and out of reach. Desktop keeps the single row (the 640px
     modal has room). The inner group (right-aligned actions) wraps too. */
  .modal-footer { flex-wrap: wrap; row-gap: var(--space-2); }
  .modal-footer > div { flex-wrap: wrap; justify-content: flex-end; }
}

/* Portrait-only: header scrolls away naturally to reclaim ~64 px of
   vertical space when the user is working in a chart or reading a
   long list. Landscape (handled below) keeps the header sticky since
   landscape phone screens are short and quick nav access matters. */
@media (max-width: 720px) and (orientation: portrait) {
  .app-header { position: static; top: auto; }
}

/* ============================================================
   LANDSCAPE on phones / small tablets
   Vertical real-estate is the constraint. Compact the header, hero,
   and timeline rows so column titles aren't truncated and the chart
   isn't hidden behind the bottom nav.
   ============================================================ */
@media (max-width: 1024px) and (orientation: landscape) {
  :root {
    --header-height: 50px;
    --bottom-nav-height: 56px;
  }
  .app-header { height: 50px; }
  .mobile-nav { height: 56px; }
  .mobile-nav .nav-btn { padding: 4px 8px; font-size: 10px; }
  .mobile-nav .nav-btn svg { width: 18px; height: 18px; }
  .app-main {
    padding: var(--space-3) var(--space-4) calc(var(--bottom-nav-height) + var(--space-4));
  }
  .hero {
    padding: var(--space-4);
    border-radius: var(--radius-lg);
  }
  .hero-amount { font-size: 28px; line-height: 1; }
  .hero-meta { font-size: 12px; gap: 8px; }
  /* Section titles: keep readable but tighter top margin so they don't
     eat the visible chart area. */
  .section-header { margin-bottom: var(--space-3); }
  .section-header h2 { font-size: 18px; }
  /* Stat cards row: tighter padding so a 2x or 3x grid fits. */
  .stat-card { padding: var(--space-3); }
  .stat-value { font-size: 20px; }
  .stat-label { font-size: 11px; }
  /* Timeline rows: no longer compress in landscape — 38 px was too short
     for the sub line to fit without clipping. Use the same min-height as
     portrait so content is never clipped regardless of orientation. */
  .timeline-row-label, .timeline-row-track { min-height: 44px; }
  .timeline-row-label { padding-top: 5px; padding-bottom: 6px; }
  .timeline-row-label.axis, .timeline-row-track.axis { min-height: 32px; }
  /* Modal: cap at 480 px centered so inputs feel proportional rather
     than stretched edge-to-edge across a 720+ px landscape viewport.
     Single-column form is non-negotiable here — 2-column grids on a
     short landscape phone crash labels into adjacent inputs. */
  .modal { padding: var(--space-3); align-items: center; }
  .modal-card {
    max-height: 92vh;
    max-width: 480px;
    width: calc(100% - 32px);
    margin: auto;
    border-radius: var(--radius-xl);
  }
  .modal-body {
    overflow-y: auto;
    overflow-x: hidden;
    padding: var(--space-4);
  }
  .modal-header, .modal-footer { padding: var(--space-3) var(--space-4); }
  /* Force single-column flex (NOT grid) so every field is the same
     width, no matter what `style="grid-column"` annotations the source
     puts on individual fields. */
  .form-grid {
    display: flex;
    flex-direction: column;
    gap: 12px;
  }
  .field { width: 100%; min-width: 0; max-width: 100%; }
  .field > * { max-width: 100%; min-width: 0; box-sizing: border-box; }
  .input, .select, .textarea, .input-group { width: 100%; max-width: 100%; min-width: 0; box-sizing: border-box; }
  /* Spanned grid-column overrides on individual fields are no-ops in a
     flex column — neutralize them defensively in case any inline style
     makes them try to behave like grid items. */
  .field[style*="grid-column"] { grid-column: auto !important; }
}

@media (min-width: 880px) {
  .planner-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(340px, 1fr));
    gap: var(--space-4);
  }
  .combo-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(360px, 1fr));
    gap: var(--space-4);
  }
}

@media (min-width: 481px) and (max-width: 879px) {
  .planner-grid {
    display: grid;

}

@media (max-width: 480px) {
  .planner-grid, .combo-grid { display: flex; flex-direction: column; gap: var(--space-4); }
}

/* Visually hidden but accessible */

  position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px;

<body>
<div class="app-shell" id="app">
  <!-- Populated by JS -->
</div>

<script>
'use strict';

/* ============================================================
   CONSTANTS & STORAGE
   ============================================================ */
const STORAGE_KEY = 'capital-planner-v1';

/* --- App version & build stamp ------------------------------------------
   APP_VERSION is the single user-facing build identifier, shown in
   Settings → About. Bump it on every meaningful release (date-build
   format: YYYY.MM.DD, append a letter — 2026.06.14b — for a second build
   the same day) and create a matching `stable-YYYY-MM-DD` git tag. Because
   the PWA is served from cache, this is the only reliable way to confirm
   which build a phone is actually running. package.json `version` is
   dev-only metadata and tracked separately. */
const APP_VERSION = '2026.07.08c';

/* --- Diagnostics & error logging ----------------------------------------
   The app runs on a phone with no console, so an uncaught error would
   otherwise vanish. logError() categorizes failures with a stable code and
   keeps the last DIAG_MAX in a localStorage ring buffer, surfaced in
   Settings → About & diagnostics where they can be copied into a report. */
const DIAG_KEY = 'yv-diag-log-v1';
const DIAG_MAX = 25;
const ErrCode = {
  STORAGE:   'E_STORAGE',    // localStorage read/write failed
  PARSE:     'E_PARSE',      // JSON.parse of local/cloud state failed
  SYNC_PUSH: 'E_SYNC_PUSH',  // Gist push failed
  SYNC_PULL: 'E_SYNC_PULL',  // Gist pull/fetch failed
  RENDER:    'E_RENDER',     // a render pass threw
  UNCAUGHT:  'E_UNCAUGHT',   // window 'error' event
  PROMISE:   'E_PROMISE',    // unhandledrejection
  PWA:       'E_PWA',        // icon/manifest setup
};

function readDiagLog() {
  try { const a = JSON.parse(localStorage.getItem(DIAG_KEY) || '[]'); return Array.isArray(a) ? a : []; }
  catch { return []; }
}
function clearDiagLog() { try { localStorage.removeItem(DIAG_KEY); } catch {} }

function logError(code, err, context) {
  const entry = {
    t: new Date().toISOString(),
    code: code || 'E_UNKNOWN',
    msg: (err && err.message) ? err.message : String(err == null ? '' : err),
    ctx: context || '',
    stack: (err && err.stack) ? String(err.stack).split('\n').slice(0, 4).join('\n') : ''
  };
  try { console.error(`[${entry.code}] ${entry.ctx}`.trim(), err); } catch {}
  try {
    const log = readDiagLog();
    log.unshift(entry);
    localStorage.setItem(DIAG_KEY, JSON.stringify(log.slice(0, DIAG_MAX)));
  } catch {}
  return entry;
}

/* Global safety nets. Without these an uncaught exception or rejected
   promise dies silently — a blank screen on iOS with no breadcrumb. */
function installErrorHandlers() {
  window.addEventListener('error', (e) => {
    // Bubbling-phase listener: catches script errors, not resource 404s.
    logError(ErrCode.UNCAUGHT, e.error || e.message, e.filename ? `${e.filename}:${e.lineno}:${e.colno}` : '');
    toast('Something went wrong — see Settings → About & diagnostics', 'danger');
  });
  window.addEventListener('unhandledrejection', (e) => {
    // Rejections are often benign (aborted fetch on navigation); log
    // quietly without a toast so we don't cry wolf.
    logError(ErrCode.PROMISE, e.reason, 'unhandledrejection');
  });
}

/* Storage probe for the About panel. */
function storageHealth() {
  try { const k = '__yv_probe__'; localStorage.setItem(k, '1'); localStorage.removeItem(k); return 'OK'; }
  catch { return 'Unavailable'; }
}

/* Minimal clipboard helper (no existing one to reuse). GitHub Pages is
   https, so the async Clipboard API is available; fall back to a hidden
   textarea + execCommand for older iOS. */
function copyText(text) {
  if (navigator.clipboard && navigator.clipboard.writeText) {
    return navigator.clipboard.writeText(text);
  }
  return new Promise((resolve, reject) => {
    try {
      const ta = document.createElement('textarea');
      ta.value = text; ta.style.position = 'fixed'; ta.style.opacity = '0';
      document.body.appendChild(ta); ta.focus(); ta.select();
      const ok = document.execCommand('copy');
      document.body.removeChild(ta);
      ok ? resolve() : reject(new Error('copy command rejected'));
    } catch (e) { reject(e); }
  });
}

const TODAY = startOfDay(new Date());

const STATUSES = ['prospect', 'selected', 'applied', 'funded', 'completed', 'skipped'];
const STATUS_LABELS = {
  prospect: 'Prospect',
  selected: 'Selected',
  applied: 'Applied',
  funded: 'Funded',
  completed: 'Completed',
  skipped: 'Skipped'
};
const STATUS_CHIP_CLASS = {
  prospect: 'chip-muted',
  selected: 'chip-accent',
  applied: 'chip-accent',
  funded: 'chip-accent',
  completed: 'chip-success',
  skipped: 'chip-muted'
};

/* ============================================================
   TWO-FIELD STATUS MODEL (account status + sub status)
   ============================================================
   The UI exposes two fields per offer:
     accountStatus: 'open' | 'closed'
     subStatus:     prospect | applied | approved | denied | on-track |
                    met-waiting | earned | didnt-track | archived
   The legacy single `offer.status` (prospect/selected/applied/funded/
   completed/skipped) is KEPT as a derived shadow value so all existing
   projection/timeline/chip/optimizer logic (44 call sites) keeps working
   untouched. deriveLegacyStatus() maps the two new fields onto it.
   ============================================================ */
const ACCOUNT_STATUSES = ['open', 'closed'];
const ACCOUNT_STATUS_LABELS = { open: 'Open', closed: 'Closed' };
const SUB_STATUSES = ['prospect', 'applied', 'approved', 'denied', 'on-track', 'met-waiting', 'earned', 'didnt-track', 'archived'];
const SUB_STATUS_LABELS = {
  prospect: 'Prospect', applied: 'Applied', approved: 'Approved', denied: 'Denied',
  'on-track': 'On-Track', 'met-waiting': 'Met (Waiting)', earned: 'Earned',
  'didnt-track': "Didn't Track", archived: 'Archived'
};
const SUB_STATUS_CHIP_CLASS = {
  prospect: 'chip-muted', applied: 'chip-accent', approved: 'chip-accent',
  denied: 'chip-danger', 'on-track': 'chip-accent', 'met-waiting': 'chip-warn',
  earned: 'chip-success', 'didnt-track': 'chip-muted', archived: 'chip-muted'
};
// Sub-statuses that auto-flip the account to Open when selected.
const SUBSTATUS_FLIPS_OPEN = new Set(['approved', 'on-track', 'met-waiting', 'earned', 'didnt-track']);
// Card 1 "Working toward a SUB": account open + actively pursuing.
const WORKING_SUB_STATUSES = new Set(['approved', 'on-track', 'met-waiting']);
// "Pre-account" sub-statuses: you haven't opened the account yet, so the
// account defaults to Closed but that does NOT force-exclude them (they
// remain hypothetical, includable via the scenario checkbox). Only an
// account that was OPENED and then Closed force-excludes.
const PRE_ACCOUNT_SUB_STATUSES = new Set(['prospect', 'applied']);
function defaultAccountForSub(subStatus) {
  return SUBSTATUS_FLIPS_OPEN.has(subStatus) ? 'open' : 'closed';
}

// New (account, sub) → legacy status, encoding the projection rules:
//  - Account Closed force-excludes ONLY when the account was meaningfully
//    open (not for pre-account prospect/applied, which stay hypothetical).
//  - Approved/On-Track/Met/Earned → 'funded' (confirmed; capital frees
//    naturally at the withdrawal date via the projection engine).
//  - Prospect → 'prospect', Applied → 'selected' (both hypothetical).
//  - Denied → 'skipped'; Didn't Track / Archived → 'completed' (excluded).
function deriveLegacyStatus(accountStatus, subStatus) {
  if (accountStatus === 'closed' && !PRE_ACCOUNT_SUB_STATUSES.has(subStatus)) return 'completed';
  switch (subStatus) {
    case 'prospect': return 'prospect';
    case 'applied': return 'selected';
    case 'approved':
    case 'on-track':
    case 'met-waiting':
    case 'earned': return 'funded';
    case 'denied': return 'skipped';
    case 'didnt-track': return 'completed';
    case 'archived': return 'completed';
    default: return 'prospect';
  }
}
// Legacy status → new fields (one-time migration for offers saved before
// the redesign). Pre-account statuses (prospect/selected) → account
// Closed (not opened yet). old 'applied' was confirmed → Approved (open);
// 'funded' → On-Track (open); completed/skipped → closed.
function migrateLegacyStatus(legacy) {
  switch (legacy) {
    case 'prospect': return { accountStatus: 'closed', subStatus: 'prospect' };
    case 'selected': return { accountStatus: 'closed', subStatus: 'prospect' };
    case 'applied': return { accountStatus: 'open', subStatus: 'approved' };
    case 'funded': return { accountStatus: 'open', subStatus: 'on-track' };
    case 'completed': return { accountStatus: 'closed', subStatus: 'earned' };
    case 'skipped': return { accountStatus: 'closed', subStatus: 'archived' };
    default: return { accountStatus: 'closed', subStatus: 'prospect' };
  }
}
// Ensure an offer has both new fields and a synced legacy status. Safe to
// call repeatedly. Run on load (migration) and after any status edit.
function normalizeOfferStatus(o) {
  if (!o) return o;
  if (!o.subStatus) {
    const m = migrateLegacyStatus(o.status || 'prospect');
    o.subStatus = m.subStatus;
    if (!o.accountStatus) o.accountStatus = m.accountStatus;
  }
  if (!o.accountStatus) o.accountStatus = defaultAccountForSub(o.subStatus);
  o.status = deriveLegacyStatus(o.accountStatus, o.subStatus);
  return o;
}

// Mint a stable per-DD `id` on any direct-deposit row loaded from storage
// that predates the field, so reminder-feed items keyed
// `yv-<offerId>-dd-<ddId>` bind to the DD identity, never its array index
// (step-6 amendment 5). Idempotent: rows that already have an id keep it.
// Runs on load; new rows get ids at creation (readDdRowsFromForm/addDdRow).
function migrateDdIds(o) {
  if (!o || !Array.isArray(o.directDeposits)) return o;
  for (const dd of o.directDeposits) {
    if (dd && !dd.id) dd.id = uid('dd');
  }
  return o;
}

// Migrate the debit requirement from the legacy absolute `byDate` (a fixed
// calendar deadline) to the new relative `withinDays` (days after the
// planned sign-up date), the same shape as daysAfterSignupAllowedBeforeDeposit.
// Idempotent + additive (never drops the user's constraint):
//   • Already has withinDays → leave it.
//   • Has byDate + a sign-up date → withinDays = round(byDate − signup),
//     floored at 1; byDate is stashed in `byDateLegacy` (not lost, but no
//     longer authoritative) so a re-derivation is possible if the user
//     later changes the sign-up date.
//   • Has byDate but NO sign-up date yet → can't derive days now; preserve
//     byDate in `byDateLegacy` and derive withinDays lazily once a sign-up
//     date exists (see reconcileDebitWithinDays).
function migrateDebitRequirement(o) {
  const dr = o && o.debitRequirement;
  if (!dr) return o;
  if (dr.withinDays != null && dr.withinDays !== '') return o; // already migrated
  const legacyByDate = dr.byDate || dr.byDateLegacy || '';
  if (!legacyByDate) return o; // nothing to convert (new/empty requirement)
  const signup = parseDate(o.plannedSignupDate);
  const by = parseDate(legacyByDate);
  if (signup && by) {
    dr.withinDays = Math.max(1, Math.round(daysBetween(signup, by)));
  }
  // Preserve the original absolute deadline so nothing is lost and a later
  // sign-up-date change can re-derive; clear the now-non-authoritative byDate.
  dr.byDateLegacy = legacyByDate;
  dr.byDate = '';
  return o;
}

// Lazily derive withinDays from a preserved legacy absolute deadline once a
// sign-up date becomes available (the migration deferred it when the offer
// had no sign-up date). Safe to call on every load after migrateDebitRequirement.
function reconcileDebitWithinDays(o) {
  const dr = o && o.debitRequirement;
  if (!dr || !dr.required) return o;
  if (dr.withinDays != null && dr.withinDays !== '') return o;
  if (!dr.byDateLegacy) return o;
  const signup = parseDate(o.plannedSignupDate);
  const by = parseDate(dr.byDateLegacy);
  if (signup && by) dr.withinDays = Math.max(1, Math.round(daysBetween(signup, by)));
  return o;
}

/* ============================================================
   SCHEMA V2 — requirements[] layer over legacy offer fields.
   ============================================================
   The legacy fields (ddRequirement, debitRequirement, directDeposits,
   requiredFundingAmount, funding-window/hold day-counts) stay CANONICAL
   for every existing consumer — renders, feed, projection, ROI, lock
   math. The v2 `requirements[]` rows are an additive richer layer:
     • source:'derived' rows are a read-only projection of legacy fields,
       refreshed from legacy on every load + save (see syncRequirementsWith-
       Legacy). Their id is tied to the legacy source (never an array index)
       so refresh is a keyed upsert and later-step feed items bind to
       requirement identity, exactly like the per-DD feed keys do today.
     • source:'user' rows are NEW requirement types with no legacy equivalent
       (e-statements, maintain balance, promo code, …). Authoritative in
       their own right; the derivation layer never touches them.
   Design: docs/assessments/2026-07-07-schema-v2-design.md. */

// The v2 requirement row types. `derived` rows use a subset; `user` rows
// (added by later form-UI steps) can use any. Kept as a doc-only reference
// list — no runtime enum enforcement (matches the loose offerType handling).
const REQUIREMENT_TYPES = [
  'spend', 'deposit', 'direct_deposit_amt', 'direct_deposit_count',
  'transactions', 'debit_txns', 'activate_debit', 'estatements',
  'online_banking', 'maintain_balance', 'promo_code', 'custom'
];

// Per-type UI metadata for the Requirements section (step 3). `label` is the
// human dropdown/display name; `money`/`count` flag which numeric inputs the
// type exposes (a `$` amount, an integer count, or neither). This is the single
// source both the add-row dropdown and per-row field rendering read, so the two
// can't drift.
const REQUIREMENT_TYPE_META = {
  spend:                { label: 'Spend ($)',            money: true,  count: false },
  deposit:              { label: 'Deposit ($)',          money: true,  count: false },
  direct_deposit_amt:   { label: 'Direct Deposit ($)',   money: true,  count: false },
  direct_deposit_count: { label: 'Direct Deposits (#)',  money: false, count: true  },
  transactions:         { label: 'Transactions (#)',     money: false, count: true  },
  debit_txns:           { label: 'Debit Transactions (#)', money: false, count: true },
  activate_debit:       { label: 'Activate Debit Card',  money: false, count: false },
  estatements:          { label: 'Enroll e-Statements',  money: false, count: false },
  online_banking:       { label: 'Enroll Online Banking', money: false, count: false },
  maintain_balance:     { label: 'Maintain Balance ($)', money: true,  count: false },
  promo_code:           { label: 'Enter Promo Code',     money: false, count: false },
  custom:               { label: 'Custom',               money: true,  count: true  }
};
const REQUIREMENT_FREQUENCIES = ['total', 'monthly', 'per_statement'];
const REQUIREMENT_FREQ_LABELS = { total: 'Total', monthly: 'Monthly', per_statement: 'Per statement' };

// Display title for a requirement row: an explicit label wins (custom rows,
// derived rows already carry a computed label); otherwise fall back to the
// type's human name. Keeps the card checklist / feed titles readable.
function requirementDisplayLabel(row) {
  if (!row) return '';
  if (row.label && String(row.label).trim()) return String(row.label).trim();
  const meta = REQUIREMENT_TYPE_META[row.type];
  return meta ? meta.label : (row.type || 'Requirement');
}

// The absolute calendar deadline for a requirement row, as an ISO string, or
// '' when it can't be computed. Anchored on the SAME sign-up date the existing
// deposit/debit deadline math uses (offer.plannedSignupDate): deadline_days is
// stored relative to it (deriveRequirementsFromLegacy computes derived rows'
// day-counts the same way), so a sign-up-date edit re-dates every row with no
// stored absolute date to drift. A signupOverride (ISO) lets the modal compute
// live against the currently-typed sign-up field before save.
function requirementDeadlineISO(offer, row, signupOverride) {
  if (!row || row.deadline_days == null || row.deadline_days === '') return '';
  const days = Number(row.deadline_days);
  if (!Number.isFinite(days)) return '';
  const anchor = parseDate(signupOverride != null ? signupOverride : (offer && offer.plannedSignupDate));
  if (!anchor) return '';
  return isoDate(addDays(anchor, days));
}

// A short "$amount · frequency" style summary for a requirement row, used as
// the feed item notes and the card checklist sub-line. Empty parts are omitted.
function requirementSummary(row) {
  if (!row) return '';
  const parts = [];
  if (row.amount != null && row.amount !== '') parts.push(formatCurrency(Number(row.amount)));
  if (row.count != null && row.count !== '') parts.push(`${Number(row.count)}×`);
  if (row.frequency && row.frequency !== 'total') parts.push(REQUIREMENT_FREQ_LABELS[row.frequency] || row.frequency);
  return parts.join(' · ');
}

// Build a fresh requirement row with all fields defaulted. `over` supplies
// the derived/known fields; done/done_date/notes default empty so a new
// derived row starts un-done (syncRequirementsWithLegacy preserves those
// across refreshes for rows that already exist).
function makeRequirementRow(over) {
  return Object.assign({
    id: '', type: 'custom', label: '', amount: null, count: null,
    deadline_days: null, frequency: 'total', hold_days: null,
    done: false, done_date: null, source: 'user', notes: ''
  }, over || {});
}

// PURE: compute the set of derived requirement rows from an offer's current
// legacy fields. Allocates new rows (source:'derived') with STABLE ids tied
// to each legacy source — never merges or reads existing requirements. Every
// legacy access is guarded so offers missing a sub-object (e.g. seed offers
// with no ddRequirement/debitRequirement/directDeposits) simply yield fewer
// rows rather than throwing. Deterministic order: funding, ddreq, per-DD (in
// array order), debit — so a re-run with unchanged legacy is byte-identical.
function deriveRequirementsFromLegacy(offer) {
  const rows = [];
  if (!offer) return rows;

  // requiredFundingAmount → a single `deposit` obligation. deadline_days is
  // the funding window (daysAfterSignupAllowedBeforeDeposit); hold_days is the
  // post-funding lock (daysFundsMustRemain). Both may be null.
  const funding = (offer.requiredFundingAmount != null && offer.requiredFundingAmount !== '')
    ? Number(offer.requiredFundingAmount) : null;
  if (funding != null && funding > 0) {
    rows.push(makeRequirementRow({
      id: 'req-funding', type: 'deposit', source: 'derived',
      label: 'Fund account',
      amount: funding,
      deadline_days: (offer.daysAfterSignupAllowedBeforeDeposit != null && offer.daysAfterSignupAllowedBeforeDeposit !== '')
        ? Number(offer.daysAfterSignupAllowedBeforeDeposit) : null,
      hold_days: (offer.daysFundsMustRemain != null && offer.daysFundsMustRemain !== '')
        ? Number(offer.daysFundsMustRemain) : null
    }));
  }

  // ddRequirement count/frequency spec → a `direct_deposit_count` obligation
  // (the COUNT/frequency requirement, distinct from the individual scheduled
  // DD rows below). frequency maps count-mode → 'total', frequency-mode → the
  // period cadence. Only emitted when a positive count is specified.
  // MATERIALIZATION GATE (step-3 fix #2): the offer form writes a DEFAULT
  // ddRequirement ({mode:'count',count:1,…}) for EVERY offer regardless of type,
  // so gating only on "count > 0" would grow a phantom req-ddreq row on every
  // saved new-funds-held offer that never had a DD requirement. A ddRequirement
  // is only a real obligation for the DD-family types, so require the offerType
  // to be one of them before deriving the row. (Per-DD rows below are naturally
  // gated — a non-DD offer has no directDeposits[] entries.)
  const isDdFamily = offer.offerType === 'direct-deposit' || offer.offerType === 'held-and-dd';
  const ddReq = isDdFamily ? offer.ddRequirement : null;
  if (ddReq) {
    if (ddReq.mode === 'frequency') {
      const periods = Number(ddReq.freqPeriods) || null;
      if (periods && periods > 0) {
        rows.push(makeRequirementRow({
          id: 'req-ddreq', type: 'direct_deposit_count', source: 'derived',
          label: `Direct deposits (${periods}× per ${ddReq.freqEvery || 'month'})`,
          count: periods,
          frequency: (ddReq.freqEvery === 'week' || ddReq.freqEvery === '2weeks') ? 'monthly' : 'monthly'
        }));
      }
    } else {
      const cnt = Number(ddReq.count) || null;
      if (cnt && cnt > 0) {
        rows.push(makeRequirementRow({
          id: 'req-ddreq', type: 'direct_deposit_count', source: 'derived',
          label: `Direct deposits (${cnt} total)`,
          count: cnt, frequency: 'total'
        }));
      }
    }
  }

  // Each scheduled directDeposits[] row → a per-DD `direct_deposit_amt` row,
  // id reusing the DD's own persisted id (minted by migrateDdIds) so it stays
  // stable across reorders. deadline_days derived from the DD's plannedDate vs
  // the sign-up date when both exist.
  if (Array.isArray(offer.directDeposits)) {
    const signup = parseDate(offer.plannedSignupDate);
    for (const dd of offer.directDeposits) {
      if (!dd || !dd.id) continue; // ids are guaranteed by migrateDdIds on load
      const amt = (dd.amount != null && dd.amount !== '') ? Number(dd.amount) : null;
      const planned = parseDate(dd.plannedDate);
      const deadline = (signup && planned) ? Math.round(daysBetween(signup, planned)) : null;
      rows.push(makeRequirementRow({
        id: `req-dd-${dd.id}`, type: 'direct_deposit_amt', source: 'derived',
        label: 'Direct deposit',
        amount: amt,
        deadline_days: (deadline != null && deadline >= 0) ? deadline : null
      }));
    }
  }

  // debitRequirement (when required) → a `debit_txns` obligation. deadline_days
  // is the relative withinDays (migrateDebitRequirement already converted any
  // legacy absolute byDate to withinDays).
  const dr = offer.debitRequirement;
  if (dr && dr.required) {
    rows.push(makeRequirementRow({
      id: 'req-debit', type: 'debit_txns', source: 'derived',
      label: 'Debit transactions',
      count: (dr.count != null && dr.count !== '') ? Number(dr.count) : null,
      deadline_days: (dr.withinDays != null && dr.withinDays !== '') ? Number(dr.withinDays) : null
    }));
  }

  return rows;
}

// Refresh an offer's source:'derived' requirement rows IN PLACE from its
// current legacy fields — called on load (migration) and on every form save.
//   • Existing derived row (matched by id) → its derived fields are refreshed
//     but done/done_date/notes are PRESERVED (a user's "I did this deposit"
//     survives editing the deposit amount).
//   • New derived source → row appended.
//   • Derived row whose legacy source is gone (DD deleted, debit unset, funding
//     cleared) → removed.
//   • source:'user' rows are never inspected or modified.
// Idempotent: unchanged legacy → identical requirements (same ids, same order).
function syncRequirementsWithLegacy(offer) {
  if (!offer) return offer;
  if (!Array.isArray(offer.requirements)) offer.requirements = [];

  const desired = deriveRequirementsFromLegacy(offer);
  const desiredById = new Map(desired.map(r => [r.id, r]));
  const desiredIds = new Set(desiredById.keys());

  // Index the offer's EXISTING derived rows by id (to preserve their progress).
  const existingDerived = new Map();
  for (const row of offer.requirements) {
    if (row && row.source === 'derived' && row.id) existingDerived.set(row.id, row);
  }

  // Rebuild the array: keep user rows untouched (in place), drop derived rows
  // whose source vanished, refresh-in-place survivors, append new derived rows.
  const next = [];
  // 1) user rows first stay wherever they were relative to each other; we keep
  //    them in their original positions by walking the original array and
  //    emitting user rows + surviving derived rows in order, then appending any
  //    brand-new derived rows at the end (deterministic: derive() order).
  const emittedDerived = new Set();
  for (const row of offer.requirements) {
    if (!row) continue;
    if (row.source === 'user') { next.push(row); continue; }
    if (row.source === 'derived') {
      if (!row.id || !desiredIds.has(row.id)) continue; // source gone → drop
      // Refresh derived fields in place; preserve progress + notes.
      const d = desiredById.get(row.id);
      row.type = d.type; row.label = d.label; row.amount = d.amount;
      row.count = d.count; row.deadline_days = d.deadline_days;
      row.frequency = d.frequency; row.hold_days = d.hold_days;
      next.push(row);
      emittedDerived.add(row.id);
      continue;
    }
    // Unknown source (defensive) — keep as-is so nothing is silently lost.
    next.push(row);
  }
  // 2) Append derived rows that didn't already exist, in derive() order.
  for (const d of desired) {
    if (!emittedDerived.has(d.id)) next.push(d);
  }

  offer.requirements = next;
  return offer;
}

// V2 scalar-field defaults (churnability, promoted fees/promo, bonus-post
// window). Applied once per offer in migrateOffersToSchemaV2 and used as the
// literal defaults spread into a new offer on save. Kept as a factory so the
// migration and readOfferForm can't drift.
function schemaV2Defaults() {
  return {
    churnable: null,               // true | false | null (unknown)
    churn_wait_months: null,       // Number | null
    churn_anchor: 'bonus_received',// 'bonus_received' | 'account_closed' | 'account_opened'
    churn_notes: '',
    churn_snoozed_until: null,     // ISO | 'forever' | null — snooze the churn
                                   // section/feed for this offer. Personal state;
                                   // deliberately NOT in TEMPLATE_TERMS_KEYS.

    bonus_received_date: null,     // ISO | null (anchor date; new — no legacy equiv)
    closed_date: null,             // ISO | null (anchor date; new — no legacy equiv)
    monthly_fee: null,             // Number | null
    fee_waiver_condition: '',
    promo_code: '',
    early_termination_fee: null,   // Number | null
    etf_window_days: null,         // Number | null
    bonus_post_min_days: null,     // Number | null
    bonus_post_max_days: null      // Number | null
  };
}

/* ============================================================
   OFFER TEMPLATES (F5) — the personal "mini Deal Radar"
   ------------------------------------------------------------
   A template is an offer's TERMS with every scrap of personal data stripped:
   no planned dates, no entity/email, no notes, no status, no per-DD instances,
   no requirement done-state. It rides state.templates[] at the state root, so
   the existing localStorage + Gist sync carry it for free; it is NEVER read by
   buildReminderItems (that loop is state.offers only) so a template can never
   emit a feed item. The two functions below are PURE (no App/DOM/Date-of-save
   coupling except the fresh id + savedAt stamp) and are exported to a Node test
   harness that asserts the strip is total. */

// Whitelist of the OFFER keys a template preserves — offer TERMS only. Anything
// not on this list (plannedSignupDate, optionalPlannedFundingDate,
// bonus_received_date, closed_date, last_edited, entityUsed, emailUsed, notes,
// churn_notes, churn_snoozed_until, lifecycle_suggest_dismissed, accountStatus/subStatus/status,
// confidence, includeInScenario, directDeposits) is dropped by construction —
// a whitelist (not a blacklist) means a NEW personal field added to offers
// later can never silently leak into a template. color + docUrl are cosmetic /
// provenance and intentionally travel; offerExpirationDate stays because a
// template for an expired offer is still a valuable re-run reference.
const TEMPLATE_TERMS_KEYS = [
  'bankName', 'offerName', 'offerType',
  'signupBonusAmount', 'offerExpirationDate',
  'requiredFundingAmount', 'daysAfterSignupAllowedBeforeDeposit', 'daysFundsMustRemain',
  'monthly_fee', 'fee_waiver_condition', 'promo_code',
  'early_termination_fee', 'etf_window_days',
  'bonus_post_min_days', 'bonus_post_max_days',
  'churnable', 'churn_wait_months', 'churn_anchor',
  'color', 'docUrl'
];

// Strip a requirement row down to its OBLIGATION shape for a template: keep what
// the obligation IS (type/label/amount/count/deadline_days/frequency/hold_days)
// but drop every trace of PROGRESS or import provenance (done, done_date, notes,
// _fromImport) and force source:'user' (a template only carries the user's own
// rows; derived rows are re-computed from the terms on instantiation).
function stripRequirementForTemplate(row) {
  if (!row) return null;
  return {
    type: row.type || 'custom',
    label: row.label || '',
    amount: (row.amount === undefined ? null : row.amount),
    count: (row.count === undefined ? null : row.count),
    deadline_days: (row.deadline_days === undefined ? null : row.deadline_days),
    frequency: row.frequency || 'total',
    hold_days: (row.hold_days === undefined ? null : row.hold_days),
    source: 'user'
  };
}

// Copy a template's ddRequirement CONFIG (the requirement shape — mode/count/
// frequency) without any per-DD planned dates/instances (those live in the
// offer's directDeposits[], which templates never carry). Returns null when the
// source offer had none.
function templateDdRequirement(dd) {
  if (!dd || typeof dd !== 'object') return null;
  return {
    mode: dd.mode === 'frequency' ? 'frequency' : 'count',
    count: (dd.count == null ? null : Number(dd.count)),
    freqEvery: dd.freqEvery || 'month',
    freqPeriods: (dd.freqPeriods == null ? null : Number(dd.freqPeriods))
  };
}

// Copy a debit requirement's CONFIG for a template: keep required/count/
// withinDays (the obligation) but drop byDate/byDateLegacy (absolute dates are
// personal-timeline artifacts). Returns null when absent.
function templateDebitRequirement(dr) {
  if (!dr || typeof dr !== 'object') return null;
  return {
    required: !!dr.required,
    count: (dr.count == null ? null : Number(dr.count)),
    withinDays: (dr.withinDays == null ? null : Number(dr.withinDays))
  };
}

// PURE: build a reusable template from an offer. Personal data is stripped by
// whitelist (TEMPLATE_TERMS_KEYS) — the returned object contains NONE of the
// personal fields. Requirement rows are reduced to obligation shape (user rows
// only). A fresh tplId (tpl_… via the shared uid idiom) + savedAt ISO stamp are
// the only non-offer-derived values. Never mutates `offer`.
function offerToTemplate(offer) {
  const o = offer || {};
  const tpl = {
    tplId: uid('tpl'),
    savedAt: new Date().toISOString()
  };
  // Terms whitelist — copy only keys that are actually present so a template's
  // shape mirrors the offer's known fields (undefined terms simply omitted).
  for (const k of TEMPLATE_TERMS_KEYS) {
    if (k in o) tpl[k] = o[k];
  }
  // Requirement CONFIG objects (not the offer's live instances).
  tpl.ddRequirement = templateDdRequirement(o.ddRequirement);
  tpl.debitRequirement = templateDebitRequirement(o.debitRequirement);
  // User requirement rows only, stripped of done/done_date/notes/_fromImport.
  const reqs = Array.isArray(o.requirements) ? o.requirements : [];
  tpl.requirements = reqs
    .filter(r => r && r.source === 'user')
    .map(stripRequirementForTemplate)
    .filter(Boolean);
  return tpl;
}

// PURE: instantiate a fresh, unsaved OFFER from a template. Today-agnostic — no
// dates are invented (plannedSignupDate/funding dates start blank; the user
// sets them in the modal). Status starts at the prospect/closed defaults (a new
// offer is always a fresh prospect regardless of what the source offer was).
// A fresh offer id (off_…) is minted. Requirement rows are rehydrated through
// makeRequirementRow so downstream code sees a full row shape; derived rows are
// left for readOfferForm/syncRequirementsWithLegacy to recompute from the terms.
// Never mutates `tpl`.
function templateToOffer(tpl) {
  const t = tpl || {};
  const offer = {
    id: uid('off'),
    // Terms — pull straight from the template, falling back to schema-sane
    // empties so the offer object is always well-shaped for the modal render.
    bankName: t.bankName || '',
    offerName: t.offerName || '',
    offerType: (t.offerType && t.offerType !== 'other') ? t.offerType : 'new-funds-held',
    signupBonusAmount: (t.signupBonusAmount == null ? null : t.signupBonusAmount),
    offerExpirationDate: t.offerExpirationDate || '',
    requiredFundingAmount: (t.requiredFundingAmount == null ? null : t.requiredFundingAmount),
    daysAfterSignupAllowedBeforeDeposit: (t.daysAfterSignupAllowedBeforeDeposit == null ? 30 : t.daysAfterSignupAllowedBeforeDeposit),
    daysFundsMustRemain: (t.daysFundsMustRemain == null ? null : t.daysFundsMustRemain),
    ddRequirement: templateDdRequirement(t.ddRequirement),
    debitRequirement: t.debitRequirement
      ? Object.assign(templateDebitRequirement(t.debitRequirement), { byDate: '', byDateLegacy: '' })
      : { required: false, count: null, withinDays: null, byDate: '', byDateLegacy: '' },
    // Fees & terms scalars.
    monthly_fee: (t.monthly_fee == null ? null : t.monthly_fee),
    fee_waiver_condition: t.fee_waiver_condition || '',
    promo_code: t.promo_code || '',
    early_termination_fee: (t.early_termination_fee == null ? null : t.early_termination_fee),
    etf_window_days: (t.etf_window_days == null ? null : t.etf_window_days),
    bonus_post_min_days: (t.bonus_post_min_days == null ? null : t.bonus_post_min_days),
    bonus_post_max_days: (t.bonus_post_max_days == null ? null : t.bonus_post_max_days),
    // Churnability.
    churnable: (t.churnable === true ? true : (t.churnable === false ? false : null)),
    churn_wait_months: (t.churn_wait_months == null ? null : t.churn_wait_months),
    churn_anchor: t.churn_anchor || 'bonus_received',
    churn_notes: '',
    // Cosmetic / provenance travel with the template.
    color: t.color || '',
    docUrl: t.docUrl || '',
    // Personal fields — reset to fresh-prospect defaults, NO invented dates.
    plannedSignupDate: '',
    optionalPlannedFundingDate: '',
    bonus_received_date: null,
    closed_date: null,
    lockStartsFrom: 'funded date',
    status: 'prospect',
    accountStatus: 'closed',
    subStatus: 'prospect',
    includeInScenario: true,
    confidence: 'likely',
    notes: '',
    entityUsed: '',
    emailUsed: '',
    directDeposits: [],
    last_edited: null
  };
  // User requirement rows: rehydrate to full row shape (fresh ids, un-done).
  const reqs = Array.isArray(t.requirements) ? t.requirements : [];
  offer.requirements = reqs.map(r => makeRequirementRow(Object.assign(
    {}, stripRequirementForTemplate(r), { id: uid('req'), source: 'user' }
  )));
  return offer;
}

// One-time migration to schema v2. Runs in App.init AFTER the legacy
// per-offer migrations (so derivation reads already-normalized legacy values).
// Per offer lacking the v2 marker (presence of a `requirements` array):
//   • seed the new scalar fields (only if absent — never clobber),
//   • seed requirements:[] and run derivation,
//   • set last_edited:null (unknown history — we don't fabricate a timestamp).
// Idempotent: a second run finds `requirements` present and does the always-on
// derived-row sync only (no scalar re-seed, no last_edited reset). Before the
// FIRST mutation, snapshots the whole state to localStorage 'yv-backup-pre-v2'
// (only if that key is absent) for the Settings restore path; a quota failure
// is logged and must NOT block the app. Does NOT save()/schedulePush — leaves
// persistence to the next genuine user save (like the other init migrations).
function migrateOffersToSchemaV2(state) {
  if (!state || !Array.isArray(state.offers)) return state;

  // F5: tolerant guard for the templates root key. This runs at boot AND at
  // every cloud-adoption point (migrateOffersToSchemaV2 is called from all of
  // them), so a state loaded from an OLDER build (which never wrote templates)
  // or a corrupt value is normalized to [] before any code reads it. Root-level
  // and idempotent — leaves an existing array untouched.
  state.templates = Array.isArray(state.templates) ? state.templates : [];

  // Is there any pre-v2 offer? (one lacking the requirements marker) — gate the
  // backup on real work so we don't snapshot an already-v2 state.
  const needsMigration = state.offers.some(o => o && !Array.isArray(o.requirements));

  if (needsMigration) {
    // One-time full-state backup BEFORE the first mutation. Never overwrite an
    // existing (older, more original) backup. Quota/serialize failure is
    // degraded-not-fatal: log and continue migrating.
    try {
      if (localStorage.getItem('yv-backup-pre-v2') == null) {
        localStorage.setItem('yv-backup-pre-v2', JSON.stringify(state));
      }
    } catch (e) {
      logError(ErrCode.STORAGE, e, 'migrateOffersToSchemaV2: backup');
    }
  }

  for (const o of state.offers) {
    if (!o) continue;
    const firstTime = !Array.isArray(o.requirements);
    if (firstTime) {
      // Seed scalar defaults without clobbering any that somehow already exist.
      const defs = schemaV2Defaults();
      for (const k in defs) { if (!(k in o)) o[k] = defs[k]; }
      if (!('last_edited' in o)) o.last_edited = null; // unknown history
      o.requirements = [];
    }
    // Always-on: refresh derived rows from current legacy values (idempotent).
    syncRequirementsWithLegacy(o);
  }
  return state;
}

// True when the one-time pre-v2 backup snapshot exists in localStorage. Gates
// the Settings "Restore pre-v2 backup" button (rendered only when recoverable).
function hasPreV2Backup() {
  try { return localStorage.getItem('yv-backup-pre-v2') != null; }
  catch (e) { return false; }
}

// Drop the pre-v2 backup snapshot. Called by the destructive "Clear all data"
// flow so an erase can't be undone via the restore button (which would otherwise
// resurrect erased financial data), and after a successful restore consumes it.
// The next render re-hides the restore button (hasPreV2Backup() → false).
function clearPreV2Backup() {
  try { localStorage.removeItem('yv-backup-pre-v2'); }
  catch (e) { /* nothing to clear / storage unavailable — best effort */ }
}

// Restore the pre-v2 snapshot as an intentional local change.
//   • Sync configured → migrate the snapshot to v2 IN MEMORY first (so the
//     restored state renders coherently), stamp a fresh _lastModified, then hand
//     it to Sync.restoreState() — the existing "make THIS the truth" path, which
//     clears lineage (_baseRevision=null) and force-pushes past the CAS so the
//     restore becomes the new cloud head and CANNOT be silently clobbered by the
//     next startup pull (the R56 restore guard). No reload needed — restoreState
//     persists + renders; we migrated before handing off.
//   • Sync NOT configured → write localStorage directly + reload; the reload's
//     fresh init re-runs migrateOffersToSchemaV2, cleanly re-migrating the
//     restored pre-v2 payload (no cloud, so nothing to push).
// The consumed backup is cleared either way. Returns false (and toasts) on a
// missing/corrupt backup.
function restorePreV2Backup() {
  let raw;
  try { raw = localStorage.getItem('yv-backup-pre-v2'); }
  catch (e) { raw = null; }
  if (raw == null) { toast('No pre-v2 backup found', 'danger'); return false; }
  let snap;
  try { snap = JSON.parse(raw); }
  catch (e) { logError(ErrCode.PARSE, e, 'restorePreV2Backup'); toast('Backup is corrupt — could not restore', 'danger'); return false; }

  if (typeof Sync !== 'undefined' && Sync.isConfigured && Sync.isConfigured()) {
    // Migrate the pre-v2 snapshot to v2 before it becomes the live/pushed state,
    // and stamp it as a fresh intentional edit so timestamp comparisons on other
    // devices also pull it (restoreState's forced push already wins by lineage).
    App.state = snap;
    migrateOffersToSchemaV2(App.state);
    App.state._lastModified = Date.now();
    clearPreV2Backup();
    Sync.restoreState(App.state)
      .then(() => { render(); toast('Restored pre-v2 backup'); })
      .catch((e) => { logError(ErrCode.SYNC_PUSH, e, 'restorePreV2Backup: restoreState'); toast('Restore saved locally; cloud push failed', 'danger'); });
    return true;
  }

  // Unconfigured: direct write + reload (init re-migrates the restored payload).
  try {
    App.state = snap;
    localStorage.setItem(STORAGE_KEY, JSON.stringify(snap));
    clearPreV2Backup();
  } catch (e) {
    logError(ErrCode.STORAGE, e, 'restorePreV2Backup: write');
    toast('Could not write restored data', 'danger');
    return false;
  }
  location.reload();
  return true;
}

/* ============================================================
   OFFER COLOR PALETTE — 12 swatches, names not hex so the palette
   can be re-tuned without breaking saved offers. Per-bank identity
   coding for the card border, timeline bar, and chart marker stroke.

   Curated constraints:
   - THREE blues: navy (deep) + sky (cyan-light) + cobalt (royal/mid)
   - ONE red-like: rose (#e11d48) — distinctly more saturated/cool
     than the app's deadline red (#e87171, a washed coral). No
     confusion between identity-rose and meaning-red.
   - TWO neutral-darks: slate (cool blue-gray) + graphite (neutral)
   - Hues spread evenly so adjacent picks are visually distinct.

   NOTE: the `name` keys are the STORED value on offer.color and must
   stay stable for back-compat. The `hex` and `label` are display-only
   and can be re-tuned freely — changing them just re-skins existing
   offers using that key. That's why e.g. `name:'pink'` now renders as
   Cobalt blue and `name:'amber'` renders as Gold.
   ============================================================ */
const OFFER_COLOR_PALETTE = [
  { name: 'navy',    hex: '#1e3a8a', label: 'Navy' },
  { name: 'sky',     hex: '#0ea5e9', label: 'Sky' },
  { name: 'teal',    hex: '#0d9488', label: 'Teal' },
  { name: 'emerald', hex: '#059669', label: 'Emerald' },
  { name: 'lime',    hex: '#65a30d', label: 'Lime' },
  { name: 'amber',   hex: '#eab308', label: 'Gold' },
  { name: 'orange',  hex: '#ea580c', label: 'Orange' },
  { name: 'rose',    hex: '#e11d48', label: 'Rose' },
  { name: 'pink',    hex: '#2563eb', label: 'Cobalt' },
  { name: 'violet',  hex: '#8b5cf6', label: 'Violet' },
  { name: 'brown',   hex: '#3f3f46', label: 'Graphite' },
  { name: 'slate',   hex: '#475569', label: 'Slate' }
];
const OFFER_COLOR_BY_NAME = Object.fromEntries(OFFER_COLOR_PALETTE.map(c => [c.name, c.hex]));

// Hex for an offer's color. Returns '' if the offer has no color set
// (either field missing, empty string, or an unknown name) so callers
// can render a neutral default.
function offerColorHex(o) {
  if (!o || !o.color) return '';
  return OFFER_COLOR_BY_NAME[o.color] || '';
}

// Set of color names already in use by other offers — used to gray
// out picker swatches. excludeOfferId lets the offer being edited
// keep its own current color selectable.
function usedOfferColors(excludeOfferId) {
  const used = new Set();
  for (const o of (App.state && App.state.offers) || []) {
    if (!o.color) continue;
    if (excludeOfferId && o.id === excludeOfferId) continue;
    used.add(o.color);
  }
  return used;
}

// First palette color not currently in use. Returns '' if all 12 are
// taken so callers can decide what to do (toast + no color, prompt
// to clear one, etc.). Excludes the offer being edited so re-saving
// without a color change doesn't false-positive.
function firstUnusedOfferColor(excludeOfferId) {
  const used = usedOfferColors(excludeOfferId);
  for (const c of OFFER_COLOR_PALETTE) {
    if (!used.has(c.name)) return c.name;
  }
  return '';
}

// Categories with a definite cash-flow direction get an auto-applied
// sign on the amount field. Correction/Other stay neutral — the user
// decides. The convention is "positive = money in, negative = money out".
function categorySign(cat) {
  if (cat === 'outflow' || cat === 'fee') return -1;
  if (cat === 'inflow' || cat === 'bonus payout') return 1;
  return 0;
}
function applyCategorySign(amount, cat) {
  const s = categorySign(cat);
  if (s === 0) return amount;
  if (!Number.isFinite(amount) || amount === 0) return amount;
  return s * Math.abs(amount);
}

/* ============================================================
   CLOUD SYNC (GitHub Gist)
   ============================================================
   Persists state to a private GitHub Gist so the app syncs across
   devices. Each device stores a Personal Access Token (PAT, scope:
   `gist`) and the Gist ID in localStorage. On startup we pull the
   Gist; if its `_lastModified` timestamp is newer than local, the
   remote replaces local. Otherwise we push local up.

   Conflict resolution is last-writer-wins on the `_lastModified`
   timestamp embedded in the state. For a single user across devices
   this is sufficient — the loser's edits are overwritten only if
   they were strictly older than the winner's.

   Token security note: a PAT with only the `gist` scope can only
   read/write your gists. It cannot touch your repos, your account
   settings, or any GitHub-authenticated services. Loss = revoke
   at github.com/settings/tokens.
   ============================================================ */
const SYNC_CONFIG_KEY = 'capital-planner-sync-config-v1';
const SYNC_FILENAME = 'capital-planner.json';

const Sync = {
  status: 'unconfigured',  // 'unconfigured' | 'syncing' | 'synced' | 'pending' | 'error'
  lastError: null,
  lastSyncAt: 0,            // Date.now() of last successful round-trip
  pushTimer: null,
  startupDone: false,
  // True when this device has local edits not yet confirmed onto the cloud.
  // Set in App.save(); cleared on every pull-adopt and every successful PATCH.
  // Used by the CAS push to distinguish "just stale, adopt silently" from
  // "both sides changed, must ask" on a head divergence. Backed by the
  // persisted App.state._dirtySince so it survives a reload (see App.save).
  localDirty: false,
  // _lastModified of the state as LOADED this session (set once in App.init,
  // before any save re-stamps it). Used by the first-sync equal-state
  // exemption: if the state we loaded was identical to the cloud and only
  // system stamps (a projection date-roll) have moved local since, the device
  // was really in sync — adopt+seed silently instead of prompting.
  loadedModified: 0,

  // Clear the dirty marker in BOTH places it lives (the volatile flag and the
  // persisted _dirtySince field) so a reload can't resurrect it. Call after a
  // pull-adopt or a successful PATCH — whenever this device's state is known
  // to match the cloud. Note: on a pull-adopt the adopted cloud payload may
  // carry the OTHER device's _dirtySince; nulling it here clears THIS
  // (adopting) device's marker, which is what we want.
  markClean() {
    this.localDirty = false;
    if (App.state) App.state._dirtySince = null;
  },

  // Single source of truth for resolving a "both sides changed" conflict —
  // BOTH the push-side CAS and the pull-side remote-newer branch call this so
  // the dialog text and OK/Cancel semantics can never drift between the two.
  // `side` is 'push' | 'pull' — only used to log the right deferred code.
  // `unknownLineage` switches to the one-time first-sync-after-upgrade copy
  // (recommend Adopt — timestamps carry no signal there, so a reflexive
  // keep-local is the hazard).
  // Returns one of:
  //   'defer'      — can't ask (background, no user) → caller leaves state

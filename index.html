function renderActiveView() {
  switch (App.view) {
    case 'overview': return renderOverview();
    case 'planner': return renderPlanner();
    case 'timeline': return renderTimeline();
    case 'offers': return renderOffers();
    case 'settings': return renderSettings();
    default: return renderOverview();
  }
}

/* ============================================================
   OVERVIEW VIEW
   ============================================================ */
function renderOverview() {
  const proj = generateProjection(App.state);
  const summary = summarizeProjection(proj, App.state.settings);

  const today = summary.today;
  const lowest = summary.lowest;

  const includedOffers = App.state.offers.filter(o => offerIsActiveForProjection(o));
  const expectedBonusTotal = includedOffers.reduce((s, o) => s + (Number(o.signupBonusAmount) || 0), 0);
  const tiedUpToday = today ? today.totalTiedUp : 0;
  const liquidCapital = App.state.settings.currentLiquidCapital;

  const heroAvailable = today ? today.availableCapital : liquidCapital;
  const heroLowest = lowest ? lowest.availableCapital : heroAvailable;
  const buffer = Number(App.state.settings.minimumCashBuffer) || 0;

  // Tone for any "lowest" or "available" dollar value: red if it would go
  // negative, buffer-yellow if it dips into the buffer zone (positive but
  // under the buffer floor), normal text otherwise. Used for both the hero
  // amount and the inline "Lowest $X" line.
  function shortfallTone(v) {
    if (v < 0) return 'var(--danger)';
    if (v < buffer) return '#e0a23a'; // matches .stat-value.warn / Buffer line
    return 'var(--text)';
  }
  const heroAmountTone = shortfallTone(heroAvailable);
  const heroLowestTone = shortfallTone(heroLowest);

  const lowestPill = summary.shortfallDays > 0
    ? `<span class="pill danger">${summary.shortfallDays} shortfall day${summary.shortfallDays === 1 ? '' : 's'}</span>`
    : summary.belowBufferDays > 0
      ? `<span class="pill warn">${summary.belowBufferDays} day${summary.belowBufferDays === 1 ? '' : 's'} below buffer</span>`
      : `<span class="pill">Healthy through horizon</span>`;

  const ACTIONS_PER_PAGE = 6;
  const allUpcomingActions = computeUpcomingActions(App.state, 200);
  const upcomingPageCount = Math.max(1, Math.ceil(allUpcomingActions.length / ACTIONS_PER_PAGE));
  if (typeof App._upcomingPage !== 'number') App._upcomingPage = 0;
  App._upcomingPage = Math.min(App._upcomingPage, upcomingPageCount - 1);
  const upcomingActions = allUpcomingActions.slice(App._upcomingPage * ACTIONS_PER_PAGE, (App._upcomingPage + 1) * ACTIONS_PER_PAGE);

  return `
    <section class="hero">
      <div class="hero-numbers">
        <div class="hero-label">Available capital today</div>
        <div class="hero-amount" style="color:${heroAmountTone};">
          <span class="currency-symbol">${heroAvailable < 0 ? '-$' : '$'}</span>${Math.abs(Math.round(heroAvailable)).toLocaleString('en-US')}
        </div>
        <div class="hero-meta">
          ${lowestPill}
          ${lowest && summary.lowestIdx > 0 ? `<span style="color:var(--text-tertiary);">Lowest <strong style="color:${heroLowestTone};">${formatCompactCurrency(heroLowest)}</strong> on ${formatDateMedium(lowest.date)}</span>` : ''}
        </div>
      </div>
      <div class="chart-wrap" id="hero-chart-wrap">
        <svg class="chart-svg" id="hero-chart" viewBox="0 0 800 280" preserveAspectRatio="xMidYMid meet"></svg>
        <div class="chart-tooltip" id="chart-tooltip"></div>
      </div>
      <div class="chart-legend">
        <span class="chart-legend-item"><span class="legend-line" style="background:var(--accent);"></span> Available capital</span>
        <span class="chart-legend-item"><span class="legend-line dashed" style="color:var(--warning);"></span> Buffer (${formatCompactCurrency(App.state.settings.minimumCashBuffer)})</span>
        <span class="chart-legend-item"><span class="legend-swatch" style="background:#5b5cf6;"></span> Funding date</span>
        <span class="chart-legend-item"><span class="legend-swatch" style="background:#10b981;"></span> Withdrawal</span>
      </div>
    </section>

    <div class="grid grid-cols-3" style="margin-bottom: var(--space-6);">
      ${statCard('Tied up today', formatCurrency(tiedUpToday), `${(today ? Math.round((today.confirmedTiedUp / Math.max(1, today.totalTiedUp)) * 100) : 0)}% confirmed`, 'accent')}
      ${statCard('Selected bonuses', formatCurrency(expectedBonusTotal), `${includedOffers.length} offer${includedOffers.length === 1 ? '' : 's'} included`, 'success')}
      ${statCard('Lowest projected', formatCompactCurrency(heroLowest), lowest ? formatDateMedium(lowest.date) : '—', summary.shortfallDays > 0 ? 'danger' : (summary.belowBufferDays > 0 ? 'warn' : 'lighten'))}
    </div>

    <div class="overview-side">
      <section class="card">
        <div class="card-header">
          <h2>Upcoming actions</h2>
          ${upcomingPageCount > 1 ? `
            <div class="upcoming-pager">
              <button class="upcoming-pg-btn" data-action="upcoming-prev" ${App._upcomingPage === 0 ? 'disabled' : ''} aria-label="Previous">‹</button>
              <span class="upcoming-pg-label">${App._upcomingPage + 1} / ${upcomingPageCount}</span>
              <button class="upcoming-pg-btn" data-action="upcoming-next" ${App._upcomingPage === upcomingPageCount - 1 ? 'disabled' : ''} aria-label="Next">›</button>
            </div>
          ` : ''}
        </div>
        ${upcomingActions.length === 0
          ? `<div style="padding:var(--space-6);text-align:center;color:var(--text-tertiary);font-size:14px;">No upcoming dates yet. Add an offer to get started.</div>`
          : `<div class="action-list upcoming-fade" key="${App._upcomingPage}">${upcomingActions.map(renderActionRow).join('')}</div>`}
      </section>

      <aside class="card snapshot-card">
        <div class="snapshot-title">At a glance</div>
        <div class="snapshot-grid">
          <div class="snap"><span class="snap-l">Active offers</span><span class="snap-v">${App.state.offers.filter(o => o.status !== 'completed' && o.status !== 'skipped').length}</span></div>
          <div class="snap"><span class="snap-l">Confirmed</span><span class="snap-v">${App.state.commitments.filter(c => c.status === 'confirmed' && c.includeInProjection).length + App.state.offers.filter(o => CONFIRMED_OFFER_STATUSES.has(o.status)).length}</span></div>
          <div class="snap"><span class="snap-l">Events</span><span class="snap-v">${App.state.events.filter(e => e.includeInProjection).length}</span></div>
          <div class="snap"><span class="snap-l">Horizon</span><span class="snap-v">${effectiveHorizonDays(App.state)}d</span></div>
          <div class="snap"><span class="snap-l">Buffer</span><span class="snap-v">${formatCompactCurrency(App.state.settings.minimumCashBuffer)}</span></div>
          <div class="snap"><span class="snap-l">Bonus pool</span><span class="snap-v" style="color:var(--success);">${formatCompactCurrency(expectedBonusTotal)}</span></div>
        </div>
      </aside>
    </div>
  `;
}

function statCard(label, value, meta = '', variant = '') {
  return `
    <div class="stat-card">
      <div class="stat-label">${label}</div>
      <div class="stat-value ${variant}">${value}</div>
      ${meta ? `<div class="stat-meta">${meta}</div>` : ''}
    </div>
  `;
}

function computeUpcomingActions(state, limit = 12) {
  const horizonEnd = addDays(TODAY, 90);
  const items = [];
  for (const o of state.offers) {
    if (o.status === 'completed' || o.status === 'skipped') continue;
    if (o.offerExpirationDate) {
      const d = parseDate(o.offerExpirationDate);
      if (d && d >= TODAY && d <= horizonEnd) {
        items.push({ date: d, kind: 'Offer expires', name: `${o.bankName}${o.offerName ? ' — ' + o.offerName : ''}`, sub: `${formatCompactCurrency(o.signupBonusAmount)} bonus`, tag: 'warn' });
      }
    }
    const dd = depositDeadline(o);
    if (dd) {
      const d = parseDate(dd);
      if (d && d >= TODAY && d <= horizonEnd && (o.status === 'applied' || o.status === 'selected' || o.status === 'prospect')) {
        items.push({ date: d, kind: 'Deposit deadline', name: `${o.bankName}${o.offerName ? ' — ' + o.offerName : ''}`, sub: `Fund ${formatCompactCurrency(o.requiredFundingAmount)}`, tag: 'danger' });
      }
    }
    const we = withdrawalEligibleDate(o);
    if (we && (o.status === 'funded' || o.status === 'applied')) {
      const d = parseDate(we);
      if (d && d >= TODAY && d <= horizonEnd) {
        items.push({ date: d, kind: 'Withdrawal', name: `${o.bankName}${o.offerName ? ' — ' + o.offerName : ''}`, sub: `Release ${formatCompactCurrency(o.requiredFundingAmount)}`, tag: 'success' });
      }
    }
  }
  for (const c of state.commitments) {
    if (c.status === 'cancelled' || c.status === 'completed') continue;
    if (c.endDate) {
      const d = parseDate(c.endDate);
      if (d && d >= TODAY && d <= horizonEnd) {
        items.push({ date: d, kind: 'Commitment release', name: c.commitmentName, sub: formatCompactCurrency(c.amount), tag: 'success' });
      }
    }
  }
  for (const e of state.events) {
    if (!e.includeInProjection) continue;
    const d = parseDate(e.date);
    if (d && d >= TODAY && d <= horizonEnd) {
      items.push({ date: d, kind: e.amount >= 0 ? 'Inflow' : 'Outflow', name: e.eventName, sub: formatCurrency(e.amount), tag: e.amount >= 0 ? 'success' : '' });
    }
  }
  items.sort((a, b) => a.date - b.date);
  return items.slice(0, limit);
}

/* Targeted update for the Upcoming-Actions pager. A full render() would
   rebuild every section on the overview page, which (a) burns work and
   (b) reflows enough surrounding DOM that the document's scroll position
   gets nudged upward when the new page has fewer rows. Swapping just the
   action-list innerHTML keeps the section height pinned (min-height in CSS)
   and the page stays exactly where the user left it. */
function updateUpcomingPage(nextPage) {
  const ACTIONS_PER_PAGE = 6;
  const all = computeUpcomingActions(App.state, 200);
  const pageCount = Math.max(1, Math.ceil(all.length / ACTIONS_PER_PAGE));
  const clamped = Math.max(0, Math.min(pageCount - 1, nextPage));
  if (clamped === App._upcomingPage) return;
  App._upcomingPage = clamped;
  const slice = all.slice(clamped * ACTIONS_PER_PAGE, (clamped + 1) * ACTIONS_PER_PAGE);
  const list = document.querySelector('.action-list');
  if (list) {
    list.innerHTML = slice.map(renderActionRow).join('');
    // Re-trigger the fade-in animation for the new page
    list.classList.remove('upcoming-fade');
    void list.offsetWidth; // force reflow so the animation restarts
    list.classList.add('upcoming-fade');
    list.setAttribute('key', clamped);
  }
  // Update pager controls in place
  const pager = document.querySelector('.upcoming-pager');
  if (pager) {
    const prev = pager.querySelector('[data-action="upcoming-prev"]');
    const next = pager.querySelector('[data-action="upcoming-next"]');
    const label = pager.querySelector('.upcoming-pg-label');
    if (prev) prev.toggleAttribute('disabled', clamped === 0);
    if (next) next.toggleAttribute('disabled', clamped === pageCount - 1);
    if (label) label.textContent = `${clamped + 1} / ${pageCount}`;
  }
}

function renderActionRow(item) {
  const month = item.date.toLocaleDateString('en-US', { month: 'short' }).toUpperCase();
  const day = item.date.getDate();
  return `
    <div class="action-row">
      <div class="action-day">
        <span class="month">${month}</span>
        <span class="day">${day}</span>
      </div>
      <div class="action-body">
        <div class="action-title">${escapeHtml(item.name)}</div>
        <div class="action-sub">${escapeHtml(item.sub)} · ${relativeDays(item.date)}</div>
      </div>
      <span class="action-tag ${item.tag || ''}">${escapeHtml(item.kind)}</span>
    </div>
  `;
}

    .slice()
    .sort((a, b) => {
      const ar = annualizedReturn(a) ?? 0;
      const br = annualizedReturn(b) ?? 0;

  const proj = generateProjection(App.state);
  const summary = summarizeProjection(proj, App.state.settings);

  const includedBonus = offers.filter(o => offerIsActiveForProjection(o)).reduce((s, o) => s + (o.signupBonusAmount || 0), 0);

  const candidates = offers.filter(o => HYPOTHETICAL_OFFER_STATUSES.has(o.status) && isOfferComplete(o));

  const optResult = App.optimizer.results;

  return `
    <div class="section-header">

      </div>
      <div style="display:flex;gap:var(--space-2);">

      </div>
    </div>

    <div class="optimizer-bar">
      <div class="optimizer-summary">
        <div class="metric">
          <span class="label">Selected</span>
          <span class="value">${includedCount} <span style="font-size:13px;color:var(--text-tertiary);font-weight:500;">of ${offers.length}</span></span>
        </div>
        <div class="metric">

        </div>
        <div class="metric">

          <span class="value" style="${summary.shortfallDays > 0 ? 'color:var(--danger);' : (summary.belowBufferDays > 0 ? 'color:#e0a23a;' : 'color:#0ea968;')}">${summary.lowest ? formatCompactCurrency(summary.lowest.availableCapital) : '—'}</span>
        </div>

          Find feasible combinations

      </div>

function renderOptimizerResults(result) {
  if (result.tooMany) {
    return `
      <div class="banner warn">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="9"/><line x1="12" y1="8" x2="12" y2="13"/><line x1="12" y1="17" x2="12" y2="17.01"/></svg>
        <div>
          <strong>Too many candidates for brute force:</strong> ${result.candidateCount} offers (limit ${result.max}). Mark some offers as "skipped" or convert them to commitments first, or raise the limit in Settings.
        </div>
      </div>
    `;
  }
  if (result.results.length === 0) {
    return `
      <div class="banner danger">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="9"/><line x1="12" y1="8" x2="12" y2="13"/><line x1="12" y1="17" x2="12" y2="17.01"/></svg>
        <div>
          <strong>No feasible combinations.</strong> Of ${result.evaluated} subsets evaluated, all ${result.infeasibleCount} would breach your buffer or go negative. Try raising your liquid capital, lowering your buffer floor, or removing high-capital offers.
        </div>
      </div>
    `;
  }
  // Compute which combo (if any) matches the user's current includeInScenario state.
  const currentMask = currentlyAppliedComboMask(result.candidates);
  return `
    <section class="card" style="margin-bottom:var(--space-5);">
      <div class="card-header">
        <h2>Top feasible combinations</h2>
        <span style="font-size:12px;color:var(--text-tertiary);">Evaluated ${result.evaluated.toLocaleString()} subsets · ${result.infeasibleCount} infeasible · click a combo to apply it</span>
      </div>
      <div class="combo-grid">
        ${result.results.map((r, i) => renderComboCard(r, i, result.candidates, currentMask)).join('')}
      </div>
      <p style="margin-top:var(--space-3);font-size:12px;color:var(--text-tertiary);">Only combinations that never dip below your buffer are shown. Ranking: highest total bonus → highest blended APY → highest lowest-available cash. <strong>Low cash</strong> is how thin you'd run at the worst point.</p>
    </section>
  `;
}

function currentlyAppliedComboMask(candidates) {
  let mask = 0;
  for (let i = 0; i < candidates.length; i++) {
    const o = App.state.offers.find(x => x.id === candidates[i].id);
    if (o && o.includeInScenario) mask |= (1 << i);
  }
  return mask;
}

function renderComboCard(r, rank, candidates, currentMask) {
  const offers = r.includedIds.map(id => candidates.find(o => o.id === id)).filter(Boolean);

    <div class="combo-card ${isSelected ? 'selected' : ''}" data-action="apply-combo" data-mask="${r.mask}" role="button" tabindex="0">

        ${r.blendedAnnReturn != null ? `<span><strong>${formatPercent(r.blendedAnnReturn)}</strong> APY blended</span>` : ''}

}

/* ============================================================
   TIMELINE VIEW
   ============================================================ */
function renderTimeline() {
  const settings = App.state.settings;
  const start = parseDate(settings.projectionStartDate) || TODAY;
  const horizon = effectiveHorizonDays(App.state);
  const end = addDays(start, horizon);

  // Collect "rows" — manual commitments + virtual offer commitments
  const rows = [];
  const offerWithCommitment = new Set();
  for (const c of App.state.commitments) {
    if (c.sourceBonusOfferId) offerWithCommitment.add(c.sourceBonusOfferId);
    if (!App.filters.timelineShowCancelled && c.status === 'cancelled') continue;
    if (!App.filters.timelineShowCompleted && c.status === 'completed') continue;
    rows.push({
      id: c.id,
      label: c.commitmentName,
      sub: `${formatCurrency(c.amount)} · ${c.type}`,
      start: parseDate(c.startDate),
      end: parseDate(c.endDate),
      status: c.status,
      isVirtual: false
    });
  }
  for (const o of App.state.offers) {
    if (offerWithCommitment.has(o.id)) continue;
    if (!isOfferComplete(o)) continue;
    if (!offerIsActiveForProjection(o) && o.status !== 'completed') continue;
    if (o.status === 'completed' && !App.filters.timelineShowCompleted) continue;
    if (o.status === 'skipped') continue;
    const sStart = parseDate(lockStartDate(o));
    const sEnd = parseDate(withdrawalEligibleDate(o));
    if (!sStart || !sEnd) continue;
    rows.push({
      id: o.id,
      label: `${o.bankName}${o.offerName ? ' — ' + o.offerName : ''}`,
      sub: `${formatCurrency(o.requiredFundingAmount)} · ${STATUS_LABELS[o.status] || o.status}`,
      start: sStart,
      end: sEnd,
      status: CONFIRMED_OFFER_STATUSES.has(o.status) ? 'confirmed' : (o.status === 'completed' ? 'completed' : 'hypothetical'),
      isVirtual: true
    });
  }
  rows.sort((a, b) => (a.start || 0) - (b.start || 0));

  // Compute shortfall bands
  const proj = generateProjection(App.state);
  const shortfallBands = [];
  let bandStart = null;
  for (let i = 0; i < proj.length; i++) {
    const d = proj[i];
    if (d.shortfall && bandStart === null) bandStart = i;
    if ((!d.shortfall || i === proj.length - 1) && bandStart !== null) {
      shortfallBands.push({ from: bandStart, to: d.shortfall ? i + 1 : i });
      bandStart = null;
    }
  }

  // Generate axis ticks (one per month within horizon)
  const ticks = [];
  let cursor = new Date(start.getFullYear(), start.getMonth(), 1);
  if (cursor < start) cursor = new Date(start.getFullYear(), start.getMonth() + 1, 1);
  while (cursor < end) {
    ticks.push({
      pct: ((cursor - start) / (end - start)) * 100,
      label: cursor.toLocaleDateString('en-US', { month: 'short', year: cursor.getFullYear() !== TODAY.getFullYear() ? '2-digit' : undefined })
    });
    cursor = new Date(cursor.getFullYear(), cursor.getMonth() + 1, 1);
  }

  const totalDays = horizon;
  function pctFor(d) {
    if (!d) return null;
    const days = (d - start) / 86400000;
    return Math.max(0, Math.min(100, (days / totalDays) * 100));
  }

  const todayPct = (TODAY >= start && TODAY < end) ? pctFor(TODAY) : null;

  return `
    <div class="section-header">
      <div>
        <h2>Timeline</h2>
        <p>Capital commitments over the next ${horizon} days. Confirmed bars are solid, hypothetical bars are dashed.</p>
      </div>
      <div style="display:flex;gap:var(--space-3);align-items:center;flex-wrap:wrap;">
        <label class="checkbox-row">
          <input type="checkbox" data-action="toggle-filter" data-filter="timelineShowCompleted" ${App.filters.timelineShowCompleted ? 'checked' : ''} />
          <span style="font-size:13px;color:var(--text-secondary);">Show completed</span>
        </label>
        <label class="checkbox-row">
          <input type="checkbox" data-action="toggle-filter" data-filter="timelineShowCancelled" ${App.filters.timelineShowCancelled ? 'checked' : ''} />
          <span style="font-size:13px;color:var(--text-secondary);">Show cancelled</span>
        </label>
      </div>
    </div>

    ${rows.length === 0
      ? renderEmptyState('No commitments to plot', 'When you add offers or capital commitments, they will appear here as horizontal bars across time.')
      : `
        <div class="timeline-wrap">
          <div class="timeline-row">
            <div class="timeline-row-label" style="font-size:11px;color:var(--text-tertiary);text-transform:uppercase;letter-spacing:0.05em;">${formatDateShort(start)} → ${formatDateShort(end)}</div>
            <div class="timeline-row-track">
              <div class="tl-axis">
                ${ticks.map(t => `<span class="tl-axis-tick" style="left:${t.pct}%;">${t.label}</span>`).join('')}
                ${todayPct != null ? `<div class="tl-today" style="left:${todayPct}%;"></div>` : ''}
              </div>
            </div>
          </div>
          ${rows.map(r => {
            const sPct = pctFor(r.start);
            const ePct = pctFor(r.end);
            if (sPct == null || ePct == null || ePct <= sPct) return '';
            const w = ePct - sPct;
            return `
              <div class="timeline-row">
                <div class="timeline-row-label">
                  <span style="overflow:hidden;text-overflow:ellipsis;white-space:nowrap;">${escapeHtml(r.label)}</span>
                  <span class="sub">${escapeHtml(r.sub)}</span>
                </div>
                <div class="timeline-row-track">
                  ${ticks.map(t => `<div class="tl-grid-line" style="left:${t.pct}%;"></div>`).join('')}
                  ${shortfallBands.map(b => {
                    const left = (b.from / totalDays) * 100;
                    const right = (b.to / totalDays) * 100;
                    return `<div class="tl-shortfall-band" style="left:${left}%;right:${100 - right}%;"></div>`;
                  }).join('')}
                  <div class="tl-bar ${r.status}" style="left:${sPct}%;width:${w}%;" title="${escapeHtml(r.label)}: ${formatDateMedium(r.start)} → ${formatDateMedium(r.end)}">
                    ${w > 8 ? formatCompactCurrency((function(){ if (r.isVirtual) { const o = App.state.offers.find(x=>x.id===r.id); return o ? o.requiredFundingAmount : 0; } const c = App.state.commitments.find(x=>x.id===r.id); return c ? c.amount : 0; })()) : ''}
                  </div>
                  ${todayPct != null ? `<div class="tl-today" style="left:${todayPct}%;"></div>` : ''}
                </div>
              </div>
            `;
          }).join('')}
        </div>

        <div class="chart-legend" style="margin-top:var(--space-4);">
          <span class="chart-legend-item"><span class="legend-swatch" style="background:rgba(91,92,246,0.2);border:1.5px solid var(--accent);"></span> Confirmed</span>
          <span class="chart-legend-item"><span class="legend-swatch" style="background:repeating-linear-gradient(45deg,rgba(91,92,246,0.10),rgba(91,92,246,0.10) 4px,rgba(91,92,246,0.18) 4px,rgba(91,92,246,0.18) 8px);border:1.5px dashed var(--accent);"></span> Hypothetical</span>

}

/* ============================================================
   OFFERS VIEW
   ============================================================ */
function renderOffers() {
  const all = App.state.offers.slice();
  const filtered = all.filter(o => {
    if (App.filters.offersStatus !== 'all' && o.status !== App.filters.offersStatus) return false;
    if (App.filters.offersSearch) {
      const q = App.filters.offersSearch.toLowerCase();
      if (!(o.bankName + ' ' + (o.offerName || '') + ' ' + (o.notes || '')).toLowerCase().includes(q)) return false;
    }
    return true;
  });

  const advanced = App.filters.offersAdvanced;

  return `
    <div class="section-header">
      <div>
        <h2>Offers</h2>
        <p>${all.length} total · ${all.filter(o => isOfferComplete(o)).length} complete · ${all.filter(o => !isOfferComplete(o)).length} drafts</p>
      </div>
      <div style="display:flex;gap:var(--space-2);">
        <button class="btn btn-secondary" data-action="toggle-advanced">${advanced ? 'Card view' : 'Table view'}</button>
        <button class="btn btn-primary" data-action="add-offer">+ Add offer</button>
      </div>
    </div>

    <div class="toolbar">
      <input id="offers-search-input" type="search" class="input" placeholder="Search offers..." style="max-width:280px;" data-action="offers-search" value="${escapeAttr(App.filters.offersSearch)}" autocomplete="off" />
      <select class="select" style="max-width:200px;" data-action="offers-status">
        <option value="all" ${App.filters.offersStatus === 'all' ? 'selected' : ''}>All statuses</option>
        ${STATUSES.map(s => `<option value="${s}" ${App.filters.offersStatus === s ? 'selected' : ''}>${STATUS_LABELS[s]}</option>`).join('')}
      </select>
    </div>

    ${filtered.length === 0
      ? renderEmptyState(all.length === 0 ? 'No offers yet' : 'No offers match', all.length === 0 ? 'Add your first bank bonus to start planning.' : 'Try changing the filter or search query.', all.length === 0 ? 'add-offer' : null, all.length === 0 ? 'Add an offer' : null)
      : (advanced ? renderOffersTable(filtered) : `<div class="planner-grid">${filtered.map(renderOfferCardWithActions).join('')}</div>`)
    }
  `;
}

function renderOfferCardWithActions(o) {
  const card = renderOfferCard(o);
  const actions = `
    <div class="offer-actions" style="margin-top:var(--space-3);padding-top:var(--space-3);border-top:1px solid var(--border-soft);">
      <button class="btn btn-ghost btn-sm" data-action="edit-offer" data-id="${o.id}">Edit</button>
      <button class="btn btn-ghost btn-sm" data-action="duplicate-offer" data-id="${o.id}">Duplicate</button>
      <button class="btn btn-ghost btn-sm" data-action="convert-offer" data-id="${o.id}">Convert</button>
      <select class="select" style="height:30px;padding:4px 8px;font-size:12px;width:auto;flex:1;min-width:120px;" data-action="change-status" data-id="${o.id}">
        ${STATUSES.map(s => `<option value="${s}" ${o.status === s ? 'selected' : ''}>${STATUS_LABELS[s]}</option>`).join('')}
      </select>
      <button class="btn btn-ghost btn-sm btn-danger" data-action="delete-offer" data-id="${o.id}" aria-label="Delete">×</button>
    </div>
  `;
  // Insert actions inside the offer-card, just before its closing tag.
  const lastIdx = card.lastIndexOf('</div>');
  return card.slice(0, lastIdx) + actions + card.slice(lastIdx);
}

function renderOffersTable(offers) {
  return `
    <div class="table-wrap">
      <table class="data-table">
        <thead>
          <tr>
            <th>Bank / Offer</th>
            <th class="num">Funding</th>
            <th class="num">Bonus</th>
            <th class="num">Lock days</th>
            <th>Fund date</th>
            <th>Withdrawal date</th>
            <th class="num">APY</th>
            <th>Status</th>
            <th>Entity</th>
            <th></th>
          </tr>
        </thead>
        <tbody>
          ${offers.map(o => {
            const ar = annualizedReturn(o);
            const ls = lockStartDate(o);
            const we = withdrawalEligibleDate(o);
            const actualDays = (ls && we) ? daysBetween(parseDate(ls), parseDate(we)) : null;
            return `
              <tr>
                <td>
                  <div style="font-weight:500;">${escapeHtml(o.bankName)}</div>
                  <div style="font-size:11px;color:var(--text-tertiary);">${escapeHtml(o.offerName || '')}</div>
                </td>
                <td class="num">${formatCurrency(o.requiredFundingAmount)}</td>
                <td class="num" style="color:var(--success);font-weight:600;">${formatCurrency(o.signupBonusAmount)}</td>
                <td class="num" title="${o.lockStartsFrom === 'open date' ? 'Bank requires ' + (o.daysFundsMustRemain ?? '—') + ' days from open; actual lock = ' + (actualDays ?? '—') : 'Days funds must remain'}">${actualDays ?? (o.daysFundsMustRemain ?? '—')}${o.lockStartsFrom === 'open date' && actualDays != null ? ` <span style="color:var(--text-tertiary);">/ ${o.daysFundsMustRemain}</span>` : ''}</td>
                <td>${formatDateShort(ls) || '—'}</td>
                <td>${formatDateShort(we) || '—'}</td>
                <td class="num">${ar != null ? formatPercent(ar) : '—'}</td>
                <td><span class="chip ${STATUS_CHIP_CLASS[o.status] || 'chip-muted'}">${STATUS_LABELS[o.status]}</span></td>
                <td style="color:var(--text-tertiary);font-size:12px;">${escapeHtml(o.entityUsed || '—')}</td>
                <td>
                  <div class="row-action-buttons">
                    <button class="btn-icon" data-action="edit-offer" data-id="${o.id}" aria-label="Edit"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 20h9"/><path d="M16.5 3.5a2.121 2.121 0 113 3L7 19l-4 1 1-4 12.5-12.5z"/></svg></button>
                    <button class="btn-icon" data-action="duplicate-offer" data-id="${o.id}" aria-label="Duplicate"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="9" y="9" width="13" height="13" rx="2"/><path d="M5 15H4a2 2 0 01-2-2V4a2 2 0 012-2h9a2 2 0 012 2v1"/></svg></button>
                  </div>
                </td>
              </tr>
            `;
          }).join('')}
        </tbody>
      </table>
    </div>
  `;
}

function renderSyncSection() {
  const cfg = Sync.getConfig() || {};
  const configured = Sync.isConfigured();
  const lastSyncText = Sync.lastSyncAt
    ? new Date(Sync.lastSyncAt).toLocaleString()
    : '—';
  const stateMod = App.state && App.state._lastModified
    ? new Date(App.state._lastModified).toLocaleString()
    : '—';
  const statusColor = {
    synced: 'var(--success)',
    syncing: 'var(--warning)',
    pending: 'var(--warning)',
    error: 'var(--danger)',
    unconfigured: 'var(--text-tertiary)'
  }[Sync.status] || 'var(--text-tertiary)';

  return `
    <section class="form-section" id="sync-section">
      <h2>Cloud sync</h2>
      <p class="section-desc">Sync your planner across devices via a private GitHub Gist. Free, end-to-end controlled by you, requires only a "gist"-scoped Personal Access Token.</p>

      <div style="display:flex;align-items:center;gap:10px;font-size:13px;margin-bottom:var(--space-4);">
        <span style="display:inline-block;width:10px;height:10px;border-radius:50%;background:${statusColor};"></span>
        <span style="color:var(--text-secondary);"><strong style="color:var(--text);">${({synced:'Synced',syncing:'Syncing…',pending:'Push pending',error:'Error',unconfigured:'Not configured'})[Sync.status] || Sync.status}</strong>${Sync.lastError ? ' — ' + escapeHtml(Sync.lastError) : ''}</span>
      </div>

      <div class="form-grid">
        <div class="field">
          <label for="sync-gist">Gist ID</label>
          <input id="sync-gist" class="input" type="text" placeholder="e.g. a1b2c3d4e5..." value="${escapeAttr(cfg.gistId || '')}" autocomplete="off" spellcheck="false" />
          <span class="field-hint">From the Gist URL: <code>gist.github.com/&lt;you&gt;/<strong>this-part</strong></code></span>
        </div>
        <div class="field">
          <label for="sync-token">Personal Access Token</label>
          <input id="sync-token" class="input" type="password" placeholder="ghp_... or github_pat_..." value="${escapeAttr(cfg.token || '')}" autocomplete="off" spellcheck="false" />
          <span class="field-hint">Stored locally per device. Scope: only <strong>gist</strong>.</span>
        </div>
      </div>

      <div style="display:flex;gap:var(--space-2);flex-wrap:wrap;margin-top:var(--space-4);">
        <button class="btn btn-primary" data-action="sync-save">Save & test</button>
        <button class="btn btn-secondary" data-action="sync-create-gist">Create new Gist</button>
        <button class="btn btn-secondary" data-action="sync-pull" ${configured ? '' : 'disabled'}>Pull now</button>
        <button class="btn btn-secondary" data-action="sync-push" ${configured ? '' : 'disabled'}>Push now</button>
        <button class="btn btn-ghost btn-danger" data-action="sync-disconnect" ${configured ? '' : 'disabled'}>Disconnect</button>
      </div>

      <div style="display:grid;grid-template-columns:1fr 1fr;gap:var(--space-3);margin-top:var(--space-4);font-size:12px;color:var(--text-tertiary);">
        <div>Last cloud sync: <span style="color:var(--text-secondary);">${lastSyncText}</span></div>
        <div>Local state modified: <span style="color:var(--text-secondary);">${stateMod}</span></div>
      </div>

      <div class="banner" style="margin-top:var(--space-5);">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="9"/><line x1="12" y1="8" x2="12" y2="12"/><line x1="12" y1="16" x2="12" y2="16.01"/></svg>
        <div>
          <strong>First-time setup (per account, not per device):</strong>
          <ol style="margin:8px 0 0 18px;font-size:13px;line-height:1.7;">
            <li>Go to <a href="https://github.com/settings/tokens" target="_blank" rel="noopener" style="color:var(--accent);text-decoration:underline;">github.com/settings/tokens</a> → <em>Generate new token</em> → <em>classic</em> → check <strong>only</strong> the <code>gist</code> scope → set "No expiration" or 1 year. Copy the token (starts with <code>ghp_</code>).</li>
            <li>Paste the token above, leave Gist ID empty, then click <strong>Create new Gist</strong>. The app will create a private Gist and fill in the ID for you.</li>
            <li>On every other device: open the same URL, paste the same token + Gist ID, click <strong>Save &amp; test</strong>. Your data appears.</li>
          </ol>
          <p style="margin-top:8px;font-size:12px;">Pushes are debounced (~2.5s after edits stop). Conflict rule: whichever device wrote last wins, based on the embedded <code>_lastModified</code> timestamp.</p>
        </div>
      </div>
    </section>
  `;
}

function renderProjectionDebugTable() {
  const proj = generateProjection(App.state);
  // Sample to avoid massive DOM: every day for first 60, then weekly
  const rows = [];
  for (let i = 0; i < proj.length; i++) {
    if (i < 60 || i % 7 === 0) rows.push(proj[i]);
  }
  return `
    <div class="table-wrap" style="margin-top:var(--space-3);max-height:480px;overflow-y:auto;">
      <table class="data-table">
        <thead>
          <tr>
            <th>Date</th>
            <th class="num">Liquid</th>
            <th class="num">Net Events</th>
            <th class="num">Confirmed Tied</th>
            <th class="num">Hypo Tied</th>
            <th class="num">Available</th>
            <th>Flag</th>
          </tr>
        </thead>
        <tbody>
          ${rows.map(d => `
            <tr class="${d.shortfall ? 'row-danger' : (d.belowBuffer ? 'row-warn' : '')}">
              <td>${formatDateShort(d.date)}</td>
              <td class="num">${formatCurrency(d.startingLiquidCapital)}</td>
              <td class="num">${formatCurrency(d.netEventsToDate)}</td>
              <td class="num">${formatCurrency(d.confirmedTiedUp)}</td>
              <td class="num">${formatCurrency(d.hypotheticalTiedUp)}</td>
              <td class="num"><strong>${formatCurrency(d.availableCapital)}</strong></td>
              <td>${d.shortfall ? '🚨 Shortfall' : (d.belowBuffer ? '⚠️ Buffer' : '')}</td>
            </tr>
          `).join('')}
        </tbody>
      </table>
    </div>
  `;
}

/* ============================================================
   CHART RENDERING — Available Capital Over Time
   ============================================================ */
function renderChartsAfterMount() {
  const heroChart = document.getElementById('hero-chart');
  if (heroChart) renderHeroChart(heroChart);
}

function renderHeroChart(svg) {
  const proj = generateProjection(App.state);
  if (!proj.length) return;

  const wrap = document.getElementById('hero-chart-wrap');
  const tooltip = document.getElementById('chart-tooltip');
  const W = 800, H = 280;
  const padL = 56, padR = 28, padT = 16, padB = 36;
  const innerW = W - padL - padR;
  const innerH = H - padT - padB;

  const buffer = App.state.settings.minimumCashBuffer;
  const liquid = App.state.settings.currentLiquidCapital;

  // Y range: padded
  let minY = Math.min(0, buffer * 0.5);
  let maxY = liquid;
  for (const d of proj) {
    if (d.availableCapital < minY) minY = d.availableCapital;
    if (d.availableCapital > maxY) maxY = d.availableCapital;
  }
  if (buffer < minY) minY = buffer;
  if (buffer > maxY) maxY = buffer;
  const actualMinCapital = proj.reduce((m, d) => Math.min(m, d.availableCapital), Infinity);
  const yPad = (maxY - minY) * 0.12 || 1000;
  minY = minY - yPad * 0.4;
  maxY = maxY + yPad * 0.6;
  if (maxY === minY) { maxY += 1000; minY -= 1000; }

  function xFor(i) { return padL + (i / (proj.length - 1)) * innerW; }
  function yFor(v) { return padT + (1 - (v - minY) / (maxY - minY)) * innerH; }

  // Y-axis ticks
  const yTicks = niceTicks(minY, maxY, 4);

  // X-axis: month labels. Skip the first month tick if it falls within
  // ~12 days of "Today" — otherwise the labels collide.
  const start = parseDate(App.state.settings.projectionStartDate) || TODAY;
  const xTicks = [];
  let cursor = new Date(start.getFullYear(), start.getMonth() + 1, 1);
  let isFirstTick = true;
  while (true) {
    const dayOffset = Math.round((cursor - start) / 86400000);
    if (dayOffset >= proj.length) break;
    const tooCloseToToday = isFirstTick && dayOffset < 4;
    if (dayOffset > 0 && !tooCloseToToday) {
      // Show year too if it crosses into a new year
      // Only show the year on January (when the year actually changes), and
      // use the FULL year ("Jan 2027") to avoid confusion with day-of-month
      // labels like "Jun 25" elsewhere on the chart.
      const showYear = cursor.getMonth() === 0 && cursor.getFullYear() !== start.getFullYear();
      xTicks.push({
        i: dayOffset,
        label: cursor.toLocaleDateString('en-US', showYear ? { month: 'short', year: 'numeric' } : { month: 'short' })
      });
    }
    isFirstTick = false;
    cursor = new Date(cursor.getFullYear(), cursor.getMonth() + 1, 1);
  }

  // Build path
  let linePath = '';
  let areaPath = '';
  for (let i = 0; i < proj.length; i++) {
    const x = xFor(i);
    const y = yFor(proj[i].availableCapital);
    linePath += (i === 0 ? 'M' : 'L') + x.toFixed(1) + ' ' + y.toFixed(1) + ' ';
    areaPath += (i === 0 ? 'M' : 'L') + x.toFixed(1) + ' ' + y.toFixed(1) + ' ';
  }
  areaPath += `L${xFor(proj.length - 1).toFixed(1)} ${(padT + innerH).toFixed(1)} L${padL} ${(padT + innerH).toFixed(1)} Z`;

  // Shortfall band rects
  let shortfallBands = '';
  let bandStart = null;
  for (let i = 0; i < proj.length; i++) {
    if (proj[i].shortfall && bandStart === null) bandStart = i;
    if ((!proj[i].shortfall || i === proj.length - 1) && bandStart !== null) {
      const endI = proj[i].shortfall ? i + 1 : i;
      const x1 = xFor(bandStart);
      const x2 = xFor(endI);
      shortfallBands += `<rect x="${x1}" y="${padT}" width="${Math.max(2, x2 - x1)}" height="${innerH}" fill="rgba(239, 68, 68, 0.07)" />`;
      bandStart = null;
    }
  }

  // Markers: funding dates, withdrawal dates, deposit deadlines, events
  const markers = [];
  for (const o of App.state.offers) {
    if (!offerIsActiveForProjection(o)) continue;
    const fund = parseDate(lockStartDate(o));
    const withd = parseDate(withdrawalEligibleDate(o));
    const dd = parseDate(depositDeadline(o));
    const name = `${o.bankName}${o.offerName ? ' — ' + o.offerName : ''}`;
    if (fund) {
      const i = Math.round((fund - start) / 86400000);
      if (i >= 0 && i < proj.length) markers.push({ i, type: 'fund', label: `Fund ${name}`, color: '#5b5cf6', amount: Number(o.requiredFundingAmount) || 0 });
    }
    if (withd) {
      const i = Math.round((withd - start) / 86400000);
      if (i >= 0 && i < proj.length) markers.push({ i, type: 'withdraw', label: `Withdraw ${name}`, color: '#10b981', amount: Number(o.requiredFundingAmount) || 0, bonus: Number(o.signupBonusAmount) || 0 });
    }
    if (dd) {
      const i = Math.round((dd - start) / 86400000);
      if (i >= 0 && i < proj.length) markers.push({ i, type: 'deposit-deadline', label: `Deposit deadline: ${name}`, color: '#ef4444', amount: Number(o.requiredFundingAmount) || 0 });
    }
  }
  for (const e of App.state.events) {
    if (!e.includeInProjection || !e.date) continue;
    const ed = parseDate(e.date);
    if (!ed) continue;
    const i = Math.round((ed - start) / 86400000);
    if (i < 0 || i >= proj.length) continue;
    const isBonus = e.category === 'bonus payout';
    const color = Number(e.amount) >= 0 ? '#10b981' : '#f59e0b';
    markers.push({ i, type: isBonus ? 'bonus' : (Number(e.amount) >= 0 ? 'event-inflow' : 'event-outflow'), label: e.eventName, color, amount: Number(e.amount) || 0 });
  }

  const todayIdx = Math.round((TODAY - start) / 86400000);

  const svgContent = `
    <defs>
      <linearGradient id="area-grad" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0%" stop-color="#5b5cf6" stop-opacity="0.22"/>
        <stop offset="100%" stop-color="#5b5cf6" stop-opacity="0.0"/>
      </linearGradient>
    </defs>
    <!-- Shortfall bands -->
    ${shortfallBands}
    <!-- Y grid + labels -->
    ${yTicks.map(t => {
      const y = yFor(t);
      return `
        <line x1="${padL}" y1="${y.toFixed(1)}" x2="${W - padR}" y2="${y.toFixed(1)}" stroke="#eef0f2" stroke-width="1"/>
        <text x="${padL - 10}" y="${(y + 4).toFixed(1)}" fill="#9099a8" font-size="12" text-anchor="end" font-weight="500">${formatCompactCurrency(t)}</text>
      `;
    }).join('')}
    <!-- Buffer line -->
    <line x1="${padL}" y1="${yFor(buffer).toFixed(1)}" x2="${W - padR}" y2="${yFor(buffer).toFixed(1)}" stroke="#f59e0b" stroke-width="1.5" stroke-dasharray="6 4" opacity="0.7"/>
    <!-- Zero line only when projection actually goes negative -->
    ${actualMinCapital < 0 ? `<line x1="${padL}" y1="${yFor(0).toFixed(1)}" x2="${W - padR}" y2="${yFor(0).toFixed(1)}" stroke="#ef4444" stroke-width="1" stroke-dasharray="4 4"/>` : ''}
    <!-- Area + line -->
    <path d="${areaPath}" fill="url(#area-grad)" />
    <path d="${linePath}" fill="none" stroke="#5b5cf6" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round"/>
    <!-- Today marker -->
    ${todayIdx >= 0 && todayIdx < proj.length ? `
      <line x1="${xFor(todayIdx).toFixed(1)}" y1="${padT}" x2="${xFor(todayIdx).toFixed(1)}" y2="${padT + innerH}" stroke="#5b5cf6" stroke-width="1" stroke-dasharray="2 3" opacity="0.5" pointer-events="none"/>
      <circle cx="${xFor(todayIdx).toFixed(1)}" cy="${yFor(proj[todayIdx].availableCapital).toFixed(1)}" r="5" fill="#5b5cf6" stroke="white" stroke-width="2.5" pointer-events="none"/>
    ` : ''}
    <!-- Markers grouped by visual proximity. When two or more markers would
         overlap horizontally (≤16 SVG units apart) they stack as a vertical
         column of dots above the lowest one. Hovering anywhere within the
         column's x-range surfaces the existing tooltip, which already
         aggregates every nearby marker into one combined panel — so all the
         actions on the cluster's days appear in a single readable list. -->
    ${(() => {
      const sorted = markers.slice().sort((a, b) => a.i - b.i);
      const CLUSTER_PX = 16;
      const groups = [];
      for (const m of sorted) {
        const last = groups[groups.length - 1];
        if (last && Math.abs(xFor(m.i) - xFor(last[last.length - 1].i)) <= CLUSTER_PX) last.push(m);
        else groups.push([m]);
      }
      const STEP = 9; // vertical pixels between stacked dots
      let out = '';
      groups.forEach((g) => {
        // Anchor every dot in the cluster to the first marker's x — the chart
        // tooltip catches everything within 12 SVG units of the cursor x, so
        // the user gets the combined panel by hovering anywhere in the column.
        const x = xFor(g[0].i);
        const baseY = yFor(proj[g[0].i].availableCapital);
        g.forEach((m, k) => {
          const cy = baseY - k * STEP;
          out += `<circle cx="${x.toFixed(1)}" cy="${cy.toFixed(1)}" r="4" fill="${m.color}" stroke="white" stroke-width="2" opacity="0.92" pointer-events="none"></circle>`;
        });
      });
      return out;
    })()}
    <!-- X axis labels (months) -->
    ${xTicks.map(t => {
      const x = xFor(t.i);
      return `<text x="${x.toFixed(1)}" y="${(padT + innerH + 20).toFixed(1)}" fill="#9099a8" font-size="12" text-anchor="middle" font-weight="500">${t.label}</text>`;
    }).join('')}
    <!-- "Today" anchor: small accent above the chart, not on the axis line -->
    ${todayIdx >= 0 && todayIdx < proj.length ? `
      <text x="${xFor(todayIdx).toFixed(1)}" y="${(padT - 4).toFixed(1)}" fill="#5b5cf6" font-size="11" text-anchor="middle" font-weight="600">Today</text>
    ` : ''}
    <!-- Horizon end label: suppress if same month as last tick, or too close -->
    ${(() => {
      if (xTicks.length === 0) return `<text x="${(W - padR).toFixed(1)}" y="${(padT + innerH + 20).toFixed(1)}" fill="#9099a8" font-size="12" text-anchor="end" font-weight="500">${formatDateShort(proj[proj.length - 1].date)}</text>`;
      const lastTick = xTicks[xTicks.length - 1];
      const lastTickDate = new Date(start.getTime() + lastTick.i * 86400000);
      const horizonDate = new Date(start.getTime() + (proj.length - 1) * 86400000);
      const sameMonth = lastTickDate.getFullYear() === horizonDate.getFullYear() && lastTickDate.getMonth() === horizonDate.getMonth();
      const tooClose = xFor(proj.length - 1) - xFor(lastTick.i) <= 32;
      return (sameMonth || tooClose) ? '' : `<text x="${(W - padR).toFixed(1)}" y="${(padT + innerH + 20).toFixed(1)}" fill="#9099a8" font-size="12" text-anchor="end" font-weight="500">${formatDateShort(proj[proj.length - 1].date)}</text>`;
    })()}
    <!-- Hover overlay -->
    <rect x="${padL}" y="${padT}" width="${innerW}" height="${innerH}" fill="transparent" id="chart-hover-area"/>
    <line id="chart-hover-line" x1="0" y1="${padT}" x2="0" y2="${padT + innerH}" stroke="#0d1421" stroke-width="1" opacity="0" stroke-dasharray="2 3"/>
    <circle id="chart-hover-dot" cx="0" cy="0" r="5" fill="#5b5cf6" stroke="white" stroke-width="2" opacity="0"/>
  `;

  svg.innerHTML = svgContent;
  svg.setAttribute('viewBox', `0 0 ${W} ${H}`);
  // No explicit height — let CSS width:100% + viewBox aspect ratio drive
  // the rendered height. Setting a fixed height attribute conflicts with
  // preserveAspectRatio="xMidYMid meet" and breaks cursor mapping.

  // Hover interactions
  const hoverArea = svg.querySelector('#chart-hover-area');
  const hoverLine = svg.querySelector('#chart-hover-line');
  const hoverDot = svg.querySelector('#chart-hover-dot');

  function markerTypeLabel(type) {
    if (type === 'fund') return 'Fund date';
    if (type === 'withdraw') return 'Withdrawal';
    if (type === 'bonus') return 'Bonus payout';
    if (type === 'deposit-deadline') return 'Deposit deadline';
    if (type === 'event-inflow') return 'Inflow';
    if (type === 'event-outflow') return 'Outflow';
    return type;
  }
  // Lighter mid-tone for tooltip text on dark background — readable on dark bg
  function lightenColor(hex) {
    const map = {
      '#5b5cf6': '#a5a6ff',  // fund purple → light
      '#10b981': '#6ee7b7',  // green → light mint
      '#ef4444': '#fca5a5',  // red → light pink
      '#f59e0b': '#fcd34d',  // amber → light yellow
    };
    return map[hex] || hex;
  }

  function handleHover(evt) {
    const rect = svg.getBoundingClientRect();
    const rawX = (evt.clientX - rect.left) * (W / rect.width);
    const rawY = (evt.clientY - rect.top) * (H / rect.height);
    if (rawX < padL || rawX > W - padR || rawY < padT || rawY > padT + innerH) { clearHover(); return; }
    const i = Math.round(((rawX - padL) / innerW) * (proj.length - 1));
    if (i < 0 || i >= proj.length) return;
    const d = proj[i];
    const cx = xFor(i);
    const cy = yFor(d.availableCapital);
    hoverLine.setAttribute('x1', cx);
    hoverLine.setAttribute('x2', cx);
    hoverLine.setAttribute('opacity', '0.5');
    hoverDot.setAttribute('cx', cx);
    hoverDot.setAttribute('cy', cy);
    hoverDot.setAttribute('opacity', '1');

    // Find any markers within ~12 SVG units of the cursor x
    const nearMarkers = markers.filter(m => Math.abs(xFor(m.i) - rawX) < 12);

    let html = `
      <div class="tt-date">${formatDateLong(d.date)}</div>
      <div class="tt-row"><span class="label">Available</span><span><strong>${formatCurrency(d.availableCapital)}</strong></span></div>
      <div class="tt-row"><span class="label">Tied up</span><span>${formatCurrency(d.totalTiedUp)}</span></div>
      ${d.netEventsToDate !== 0 ? `<div class="tt-row"><span class="label">Net events</span><span>${(d.netEventsToDate >= 0 ? '+' : '') + formatCurrency(d.netEventsToDate)}</span></div>` : ''}
    `;
    if (nearMarkers.length > 0) {
      html += `<div style="border-top:1px solid rgba(255,255,255,0.18);margin-top:6px;padding-top:6px;">`;
      for (const m of nearMarkers) {
        html += `<div class="tt-row" style="margin-top:3px;"><span class="label">${markerTypeLabel(m.type)}</span><span style="color:${lightenColor(m.color)};font-weight:600;">${escapeHtml(m.label)}</span></div>`;
        if (m.type === 'fund' && m.amount) html += `<div class="tt-row"><span class="label">Deposit</span><span>${formatCurrency(m.amount)}</span></div>`;
        if (m.type === 'deposit-deadline' && m.amount) html += `<div class="tt-row"><span class="label">Must fund by</span><span style="color:#fca5a5;">${formatCurrency(m.amount)}</span></div>`;
        if (m.type === 'withdraw') {
          if (m.amount) html += `<div class="tt-row"><span class="label">Released</span><span>${formatCurrency(m.amount)}</span></div>`;
          if (m.bonus) html += `<div class="tt-row"><span class="label">Bonus</span><span style="color:#6ee7b7;">+${formatCurrency(m.bonus)}</span></div>`;
        }
        if (m.type === 'bonus' && m.amount) html += `<div class="tt-row"><span class="label">Payout</span><span style="color:#6ee7b7;">+${formatCurrency(m.amount)}</span></div>`;
        if ((m.type === 'event-inflow' || m.type === 'event-outflow') && m.amount) html += `<div class="tt-row"><span class="label">Amount</span><span style="color:${m.amount >= 0 ? '#6ee7b7' : '#fcd34d'};">${m.amount >= 0 ? '+' : ''}${formatCurrency(m.amount)}</span></div>`;
      }
      html += `</div>`;
    }
    tooltip.innerHTML = html;
    tooltip.classList.add('visible');

    // On mobile use fixed positioning to escape the overflow-x:auto container.
    // After placing, measure the tooltip and clamp left/top so the box (which
    // is translated -50%,-110% via CSS) cannot spill past the viewport edges.
    if (window.innerWidth <= 720) {
      const svgX = (cx / W) * rect.width + rect.left;
      const svgY = (cy / H) * rect.height + rect.top;
      tooltip.style.position = 'fixed';
      tooltip.style.left = svgX + 'px';
      tooltip.style.top = svgY + 'px';
      // Force a layout pass to read the now-rendered size, then clamp.
      const ttRect = tooltip.getBoundingClientRect();
      const margin = 8;
      const halfW = ttRect.width / 2;
      const minLeft = margin + halfW;
      const maxLeft = window.innerWidth - margin - halfW;
      const clampedLeft = Math.max(minLeft, Math.min(maxLeft, svgX));
      // If the tooltip would clip the top of the viewport, flip it below the
      // dot instead of above.
      const wantsTop = svgY - ttRect.height - 12;
      const flipDown = wantsTop < margin;
      tooltip.style.left = clampedLeft + 'px';
      if (flipDown) {
        tooltip.style.top = (svgY + 18) + 'px';
        tooltip.style.transform = 'translate(-50%, 0)';
      } else {
        tooltip.style.top = svgY + 'px';
        tooltip.style.transform = 'translate(-50%, -110%)';
      }
    } else {
      const wrapRect = wrap.getBoundingClientRect();
      const tx = (cx / W) * wrapRect.width;
      const ty = (cy / H) * wrapRect.height;
      tooltip.style.position = 'absolute';
      tooltip.style.left = tx + 'px';
      tooltip.style.top = ty + 'px';
      tooltip.style.transform = 'translate(-50%, -110%)';
    }
  }

  function clearHover() {
    hoverLine.setAttribute('opacity', '0');
    hoverDot.setAttribute('opacity', '0');
    tooltip.classList.remove('visible');
  }

  svg.addEventListener('mousemove', handleHover);
  svg.addEventListener('mouseleave', clearHover);
  svg.addEventListener('touchmove', (e) => { e.preventDefault(); handleHover(e.touches[0]); }, { passive: false });
  svg.addEventListener('touchend', clearHover);
}

function niceTicks(min, max, count) {
  const range = max - min;
  const step = niceStep(range / count);
  const ticks = [];
  let v = Math.ceil(min / step) * step;
  while (v <= max + step * 0.001) { ticks.push(v); v += step; }
  return ticks;
}
function niceStep(raw) {
  const exp = Math.pow(10, Math.floor(Math.log10(raw)));
  const f = raw / exp;
  let nf;
  if (f < 1.5) nf = 1;
  else if (f < 3) nf = 2;
  else if (f < 7) nf = 5;
  else nf = 10;
  return nf * exp;
}

/* ============================================================
   ESCAPING
   ============================================================ */
function escapeHtml(s) {
  if (s == null) return '';
  return String(s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
}
function escapeAttr(s) { return escapeHtml(s); }

/* ============================================================
   TOAST
   ============================================================ */
let toastTimer = null;
function toast(msg, kind = '') {
  const el = document.getElementById('toast');
  if (!el) return;
  el.textContent = msg;
  el.className = 'toast visible' + (kind ? ' ' + kind : '');
  if (toastTimer) clearTimeout(toastTimer);
  toastTimer = setTimeout(() => { el.className = 'toast'; }, 2500);
}

/* ============================================================
   EVENT BINDINGS
   ============================================================ */
function bindGlobalEvents() {
  document.addEventListener('click', onClick);
  document.addEventListener('change', onChange);
  document.addEventListener('input', onInput);
  document.addEventListener('keydown', (e) => {
    if (e.key === 'Escape') closeModal();
  });
  // Close modal on backdrop click
  document.addEventListener('click', (e) => {
    if (e.target.id === 'modal-root') closeModal();
  });
  // Cross-device sync: pull on focus / tab visible (throttled inside safeSync)
  window.addEventListener('focus', () => {
    if (Sync.isConfigured()) Sync.safeSync({ reason: 'focus' });
  });
  document.addEventListener('visibilitychange', () => {
    if (document.visibilityState === 'visible' && Sync.isConfigured()) {
      Sync.safeSync({ reason: 'tab visible' });
    }
  });
  // Tick the indicator every 30s so "Synced 2m ago" stays current
  setInterval(updateSyncIndicator, 30000);
}

function bindViewEvents() { /* re-binding handled by event delegation */ }

function onClick(e) {
  const target = e.target.closest('[data-action], [data-view]');
  if (!target) return;
  const view = target.dataset.view;
  if (view) {
    e.preventDefault();
    App.setView(view);
    return;
  }
  const action = target.dataset.action;
  if (!action) return;
  const id = target.dataset.id;

  switch (action) {
    case 'add-offer': showOfferModal(); break;
    case 'edit-offer': showOfferModal(id); break;
    case 'duplicate-offer': duplicateOffer(id); break;
    case 'convert-offer': convertOffer(id); break;
    case 'delete-offer': if (confirm('Delete this offer?')) deleteOffer(id); break;
    case 'delete-offer-from-modal': if (confirm('Delete this offer?')) { deleteOffer(id); closeModal(); } break;
    case 'save-offer': saveOfferFromForm(id, target.dataset.isedit === '1'); break;
    case 'toggle-advanced-form': toggleAdvancedForm(target); break;
    case 'close-modal': closeModal(); break;

    case 'add-commitment': showCommitmentModal(); break;
    case 'edit-commitment': showCommitmentModal(id); break;
    case 'delete-commitment': if (confirm('Delete this commitment?')) deleteCommitment(id); break;
    case 'delete-commitment-from-modal': if (confirm('Delete this commitment?')) { deleteCommitment(id); closeModal(); } break;
    case 'save-commitment': saveCommitmentFromForm(id, target.dataset.isedit === '1'); break;

    case 'add-event': showEventModal(); break;
    case 'edit-event': showEventModal(id); break;
    case 'delete-event': if (confirm('Delete this event?')) deleteEvent(id); break;
    case 'delete-event-from-modal': if (confirm('Delete this event?')) { deleteEvent(id); closeModal(); } break;
    case 'save-event': saveEventFromForm(id, target.dataset.isedit === '1'); break;

    case 'export-json': exportJson(); break;
    case 'reset-sample': if (confirm('Replace your data with sample data?')) { App.state = seedSampleData(App.defaultState()); App.save(); render(); toast('Sample data loaded'); } break;
    case 'clear-all': if (confirm('Erase ALL data? This cannot be undone.')) { App.state = App.defaultState(); App.save(); render(); toast('All data cleared'); } break;

    case 'run-optimizer': runOptimizerNow(); break;
    case 'clear-optimizer': App.optimizer.results = null; render(); break;
    case 'apply-combo': applyOptimizerCombo(target.dataset.mask); break;

    case 'toggle-advanced': App.filters.offersAdvanced = !App.filters.offersAdvanced; render(); break;

    case 'upcoming-prev': updateUpcomingPage(Math.max(0, (App._upcomingPage || 0) - 1)); break;
    case 'upcoming-next': updateUpcomingPage((App._upcomingPage || 0) + 1); break;

    // Sync actions
    case 'open-sync': App.setView('settings'); setTimeout(() => { document.getElementById('sync-section')?.scrollIntoView({ behavior: 'smooth', block: 'start' }); }, 50); break;
    case 'sync-save': saveSyncConfigFromForm(); break;
    case 'sync-pull': Sync.pull(); break;
    case 'sync-push': Sync.push(); break;
    case 'sync-create-gist': createGistFromForm(); break;
    case 'sync-disconnect': if (confirm('Disconnect cloud sync? Your local data is kept; nothing is deleted from the Gist.')) { Sync.disconnect(); render(); toast('Disconnected'); } break;
  }

  // FAB
  if (target.id === 'fab-add') { showOfferModal(); return; }
}

function onChange(e) {
  const el = e.target;
  if (el.id === 'fab-add') return;

  // Setting fields
  if (el.dataset.setting) {
    const key = el.dataset.setting;
    let value = el.type === 'checkbox' ? el.checked : (el.type === 'number' ? Number(el.value) : el.value);
    if (key === 'currentLiquidCapital' || key === 'minimumCashBuffer') value = Math.max(0, value);
    if (key === 'projectionHorizonDays') value = Math.max(30, Math.min(1825, value));
    if (key === 'maxOptimizerCandidates') value = Math.max(1, Math.min(20, value));
    App.update(s => { s.settings[key] = value; });
    return;
  }

  // Offer include checkbox
  if (el.dataset.action === 'toggle-include') {
    const id = el.dataset.id;
    App.update(s => {
      const o = s.offers.find(x => x.id === id);
      if (o) o.includeInScenario = el.checked;
    });
    return;
  }

  // Filter toggles
  if (el.dataset.action === 'toggle-filter') {
    App.filters[el.dataset.filter] = el.checked;
    render();
    return;
  }

  // Status change inline
  if (el.dataset.action === 'change-status') {
    const id = el.dataset.id;
    const newStatus = el.value;
    App.update(s => {
      const o = s.offers.find(x => x.id === id);
      if (o) o.status = newStatus;
    });
    return;
  }

  // Offers status filter
  if (el.dataset.action === 'offers-status') { App.filters.offersStatus = el.value; render(); return; }

  // Import JSON
  if (el.dataset.action === 'import-json') {
    const file = el.files[0];
    if (file) importJsonFile(file);
    return;
  }
}

function onInput(e) {
  const el = e.target;
  if (el.dataset.action === 'offers-search') {
    App.filters.offersSearch = el.value;
    clearTimeout(window._searchTimer);
    window._searchTimer = setTimeout(() => render(), 120);
  }
}

function toggleAdvancedForm(btn) {
  const expanded = btn.getAttribute('aria-expanded') === 'true';
  btn.setAttribute('aria-expanded', String(!expanded));
  const panel = document.getElementById('advanced-fields');
  if (panel) panel.classList.toggle('open', !expanded);
}

/* ============================================================
   ACTIONS
   ============================================================ */
function saveOfferFromForm(id, isEdit) {
  const offer = readOfferForm(id, isEdit);
  if (!offer) return;
  if (!offer.bankName) { toast('Bank name is required', 'danger'); return; }
  App.update(s => {
    const idx = s.offers.findIndex(o => o.id === id);
    if (idx >= 0) s.offers[idx] = offer;
    else s.offers.push(offer);
  });
  closeModal();
  toast(isEdit ? 'Offer updated' : 'Offer added');
}

function deleteOffer(id) {
  App.update(s => {
    s.offers = s.offers.filter(o => o.id !== id);
    s.commitments = s.commitments.filter(c => c.sourceBonusOfferId !== id);
  });
  toast('Offer deleted');
}

function duplicateOffer(id) {
  const o = App.state.offers.find(x => x.id === id);
  if (!o) return;
  const dup = JSON.parse(JSON.stringify(o));
  dup.id = uid('off');
  dup.bankName = o.bankName + ' (copy)';
  dup.status = 'prospect';
  App.update(s => { s.offers.push(dup); });
  toast('Offer duplicated');
}

function convertOffer(id) {
  const o = App.state.offers.find(x => x.id === id);
  if (!o) return;
  if (!isOfferComplete(o)) { toast('Offer is incomplete', 'danger'); return; }
  if (App.state.commitments.some(c => c.sourceBonusOfferId === id && c.status !== 'cancelled')) {
    toast('Already converted'); return;
  }
  const cmt = convertOfferToCommitment(o);
  if (!cmt) { toast('Could not derive dates', 'danger'); return; }
  App.update(s => { s.commitments.push(cmt); });
  toast('Offer converted to commitment');
}

function saveCommitmentFromForm(id, isEdit) {
  const c = readCommitmentForm(id);
  if (!c) return;
  if (!c.commitmentName) { toast('Name required', 'danger'); return; }
  if (!c.startDate || !c.endDate || parseDate(c.startDate) >= parseDate(c.endDate)) { toast('End date must be after start date', 'danger'); return; }
  App.update(s => {
    const idx = s.commitments.findIndex(x => x.id === id);
    if (idx >= 0) s.commitments[idx] = c;
    else s.commitments.push(c);
  });
  closeModal();
  toast(isEdit ? 'Commitment saved' : 'Commitment added');
}

function deleteCommitment(id) {
  App.update(s => { s.commitments = s.commitments.filter(c => c.id !== id); });
  toast('Commitment deleted');
}

function saveEventFromForm(id, isEdit) {
  const ev = readEventForm(id);
  if (!ev) return;
  if (!ev.eventName) { toast('Name required', 'danger'); return; }
  if (!ev.date || !parseDate(ev.date)) { toast('Date required', 'danger'); return; }
  App.update(s => {
    const idx = s.events.findIndex(x => x.id === id);
    if (idx >= 0) s.events[idx] = ev;
    else s.events.push(ev);
  });
  closeModal();
  toast(isEdit ? 'Event saved' : 'Event added');
}

function deleteEvent(id) {
  App.update(s => { s.events = s.events.filter(e => e.id !== id); });
  toast('Event deleted');
}

function runOptimizerNow() {
  const result = runOptimizer(App.state);
  App.optimizer.results = result;
  render();
  if (result.tooMany) toast(`Too many candidates (${result.candidateCount}). Mark some as skipped.`, 'danger');
  else if (result.results.length === 0) toast('No feasible combinations found', 'danger');
  else toast(`Found ${result.results.length} feasible combination${result.results.length === 1 ? '' : 's'}`);
}

function applyOptimizerCombo(maskStr) {
  const result = App.optimizer.results;
  if (!result) return;
  const mask = Number(maskStr);
  const candidates = result.candidates;
  App.update(s => {
    for (let i = 0; i < candidates.length; i++) {
      const o = s.offers.find(x => x.id === candidates[i].id);
      if (!o) continue;
      o.includeInScenario = Boolean(mask & (1 << i));
    }
  });
  toast('Combination applied');
}

/* ============================================================
   SYNC FORM HANDLERS
   ============================================================ */
async function saveSyncConfigFromForm() {
  const gistInput = document.getElementById('sync-gist');
  const tokenInput = document.getElementById('sync-token');
  if (!gistInput || !tokenInput) return;
  const gistId = gistInput.value.trim();
  const token = tokenInput.value.trim();
  if (!token) { toast('Token is required', 'danger'); return; }
  if (!gistId) { toast('Gist ID is required (or use "Create new Gist")', 'danger'); return; }
  Sync.setConfig({ gistId, token });
  Sync.setStatus('syncing');
  // "Save & test" semantic: this device is joining sync. If the Gist has
  // valid existing state, adopt it (pull). If empty or fresh, push local up.
  try {
    const data = await ghGet(`https://api.github.com/gists/${gistId}`, token);
    const file = data.files[SYNC_FILENAME] || Object.values(data.files || {})[0];
    let remote = null;
    if (file) {
      const content = file.truncated
        ? await (await fetch(file.raw_url)).text()
        : file.content;
      if (content && content.trim()) {
        try { remote = JSON.parse(content); } catch {}
      }
    }
    if (remote && remote.settings && typeof remote.settings === 'object') {
      // Adopt the cloud state — this device joins the existing sync
      App.state = remote;
      try { localStorage.setItem(STORAGE_KEY, JSON.stringify(App.state)); } catch {}
      Sync.lastSyncAt = Date.now();
      Sync.setStatus('synced');
      Sync.startupDone = true;
      toast('Synced — pulled cloud data');
    } else {
      // Empty/new Gist: seed it with our local state
      await Sync.push({ silent: true });
      Sync.startupDone = true;
      toast('Synced — pushed local data to cloud');
    }
  } catch (e) {
    Sync.setStatus('error', e.message);
    toast('Sync test failed: ' + e.message, 'danger');
  }
  render();
}

async function createGistFromForm() {
  const tokenInput = document.getElementById('sync-token');
  if (!tokenInput) return;
  const token = tokenInput.value.trim();
  if (!token) { toast('Token is required first', 'danger'); return; }
  Sync.setStatus('syncing');
  try {
    const gistId = await Sync.createGist(token);
    Sync.setConfig({ gistId, token });
    Sync.lastSyncAt = Date.now();
    Sync.setStatus('synced');
    toast('Created and linked Gist');
    render();
  } catch (e) {
    Sync.setStatus('error', e.message);
    toast('Could not create Gist: ' + e.message, 'danger');
  }
}

/* ============================================================
   IMPORT / EXPORT
   ============================================================ */
function exportJson() {
  const blob = new Blob([JSON.stringify(App.state, null, 2)], { type: 'application/json' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = `capital-planner-${isoDate(TODAY)}.json`;
  document.body.appendChild(a);
  a.click();
  setTimeout(() => { document.body.removeChild(a); URL.revokeObjectURL(url); }, 100);
  toast('Exported');
}

function importJsonFile(file) {
  const reader = new FileReader();
  reader.onload = (e) => {
    try {
      const parsed = JSON.parse(e.target.result);
      if (!parsed.settings || !Array.isArray(parsed.offers)) throw new Error('Invalid shape');
      App.state = parsed;
      App.save();
      render();
      toast('Imported');
    } catch (err) {
      toast('Invalid JSON: ' + err.message, 'danger');
    }
  };
  reader.readAsText(file);
}

<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#5b5cf6">
<title>Yield Vector</title>
<!-- iOS PWA: lets the page launch full-screen when added to Home Screen -->
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Yield Vector">
<meta name="mobile-web-app-capable" content="yes">
<meta name="format-detection" content="telephone=no">
<!-- Icon + manifest hrefs are set at runtime via canvas-generated PNG -->
<link rel="apple-touch-icon" id="apple-icon" href="">
<link rel="icon" id="favicon" href="">
<link rel="manifest" id="manifest" href="">
<style>
/* ============================================================
   DESIGN TOKENS
   ============================================================ */
:root {
  --bg: #f5f5f7;
  --bg-elevated: #ffffff;
  --card: #ffffff;
  --card-soft: #fafafc;

  --text: #2a2e3d;
  --text-secondary: #5b6374;
  --text-tertiary: #9099a8;
  --text-inverse: #ffffff;

  --accent: #5b5cf6;
  --accent-hover: #4f50e0;
  --accent-soft: #eef0fe;
  --accent-mid: #c8c9fa;
  --accent-strong: #3f40c4;

  --warning: #f59e0b;
  --warning-soft: #fff5e0;
  /* Lightened red — matches .stat-value.danger and .action-tag.danger so
     every red in the UI reads as the same softer shade. */
  --danger: #e87171;
  --danger-soft: #fee5e5;
  --success: #10b981;
  --success-soft: #d6f5e7;

  --border: #e5e7eb;
  --border-soft: #eef0f2;
  --border-strong: #d1d5db;

  --radius-sm: 8px;
  --radius-md: 12px;
  --radius-lg: 16px;
  --radius-xl: 20px;
  --radius-pill: 999px;

  --space-1: 4px;
  --space-2: 8px;
  --space-3: 12px;
  --space-4: 16px;
  --space-5: 20px;
  --space-6: 24px;
  --space-7: 28px;
  --space-8: 32px;
  --space-10: 40px;
  --space-12: 48px;
  --space-16: 64px;

  --shadow-sm: 0 1px 2px rgba(15, 23, 42, 0.04);
  --shadow-card: 0 1px 3px rgba(15, 23, 42, 0.04), 0 4px 16px rgba(15, 23, 42, 0.05);
  --shadow-card-hover: 0 1px 3px rgba(15, 23, 42, 0.06), 0 12px 28px rgba(15, 23, 42, 0.08);
  --shadow-modal: 0 24px 64px rgba(15, 23, 42, 0.18);
  --shadow-fab: 0 8px 24px rgba(91, 92, 246, 0.35);

  --font-sans: -apple-system, BlinkMacSystemFont, 'SF Pro Display', 'SF Pro Text', 'Segoe UI', Roboto, 'Helvetica Neue', sans-serif;
  --font-mono: 'SF Mono', 'Menlo', 'Monaco', 'Consolas', monospace;

  --header-height: 80px;
  --bottom-nav-height: 70px;
  --content-max-width: 1280px;
}

/* (BrokenDollar @font-face removed — the substitute fonts rendered the $
   glyph taller than SF Pro's digits, so amounts looked uneven. SF Pro's
   default $ has a continuous vertical line, but its cap-height matches
   the digits exactly.) */

/* ============================================================
   RESET & BASE
   ============================================================ */
* { box-sizing: border-box; margin: 0; padding: 0; }

html { -webkit-text-size-adjust: 100%; }

body {
  font-family: var(--font-sans);
  font-size: 15px;
  line-height: 1.5;
  color: var(--text);
  background: var(--bg);
  -webkit-font-smoothing: antialiased;
  -moz-osx-font-smoothing: grayscale;
  font-feature-settings: 'tnum' 1, 'cv11' 1;
  min-height: 100vh;
  overflow-x: hidden;
}

button { font: inherit; color: inherit; background: none; border: none; cursor: pointer; }
input, select, textarea { font: inherit; color: inherit; }
ul, ol { list-style: none; }
a { color: inherit; text-decoration: none; }

/* ============================================================
   LAYOUT
   ============================================================ */
.app-shell {
  display: flex;
  flex-direction: column;
  min-height: 100vh;
}

.app-header {
  position: sticky;
  top: 0;
  z-index: 30;
  display: flex;
  align-items: center;
  gap: var(--space-6);
  height: var(--header-height);
  padding: 0 var(--space-6);
  background: rgba(245, 245, 247, 0.85);
  backdrop-filter: saturate(1.6) blur(14px);
  -webkit-backdrop-filter: saturate(1.6) blur(14px);
  border-bottom: 1px solid var(--border-soft);
}

.brand {
  display: inline-flex;
  align-items: center;
  gap: 8px;
}

.brand-flourish {
  flex-shrink: 0;
  display: block;
}

.brand-name {
  /* Hold the deep indigo across most of "Yield" and only let the lift bloom
     during "Vector" — sharper diagonal, late stops. */
  background: linear-gradient(115deg, #312e81 0%, #4338ca 58%, #5b4fd8 78%, #7c5fef 92%, #a78bfa 100%);
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
  background-clip: text;
  /* Apple-system text feel: SF Pro Display via the existing font stack,
     semibold (600) instead of bold (700), slightly looser tracking. */
  font-family: 'SF Pro Display', 'SF Pro Text', -apple-system, BlinkMacSystemFont, var(--font-sans);
  font-weight: 600;
  font-size: 17px;
  letter-spacing: -0.018em;
  line-height: 1;
}

.primary-nav {
  display: flex;
  gap: var(--space-1);
  margin-left: var(--space-6);
}

.nav-btn {
  padding: 8px 14px;
  border-radius: var(--radius-pill);
  font-size: 14px;
  font-weight: 500;
  color: var(--text-secondary);
  transition: background 0.15s, color 0.15s;
}

.nav-btn:hover { color: var(--text); background: var(--accent-soft); }
.nav-btn.active { color: var(--accent); background: var(--accent-soft); font-weight: 600; }

.header-trailing {
  margin-left: auto;
  display: flex;
  gap: var(--space-3);
  align-items: center;
}
.header-actions {
  display: flex;
  gap: var(--space-2);
  align-items: center;
}

/* Overview "side panel" layout: actions wide on left, snapshot narrow on
   right. Items align to top so they don't stretch awkwardly. */
.overview-side {
  display: grid;
  grid-template-columns: minmax(0, 2fr) minmax(0, 1fr);
  gap: var(--space-4);
  align-items: start;
}
@media (max-width: 720px) {
  .overview-side { grid-template-columns: 1fr; }
}

.snapshot-card {
  padding: var(--space-5);
  background: var(--card);
  border: 1px solid var(--border-soft);
  box-shadow: var(--shadow-card);
}
.snapshot-title {
  font-size: 12px;
  font-weight: 600;
  text-transform: uppercase;
  letter-spacing: 0.06em;
  color: var(--text-tertiary);
  margin-bottom: var(--space-4);
  display: flex;
  align-items: center;
  gap: 6px;
}
.snapshot-title::after {
  content: '';
  flex: 1;
  height: 1px;
  background: var(--border-soft);
}
.snapshot-grid {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: var(--space-3);
}
/* Each stat cell: subtle left accent stripe (color-coded per stat),
   value above label, slightly more padding, and a hover lift so the
   panel reads as a designed dashboard component rather than a flat
   list of key/values. */
.snap {
  display: flex;
  flex-direction: column-reverse;  /* value on top, label below */
  gap: 2px;
  padding: var(--space-3) var(--space-3) var(--space-3) calc(var(--space-3) + 4px);
  background: var(--card-soft);
  border-radius: var(--radius-md);
  border: 1px solid var(--border-soft);
  position: relative;
  overflow: hidden;
  transition: background 0.12s, transform 0.12s;
}
.snap::before {
  content: '';
  position: absolute;
  left: 0; top: 8px; bottom: 8px;
  width: 3px;
  border-radius: 2px;
  background: var(--accent-mid);
}
.snap.snap-active::before  { background: #7c5fef; }
.snap.snap-confirmed::before { background: #10b981; }
.snap.snap-events::before    { background: #f59e0b; }
.snap.snap-horizon::before   { background: #6b7280; }
.snap.snap-buffer::before    { background: #d97706; }
.snap.snap-bonus::before     { background: #10b981; }
.snap-l {
  font-size: 11px;
  color: var(--text-tertiary);
  font-weight: 600;
  text-transform: uppercase;
  letter-spacing: 0.04em;
}
.snap-v {
  font-size: 19px;
  font-weight: 700;
  letter-spacing: -0.015em;
  color: var(--text);
  font-feature-settings: 'tnum' 1;
  line-height: 1.1;
}
.snap.snap-bonus .snap-v { color: var(--success); }

/* Sync indicator chip in the header — flatter & lighter than a pill:
   rounded-square radius, no shadow, very-light translucent background,
   no border. Sits unobtrusively at top-right while still readable. */
.sync-indicator {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  padding: 5px 10px;
  border-radius: 8px;
  font-size: 12px;
  font-weight: 500;
  cursor: pointer;
  background: rgba(13, 20, 33, 0.04);
  color: var(--text-tertiary);
  border: none;
  box-shadow: none;
  transition: background 0.15s, color 0.15s;
  white-space: nowrap;
}
.sync-indicator:hover { background: rgba(13, 20, 33, 0.07); color: var(--text-secondary); }
.sync-dot {
  width: 7px; height: 7px;
  border-radius: 50%;
  background: var(--text-tertiary);
  flex-shrink: 0;
  /* No halo box-shadow — flat single-color dot. */
}
.sync-indicator[data-status="synced"] .sync-dot { background: var(--success); }
.sync-indicator[data-status="syncing"] .sync-dot { background: var(--warning); animation: sync-pulse 1.1s ease-in-out infinite; }
.sync-indicator[data-status="pending"] .sync-dot { background: var(--warning); }
.sync-indicator[data-status="error"] .sync-dot { background: var(--danger); }
.sync-indicator[data-status="unconfigured"] .sync-dot { background: var(--text-tertiary); }
.sync-indicator[data-status="error"] { color: var(--danger); background: rgba(232, 113, 113, 0.08); }

@keyframes sync-pulse {
  0%, 100% { opacity: 1; transform: scale(1); }
  50% { opacity: 0.5; transform: scale(0.85); }
}

@media (max-width: 480px) {
  .sync-indicator .sync-text { display: none; }
  .sync-indicator { padding: 8px; }
}

.app-main {
  flex: 1;
  padding: var(--space-8) var(--space-6) var(--space-12);
  max-width: var(--content-max-width);
  width: 100%;
  margin: 0 auto;
}

/* Mobile bottom nav */
.mobile-nav {
  display: none;
  position: fixed;
  bottom: 0;
  left: 0;
  right: 0;
  height: var(--bottom-nav-height);
  background: rgba(255, 255, 255, 0.95);
  backdrop-filter: saturate(1.6) blur(14px);
  border-top: 1px solid var(--border-soft);
  padding: 8px 4px calc(8px + env(safe-area-inset-bottom));
  z-index: 30;
  justify-content: space-around;
}

.mobile-nav .nav-btn {
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 2px;
  padding: 6px 8px;
  font-size: 11px;
  background: transparent;
  border-radius: var(--radius-md);
  color: var(--text-tertiary);
  font-weight: 500;
}

.mobile-nav .nav-btn.active {
  color: var(--accent);
  background: transparent;
}

.mobile-nav .nav-btn svg { width: 22px; height: 22px; stroke-width: 1.7; }

.fab {
  position: fixed;
  display: none;
  bottom: calc(var(--bottom-nav-height) + 12px);
  right: 16px;
  width: 56px;
  height: 56px;
  border-radius: 50%;
  background: var(--accent);
  color: white;
  box-shadow: var(--shadow-fab);
  z-index: 25;
  align-items: center;
  justify-content: center;
  transition: transform 0.15s;
}
.fab:active { transform: scale(0.95); }

/* ============================================================
   BUTTONS
   ============================================================ */
.btn {
  display: inline-flex;
  align-items: center;
  gap: var(--space-2);
  padding: 9px 16px;
  border-radius: var(--radius-pill);
  font-size: 14px;
  font-weight: 500;
  transition: background 0.12s, color 0.12s, transform 0.05s, box-shadow 0.12s;
  white-space: nowrap;
  border: 1px solid transparent;
}
.btn:active { transform: translateY(0.5px); }

.btn-primary { background: var(--accent); color: white; }
.btn-primary:hover { background: var(--accent-hover); }

.btn-secondary { background: var(--bg-elevated); color: var(--text); border-color: var(--border); }
.btn-secondary:hover { background: var(--card-soft); border-color: var(--border-strong); }

.btn-ghost { color: var(--text-secondary); padding: 8px 12px; }
.btn-ghost:hover { background: var(--accent-soft); color: var(--accent); }

.btn-danger { color: var(--danger); }
.btn-danger:hover { background: var(--danger-soft); }

.btn-sm { padding: 6px 12px; font-size: 13px; }
.btn-lg { padding: 12px 22px; font-size: 15px; }

.btn-icon {
  width: 36px; height: 36px;
  border-radius: var(--radius-md);
  padding: 0;
  display: inline-grid;
  place-items: center;
  color: var(--text-secondary);
  transition: background 0.12s, color 0.12s;
}
.btn-icon:hover { background: var(--accent-soft); color: var(--accent); }

/* ============================================================
   CARDS
   ============================================================ */
.card {
  background: var(--card);
  border-radius: var(--radius-xl);
  padding: var(--space-6);
  box-shadow: var(--shadow-card);
}

.card-soft { background: var(--card-soft); border: 1px solid var(--border-soft); box-shadow: none; }

.card-title {
  font-size: 13px;
  font-weight: 600;
  text-transform: uppercase;
  letter-spacing: 0.06em;
  color: var(--text-tertiary);
  margin-bottom: var(--space-4);
}

.card-header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: var(--space-3);
  margin-bottom: var(--space-4);
}

.card-header h2 {
  font-size: 18px;
  font-weight: 600;
  letter-spacing: -0.01em;
}

/* ============================================================
   OVERVIEW: HERO
   ============================================================ */
.hero {
  background: var(--card);
  border-radius: var(--radius-xl);
  padding: var(--space-8);
  box-shadow: var(--shadow-card);
  margin-bottom: var(--space-6);
}

.hero-numbers {
  display: flex;
  flex-direction: column;
  gap: var(--space-3);
  margin-bottom: var(--space-6);
}

/* Tile-style label — same casing/letter-spacing as the stat-card labels
   below so the hero reads as the leading tile in a coherent row. Slightly
   larger and pushed away from the dollar amount for breathing room. */
.hero-label {
  font-size: 14px;
  font-weight: 600;
  text-transform: uppercase;
  letter-spacing: 0.06em;
  color: var(--text-tertiary);
  margin-bottom: var(--space-1);
  /* Allow the label to wrap so it never truncates mid-word on narrow
     viewports ("AVAILABLE CAPI..." was being cut off on phones). */
  white-space: normal;
  overflow-wrap: anywhere;
}

.hero-amount {
  /* 38 px (5% smaller than the prior 40 px), weight 600, lighter color
     (#2a3245 vs #1a2235) for less visual heft. The whole value renders
     as a single string ("$175,000") inside one <span> for the digits +
     one for the symbol — both inline with margin/padding 0 so the gap
     between $ and the first digit is exactly typographic kerning, not
     a pixel of CSS margin. Other dollar displays in the app (stat
     cells, tooltips, "Tied up today") use plain string concat
     ("$" + n.toLocaleString()), so this matches them by virtue of
     having no CSS-injected gap either. */
  font-size: 38px;
  font-weight: 600;
  letter-spacing: -0.025em;
  line-height: 1;
  color: #2a3245;
}

/* Currency symbol: same size, same weight, ZERO margin between $ and
   the first digit. Consistent with formatCurrency() / formatCompact-
   Currency() output everywhere else in the app, which produces "$X"
   as a single string with no separator. */
.hero-amount .currency-symbol {
  font-weight: inherit;
  opacity: 1;
  margin: 0;
  padding: 0;
  font-size: 1em;
  vertical-align: baseline;
  display: inline;
  letter-spacing: 0;
}
.hero-amount .currency-symbol + * { margin-left: 0; padding-left: 0; }

.hero-meta {
  font-size: 15px;
  color: var(--text-secondary);
  display: flex;
  flex-wrap: wrap;
  gap: 12px;
  align-items: center;
}

.hero-meta .pill {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  padding: 4px 10px;
  border-radius: var(--radius-pill);
  font-size: 13px;
  background: var(--accent-soft);
  color: var(--accent);
  font-weight: 500;
}
.hero-meta .pill.warn { background: var(--warning-soft); color: #b45309; }
.hero-meta .pill.danger { background: var(--danger-soft); color: var(--danger); }

/* ============================================================
   CHART
   ============================================================ */
.chart-wrap {
  position: relative;
  width: 100%;
  margin-top: var(--space-4);
}

.chart-svg { width: 100%; display: block; overflow: visible; }
.chart-svg text {
  font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Display', 'SF Pro Text', 'Segoe UI', Roboto, 'Helvetica Neue', sans-serif;
  font-feature-settings: 'tnum' 1;
  -webkit-font-smoothing: antialiased;
}

/* Mobile portrait: chart needs BOTH a min-width (so the user has
   content to scroll through) AND a horizontally-scrollable wrapper.
   Tooltip is appended to <body> in JS (Round 18) so it renders above
   the wrap regardless of overflow — no need for `overflow: visible`. */
@media (max-width: 720px) and (orientation: portrait) {
  .chart-wrap {
    overflow-x: auto;
    overflow-y: hidden;
    -webkit-overflow-scrolling: touch;
    margin: var(--space-4) 0 0 0;
    padding: 0;
    scrollbar-width: thin;
  }
  .chart-svg {
    width: 100%;
    min-width: 600px;       /* user scrolls horizontally for the rest */
    height: auto;
    display: block;
  }
}

/* Mobile landscape: viewport is wide & short — chart fits without scroll
   and capped at a moderate height so the rest of the page is reachable. */
@media (max-width: 1024px) and (orientation: landscape) {
  .chart-wrap {
    overflow-x: auto;
    overflow-y: visible;
    -webkit-overflow-scrolling: touch;
    margin: var(--space-3) 0 0 0;
    padding: 0;
    max-height: 280px;
  }
  .chart-svg {
    width: 100%;
    min-width: 600px;
    height: auto;
    display: block;
  }
}

.chart-tooltip {
  position: absolute;
  pointer-events: none;
  background: rgba(13, 20, 33, 0.94);
  color: white;
  padding: 10px 14px;
  border-radius: 10px;
  font-size: 12px;
  line-height: 1.5;
  transform: translate(-50%, -110%);
  white-space: nowrap;
  box-shadow: 0 6px 20px rgba(0,0,0,0.18);
  opacity: 0;
  transition: opacity 0.1s;
  z-index: 5;
}
.chart-tooltip.visible { opacity: 1; }
/* On mobile, lock the tooltip to a fixed width so it doesn't visually
   reflow into different-sized boxes day-to-day based on which markers
   happen to be near the cursor. Long event names truncate cleanly
   inside the fixed box rather than pushing the box wider. */
@media (max-width: 720px) {
  .chart-tooltip {
    white-space: normal;
    width: 220px;
    min-width: 220px;
    max-width: min(220px, calc(100vw - 24px));
  }
  .chart-tooltip .tt-row > span:last-child {
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
    min-width: 0;
    flex: 1 1 auto;
    text-align: right;
  }
  .chart-tooltip .tt-row .label { flex: 0 0 auto; }
}
.chart-tooltip .tt-date { font-weight: 600; margin-bottom: 4px; opacity: 0.85; }
.chart-tooltip .tt-row { display: flex; justify-content: space-between; gap: 16px; min-width: 0; }
.chart-tooltip .tt-row .label { opacity: 0.7; }

.chart-legend {
  display: flex;
  flex-wrap: wrap;
  gap: var(--space-4);
  margin-top: var(--space-4);
  font-size: 12px;
  color: var(--text-secondary);
}
.chart-legend-item { display: inline-flex; align-items: center; gap: 6px; }
.legend-swatch { width: 10px; height: 10px; border-radius: 3px; display: inline-block; }
.legend-line { width: 16px; height: 2px; display: inline-block; border-radius: 1px; }
.legend-line.dashed { border-top: 2px dashed currentColor; height: 0; }

/* ============================================================
   GRID & STAT CARDS
   ============================================================ */
.grid {
  display: grid;
  gap: var(--space-4);
}

.grid-cols-1 { grid-template-columns: 1fr; }
.grid-cols-2 { grid-template-columns: repeat(2, minmax(0, 1fr)); }
.grid-cols-3 { grid-template-columns: repeat(3, minmax(0, 1fr)); }
.grid-cols-4 { grid-template-columns: repeat(4, minmax(0, 1fr)); }

.stat-card {
  background: var(--card);
  border-radius: var(--radius-lg);
  padding: var(--space-5);
  box-shadow: var(--shadow-card);
  display: flex;
  flex-direction: column;
  gap: var(--space-2);
  transition: box-shadow 0.18s, transform 0.08s;
}
.stat-card:hover { box-shadow: var(--shadow-card-hover); }
/* Clickable affordance: cursor + a tiny lift on hover, settle on press.
   Activated by adding data-action to the stat-card so any <div> with a
   navigation action automatically reads as a button. */
.stat-card[data-action] { cursor: pointer; }
.stat-card[data-action]:hover { transform: translateY(-1px); }
.stat-card[data-action]:active { transform: translateY(0); }
.stat-card[data-action]:focus-visible {
  outline: 2px solid var(--accent);
  outline-offset: 2px;
}
.stat-label { font-size: 12px; color: var(--text-tertiary); font-weight: 600; text-transform: uppercase; letter-spacing: 0.06em; }
.stat-value { font-size: 26px; font-weight: 600; letter-spacing: -0.02em; line-height: 1.15; }
/* Mid amber — sits between the Offer-expires tag's pale background
   (#fff5e0) and its deep brown text (#b45309). Used when Lowest projected
   touches the buffer zone (positive but below buffer). */
.stat-value.warn { color: #c88b2c; }
/* Lighter red — softened from raw #ef4444 to match the Deposit Deadline tag */
.stat-value.danger { color: #e87171; }
/* Brighter mint green, in lockstep with .action-tag.success */
.stat-value.success { color: #0ea968; }
/* Slightly deeper than the prior #8284f7 — closer to the wordmark indigo */
.stat-value.accent { color: #6c6ce5; }
/* Same mid amber as .stat-value.warn so "healthy but lighten" reads coherent */
.stat-value.lighten { color: #c88b2c; }
.stat-meta { font-size: 12px; color: var(--text-tertiary); margin-top: var(--space-1); }

/* ============================================================
   UPCOMING ACTIONS
   ============================================================ */
.action-list {
  display: flex;
  flex-direction: column;
  gap: var(--space-1);
  /* Reserve a full page worth of vertical space so paging to a partial last
     page doesn't shrink the card and yank the page upward. 6 rows × ~52px. */
  min-height: 312px;
}
@media (max-width: 480px) {
  .action-list { min-height: 360px; } /* mobile rows wrap an extra line */
}

.action-row {
  display: grid;
  grid-template-columns: 56px minmax(0, 1fr) auto;
  align-items: center;
  gap: var(--space-3);
  padding: var(--space-3) var(--space-4);
  border-radius: var(--radius-md);
  transition: background 0.1s;
}
.action-row:hover { background: var(--bg); }

/* Mobile: tighter columns, tag wraps under the title so nothing collides */
@media (max-width: 480px) {
  .action-row {
    grid-template-columns: 48px minmax(0, 1fr);
    gap: var(--space-2);
    padding: var(--space-2) var(--space-3);
  }
  .action-row .action-tag {
    grid-column: 2;
    grid-row: 2;
    justify-self: start;
    margin-top: 2px;
    font-size: 10px;
    padding: 2px 7px;
  }
}

/* iOS calendar-icon-style date block: bright red month, large dark day */
.action-day {
  text-align: center;
  line-height: 1;
  padding: 2px 0;
}
.action-day .month {
  display: block;
  font-size: 10px;
  font-weight: 700;
  color: #ff3b30;  /* iOS systemRed */
  text-transform: uppercase;
  letter-spacing: 0.04em;
  line-height: 1.4;
  margin-bottom: 1px;
}
.action-day .day {
  display: block;
  font-size: 24px;
  /* Mac Calendar feel: semibold, not heavy bold */
  font-weight: 500;
  color: var(--text);
  line-height: 1;
  letter-spacing: 0;
  /* Proportional (not tabular) figures so a narrow "1" doesn't carry extra
     left-side bearing — under tabular-nums "16" looked right-shifted vs
     "30" because the "1" sat in a fixed-width box with empty space on
     its left. Proportional widths size each number to its actual glyphs
     so the block centers naturally in the 56px cell. */
  font-variant-numeric: proportional-nums;
  font-feature-settings: 'pnum' 1;
}
.action-day .month { font-weight: 600; }

.action-body { display: flex; flex-direction: column; gap: 2px; min-width: 0; }
.action-title { font-weight: 500; font-size: 14px; color: var(--text); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.action-sub { font-size: 12px; color: var(--text-tertiary); }

.action-tag {
  font-size: 11px;
  padding: 3px 8px;
  border-radius: var(--radius-pill);
  background: var(--accent-soft);
  /* Default (Outflow / generic) — slightly deeper purple, in lockstep with
     the Tied-up-today stat color so the two read as the same hue. */
  color: #6c6ce5;
  font-weight: 600;
  text-transform: uppercase;
  letter-spacing: 0.04em;
}
.action-tag.warn { background: var(--warning-soft); color: #b45309; }
/* Brighter mint green — softer than #10b981, deeper than #059669; the same
   tone is used by .stat-value.success so Selected bonuses and the Withdrawal
   tag read as one hue. */
.action-tag.success { background: var(--success-soft); color: #0ea968; }
/* Lightened red — matches .stat-value.danger so Lowest Projected and the
   Deposit Deadline tag read as the same shade. */
.action-tag.danger { background: var(--danger-soft); color: #e87171; }

.upcoming-pager { display: inline-flex; align-items: center; gap: 6px; }
.upcoming-pg-btn {
  width: 24px; height: 24px; border-radius: 50%;
  background: var(--accent-soft); color: var(--accent);
  font-size: 14px; font-weight: 600; line-height: 1;
  display: inline-flex; align-items: center; justify-content: center;
  border: none; cursor: pointer; transition: background 0.12s, opacity 0.12s;
}
.upcoming-pg-btn:hover:not(:disabled) { background: var(--accent-mid); }
.upcoming-pg-btn:disabled { opacity: 0.35; cursor: default; }
.upcoming-pg-label { font-size: 12px; color: var(--text-tertiary); font-variant-numeric: tabular-nums; min-width: 30px; text-align: center; }
.upcoming-fade { animation: upcoming-fade-in 0.22s ease-out; }
@keyframes upcoming-fade-in {
  from { opacity: 0; transform: translateY(4px); }
  to { opacity: 1; transform: translateY(0); }
}

/* ============================================================
   OFFER CARDS
   ============================================================ */
.offer-card {
  background: var(--card);
  border-radius: var(--radius-lg);
  padding: var(--space-5);
  box-shadow: var(--shadow-card);
  border: 1.5px solid transparent;
  transition: border-color 0.15s, box-shadow 0.15s, transform 0.05s;
  position: relative;
}
.offer-card.included { border-color: var(--accent); }
.offer-card.draft { opacity: 0.85; border-style: dashed; border-color: var(--warning); }

.offer-card-header {
  display: flex;
  align-items: flex-start;
  gap: var(--space-3);
  margin-bottom: var(--space-4);
}

.offer-include {
  appearance: none;
  -webkit-appearance: none;
  width: 22px; height: 22px;
  border: 2px solid var(--border-strong);
  border-radius: 7px;
  cursor: pointer;
  position: relative;
  flex-shrink: 0;
  margin-top: 2px;
  transition: background 0.1s, border-color 0.1s;
}
.offer-include:checked {
  background: var(--accent);
  border-color: var(--accent);
}
.offer-include:checked::after {
  content: '';
  position: absolute;
  left: 5px; top: 1px;
  width: 6px; height: 11px;
  border: solid white;
  border-width: 0 2.5px 2.5px 0;
  transform: rotate(45deg);
}
.offer-include:disabled { opacity: 0.5; cursor: not-allowed; }

.offer-name { font-size: 16px; font-weight: 600; line-height: 1.25; letter-spacing: -0.01em; }
.offer-bank { font-size: 13px; color: var(--text-tertiary); margin-top: 2px; }

.offer-stats {
  display: grid;
  grid-template-columns: repeat(2, 1fr);
  gap: var(--space-3) var(--space-4);
  padding: var(--space-3) 0;
  border-top: 1px solid var(--border-soft);
  border-bottom: 1px solid var(--border-soft);
  margin-bottom: var(--space-4);
}
.offer-stat { display: flex; flex-direction: column; }
.offer-stat-label { font-size: 11px; color: var(--text-tertiary); font-weight: 600; text-transform: uppercase; letter-spacing: 0.05em; }
.offer-stat-value { font-size: 15px; font-weight: 600; color: var(--text); margin-top: 2px; }
.offer-stat-value.success { color: var(--success); }
.offer-stat-value.muted { color: var(--text-tertiary); font-weight: 500; }

.offer-dates { font-size: 13px; color: var(--text-secondary); margin-bottom: var(--space-3); display: flex; flex-direction: column; gap: 2px; }

.offer-chips {
  display: flex;
  flex-wrap: wrap;
  gap: var(--space-2);
  margin-bottom: var(--space-3);
}

.chip {
  font-size: 11px;
  padding: 3px 9px;
  border-radius: var(--radius-pill);
  background: var(--bg);
  color: var(--text-secondary);
  font-weight: 600;
  text-transform: uppercase;
  letter-spacing: 0.04em;
}
.chip-accent { background: var(--accent-soft); color: var(--accent); }
.chip-warn { background: var(--warning-soft); color: #b45309; }
.chip-success { background: var(--success-soft); color: #047857; }
.chip-danger { background: var(--danger-soft); color: var(--danger); }
.chip-muted { background: var(--bg); color: var(--text-tertiary); }

.offer-actions {
  display: flex;
  gap: var(--space-1);
  align-items: center;
  flex-wrap: wrap;
  margin-top: auto;
}

/* ============================================================
   TIMELINE — labels and tracks live in TWO SEPARATE CONTAINERS
   side-by-side. The labels column never scrolls; the tracks column
   scrolls horizontally on its own. They share no scroll parent, so
   bars can never bleed visually behind the labels.
   ============================================================ */
.timeline-wrap {
  display: flex;
  background: var(--card);
  border-radius: var(--radius-xl);
  padding: var(--space-6);
  box-shadow: var(--shadow-card);
  overflow: hidden;
}

.timeline-labels-col {
  flex: 0 0 240px;
  display: flex;
  flex-direction: column;
  border-right: 1px solid var(--border-soft);
}

.timeline-tracks-scroll {
  flex: 1 1 0;
  min-width: 0;
  overflow-x: auto;
  overflow-y: hidden;
  -webkit-overflow-scrolling: touch;
}

.timeline-tracks-col {
  display: flex;
  flex-direction: column;
  min-width: 100%;
}

.timeline-row-label {
  height: 44px;
  display: flex;
  flex-direction: column;
  justify-content: center;
  padding: var(--space-2) var(--space-3);
  font-size: 13px;
  font-weight: 500;
  color: var(--text);
  background: var(--card);
  border-bottom: 1px solid var(--border-soft);
  box-sizing: border-box;
}
.timeline-labels-col > .timeline-row-label:last-child { border-bottom: none; }
.timeline-row-label.axis {
  height: 32px;
  font-size: 11px;
  color: var(--text-tertiary);
  text-transform: uppercase;
  letter-spacing: 0.05em;
}
.timeline-row-label .sub { font-size: 11px; color: var(--text-tertiary); margin-top: 2px; }

.timeline-row-track {
  position: relative;
  height: 44px;
  border-bottom: 1px solid var(--border-soft);
  box-sizing: border-box;
}
.timeline-tracks-col > .timeline-row-track:last-child { border-bottom: none; }
.timeline-row-track.axis { height: 32px; }

.tl-bar {
  position: absolute;
  top: 50%;
  height: 22px;
  transform: translateY(-50%);
  border-radius: 7px;
  display: flex;
  align-items: center;
  padding: 0 8px;
  font-size: 11px;
  font-weight: 600;
  color: var(--accent-strong);
  background: var(--accent-soft);
  border: 1.5px solid var(--accent-mid);
  white-space: nowrap;
  overflow: hidden;
}
.tl-bar.confirmed { background: rgba(91, 92, 246, 0.16); border-color: var(--accent); color: var(--accent-strong); }
.tl-bar.hypothetical { background: repeating-linear-gradient(45deg, rgba(91,92,246,0.10), rgba(91,92,246,0.10) 6px, rgba(91,92,246,0.18) 6px, rgba(91,92,246,0.18) 12px); border: 1.5px dashed var(--accent); color: var(--accent-strong); }
.tl-bar.completed { background: var(--bg); border-color: var(--border-strong); color: var(--text-tertiary); }
.tl-bar.cancelled { opacity: 0.4; }

.tl-axis {
  position: relative;
  height: 32px;
  border-bottom: 1px solid var(--border);
  font-size: 11px;
  color: var(--text-tertiary);
}
.tl-axis-tick { position: absolute; transform: translateX(-50%); padding-top: 4px; font-weight: 500; }
.tl-axis-tick::before {
  content: '';
  position: absolute;
  top: -4px; left: 50%;
  width: 1px; height: 6px;
  background: var(--border-strong);
}

.tl-grid-line {
  position: absolute;
  top: 0; bottom: 0;
  width: 1px;
  background: var(--border-soft);
}

/* Today indicator on Timeline — neutral gray (not accent purple) so it
   doesn't compete with Outflow purple bubbles or the included-offer accent.
   Same family as the chart's Today marker (#9099a8 line, #6b7280 pill). */
.tl-today {
  position: absolute;
  top: 0; bottom: 0;
  width: 1px;
  background: #9099a8;
  pointer-events: none;
}
.tl-today::before {
  content: 'Today';
  position: absolute;
  top: -16px;
  left: 0;
  transform: translateX(-50%);
  background: #6b7280;
  color: white;
  font-size: 10px;
  font-weight: 600;
  padding: 1px 6px;
  border-radius: 4px;
  white-space: nowrap;
}
/* Only the axis row gets the "Today" pill — suppress on data bars */
.timeline-row-track .tl-today::before {
  content: none;
}

.tl-shortfall-band {
  position: absolute;
  top: 0; bottom: 0;
  background: rgba(239, 68, 68, 0.08);
  border-left: 1px dashed rgba(239, 68, 68, 0.5);
  border-right: 1px dashed rgba(239, 68, 68, 0.5);
  pointer-events: none;
}

/* ============================================================
   FORMS
   ============================================================ */
.form-section {
  background: var(--card);
  border-radius: var(--radius-xl);
  padding: var(--space-6);
  box-shadow: var(--shadow-card);
}

.form-section + .form-section { margin-top: var(--space-4); }

.form-section h2 {
  font-size: 17px;
  font-weight: 600;
  letter-spacing: -0.01em;
  margin-bottom: var(--space-1);
}
.form-section .section-desc { font-size: 13px; color: var(--text-secondary); margin-bottom: var(--space-5); }

.form-grid {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
  gap: var(--space-4);
  /* Stretch each field to fill its cell so the input within can pin to
     the bottom — that way labels of different lengths (one-liner vs
     wrapped two-liner) don't push their inputs onto different baselines. */
  align-items: stretch;
}

.field {
  display: flex;
  flex-direction: column;
  gap: 6px;
  /* `min-width: 0` lets the field shrink below the intrinsic size of its
     contents (e.g. long hint text). Without this, flex/grid items have
     `min-width: auto` which forces the cell wider than the parent and
     creates the modal-wide horizontal-scroll bug on phones. */
  min-width: 0;
}
.field label, .field-label {
  font-size: 12px;
  font-weight: 600;
  color: var(--text-secondary);
  text-transform: uppercase;
  letter-spacing: 0.04em;
  /* Reserve consistent vertical space so a 2-line label ("Days after signup
     to deposit") and a 1-line label ("Status") don't push their inputs onto
     different baselines when paired in a row. */
  min-height: 30px;
  display: flex;
  align-items: flex-end;
  line-height: 1.25;
}
/* Inputs pin to the bottom of the cell. Combined with the label's reserved
   min-height, every input in a form-grid row lines up horizontally even when
   labels above wrap to different numbers of lines. */
.field > .input,
.field > .select,
.field > .textarea,
.field > .input-group,
.field > .radio-group {
  margin-top: auto;
}
.field-hint { font-size: 12px; color: var(--text-tertiary); margin-top: 2px; }
.field-error { font-size: 12px; color: var(--danger); margin-top: 2px; }

.input, .select, .textarea {
  width: 100%;
  display: block;
  /* Match `.field { min-width: 0 }` so inputs can shrink to the column
     width on narrow screens. Some native widgets (date, number) carry an
     intrinsic min-width that would otherwise overflow the form column.
     `box-sizing: border-box` is set globally on `*`, but re-stating here
     makes the no-overflow contract explicit at the input level. */
  min-width: 0;
  max-width: 100%;
  box-sizing: border-box;
  padding: 10px 12px;
  border: 1.5px solid var(--border);
  background: var(--card);
  border-radius: var(--radius-md);
  font-size: 14px;
  color: var(--text);
  transition: border-color 0.1s, box-shadow 0.1s;
  font-family: inherit;
}
/* Input groups (currency-prefix, days-suffix) wrap the input in a
   relative-position div for the absolutely-positioned prefix/suffix. The
   wrapper itself must stay constrained so the inner input can't overflow
   the field cell on phones — Safari's intrinsic native-control widths
   would otherwise push the right edge past the modal. */
.input-group {
  position: relative;
  width: 100%;
  min-width: 0;
  max-width: 100%;
  box-sizing: border-box;
}
.input:focus, .select:focus, .textarea:focus {
  outline: none;
  border-color: var(--accent);
  box-shadow: 0 0 0 3px rgba(91, 92, 246, 0.15);
}
.input[type="number"] { font-feature-settings: 'tnum' 1; }
.textarea { resize: vertical; min-height: 72px; }

.input-group .input-prefix { position: absolute; left: 12px; top: 50%; transform: translateY(-50%); color: var(--text-tertiary); font-size: 14px; pointer-events: none; }
.input-group .input-suffix { position: absolute; right: 12px; top: 50%; transform: translateY(-50%); color: var(--text-tertiary); font-size: 13px; pointer-events: none; }
.input-group .input { padding-left: 28px; }
.input-group.with-suffix .input { padding-right: 60px; }

.checkbox-row { display: flex; align-items: center; gap: var(--space-2); cursor: pointer; padding: 4px 0; }
.checkbox-row input[type="checkbox"] {
  appearance: none;
  -webkit-appearance: none;
  width: 18px; height: 18px;
  border: 2px solid var(--border-strong);
  border-radius: 5px;
  cursor: pointer;
  position: relative;
}
.checkbox-row input[type="checkbox"]:checked { background: var(--accent); border-color: var(--accent); }
.checkbox-row input[type="checkbox"]:checked::after {
  content: '';
  position: absolute;
  left: 4px; top: 0;
  width: 5px; height: 9px;
  border: solid white;
  border-width: 0 2px 2px 0;
  transform: rotate(45deg);
}

.radio-group {
  display: flex;
  gap: 0;
  background: var(--bg);
  border-radius: var(--radius-md);
  padding: 3px;
  width: 100%;
}
.radio-group label {
  flex: 1;
  text-align: center;
  padding: 8px 12px;
  border-radius: 8px;
  font-size: 13px;
  font-weight: 500;
  color: var(--text-secondary);
  cursor: pointer;
  transition: background 0.1s, color 0.1s;
}
.radio-group input[type="radio"] { display: none; }
.radio-group input[type="radio"]:checked + label { background: var(--card); color: var(--text); box-shadow: var(--shadow-sm); font-weight: 600; }

/* ============================================================
   MODAL / DRAWER
   ============================================================ */
.modal {
  position: fixed;
  inset: 0;
  z-index: 100;
  display: none;
  background: rgba(13, 20, 33, 0.45);
  backdrop-filter: blur(2px);
  align-items: flex-start;
  justify-content: center;
  padding: var(--space-8) var(--space-4);
  overflow-y: auto;
}
.modal.open { display: flex; }

.modal-card {
  background: var(--card);
  border-radius: var(--radius-xl);
  width: 100%;
  max-width: 640px;
  box-shadow: var(--shadow-modal);
  overflow: hidden;
  display: flex;
  flex-direction: column;
  max-height: calc(100vh - 64px);
}

.modal-header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: var(--space-5) var(--space-6);
  border-bottom: 1px solid var(--border-soft);
}
.modal-title { font-size: 18px; font-weight: 600; letter-spacing: -0.01em; }
.modal-body {
  padding: var(--space-6);
  overflow-y: auto;
  /* Defensive: if any inner element overflows horizontally on narrow
     viewports, clip it instead of letting the user scroll the whole modal
     left/right. Vertical scroll for long forms is still preserved. */
  overflow-x: hidden;
  flex: 1;
}
.modal-footer {
  padding: var(--space-4) var(--space-6);
  border-top: 1px solid var(--border-soft);
  display: flex;
  justify-content: space-between;
  gap: var(--space-2);
  align-items: center;
}

.advanced-toggle {
  display: flex;
  align-items: center;
  gap: 6px;
  padding: var(--space-3) 0;
  margin: var(--space-4) 0;
  border-top: 1px solid var(--border-soft);
  font-size: 13px;
  color: var(--text-secondary);
  font-weight: 500;
  cursor: pointer;
  width: 100%;
  justify-content: space-between;
}
.advanced-toggle .chevron { transition: transform 0.15s; }
.advanced-toggle[aria-expanded="true"] .chevron { transform: rotate(180deg); }

.advanced-fields { display: none; flex-direction: column; gap: var(--space-4); }
.advanced-fields.open { display: flex; }

/* ============================================================
   TABLES
   ============================================================ */
.table-wrap { overflow-x: auto; border-radius: var(--radius-lg); border: 1px solid var(--border-soft); }

table.data-table {
  width: 100%;
  font-size: 13px;
  border-collapse: collapse;
  background: var(--card);
}
.data-table th {
  text-align: left;
  font-weight: 600;
  font-size: 11px;
  color: var(--text-tertiary);
  text-transform: uppercase;
  letter-spacing: 0.06em;
  padding: var(--space-3);
  background: var(--card-soft);
  border-bottom: 1px solid var(--border);
  white-space: nowrap;
}
.data-table td {
  padding: var(--space-3);
  border-bottom: 1px solid var(--border-soft);
  vertical-align: middle;
}
.data-table tbody tr:hover { background: var(--bg); }
.data-table tbody tr:last-child td { border-bottom: none; }

.num { text-align: right; font-feature-settings: 'tnum' 1; }
.row-warn { background: rgba(245, 158, 11, 0.06); }
.row-danger { background: rgba(239, 68, 68, 0.07); }

/* ============================================================
   PLANNER OPTIMIZER
   ============================================================ */
.optimizer-bar {
  background: var(--card);
  border-radius: var(--radius-xl);
  padding: var(--space-5) var(--space-6);
  box-shadow: var(--shadow-card);
  margin-bottom: var(--space-5);
  display: flex;
  flex-wrap: wrap;
  gap: var(--space-4);
  align-items: center;
  justify-content: space-between;
}

.optimizer-summary {
  display: flex;
  gap: var(--space-6);
  flex-wrap: wrap;
}
.optimizer-summary .metric { display: flex; flex-direction: column; gap: 2px; }
.optimizer-summary .metric .label { font-size: 11px; color: var(--text-tertiary); font-weight: 600; text-transform: uppercase; letter-spacing: 0.05em; }
.optimizer-summary .metric .value { font-size: 18px; font-weight: 600; }

.combo-card {
  background: var(--card);
  border-radius: var(--radius-lg);
  padding: var(--space-5);
  box-shadow: var(--shadow-card);
  border: 2px solid transparent;
  cursor: pointer;
  transition: border-color 0.12s, transform 0.05s, box-shadow 0.12s;
}
.combo-card:hover { border-color: var(--accent-mid); }
.combo-card:active { transform: scale(0.997); }
.combo-card.selected { border-color: var(--accent); box-shadow: var(--shadow-card-hover), 0 0 0 4px rgba(91, 92, 246, 0.12); }
.recommended-tag { color: var(--accent); font-weight: 700; }

.combo-header { display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: var(--space-3); gap: var(--space-3); }
.combo-rank { font-size: 11px; font-weight: 700; color: var(--text-tertiary); text-transform: uppercase; letter-spacing: 0.06em; }
.combo-bonus { font-size: 22px; font-weight: 700; letter-spacing: -0.02em; color: var(--success); }
.combo-meta { font-size: 12px; color: var(--text-secondary); margin-bottom: var(--space-3); display: flex; flex-wrap: wrap; gap: 12px; }
.combo-meta span { display: inline-flex; align-items: center; gap: 4px; }
.combo-offers { display: flex; flex-direction: column; gap: 4px; }
.combo-offer { font-size: 13px; padding: 6px 10px; background: var(--bg); border-radius: 6px; display: flex; justify-content: space-between; gap: 8px; }
.combo-offer .name { color: var(--text); font-weight: 500; }
.combo-offer .amount { color: var(--text-tertiary); font-feature-settings: 'tnum' 1; }

/* ============================================================
   EMPTY STATES & MISC
   ============================================================ */
.empty-state {
  text-align: center;
  padding: var(--space-12) var(--space-6);
  color: var(--text-secondary);
}
.empty-state svg { width: 48px; height: 48px; opacity: 0.4; margin-bottom: var(--space-4); }
.empty-state h3 { font-size: 18px; font-weight: 600; color: var(--text); margin-bottom: var(--space-2); }
.empty-state p { font-size: 14px; max-width: 360px; margin: 0 auto var(--space-4); }

.toast {
  position: fixed;
  bottom: 30px;
  left: 50%;
  transform: translateX(-50%) translateY(20px);
  background: rgba(13, 20, 33, 0.94);
  color: white;
  padding: 12px 20px;
  border-radius: var(--radius-pill);
  font-size: 14px;
  font-weight: 500;
  text-align: center;
  box-shadow: 0 12px 32px rgba(0,0,0,0.2);
  opacity: 0;
  pointer-events: none;
  z-index: 200;
  transition: opacity 0.2s, transform 0.2s;
  /* Cap width so the toast doesn't run edge-to-edge on phones */
  max-width: calc(100vw - 32px);
}
.toast.visible { opacity: 1; transform: translateX(-50%) translateY(0); }
.toast.danger { background: var(--danger); }

.divider { height: 1px; background: var(--border-soft); margin: var(--space-5) 0; }

.banner {
  display: flex;
  gap: var(--space-3);
  padding: var(--space-4);
  border-radius: var(--radius-md);
  font-size: 13px;
  background: var(--accent-soft);
  color: var(--accent-strong);
  border: 1px solid rgba(91, 92, 246, 0.2);
  margin-bottom: var(--space-4);
  /* Center vertically; lay icon + text out so the text reads centered relative
     to its full visual block instead of left-stuck against the icon. */
  align-items: center;
  justify-content: center;
  text-align: center;
}
.banner > div { flex: 0 1 auto; }
.banner.warn { background: var(--warning-soft); color: #92400e; border-color: rgba(245, 158, 11, 0.3); }
.banner.danger { background: var(--danger-soft); color: #c95555; border-color: rgba(232, 113, 113, 0.3); }
.banner svg { flex-shrink: 0; width: 18px; height: 18px; margin-top: 1px; }

.toolbar {
  display: flex;
  gap: var(--space-3);
  flex-wrap: wrap;
  align-items: center;
  margin-bottom: var(--space-5);
}

.section-header {
  display: flex;
  justify-content: space-between;
  align-items: center;
  gap: var(--space-3);
  margin-bottom: var(--space-4);
  flex-wrap: wrap;
}
.section-header h2 { font-size: 22px; font-weight: 700; letter-spacing: -0.02em; }
.section-header p { font-size: 14px; color: var(--text-secondary); }

.row-action-buttons { display: flex; gap: var(--space-1); justify-content: flex-end; }

/* ============================================================
   RESPONSIVE
   ============================================================ */
@media (max-width: 880px) {
  .grid-cols-4 { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  .grid-cols-3 { grid-template-columns: repeat(2, minmax(0, 1fr)); }
}

@media (max-width: 720px) {
  .primary-nav, .header-actions { display: none; }
  .app-header { padding: 0 var(--space-4); }
  .mobile-nav { display: flex; }
  .fab { display: flex; }
  .app-main {
    padding: var(--space-4) var(--space-4) calc(var(--bottom-nav-height) + var(--space-8));
  }
  .hero { padding: var(--space-6); border-radius: var(--radius-lg); }
  .hero-amount { font-size: 36px; }
  .hero-label { font-size: 13px; letter-spacing: 0.04em; }
  .grid-cols-4, .grid-cols-3, .grid-cols-2 { grid-template-columns: 1fr 1fr; }
  .grid-cols-2.mobile-stack { grid-template-columns: 1fr; }
  .stat-card { padding: var(--space-4); }
  .stat-value { font-size: 22px; }
  /* Mobile portrait timeline: narrower (sticky) labels column on the
     left so bank names are always visible, plus a wide horizontally-
     scrollable tracks area on the right. Two separate containers
     means the labels never participate in the scroll — they stay
     pinned regardless of where the user scrolls the bars. */
  .timeline-wrap { padding: var(--space-3); }
  .timeline-labels-col {
    flex: 0 0 96px;
    /* Sticky-belt-and-suspenders: even though labels-col is outside
       the scroll container, position:sticky here keeps it pinned if
       the layout is ever flattened into a single scroll context. */
    position: sticky;
    left: 0;
    z-index: 2;
    background: var(--card);
  }
  .timeline-tracks-col {
    width: 600px;
    min-width: 600px;
  }
  .timeline-tracks-scroll {
    overflow-x: auto;
    -webkit-overflow-scrolling: touch;
    scrollbar-width: thin;
  }
  .timeline-row-label {
    font-size: 11px;
    padding: 6px 8px;
  }
  .timeline-row-label > span:first-child {
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }
  .timeline-row-label .sub { font-size: 10px; }
  .tl-axis-tick { font-size: 10px; }
  .modal { padding: 0; align-items: flex-end; }
  .modal-card { max-width: 100%; width: 100%; max-height: 92vh; border-radius: var(--radius-xl) var(--radius-xl) 0 0; }
  .modal-header { padding: var(--space-4); }
  .modal-body {
    padding: var(--space-4);
    overflow-x: hidden;
    overflow-y: auto;
  }
  .modal-footer { padding: var(--space-3) var(--space-4); }
  /* Same flex-column rule as landscape so every field is uniform width
     regardless of any `style="grid-column"` annotations in the source. */
  .form-grid { display: flex; flex-direction: column; gap: 12px; }
  .field { width: 100%; max-width: 100%; min-width: 0; }
  .field > * { max-width: 100%; min-width: 0; box-sizing: border-box; }
  .input, .select, .textarea, .input-group { width: 100%; max-width: 100%; min-width: 0; box-sizing: border-box; }
  .field[style*="grid-column"] { grid-column: auto !important; }
  .section-header h2 { font-size: 20px; }
  .planner-add-btn { display: none; }
  .timeline-row-label { font-size: 12px; padding: 6px 8px; }
}

@media (max-width: 480px) {
  .grid-cols-4, .grid-cols-3, .grid-cols-2 { grid-template-columns: 1fr; }
  .hero-amount { font-size: 34px; }
}

/* Portrait-only: header scrolls away naturally to reclaim ~64 px of
   vertical space when the user is working in a chart or reading a
   long list. Landscape (handled below) keeps the header sticky since
   landscape phone screens are short and quick nav access matters. */
@media (max-width: 720px) and (orientation: portrait) {
  .app-header { position: static; top: auto; }
}

/* ============================================================
   LANDSCAPE on phones / small tablets
   Vertical real-estate is the constraint. Compact the header, hero,
   and timeline rows so column titles aren't truncated and the chart
   isn't hidden behind the bottom nav.
   ============================================================ */
@media (max-width: 1024px) and (orientation: landscape) {
  :root {
    --header-height: 50px;
    --bottom-nav-height: 56px;
  }
  .app-header { height: 50px; }
  .mobile-nav { height: 56px; }
  .mobile-nav .nav-btn { padding: 4px 8px; font-size: 10px; }
  .mobile-nav .nav-btn svg { width: 18px; height: 18px; }
  .app-main {
    padding: var(--space-3) var(--space-4) calc(var(--bottom-nav-height) + var(--space-4));
  }
  .hero {
    padding: var(--space-4);
    border-radius: var(--radius-lg);
  }
  .hero-amount { font-size: 28px; line-height: 1; }
  .hero-meta { font-size: 12px; gap: 8px; }
  /* Section titles: keep readable but tighter top margin so they don't
     eat the visible chart area. */
  .section-header { margin-bottom: var(--space-3); }
  .section-header h2 { font-size: 18px; }
  /* Stat cards row: tighter padding so a 2x or 3x grid fits. */
  .stat-card { padding: var(--space-3); }
  .stat-value { font-size: 20px; }
  .stat-label { font-size: 11px; }
  /* Timeline rows: compress slightly so more rows fit on screen. */
  .timeline-wrap { padding: var(--space-4); }
  .timeline-row-label, .timeline-row-track { height: 38px; }
  .timeline-row-label.axis, .timeline-row-track.axis { height: 26px; }
  /* Modal: cap at 480 px centered so inputs feel proportional rather
     than stretched edge-to-edge across a 720+ px landscape viewport.
     Single-column form is non-negotiable here — 2-column grids on a
     short landscape phone crash labels into adjacent inputs. */
  .modal { padding: var(--space-3); align-items: center; }
  .modal-card {
    max-height: 92vh;
    max-width: 480px;
    width: calc(100% - 32px);
    margin: auto;
    border-radius: var(--radius-xl);
  }
  .modal-body {
    overflow-y: auto;
    overflow-x: hidden;
    padding: var(--space-4);
  }
  .modal-header, .modal-footer { padding: var(--space-3) var(--space-4); }
  /* Force single-column flex (NOT grid) so every field is the same
     width, no matter what `style="grid-column"` annotations the source
     puts on individual fields. */
  .form-grid {
    display: flex;
    flex-direction: column;
    gap: 12px;
  }
  .field { width: 100%; min-width: 0; max-width: 100%; }
  .field > * { max-width: 100%; min-width: 0; box-sizing: border-box; }
  .input, .select, .textarea, .input-group { width: 100%; max-width: 100%; min-width: 0; box-sizing: border-box; }
  /* Spanned grid-column overrides on individual fields are no-ops in a
     flex column — neutralize them defensively in case any inline style
     makes them try to behave like grid items. */
  .field[style*="grid-column"] { grid-column: auto !important; }
}

@media (min-width: 880px) {
  .planner-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(340px, 1fr));
    gap: var(--space-4);
  }
  .combo-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(360px, 1fr));
    gap: var(--space-4);
  }
}

@media (min-width: 481px) and (max-width: 879px) {
  .planner-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: var(--space-4);
  }
  .combo-grid { display: flex; flex-direction: column; gap: var(--space-3); }
}

@media (max-width: 480px) {
  .planner-grid, .combo-grid { display: flex; flex-direction: column; gap: var(--space-4); }
}

/* Visually hidden but accessible */
.sr-only {
  position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px;
  overflow: hidden; clip: rect(0,0,0,0); white-space: nowrap; border: 0;
}
</style>

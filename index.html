    case 'meeting': return 'Working toward the bonus — completing requirements.';
    case 'waiting': return 'Requirements met — waiting for the bonus to post.';
    case 'earned':
      return offer.bonus_received_date
        ? `Bonus received ${formatDateDisplay(offer.bonus_received_date)}.`
        : 'Bonus earned — safe to close once funds release.';
    case 'closed':
      return offer.closed_date
        ? `Account closed ${formatDateDisplay(offer.closed_date)}.`
        : 'Account closed.';
    default: return '';
  }
}

// Lifecycle (F3): keep offer.closed_date consistent with an account-status
// transition. SHARED by both status-change paths — the modal save
// (saveOfferFromForm/readOfferForm) and the inline offer-card "Offer status"
// dropdown (onChange 'change-status') — so the two can never drift.
//   • Reopen (prior closed → now open): the closure is void, so CLEAR any stale
//     closed_date. The churn step anchors on closed_date and must not read a
//     date from a closure that was undone.
//   • Close (now closed, non-pre-account): stamp closed_date if empty. Never
//     overwrites an existing date (a re-save of an already-closed offer keeps
//     the original close date).
// Mutates offer in place; no-op for a transition that isn't a close or reopen.
// `priorAccountStatus` is the offer's accountStatus BEFORE this change.
function reconcileClosedDate(offer, priorAccountStatus) {
  if (!offer) return;
  if (priorAccountStatus === 'closed' && offer.accountStatus === 'open') {
    offer.closed_date = null;
  } else if (offer.accountStatus === 'closed' && !PRE_ACCOUNT_SUB_STATUSES.has(offer.subStatus) && !offer.closed_date) {
    offer.closed_date = isoDate(TODAY);
  }
}

// True when EVERY requirement row (derived + user) on the offer is done. Drives
// the auto-suggest ("all requirements met — mark as Waiting?"). An offer with no
// requirement rows returns false — there's nothing to have completed, so we
// never nudge an offer that has no tracked obligations.
function allRequirementsDone(offer) {
  const reqs = Array.isArray(offer && offer.requirements) ? offer.requirements : [];
  if (reqs.length === 0) return false;
  return reqs.every(r => r && r.done);
}

// Should the "mark as Waiting for Bonus?" suggestion show for this offer?
// Gate: the account is OPEN (a closed offer can't advance to met-waiting — the
// one-tap would land on stage 'closed', not 'waiting'), subStatus is still
// approved/on-track, ALL requirements are done, and the user hasn't dismissed it
// for this offer. No automatic status change — the tap does that. Kept as its
// own predicate so the card and modal agree.
function shouldSuggestWaiting(offer) {
  if (!offer) return false;
  if (offer.lifecycle_suggest_dismissed) return false;
  if (offer.accountStatus !== 'open') return false;
  if (offer.subStatus !== 'approved' && offer.subStatus !== 'on-track') return false;
  return allRequirementsDone(offer);
}

// The anchor date the expected-bonus window counts from: the LATEST done_date
// across requirement rows (the last obligation you completed is when the clock
// really starts). Returns { iso, estimated }:
//   • estimated:false when at least one row has a real done_date.
//   • estimated:true  when no row carries a done_date — we fall back to today so
//     a window still shows, flagged "estimated" in the UI.
// Returns null only when there are no requirement rows at all.
function bonusWindowAnchor(offer) {
  const reqs = Array.isArray(offer && offer.requirements) ? offer.requirements : [];
  if (reqs.length === 0) return { iso: isoDate(TODAY), estimated: true };
  let latest = null;
  for (const r of reqs) {
    const d = r && r.done_date ? parseDate(r.done_date) : null;
    if (d && (!latest || d.getTime() > latest.getTime())) latest = d;
  }
  if (latest) return { iso: isoDate(latest), estimated: false };
  return { iso: isoDate(TODAY), estimated: true };
}

// Expected-bonus posting window for an offer that has met its requirements.
// Returns { startISO, endISO, estimated, typical } or null when it doesn't
// apply (subStatus not met-waiting/earned) or can't be computed. `typical` flags
// the default-days fallback; `estimated` flags the today-anchor fallback.
//   window = [anchor + min, anchor + max], where anchor = latest done_date
//   (fallback today), min/max = bonus_post_min/max_days (fallback DEFAULT_*).
function expectedBonusWindow(offer) {
  if (!offer) return null;
  const stage = lifecycleStage(offer);
  if (stage !== 'waiting' && stage !== 'earned') return null;
  const anchor = bonusWindowAnchor(offer);
  if (!anchor) return null;
  const anchorDate = parseDate(anchor.iso);
  if (!anchorDate) return null;
  const hasMin = offer.bonus_post_min_days != null && offer.bonus_post_min_days !== '';
  const hasMax = offer.bonus_post_max_days != null && offer.bonus_post_max_days !== '';
  const typical = !hasMin && !hasMax;
  let min = hasMin ? Number(offer.bonus_post_min_days) : DEFAULT_BONUS_POST_MIN_DAYS;
  let max = hasMax ? Number(offer.bonus_post_max_days) : DEFAULT_BONUS_POST_MAX_DAYS;
  if (!Number.isFinite(min)) min = DEFAULT_BONUS_POST_MIN_DAYS;
  if (!Number.isFinite(max)) max = DEFAULT_BONUS_POST_MAX_DAYS;
  if (max < min) { const t = min; min = max; max = t; } // tolerate reversed input
  return {
    startISO: isoDate(addDays(anchorDate, min)),
    endISO: isoDate(addDays(anchorDate, max)),
    estimated: anchor.estimated,
    typical
  };
}

// Latest of all applicable "you can safely close the account" constraints, as an
// ISO date, or null when insufficient data. Each term is null-safe; the result
// is the MAX (close only when EVERY constraint has passed). Terms:
//   (a) withdrawal-eligible date — funds are physically released (the legacy
//       `we` the stub already computed; models the hold/round-trip).
//   (b) bonus timing — if the bonus is already received (bonus_received_date),
//       that date; otherwise the expected-bonus window END (don't close before
//       the bonus is expected to post, or a late-posting bonus can be clawed).
//   (c) open-anchor + etf_window_days — an early-termination-fee avoidance
//       window measured from the account open date (plannedSignupDate).
//   (d) every UNMET requirement row's resolved deadline — don't call it safe
//       before an outstanding obligation's own deadline has passed. DONE rows are
//       excluded: a completed obligation's deadline is irrelevant to close-safety
//       (its date has served its purpose), and counting it would push safe-to-
//       close months past a real bonus_received_date for a long-deadline row.
// Returns ISO or null (never throws). Feed + card read this.
function safeToCloseDate(offer) {
  if (!offer) return null;
  const candidates = [];

  // (a) withdrawal-eligible (funds released).
  const we = withdrawalEligibleDate(offer);
  if (we) candidates.push(we);

  // (b) bonus timing.
  if (offer.bonus_received_date) {
    candidates.push(offer.bonus_received_date);
  } else {
    const win = expectedBonusWindow(offer);
    if (win && win.endISO) candidates.push(win.endISO);
  }

  // (c) ETF-avoidance window from the account open date.
  if (offer.etf_window_days != null && offer.etf_window_days !== '') {
    const days = Number(offer.etf_window_days);
    const open = parseDate(offer.plannedSignupDate);
    if (Number.isFinite(days) && open) candidates.push(isoDate(addDays(open, days)));
  }

  // (d) every UNMET requirement deadline (done rows don't constrain close-safety).
  const reqs = Array.isArray(offer.requirements) ? offer.requirements : [];
  for (const r of reqs) {
    if (!r || r.done) continue;
    const dlISO = requirementDeadlineISO(offer, r);
    if (dlISO) candidates.push(dlISO);
  }

  if (candidates.length === 0) return null;
  // MAX by ISO date (YYYY-MM-DD sorts lexicographically == chronologically).
  let maxISO = candidates[0];
  for (const c of candidates) { if (c > maxISO) maxISO = c; }
  return maxISO;
}

/* ============================================================
   CHURNABILITY (F6)
   ============================================================
   An offer marked churnable can be re-run after a cooling-off period.
   churnEligibleDate() resolves the anchor date per churn_anchor, adds
   churn_wait_months (calendar-month-safe, clamped), and returns the ISO
   date the account can be opened again. The card, the Overview "Upcoming
   churn dates" section, and the `churn-eligible` feed kind all read this. */
// How far ahead the Overview churn section looks for "Upcoming" eligibility.
const CHURN_HORIZON_DAYS = 60;
// Feed emit window: emit `churn-eligible` when the eligible date is at most this
// many days AHEAD (upcoming) ...
const CHURN_FEED_LOOKAHEAD_DAYS = 60;
// ... OR already past but within this many days behind (still actionable — you
// can churn now — without resurrecting ancient history).
const CHURN_FEED_PAST_GRACE_DAYS = 180;

// Human label for each anchor, reused by the modal, card, overview, and feed.
const CHURN_ANCHOR_LABELS = {
  bonus_received: 'bonus received',
  account_closed: 'account closed',
  account_opened: 'account opened'
};

// The ISO anchor date churn eligibility counts from, per churn_anchor:
//   • bonus_received → bonus_received_date
//   • account_closed → closed_date
//   • account_opened → plannedSignupDate (the SAME open-date source the
//     lifecycle/deadline math uses — no separate "opened" field exists)
// Returns an ISO string or '' when the relevant date isn't set. Defaults to the
// bonus_received anchor for an unknown/missing churn_anchor.
function churnAnchorDate(offer) {
  if (!offer) return '';
  switch (offer.churn_anchor) {
    case 'account_closed': return offer.closed_date || '';
    case 'account_opened': return offer.plannedSignupDate || '';
    case 'bonus_received':
    default: return offer.bonus_received_date || '';
  }
}

// The ISO date an offer becomes churn-eligible again, or null. Returns null when
// the offer isn't churnable (churnable !== true), the wait-months is missing/
// non-positive, or the anchor date for its churn_anchor isn't set yet. Pure;
// never throws (all date access is guarded, month-add is clamp-safe).
function churnEligibleDate(offer) {
  if (!offer || offer.churnable !== true) return null;
  const months = Number(offer.churn_wait_months);
  if (!Number.isFinite(months) || months <= 0) return null;
  const anchorISO = churnAnchorDate(offer);
  const anchor = parseDate(anchorISO);
  if (!anchor) return null;
  const eligible = addMonthsClamped(anchor, months);
  if (!eligible) return null;
  return isoDate(eligible);
}

// Whether an offer's churn is currently snoozed. True when churn_snoozed_until
// is the sentinel 'forever' OR an ISO date strictly after today. A TIMED snooze
// whose date is today-or-earlier has lapsed and reads as NOT snoozed — the
// comparison alone handles expiry, so no cleanup migration is ever needed.
// Pure; tolerant of a missing/garbage value (returns false). The Overview
// section, the card churn line, and the `churn-eligible` feed kind all read
// this so snooze state can never diverge between surfaces.
function churnSnoozeActive(offer) {
  if (!offer) return false;
  const s = offer.churn_snoozed_until;
  if (s === 'forever') return true;
  if (typeof s !== 'string' || !s) return false;
  const d = parseDate(s);
  if (!d) return false;
  return d.getTime() > TODAY.getTime();
}

function simpleReturn(offer) {
  if (!offer.requiredFundingAmount || !offer.signupBonusAmount) return null;
  return offer.signupBonusAmount / offer.requiredFundingAmount;
}

// Total capital-time (dollar-days) a DD offer ties up: Σ(amount_i × heldDays_i).
// STANDARD DD: heldDays_i = the transfer round-trip for that DD (which is
// longer when initiated before a weekend/holiday). HELD+DD: each DD's
// amount is held from when it lands until the shared withdrawal-eligible
// date. Returns { dollarDays, weightedDays, totalAmount } or null.
function ddCapitalTime(offer) {
  const dds = (offer.directDeposits || []).filter(dd => dd && dd.plannedDate && Number(dd.amount) > 0);
  if (dds.length === 0) return null;
  let dollarDays = 0, totalAmount = 0;
  if (offer.offerType === 'direct-deposit') {
    for (const dd of dds) {
      const rt = ddRoundTrip(dd);
      if (!rt || rt.heldDays <= 0) continue;
      const amt = Number(dd.amount);
      dollarDays += amt * rt.heldDays;
      totalAmount += amt;
    }
  } else { // held-and-dd
    const we = parseDate(withdrawalEligibleDate(offer));
    if (!we) return null;
    // Held lump sum: requiredFundingAmount from the funding date → withdrawal.
    const fundStart = parseDate(lockStartDate(offer));
    const fundAmt = Number(offer.requiredFundingAmount) || 0;
    if (fundStart && fundAmt > 0) {
      const heldDays = daysBetween(fundStart, we);
      if (heldDays > 0) { dollarDays += fundAmt * heldDays; totalAmount += fundAmt; }
    }
    // Each qualifying DD from when it lands → withdrawal.
    for (const dd of dds) {
      const eff = parseDate(directDepositEffectiveDate(dd));
      if (!eff) continue;
      const held = daysBetween(eff, we);
      if (held <= 0) continue;
      const amt = Number(dd.amount);
      dollarDays += amt * held;
      totalAmount += amt;
    }
  }
  if (dollarDays <= 0 || totalAmount <= 0) return null;
  return { dollarDays, totalAmount, weightedDays: dollarDays / totalAmount };
}

function annualizedReturn(offer) {
  const bonus = Number(offer.signupBonusAmount);
  if (!bonus || bonus < 0) {
    // Allow $0 bonus to yield 0% rather than null below; but a missing
    // bonus is a null.
    if (offer.signupBonusAmount == null) return null;
  }
  // DIRECT-DEPOSIT family: weight each DD's ROI by dollar-days (amount ×
  // days held) so a DD dragged longer by a weekend/holiday, or a bigger
  // DD, pulls the blended rate appropriately. The single closed form
  //   bonus × 365 / Σ(amount_i × heldDays_i)
  // is exactly the amount-and-time-weighted average of the per-DD
  // annualized ROIs, and reduces to the standard formula for one DD.
  if (offer.offerType === 'direct-deposit' || offer.offerType === 'held-and-dd') {
    const ct = ddCapitalTime(offer);
    if (!ct || !offer.signupBonusAmount) return null;
    return Number(offer.signupBonusAmount) * 365 / ct.dollarDays;
  }
  // NEW FUNDS HELD: annualize on actual days unavailable (business-day
  // aware lockStart → withdrawalEligible), matching the "Days tied up"
  // card stat. Fall back to the stated hold count when dates are absent.
  const r = simpleReturn(offer);
  if (r == null) return null;
  let days = null;
  const ls = parseDate(lockStartDate(offer));
  const we = parseDate(withdrawalEligibleDate(offer));
  if (ls && we) days = daysBetween(ls, we);
  if (!days || days <= 0) days = Number(offer.daysFundsMustRemain) || 0;
  if (!days || days <= 0) return null;
  return r * 365 / days;
}

function isOfferComplete(offer) {
  // Standard direct deposit has NO bank-imposed hold, so it does not
  // require daysFundsMustRemain. Every other type does.
  const isStandardDD = offer.offerType === 'direct-deposit';
  // Planned sign-up date is REQUIRED only once the account is OPEN (a
  // committed offer must be dated). A prospect/applied offer (account
  // closed) is a full non-draft offer WITHOUT a sign-up date — it simply
  // emits no dated work items and ties up no projected capital until a
  // date is added. The sign-up date alone therefore no longer forces
  // draft status; other missing required fields still draft the offer.
  const signupDateOk = offer.accountStatus !== 'open'
    || Boolean(offer.plannedSignupDate && parseDate(offer.plannedSignupDate));
  const baseOk = Boolean(
    offer.bankName &&
    offer.requiredFundingAmount > 0 &&
    offer.signupBonusAmount >= 0 &&
    signupDateOk &&
    (isStandardDD || (offer.daysFundsMustRemain != null && offer.daysFundsMustRemain >= 0))
  );
  if (!baseOk) return false;
  if (offer.offerType === 'direct-deposit' || offer.offerType === 'held-and-dd') {
    const ddsOk = Array.isArray(offer.directDeposits)
      && offer.directDeposits.length > 0
      && offer.directDeposits.every(dd =>
        dd && dd.plannedDate && parseDate(dd.plannedDate) && Number(dd.amount) > 0);
    if (!ddsOk) return false;
    // Held + DD: the held lump sum needs a funding date (it drives the
    // chart + hold window). Standard direct-deposit has no held lump sum.
    if (offer.offerType === 'held-and-dd'
      && !(offer.optionalPlannedFundingDate && parseDate(offer.optionalPlannedFundingDate))) return false;
    return true;
  }
  return true;
}

function offerIssues(offer) {
  const issues = [];
  const isStandardDD = offer.offerType === 'direct-deposit';
  if (!offer.bankName) issues.push('Bank name is required');
  if (!offer.requiredFundingAmount || offer.requiredFundingAmount <= 0) issues.push('Required funding amount must be > 0');
  if (offer.signupBonusAmount == null || offer.signupBonusAmount < 0) issues.push('Bonus amount required');
  // Sign up date only required when the account is open (committed offers
  // must be dated); prospects/applied may be full offers without a date.
  if (offer.accountStatus === 'open' && (!offer.plannedSignupDate || !parseDate(offer.plannedSignupDate))) issues.push('Sign up date required');
  if (!isStandardDD && (offer.daysFundsMustRemain == null || offer.daysFundsMustRemain < 0)) issues.push('Hold-through day is required');
  if (offer.offerType === 'direct-deposit' || offer.offerType === 'held-and-dd') {
    if (!Array.isArray(offer.directDeposits) || offer.directDeposits.length === 0) {
      issues.push('At least one direct deposit is required');
    } else if (!offer.directDeposits.every(dd => dd && dd.plannedDate && parseDate(dd.plannedDate) && Number(dd.amount) > 0)) {
      issues.push('Each direct deposit needs a date and amount > 0');
    }
  }
  if (offer.offerType === 'held-and-dd'
    && !(offer.optionalPlannedFundingDate && parseDate(offer.optionalPlannedFundingDate))) {
    issues.push('Planned funding date is required for Held + DD');
  }
  return issues;
}

function offerIsActiveForProjection(offer, includedOverride = null) {
  // Returns whether this offer should affect the projection.
  if (!isOfferComplete(offer)) return false;
  if (offer.status === 'completed' || offer.status === 'skipped') return false;
  if (includedOverride !== null) return includedOverride.has(offer.id);
  if (CONFIRMED_OFFER_STATUSES.has(offer.status)) return true;
  return Boolean(offer.includeInScenario);
}

/* ============================================================
   PROJECTION ENGINE
   ============================================================
   Generates a daily cash projection over the configured horizon.

   For each day in [projectionStartDate, projectionStartDate + horizonDays):
     availableCapital =
         currentLiquidCapital
       + cumulative net of all included Capital Events with date <= day
       - sum of confirmed commitments active on this day
       - sum of hypothetical commitments active on this day

   Interval convention:
     A commitment with startDate=A and endDate=B ties up funds on each day d
     where A <= d < B. If a deposit lands March 1 and is withdrawal-eligible
     May 1, the funds are tied up March 1 through April 30 (61 days).

   Sources of commitments:
     1. Manual/explicit Capital Commitments (with includeInProjection true).
     2. Bonus Offers that are considered active:
        - status in {applied, funded} → counted as confirmed
        - status in {prospect, selected} with includeInScenario → counted
          as hypothetical
        Suppressed if a non-cancelled commitment with sourceBonusOfferId
        already covers the offer.

   The optimizer can pass an `includedOfferIds` set to override which
   prospect/selected offers contribute (used to evaluate combinations).
   ============================================================ */
// Compute the effective projection horizon in days based on the user's
// chosen mode. 'auto' = 30 days past the latest active date in the system
// (commitment ends, withdrawal-eligible dates, included events), with a
// 30-day floor. Modes other than 'custom' are fixed-day shorthands.
function effectiveHorizonDays(state) {
  const settings = state.settings || {};
  const mode = settings.projectionHorizonMode || 'auto';
  const start = parseDate(settings.projectionStartDate) || TODAY;
  if (mode === '3months') return 90;
  if (mode === '6months') return 180;
  if (mode === '1year') return 365;
  if (mode === '2years') return 730;
  if (mode === 'custom') return Math.max(30, Math.min(1825, Number(settings.projectionHorizonDays) || 365));
  // 'auto' — exactly 30 days past the latest withdrawal-eligible date of
  // offers that are ACTIVE in the projection. Confirmed offers count
  // unconditionally; unconfirmed offers (prospect/selected) only count
  // if the user has checked includeInScenario. This matches what's
  // actually plotted on the chart, so the X-axis can't extend out to
  // some prospect offer the user hasn't opted in to.
  // Hard clamp: end = lastActionDate + 30 days. No baseline padding,
  // no extra fudge factor anywhere. If no active offer, 30-day floor.
  let lastAction = null;
  const debug = [];
  for (const o of state.offers || []) {
    if (!offerIsActiveForProjection(o)) continue;
    const we = withdrawalEligibleDate(o);
    const d = we ? parseDate(we) : null;
    if (d && (lastAction == null || d > lastAction)) lastAction = d;
    if (d) debug.push({ id: o.id, status: o.status, withdrawal: we });
  }
  // Expose for inspection from the console: App.state && window._horizonDebug
  if (typeof window !== 'undefined') window._horizonDebug = { lastAction, considered: debug };
  if (!lastAction) return 30;
  const days = daysBetween(start, addDays(lastAction, 30));
  return Math.max(30, Math.min(180, days));
}

function generateProjection(state, options = {}) {
  const settings = state.settings;
  const horizon = effectiveHorizonDays(state);
  const start = parseDate(settings.projectionStartDate) || TODAY;
  const buffer = Number(settings.minimumCashBuffer) || 0;
  const liquid = Number(settings.currentLiquidCapital) || 0;

  const includedOverride = options.includedOfferIds
    ? new Set(options.includedOfferIds)
    : null;
  const earlyExit = options.earlyExit || false;

  // Pre-build day skeleton
  const days = new Array(horizon);
  const dayMs = 86400000;
  const startMs = start.getTime();
  for (let i = 0; i < horizon; i++) {
    days[i] = {
      date: new Date(startMs + i * dayMs),
      dateISO: '',
      dayIndex: i,
      startingLiquidCapital: liquid,
      confirmedTiedUp: 0,
      hypotheticalTiedUp: 0,
      totalTiedUp: 0,
      netEventsToDate: 0,
      availableCapital: liquid,
      belowBuffer: false,
      shortfall: false
    };
  }

  // Helper: find day index for a Date (clamped)
  function indexFor(date) {
    if (!date) return -1;
    const idx = Math.floor((startOfDay(date).getTime() - startMs) / dayMs);
    return idx;
  }

  // Helper: apply a commitment over its active range
  function applyCommitment(amount, startDate, endDate, kind) {
    const sIdx = indexFor(startDate);
    const eIdx = indexFor(endDate);
    if (eIdx < 0) return; // ends before horizon starts
    if (sIdx >= horizon) return; // starts after horizon ends
    // Active days: [max(sIdx,0), min(eIdx, horizon)) — endDate exclusive
    const from = Math.max(sIdx, 0);
    const to = Math.min(eIdx, horizon);
    for (let i = from; i < to; i++) {
      if (kind === 'confirmed') days[i].confirmedTiedUp += amount;
      else days[i].hypotheticalTiedUp += amount;
    }
  }

  // 1. Manual capital commitments
  const offerIdsWithCommitments = new Set();
  for (const c of state.commitments) {
    if (!c.includeInProjection) continue;
    if (c.status === 'cancelled') continue;
    const amount = Number(c.amount);
    if (!amount || amount <= 0) continue;
    const cs = parseDate(c.startDate);
    const ce = parseDate(c.endDate);
    if (!cs || !ce || cs >= ce) continue;
    if (c.sourceBonusOfferId) offerIdsWithCommitments.add(c.sourceBonusOfferId);
    const kind = (c.status === 'confirmed' || c.status === 'completed') ? 'confirmed' : 'hypothetical';
    if (c.status === 'completed') continue; // completed commitments no longer tie up funds
    applyCommitment(amount, cs, ce, kind);
  }

  // 2. Virtual commitments from bonus offers
  for (const o of state.offers) {
    if (!offerIsActiveForProjection(o, includedOverride)) continue;
    if (offerIdsWithCommitments.has(o.id)) continue; // suppressed by explicit commitment
    const kind = CONFIRMED_OFFER_STATUSES.has(o.status) ? 'confirmed' : 'hypothetical';
    // STANDARD direct deposit: each DD ties up its own amount only for
    // its transfer round trip (initiation → return to origin). No shared
    // hold — money is out of the origin account exactly while in transit
    // + seasoning. DDs initiated before weekends/holidays tie up longer.
    if (o.offerType === 'direct-deposit' && Array.isArray(o.directDeposits) && o.directDeposits.length > 0) {
      for (const dd of o.directDeposits) {
        const rt = ddRoundTrip(dd);
        const amt = Number(dd.amount) || 0;
        if (!rt || amt <= 0) continue;
        if (rt.initiate >= rt.returnDate) continue;
        applyCommitment(amt, rt.initiate, rt.returnDate, kind);
      }
      continue;
    }
    // HELD + DD: two distinct capital commitments, both tied up through the
    // bonus hold (withdrawal-eligible) date:
    //   1. the held LUMP SUM (requiredFundingAmount) from the funding date, and
    //   2. each qualifying DD's amount from when it lands.
    // Previously only (2) was modeled, so the held funds never hit the chart.
    if (o.offerType === 'held-and-dd' && Array.isArray(o.directDeposits) && o.directDeposits.length > 0) {
      const we = parseDate(withdrawalEligibleDate(o));
      if (!we) continue;
      const fundStart = parseDate(lockStartDate(o));
      const fundAmt = Number(o.requiredFundingAmount) || 0;
      if (fundStart && fundAmt > 0 && fundStart < we) applyCommitment(fundAmt, fundStart, we, kind);
      for (const dd of o.directDeposits) {
        const eff = parseDate(directDepositEffectiveDate(dd));
        const amt = Number(dd.amount) || 0;
        if (!eff || amt <= 0 || eff >= we) continue;
        applyCommitment(amt, eff, we, kind);
      }
      continue;
    }
    // New funds held: single block over the lock window.
    const start = parseDate(lockStartDate(o));
    const end = parseDate(withdrawalEligibleDate(o));
    if (!start || !end || start >= end) continue;
    applyCommitment(Number(o.requiredFundingAmount), start, end, kind);
  }

  // 3. Capital events — accumulate net through each day. Recurring
  // events expand into one instance per occurrence in the horizon
  // window; one-time events produce a single instance. The downstream
  // running-sum loop doesn't know or care which is which.
  const horizonEndDate = new Date(startMs + (horizon - 1) * dayMs);
  const validEvents = [];
  for (const e of state.events) {
    if (!e.includeInProjection) continue;
    const instances = expandEventInstances(e, start, horizonEndDate);
    for (const inst of instances) {
      const idx = indexFor(inst.date);
      if (idx >= 0 && idx < horizon) validEvents.push({ idx, amount: inst.amount });
    }
  }
  validEvents.sort((a, b) => a.idx - b.idx);

  let cumul = 0;
  let evIdx = 0;
  for (let i = 0; i < horizon; i++) {
    while (evIdx < validEvents.length && validEvents[evIdx].idx <= i) {
      cumul += validEvents[evIdx].amount;
      evIdx++;
    }
    const d = days[i];
    d.netEventsToDate = cumul;
    d.totalTiedUp = d.confirmedTiedUp + d.hypotheticalTiedUp;
    d.availableCapital = d.startingLiquidCapital + cumul - d.totalTiedUp;
    d.belowBuffer = d.availableCapital < buffer;
    d.shortfall = d.availableCapital < 0;
    d.dateISO = isoDate(d.date);
    if (earlyExit && d.shortfall) {
      // Optimizer hint: still finish for stats, but mark early-exit info
    }
  }

  return days;
}

/* ============================================================
   PROJECTION SUMMARY (for the Overview view)
   ============================================================ */
function summarizeProjection(projection, settings) {
  if (!projection.length) return {};
  let lowest = projection[0];
  let lowestIdx = 0;
  let shortfallDays = 0;
  let belowBufferDays = 0;
  for (let i = 0; i < projection.length; i++) {
    const d = projection[i];
    if (d.availableCapital < lowest.availableCapital) { lowest = d; lowestIdx = i; }
    if (d.shortfall) shortfallDays++;
    if (d.belowBuffer) belowBufferDays++;
  }
  return {
    today: projection[0],
    lowest,
    lowestIdx,
    shortfallDays,
    belowBufferDays,
    feasible: shortfallDays === 0,
    horizonDays: projection.length
  };
}

/* ============================================================
   OFFER → COMMITMENT CONVERSION
   ============================================================ */
function convertOfferToCommitment(offer) {
  const start = lockStartDate(offer);
  const end = withdrawalEligibleDate(offer);
  if (!start || !end) return null;
  return {
    id: uid('cmt'),
    commitmentName: offer.offerName ? `${offer.bankName} — ${offer.offerName}` : offer.bankName,
    sourceBonusOfferId: offer.id,
    amount: Number(offer.requiredFundingAmount),
    startDate: start,
    endDate: end,
    type: 'minimum balance',
    status: CONFIRMED_OFFER_STATUSES.has(offer.status) ? 'confirmed' : 'hypothetical',
    includeInProjection: true,
    expectedBonus: Number(offer.signupBonusAmount) || 0,
    notes: ''
  };
}

/* ============================================================
   OPTIMIZER
   ============================================================
   Brute-force search over candidate offers (status in
   {prospect, selected}, complete, dates within projection horizon).

   For up to maxOptimizerCandidates offers, evaluate every 2^n subset.
   For each subset:
     - Generate the daily projection with that subset selected.
     - A combination is feasible if availableCapital >= 0 every day.
     - Track total bonus, lowest available capital, days below buffer,
       and any breach dates.

   Ranking (feasible only):
     1. Highest total expected bonus.
     2. Highest blended annualized return.
     3. Highest lowest-available-capital (largest safety margin).

   Note: For n=15 this is 32,768 evaluations × 365 days ≈ 12M ops,
   which is fast in modern JS. We always run synchronously and then
   render. If candidates exceed the configured limit, we ask the user
   to deselect some via the planner cards.
   ============================================================ */
function runOptimizer(state) {
  const horizonStart = parseDate(state.settings.projectionStartDate) || TODAY;
  const horizonEnd = addDays(horizonStart, effectiveHorizonDays(state));

  const candidates = state.offers.filter(o => {
    if (!HYPOTHETICAL_OFFER_STATUSES.has(o.status)) return false;
    if (!isOfferComplete(o)) return false;
    const start = parseDate(lockStartDate(o));
    const end = parseDate(withdrawalEligibleDate(o));
    if (!start || !end) return false;
    if (end <= horizonStart || start >= horizonEnd) return false;
    return true;
  });

  const max = state.settings.maxOptimizerCandidates || 15;

  if (candidates.length > max) {
    return {
      tooMany: true,
      candidateCount: candidates.length,
      max,
      candidates,
      results: [],
      evaluated: 0,
      infeasibleCount: 0
    };
  }

  const buffer = Number(state.settings.minimumCashBuffer) || 0;
  const total = 1 << candidates.length;
  const results = [];
  let infeasibleCount = 0;

  for (let mask = 0; mask < total; mask++) {
    const includedIds = [];
    let totalBonus = 0;
    let totalRequired = 0;
    let weightedAnnReturnNum = 0;
    let weightedAnnReturnDen = 0;
    for (let i = 0; i < candidates.length; i++) {
      if (mask & (1 << i)) {
        const o = candidates[i];
        includedIds.push(o.id);
        totalBonus += Number(o.signupBonusAmount) || 0;
        totalRequired += Number(o.requiredFundingAmount) || 0;
        const ar = annualizedReturn(o);
        if (ar != null) {
          // Weight by capital × duration (dollar-days) to get a blended
          // rate. DD offers use their actual round-trip dollar-days;
          // held offers use required funding × stated hold days.
          let weight;
          if (o.offerType === 'direct-deposit' || o.offerType === 'held-and-dd') {
            const ct = ddCapitalTime(o);
            weight = ct ? ct.dollarDays : 0;
          } else {
            weight = Number(o.requiredFundingAmount) * Number(o.daysFundsMustRemain || 0);
          }
          if (weight > 0) {
            weightedAnnReturnNum += ar * weight;
            weightedAnnReturnDen += weight;
          }
        }
      }
    }

    const proj = generateProjection(state, { includedOfferIds: includedIds });
    let lowest = Infinity;
    let belowBufferDays = 0;
    let shortfallDays = 0;
    const breachDates = [];
    for (const d of proj) {
      if (d.availableCapital < lowest) lowest = d.availableCapital;
      if (d.shortfall) { shortfallDays++; breachDates.push(d.dateISO); }
      else if (d.belowBuffer) belowBufferDays++;
    }
    const feasible = shortfallDays === 0 && belowBufferDays === 0;
    if (!feasible) infeasibleCount++;
    results.push({
      mask,
      includedIds,
      offerCount: includedIds.length,
      totalBonus,
      totalRequired,
      lowestAvailable: lowest,
      belowBufferDays,
      shortfallDays,
      feasible,
      blendedAnnReturn: weightedAnnReturnDen > 0 ? weightedAnnReturnNum / weightedAnnReturnDen : null,
      breachDates: breachDates.slice(0, 5)
    });
  }

  // Rank feasible: bonus desc → annReturn desc → lowestAvailable desc
  const feasibleResults = results
    .filter(r => r.feasible && r.offerCount > 0)
    .sort((a, b) => {
      if (b.totalBonus !== a.totalBonus) return b.totalBonus - a.totalBonus;
      const ar = (a.blendedAnnReturn ?? 0), br = (b.blendedAnnReturn ?? 0);
      if (br !== ar) return br - ar;
      return b.lowestAvailable - a.lowestAvailable;
    });

  return {
    tooMany: false,
    candidates,
    results: feasibleResults.slice(0, 10),
    allResults: results,
    evaluated: total,
    infeasibleCount,
    candidateCount: candidates.length
  };
}

/* ============================================================
   RENDERING — top-level shell
   ============================================================ */
function render() {
  const root = document.getElementById('app');
  try {
    // Idempotent status normalization covers every state path (load, sync
    // pull, inline edits) in one place — guarantees subStatus/accountStatus
    // exist and the legacy shadow status is in sync before anything renders.
    if (App.state && App.state.offers) App.state.offers.forEach(normalizeOfferStatus);
    // Preserve focus + caret on inputs across full re-renders. Without this,
    // typing/backspacing in the search box loses focus on every keystroke
    // because innerHTML destroys the input element.
    const focused = document.activeElement;
    const focusedId = focused && focused.id ? focused.id : null;
    const selStart = focused && focused.selectionStart != null ? focused.selectionStart : null;
    const selEnd = focused && focused.selectionEnd != null ? focused.selectionEnd : null;

    root.innerHTML = renderShell();

    if (focusedId) {
      const el = document.getElementById(focusedId);
      if (el) {
        el.focus({ preventScroll: true });
        try { if (selStart != null && el.setSelectionRange) el.setSelectionRange(selStart, selEnd); } catch {}
      }
    }
    bindViewEvents();
    // Re-render charts that need actual DOM measurements
    renderChartsAfterMount();
  } catch (e) {
    // Never blank the screen on a render bug — log it and show a
    // recoverable error panel instead.
    logError(ErrCode.RENDER, e, 'render:' + (App.view || '?'));
    if (root) root.innerHTML = renderErrorState(e);
  }
}

/* Self-contained recovery UI. Must not depend on renderShell()/state being
   healthy, since it's shown precisely when those threw. Reads the diag log
   straight from localStorage so it works even mid-boot. */
function renderErrorState(err) {
  const msg = (err && err.message) ? err.message : String(err || 'Unknown error');
  return `
    <div class="error-state">
      <h1>Yield Vector hit a snag</h1>
      <p>The view failed to render, but your data is safe in local storage. Try reloading. If it keeps happening, copy the diagnostics below when reporting it.</p>
      <pre class="error-state-msg">${escapeHtml(msg)}</pre>
      <div class="error-state-actions">
        <button class="btn btn-primary" onclick="location.reload()">Reload</button>
        <button class="btn btn-secondary" data-action="copy-diag">Copy diagnostics</button>
      </div>
      <p class="error-state-foot">Build v${escapeHtml(APP_VERSION)}</p>
    </div>`;
}

  const expectedBonusTotal = includedOffers.reduce((s, o) => s + (Number(o.signupBonusAmount) || 0), 0);
  const tiedUpToday = today ? today.totalTiedUp : 0;
  const liquidCapital = App.state.settings.currentLiquidCapital;

  const heroAvailable = today ? today.availableCapital : liquidCapital;
  const heroLowest = lowest ? lowest.availableCapital : heroAvailable;
  const buffer = Number(App.state.settings.minimumCashBuffer) || 0;

  // Tone for any "lowest" or "available" dollar value: red if it would go
  // negative, buffer-yellow if it dips into the buffer zone (positive but

  // amount and the inline "Lowest $X" line.
  function shortfallTone(v) {
    if (v < 0) return 'var(--danger)';
    if (v < buffer) return '#c88b2c'; // matches .stat-value.warn / Buffer line
    return 'var(--text)';

  const heroAmountTone = shortfallTone(heroAvailable);
  const heroLowestTone = shortfallTone(heroLowest);

  const lowestPill = summary.shortfallDays > 0
    ? `<span class="pill danger">${summary.shortfallDays} shortfall day${summary.shortfallDays === 1 ? '' : 's'}</span>`

      : `<span class="pill">Healthy through horizon</span>`;

  const ACTIONS_PER_PAGE = 6;
  const allUpcomingActions = computeUpcomingActions(App.state, 200);
  const upcomingPageCount = Math.max(1, Math.ceil(allUpcomingActions.length / ACTIONS_PER_PAGE));
  if (typeof App._upcomingPage !== 'number') App._upcomingPage = 0;
  App._upcomingPage = Math.min(App._upcomingPage, upcomingPageCount - 1);

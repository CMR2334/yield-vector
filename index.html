<body>
<div class="app-shell" id="app">
  <!-- Populated by JS -->
</div>

<script>
'use strict';

/* ============================================================
   CONSTANTS & STORAGE
   ============================================================ */
const STORAGE_KEY = 'capital-planner-v1';
const TODAY = startOfDay(new Date());

const STATUSES = ['prospect', 'selected', 'applied', 'funded', 'completed', 'skipped'];
const STATUS_LABELS = {
  prospect: 'Prospect',
  selected: 'Selected',
  applied: 'Applied',
  funded: 'Funded',
  completed: 'Completed',
  skipped: 'Skipped'
};
const STATUS_CHIP_CLASS = {
  prospect: 'chip-muted',
  selected: 'chip-accent',
  applied: 'chip-accent',
  funded: 'chip-accent',
  completed: 'chip-success',
  skipped: 'chip-muted'
};

const CONFIDENCE_LABELS = { confirmed: 'Confirmed', likely: 'Likely', uncertain: 'Uncertain' };

const CONFIRMED_OFFER_STATUSES = new Set(['applied', 'funded']);
const HYPOTHETICAL_OFFER_STATUSES = new Set(['prospect', 'selected']);

const COMMITMENT_TYPES = [
  { value: 'minimum balance', label: 'Minimum Balance' },
  { value: 'opening deposit', label: 'Opening Deposit' },
  { value: 'direct deposit', label: 'Direct Deposit' },
  { value: 'manual hold', label: 'Manual Hold' },
  { value: 'other', label: 'Other' }
];

const EVENT_CATEGORIES = [
  { value: 'inflow', label: 'Inflow' },
  { value: 'outflow', label: 'Outflow' },
  { value: 'bonus payout', label: 'Bonus Payout' },
  { value: 'fee', label: 'Fee' },
  { value: 'correction', label: 'Correction' },
  { value: 'other', label: 'Other' }
];

const ENTITY_OPTIONS = [
  'Collin Rekowski (Ind - SSN)',
  'Collin Rekowski (SP - EIN)',
  'Ethir Systems (LLC - EIN)'
];

const EMAIL_OPTIONS = [
  'cmreko91@gmail.com',
  'collinrekowski1@gmail.com',
  'ethirsystems@gmail.com'
];

/* ============================================================
   CLOUD SYNC (GitHub Gist)
   ============================================================
   Persists state to a private GitHub Gist so the app syncs across
   devices. Each device stores a Personal Access Token (PAT, scope:
   `gist`) and the Gist ID in localStorage. On startup we pull the
   Gist; if its `_lastModified` timestamp is newer than local, the
   remote replaces local. Otherwise we push local up.

   Conflict resolution is last-writer-wins on the `_lastModified`
   timestamp embedded in the state. For a single user across devices
   this is sufficient — the loser's edits are overwritten only if
   they were strictly older than the winner's.

   Token security note: a PAT with only the `gist` scope can only
   read/write your gists. It cannot touch your repos, your account
   settings, or any GitHub-authenticated services. Loss = revoke
   at github.com/settings/tokens.
   ============================================================ */
const SYNC_CONFIG_KEY = 'capital-planner-sync-config-v1';
const SYNC_FILENAME = 'capital-planner.json';

const Sync = {
  status: 'unconfigured',  // 'unconfigured' | 'syncing' | 'synced' | 'pending' | 'error'
  lastError: null,
  lastSyncAt: 0,            // Date.now() of last successful round-trip
  pushTimer: null,
  startupDone: false,

  getConfig() {
    try { return JSON.parse(localStorage.getItem(SYNC_CONFIG_KEY)) || null; }
    catch { return null; }
  },
  setConfig(cfg) {
    if (cfg) localStorage.setItem(SYNC_CONFIG_KEY, JSON.stringify(cfg));
    else localStorage.removeItem(SYNC_CONFIG_KEY);
  },
  isConfigured() {
    const c = this.getConfig();
    return Boolean(c && c.token && c.gistId);
  },
  setStatus(s, err = null) {
    this.status = s;
    this.lastError = err;
    updateSyncIndicator();
  },

  // Schedule a debounced push after local edits.
  schedulePush(delayMs = 2500) {
    if (!this.isConfigured()) { this.setStatus('unconfigured'); return; }
    if (this.pushTimer) clearTimeout(this.pushTimer);
    this.setStatus('pending');
    this.pushTimer = setTimeout(() => this.push({ silent: true }), delayMs);
  },

  // Timestamp-aware sync: pulls from Gist; if remote newer, replaces local
  // (after flushing any pending push). If local newer, pushes. Safe to call
  // from startup, focus, and visibilitychange. Throttled by SAFE_SYNC_COOLDOWN.
  _lastSafeSyncAt: 0,
  async safeSync({ force = false, reason = '' } = {}) {
    if (!this.isConfigured()) { this.setStatus('unconfigured'); return; }
    const SAFE_SYNC_COOLDOWN = 5000;
    const now = Date.now();
    if (!force && now - this._lastSafeSyncAt < SAFE_SYNC_COOLDOWN) return;
    this._lastSafeSyncAt = now;

    const cfg = this.getConfig();
    // If a debounced push is queued, the user has unsaved local edits — flush
    // them first so we don't clobber them by pulling.
    if (this.pushTimer) {
      clearTimeout(this.pushTimer);
      this.pushTimer = null;
      await this.push({ silent: true });
    }

    this.setStatus('syncing');
    try {
      const data = await ghGet(`https://api.github.com/gists/${cfg.gistId}`, cfg.token);
      const file = data.files[SYNC_FILENAME] || Object.values(data.files || {})[0];
      let remote = null;
      if (file) {
        const content = file.truncated
          ? await (await fetch(file.raw_url)).text()
          : file.content;
        if (content && content.trim()) {
          try { remote = JSON.parse(content); } catch { remote = null; }
        }
      }
      const remoteModified = (remote && remote._lastModified) || 0;
      const localModified = (App.state && App.state._lastModified) || 0;

      if (remote && remoteModified > localModified) {
        // Remote wins — replace local
        App.state = remote;
        try { localStorage.setItem(STORAGE_KEY, JSON.stringify(App.state)); } catch {}
        this.lastSyncAt = Date.now();
        this.setStatus('synced');
        render();
        if (reason) toast(`Pulled latest from cloud (${reason})`);
      } else if (!remote || localModified > remoteModified) {
        // Local newer or remote empty — push up. Skip if remoteModified > 0
        // and local seeded with no edits (avoids overwriting with sample data
        // on a fresh device); only push if local has been touched.
        if (remoteModified > 0 && localModified === 0) {
          // Local is fresh / unsaved — pull remote rather than push
          App.state = remote;
          try { localStorage.setItem(STORAGE_KEY, JSON.stringify(App.state)); } catch {}
          this.lastSyncAt = Date.now();
          this.setStatus('synced');
          render();
          if (reason) toast(`Pulled latest from cloud (${reason})`);
        } else {
          await this.push({ silent: true });
        }
      } else {
        this.lastSyncAt = Date.now();
        this.setStatus('synced');
      }
    } catch (e) {
      this.setStatus('error', e.message);
      console.warn('safeSync failed', e);
    }
  },

  async startupSync() {
    if (this.startupDone) return;
    this.startupDone = true;
    return this.safeSync({ force: true });
  },

  async pull({ silent = false } = {}) {
    if (!this.isConfigured()) { toast('Sync not configured', 'danger'); return; }
    const cfg = this.getConfig();
    this.setStatus('syncing');
    try {
      const data = await ghGet(`https://api.github.com/gists/${cfg.gistId}`, cfg.token);
      const file = data.files[SYNC_FILENAME] || Object.values(data.files || {})[0];
      if (!file) throw new Error('Gist has no file yet');
      const content = file.truncated
        ? await (await fetch(file.raw_url)).text()
        : file.content;
      if (!content || !content.trim()) throw new Error('Gist file is empty');
      const remote = JSON.parse(content);
      App.state = remote;
      try { localStorage.setItem(STORAGE_KEY, JSON.stringify(App.state)); } catch {}
      this.lastSyncAt = Date.now();
      this.setStatus('synced');
      render();
      if (!silent) toast('Pulled from cloud');
    } catch (e) {
      this.setStatus('error', e.message);
      if (!silent) toast('Pull failed: ' + e.message, 'danger');
    }
  },

  async push({ silent = false } = {}) {
    if (!this.isConfigured()) { if (!silent) toast('Sync not configured', 'danger'); return; }
    const cfg = this.getConfig();
    this.setStatus('syncing');
    try {
      // Stamp last-modified + reminder feed snapshot just before sending so
      // remote reflects the upload. The feed is what an iOS Shortcut will
      // read to build merge-style Reminders entries.
      App.state._lastModified = Date.now();
      try { App.state._feed = computeReminderFeed(App.state); } catch {}
      try { localStorage.setItem(STORAGE_KEY, JSON.stringify(App.state)); } catch {}
      const body = JSON.stringify({
        files: { [SYNC_FILENAME]: { content: JSON.stringify(App.state, null, 2) } }
      });
      await ghFetch(`https://api.github.com/gists/${cfg.gistId}`, cfg.token, 'PATCH', body);
      this.lastSyncAt = Date.now();
      this.setStatus('synced');
      if (!silent) toast('Pushed to cloud');
    } catch (e) {
      this.setStatus('error', e.message);
      if (!silent) toast('Push failed: ' + e.message, 'danger');
    }
  },

  async createGist(token) {
    // Convenience: create a private Gist seeded with current state + feed.
    App.state._lastModified = Date.now();
    try { App.state._feed = computeReminderFeed(App.state); } catch {}
    try { localStorage.setItem(STORAGE_KEY, JSON.stringify(App.state)); } catch {}
    const body = JSON.stringify({
      description: 'Yield Vector sync',
      public: false,
      files: { [SYNC_FILENAME]: { content: JSON.stringify(App.state, null, 2) } }
    });
    const data = await ghFetch('https://api.github.com/gists', token, 'POST', body);
    return data.id;
  },

  disconnect() {
    if (this.pushTimer) clearTimeout(this.pushTimer);
    this.setConfig(null);
    this.lastSyncAt = 0;
    this.setStatus('unconfigured');
  }
};

async function ghGet(url, token) {
  const r = await fetch(url, {
    headers: {
      Authorization: `token ${token}`,
      Accept: 'application/vnd.github+json'
    }
  });
  if (!r.ok) {
    const t = await r.text().catch(() => '');
    throw new Error(`HTTP ${r.status}${t ? ': ' + t.slice(0, 80) : ''}`);
  }
  return r.json();
}

async function ghFetch(url, token, method, body) {
  const r = await fetch(url, {
    method,
    headers: {
      Authorization: `token ${token}`,
      Accept: 'application/vnd.github+json',
      'Content-Type': 'application/json'
    },
    body
  });
  if (!r.ok) {
    const t = await r.text().catch(() => '');
    throw new Error(`HTTP ${r.status}${t ? ': ' + t.slice(0, 80) : ''}`);
  }
  return r.json();
}

function relativeTimeShort(ts) {
  if (!ts) return '';
  const diff = Math.max(0, Date.now() - ts);
  if (diff < 10000) return 'just now';
  if (diff < 60000) return `${Math.floor(diff / 1000)}s ago`;
  if (diff < 3600000) return `${Math.floor(diff / 60000)}m ago`;
  if (diff < 86400000) return `${Math.floor(diff / 3600000)}h ago`;
  return `${Math.floor(diff / 86400000)}d ago`;
}

function renderSyncIndicator() {
  const rel = Sync.lastSyncAt ? relativeTimeShort(Sync.lastSyncAt) : '';
  const labels = {
    synced: rel ? `Synced ${rel}` : 'Synced',
    syncing: 'Syncing…',
    pending: 'Pending',
    error: 'Sync error',
    unconfigured: 'Not synced'
  };
  const title = Sync.lastError
    ? `Error: ${Sync.lastError}. Click to fix.`
    : (Sync.status === 'synced' && Sync.lastSyncAt
      ? `Last synced ${new Date(Sync.lastSyncAt).toLocaleTimeString()}. Click for sync settings.`
      : `Click for sync settings.`);
  return `
    <button class="sync-indicator" data-status="${Sync.status}" data-action="open-sync" title="${escapeAttr(title)}">
      <span class="sync-dot"></span>
      <span class="sync-text">${labels[Sync.status] || 'Sync'}</span>
    </button>
  `;
}

function updateSyncIndicator() {
  // Patch in place to avoid full re-render
  const old = document.querySelector('.sync-indicator');
  if (!old) return;
  const wrap = document.createElement('div');
  wrap.innerHTML = renderSyncIndicator();
  const next = wrap.firstElementChild;
  old.replaceWith(next);
}

/* ============================================================
   PWA: runtime-generated icon + manifest, no external assets
   ============================================================ */
function setupPwa() {
  // Yield Vector home-screen icon — pixel-identical (modulo raster vs.
  // vector) to the inline SVG brand mark in renderHeader(). The header
  // SVG is a 22×22 viewBox; this canvas is 180×180. Every coordinate
  // below is the header coord × (180/22) ≈ 8.18181818, so the icon
  // and the header read as the same mark at two scales.
  //
  // Header reference (LOCKED — keep in sync if either is edited):
  //   - rect 22×22, rx=6
  //   - chip gradient (BL→TR, x1=0 y1=22 x2=22 y2=0):
  //       0%   #1e1b4b     45%  #4338ca
  //       80%  #7c3aed    100%  #b69cff
  //   - shimmer (x1=0 y1=0 x2=14 y2=14):
  //       0%   rgba(255,255,255,0.18)
  //       100% rgba(255,255,255,0)
  //   - arrow shaft:  M 5.5 16.5 Q 9 12 16 6.5    stroke=#fff w=2 round
  //   - arrowhead:    M 10.8 7.2 L 16.5 6 L 15.3 12  same stroke
  const c = document.createElement('canvas');
  c.width = 180; c.height = 180;
  const ctx = c.getContext('2d');
  const W = 180;
  const S = W / 22;            // header→canvas scale
  const R = 6 * S;             // 49.09 — corner radius

  // Round-corner clip (rx=6 in header, rx=49 here)
  ctx.save();
  ctx.beginPath();
  ctx.moveTo(R, 0);
  ctx.lineTo(W - R, 0);
  ctx.quadraticCurveTo(W, 0, W, R);
  ctx.lineTo(W, W - R);
  ctx.quadraticCurveTo(W, W, W - R, W);
  ctx.lineTo(R, W);
  ctx.quadraticCurveTo(0, W, 0, W - R);
  ctx.lineTo(0, R);
  ctx.quadraticCurveTo(0, 0, R, 0);
  ctx.closePath();
  ctx.clip();

  // Chip gradient: corner-to-corner, bottom-left → top-right
  const grad = ctx.createLinearGradient(0, W, W, 0);
  grad.addColorStop(0.00, '#1e1b4b');
  grad.addColorStop(0.45, '#4338ca');
  grad.addColorStop(0.80, '#7c3aed');
  grad.addColorStop(1.00, '#b69cff');
  ctx.fillStyle = grad;
  ctx.fillRect(0, 0, W, W);

  // Upper-left shimmer overlay — same stops/extent as the header SVG
  const shimmer = ctx.createLinearGradient(0, 0, 14 * S, 14 * S);
  shimmer.addColorStop(0, 'rgba(255,255,255,0.18)');
  shimmer.addColorStop(1, 'rgba(255,255,255,0)');
  ctx.fillStyle = shimmer;
  ctx.fillRect(0, 0, W, W);

  // White arrow — same Bezier shaft + chevron arrowhead as the header.
  // Stroke width 2 in header → 2 × S ≈ 16.36 here.
  ctx.strokeStyle = '#ffffff';
  ctx.lineWidth = 2 * S;
  ctx.lineCap = 'round';
  ctx.lineJoin = 'round';
  // Shaft: M 5.5 16.5 Q 9 12 16 6.5
  ctx.beginPath();
  ctx.moveTo(5.5 * S, 16.5 * S);
  ctx.quadraticCurveTo(9 * S, 12 * S, 16 * S, 6.5 * S);
  ctx.stroke();
  // Arrowhead: M 10.8 7.2 L 16.5 6 L 15.3 12
  ctx.beginPath();
  ctx.moveTo(10.8 * S, 7.2 * S);
  ctx.lineTo(16.5 * S, 6 * S);
  ctx.lineTo(15.3 * S, 12 * S);
  ctx.stroke();

  ctx.restore();

  const dataUrl = c.toDataURL('image/png');
  const apple = document.getElementById('apple-icon');
  const fav = document.getElementById('favicon');
  if (apple) apple.href = dataUrl;
  if (fav) fav.href = dataUrl;
  // Sync the <meta name="theme-color"> too — it controls the iOS Safari
  // status-bar tint and the Android task-switcher header. Pick a color
  // pulled from the chip's mid-gradient so the OS chrome harmonizes
  // with the icon rather than being the old standalone accent.
  const themeMeta = document.querySelector('meta[name="theme-color"]');
  if (themeMeta) themeMeta.setAttribute('content', '#4338ca');
  // Web App Manifest (Android/Chrome)
  const manifest = {
    name: 'Yield Vector',
    short_name: 'Yield Vector',
    display: 'standalone',
    start_url: location.pathname,
    scope: location.pathname,
    background_color: '#f5f5f7',
    theme_color: '#4338ca',
    icons: [
      { src: dataUrl, sizes: '180x180', type: 'image/png', purpose: 'any maskable' }
    ]
  };
  const blob = new Blob([JSON.stringify(manifest)], { type: 'application/manifest+json' });
  const m = document.getElementById('manifest');
  if (m) m.href = URL.createObjectURL(blob);
}

/* ============================================================
   DATE UTILITIES
   ============================================================ */
function startOfDay(d) {
  const x = new Date(d);
  x.setHours(0, 0, 0, 0);
  return x;
}

function parseDate(s) {
  if (!s) return null;
  if (s instanceof Date) return startOfDay(s);
  const m = String(s).match(/^(\d{4})-(\d{2})-(\d{2})/);
  if (!m) return null;
  const d = new Date(+m[1], +m[2] - 1, +m[3]);
  return isNaN(d) ? null : d;
}

function isoDate(d) {
  if (!d) return '';
  const dt = d instanceof Date ? d : parseDate(d);
  if (!dt) return '';
  const y = dt.getFullYear();
  const m = String(dt.getMonth() + 1).padStart(2, '0');
  const dd = String(dt.getDate()).padStart(2, '0');
  return `${y}-${m}-${dd}`;
}

function addDays(d, n) {
  const dt = new Date(d);
  dt.setDate(dt.getDate() + n);
  return dt;
}

function daysBetween(a, b) {
  const ms = startOfDay(b) - startOfDay(a);
  return Math.round(ms / 86400000);
}

function formatDateShort(d) {
  const dt = d instanceof Date ? d : parseDate(d);
  if (!dt) return '—';
  return dt.toLocaleDateString('en-US', { month: 'short', day: 'numeric' });
}

function formatDateMedium(d) {
  const dt = d instanceof Date ? d : parseDate(d);
  if (!dt) return '—';
  const sameYear = dt.getFullYear() === TODAY.getFullYear();
  return dt.toLocaleDateString('en-US', sameYear
    ? { month: 'short', day: 'numeric' }
    : { month: 'short', day: 'numeric', year: 'numeric' });
}

function formatDateLong(d) {
  const dt = d instanceof Date ? d : parseDate(d);
  if (!dt) return '—';
  return dt.toLocaleDateString('en-US', { weekday: 'short', month: 'short', day: 'numeric', year: 'numeric' });
}

function relativeDays(d) {
  const dt = parseDate(d);
  if (!dt) return '';
  const n = daysBetween(TODAY, dt);
  if (n === 0) return 'today';
  if (n === 1) return 'tomorrow';
  if (n === -1) return 'yesterday';
  if (n > 0) return `in ${n} days`;
  return `${-n} days ago`;
}

/* ============================================================
   CURRENCY FORMATTING
   ============================================================ */
function formatCurrency(n, opts = {}) {
  if (n === null || n === undefined || isNaN(n)) return '—';
  const sign = n < 0 ? '-' : '';
  const abs = Math.abs(n);
  return sign + '$' + Math.round(abs).toLocaleString('en-US');
}

function formatCurrencyDecimal(n) {
  if (n === null || n === undefined || isNaN(n)) return '—';
  const sign = n < 0 ? '-' : '';
  return sign + '$' + Math.abs(n).toLocaleString('en-US', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
}

function formatCompactCurrency(n) {
  if (n === null || n === undefined || isNaN(n)) return '—';
  const sign = n < 0 ? '-' : '';
  const abs = Math.abs(n);
  if (abs >= 1_000_000) return `${sign}$${(abs / 1_000_000).toFixed(abs >= 10_000_000 ? 0 : 1)}M`;
  if (abs >= 10_000) return `${sign}$${Math.round(abs / 1000)}K`;
  if (abs >= 1000) return `${sign}$${(abs / 1000).toFixed(1)}K`;
  return `${sign}$${Math.round(abs)}`;
}

function formatPercent(n, digits = 1) {
  if (n === null || n === undefined || isNaN(n)) return '—';
  return (n * 100).toFixed(digits) + '%';
}

/* ============================================================
   ID GENERATOR
   ============================================================ */
function uid(prefix = 'id') {
  return `${prefix}_${Date.now().toString(36)}_${Math.random().toString(36).slice(2, 8)}`;
}

/* ============================================================
   STATE MANAGEMENT
   ============================================================ */
const App = {
  state: null,
  view: 'overview',
  filters: {
    timelineShowCancelled: false,
    timelineShowCompleted: true,
    offersStatus: 'all',
    offersSearch: '',
    offersAdvanced: false
  },
  optimizer: { results: null, candidates: [], evaluated: 0, infeasibleCount: 0, lastRunAt: null },

  init() {
    const saved = this.load();
    this.state = saved || this.defaultState();
    if (!saved) {
      this.state = seedSampleData(this.state);
      this.save();
    }
    this.rollProjectionStartIfStale();
    setupPwa();
    if (Sync.isConfigured()) Sync.setStatus('synced'); // optimistic until startup pull replies
    else Sync.setStatus('unconfigured');
    render();
    bindGlobalEvents();
    // Async pull — runs after first paint, doesn't block UI
    if (Sync.isConfigured()) {
      setTimeout(() => Sync.startupSync(), 50);
    }
  },

  // Auto-roll the projection start date forward to today whenever it
  // falls behind. Called on init, on visibilitychange (tab back from
  // background), and once a minute via setInterval (covers the case
  // where the app is left open overnight). Returns true if the state
  // changed, so callers can re-render. We only advance — never roll
  // backward — so a user explicitly setting a future start date in
  // Settings is preserved.
  rollProjectionStartIfStale() {
    if (!this.state || !this.state.settings) return false;
    const today = isoDate(new Date());
    const cur = this.state.settings.projectionStartDate;
    if (!cur || cur < today) {
      this.state.settings.projectionStartDate = today;
      this.save();
      return true;
    }
    return false;
  },

  defaultState() {
    return {
      version: 1,
      settings: {
        currentLiquidCapital: 200000,
        minimumCashBuffer: 20000,
        projectionStartDate: isoDate(TODAY),
        projectionHorizonMode: 'auto',  // 'auto' | '3months' | '6months' | '1year' | '2years' | 'custom'
        projectionHorizonDays: 365,     // used only when mode === 'custom'
        maxOptimizerCandidates: 15,
        defaultLockStartsFrom: 'funded date'
      },
      offers: [],
      commitments: [],
      events: []
    };
  },

  load() {
    try {
      const raw = localStorage.getItem(STORAGE_KEY);
      if (!raw) return null;
      const parsed = JSON.parse(raw);
      if (!parsed || typeof parsed !== 'object') return null;
      return parsed;
    } catch (e) {
      console.warn('Failed to load state', e);
      return null;
    }
  },

  save() {
    try {
      // Stamp last-modified so cloud sync can resolve "who's newer"
      this.state._lastModified = Date.now();
      localStorage.setItem(STORAGE_KEY, JSON.stringify(this.state));
      Sync.schedulePush();
    } catch (e) {
      toast('Could not save: storage unavailable', 'danger');
    }
  },

  setView(view) {
    if (this.view === view) return;
    this.view = view;
    render();
    window.scrollTo({ top: 0, behavior: 'instant' });
  },

  update(updater) {
    updater(this.state);
    this.save();
    render();
  }
};

/* ============================================================
   OFFER DERIVED FIELDS
   ============================================================ */
function effectiveFundingDate(offer) {
  return offer.optionalPlannedFundingDate || offer.plannedSignupDate;
}

function depositDeadline(offer) {
  if (!offer.plannedSignupDate || offer.daysAfterSignupAllowedBeforeDeposit == null) return null;
  return isoDate(addDays(parseDate(offer.plannedSignupDate), Number(offer.daysAfterSignupAllowedBeforeDeposit)));
}

function withdrawalEligibleDate(offer) {
  // The day-count anchor depends on lockStartsFrom:
  //   'open date'   → days are measured from when the account is opened
  //                   (e.g. US Bank: "60 days from account open"). Funding
  //                   later means a shorter actual lock.
  //   'funded date' → days are measured from the actual funding date
  //                   (e.g. Citi: "keep $50k for 60 days from deposit").
  const anchor = offer.lockStartsFrom === 'open date'
    ? offer.plannedSignupDate
    : effectiveFundingDate(offer);
  if (!anchor || offer.daysFundsMustRemain == null) return null;
  return isoDate(addDays(parseDate(anchor), Number(offer.daysFundsMustRemain)));
}

function lockStartDate(offer) {
  // Money is only actually unavailable from when it's deposited, regardless
  // of what the bank uses to anchor the day count. Always return the funding
  // date here so the projection reflects real cash availability.
  return effectiveFundingDate(offer);
}

function safeToCloseDate(offer) {
  // Approximation: withdrawalEligible + a small grace period; or use explicit field if present
  const we = withdrawalEligibleDate(offer);
  if (!we) return null;
  // Keep separate as concept; actual safe-to-close varies by bank policy
  return null;
}

function simpleReturn(offer) {
  if (!offer.requiredFundingAmount || !offer.signupBonusAmount) return null;
  return offer.signupBonusAmount / offer.requiredFundingAmount;
}

function annualizedReturn(offer) {
  const r = simpleReturn(offer);
  if (r == null || !offer.daysFundsMustRemain || offer.daysFundsMustRemain <= 0) return null;
  return r * 365 / offer.daysFundsMustRemain;
}

function isOfferComplete(offer) {
  return Boolean(
    offer.bankName &&
    offer.requiredFundingAmount > 0 &&
    offer.signupBonusAmount >= 0 &&
    offer.plannedSignupDate &&
    offer.daysFundsMustRemain != null &&
    offer.daysFundsMustRemain >= 0 &&
    parseDate(offer.plannedSignupDate)
  );
}

function offerIssues(offer) {
  const issues = [];
  if (!offer.bankName) issues.push('Bank name is required');
  if (!offer.requiredFundingAmount || offer.requiredFundingAmount <= 0) issues.push('Required funding amount must be > 0');
  if (offer.signupBonusAmount == null || offer.signupBonusAmount < 0) issues.push('Bonus amount required');
  if (!offer.plannedSignupDate || !parseDate(offer.plannedSignupDate)) issues.push('Planned signup date required');
  if (offer.daysFundsMustRemain == null || offer.daysFundsMustRemain < 0) issues.push('Days funds must remain required');
  return issues;
}

function offerIsActiveForProjection(offer, includedOverride = null) {
  // Returns whether this offer should affect the projection.
  if (!isOfferComplete(offer)) return false;
  if (offer.status === 'completed' || offer.status === 'skipped') return false;
  if (includedOverride !== null) return includedOverride.has(offer.id);
  if (CONFIRMED_OFFER_STATUSES.has(offer.status)) return true;
  return Boolean(offer.includeInScenario);
}

/* ============================================================
   PROJECTION ENGINE
   ============================================================
   Generates a daily cash projection over the configured horizon.

   For each day in [projectionStartDate, projectionStartDate + horizonDays):
     availableCapital =
         currentLiquidCapital
       + cumulative net of all included Capital Events with date <= day
       - sum of confirmed commitments active on this day
       - sum of hypothetical commitments active on this day

   Interval convention:
     A commitment with startDate=A and endDate=B ties up funds on each day d
     where A <= d < B. If a deposit lands March 1 and is withdrawal-eligible
     May 1, the funds are tied up March 1 through April 30 (61 days).

   Sources of commitments:
     1. Manual/explicit Capital Commitments (with includeInProjection true).
     2. Bonus Offers that are considered active:
        - status in {applied, funded} → counted as confirmed
        - status in {prospect, selected} with includeInScenario → counted
          as hypothetical
        Suppressed if a non-cancelled commitment with sourceBonusOfferId
        already covers the offer.

   The optimizer can pass an `includedOfferIds` set to override which
   prospect/selected offers contribute (used to evaluate combinations).
   ============================================================ */
// Compute the effective projection horizon in days based on the user's
// chosen mode. 'auto' = 30 days past the latest active date in the system
// (commitment ends, withdrawal-eligible dates, included events), with a
// 30-day floor. Modes other than 'custom' are fixed-day shorthands.
function effectiveHorizonDays(state) {
  const settings = state.settings || {};
  const mode = settings.projectionHorizonMode || 'auto';
  const start = parseDate(settings.projectionStartDate) || TODAY;
  if (mode === '3months') return 90;
  if (mode === '6months') return 180;
  if (mode === '1year') return 365;
  if (mode === '2years') return 730;
  if (mode === 'custom') return Math.max(30, Math.min(1825, Number(settings.projectionHorizonDays) || 365));
  // 'auto' — exactly 30 days past the latest withdrawal-eligible date of
  // offers that are ACTIVE in the projection. Confirmed offers count
  // unconditionally; unconfirmed offers (prospect/selected) only count
  // if the user has checked includeInScenario. This matches what's
  // actually plotted on the chart, so the X-axis can't extend out to
  // some prospect offer the user hasn't opted in to.
  // Hard clamp: end = lastActionDate + 30 days. No baseline padding,
  // no extra fudge factor anywhere. If no active offer, 30-day floor.
  let lastAction = null;
  const debug = [];
  for (const o of state.offers || []) {
    if (!offerIsActiveForProjection(o)) continue;
    const we = withdrawalEligibleDate(o);
    const d = we ? parseDate(we) : null;
    if (d && (lastAction == null || d > lastAction)) lastAction = d;
    if (d) debug.push({ id: o.id, status: o.status, withdrawal: we });
  }
  // Expose for inspection from the console: App.state && window._horizonDebug
  if (typeof window !== 'undefined') window._horizonDebug = { lastAction, considered: debug };
  if (!lastAction) return 30;
  const days = daysBetween(start, addDays(lastAction, 30));
  return Math.max(30, Math.min(180, days));
}

function generateProjection(state, options = {}) {
  const settings = state.settings;
  const horizon = effectiveHorizonDays(state);
  const start = parseDate(settings.projectionStartDate) || TODAY;
  const buffer = Number(settings.minimumCashBuffer) || 0;
  const liquid = Number(settings.currentLiquidCapital) || 0;

  const includedOverride = options.includedOfferIds
    ? new Set(options.includedOfferIds)
    : null;
  const earlyExit = options.earlyExit || false;

  // Pre-build day skeleton
  const days = new Array(horizon);
  const dayMs = 86400000;
  const startMs = start.getTime();
  for (let i = 0; i < horizon; i++) {
    days[i] = {
      date: new Date(startMs + i * dayMs),
      dateISO: '',
      dayIndex: i,
      startingLiquidCapital: liquid,
      confirmedTiedUp: 0,
      hypotheticalTiedUp: 0,
      totalTiedUp: 0,
      netEventsToDate: 0,
      availableCapital: liquid,
      belowBuffer: false,
      shortfall: false
    };
  }

  // Helper: find day index for a Date (clamped)
  function indexFor(date) {
    if (!date) return -1;
    const idx = Math.floor((startOfDay(date).getTime() - startMs) / dayMs);
    return idx;
  }

  // Helper: apply a commitment over its active range
  function applyCommitment(amount, startDate, endDate, kind) {
    const sIdx = indexFor(startDate);
    const eIdx = indexFor(endDate);
    if (eIdx < 0) return; // ends before horizon starts
    if (sIdx >= horizon) return; // starts after horizon ends
    // Active days: [max(sIdx,0), min(eIdx, horizon)) — endDate exclusive
    const from = Math.max(sIdx, 0);
    const to = Math.min(eIdx, horizon);
    for (let i = from; i < to; i++) {
      if (kind === 'confirmed') days[i].confirmedTiedUp += amount;
      else days[i].hypotheticalTiedUp += amount;
    }
  }

  // 1. Manual capital commitments
  const offerIdsWithCommitments = new Set();
  for (const c of state.commitments) {
    if (!c.includeInProjection) continue;
    if (c.status === 'cancelled') continue;
    const amount = Number(c.amount);
    if (!amount || amount <= 0) continue;
    const cs = parseDate(c.startDate);
    const ce = parseDate(c.endDate);
    if (!cs || !ce || cs >= ce) continue;
    if (c.sourceBonusOfferId) offerIdsWithCommitments.add(c.sourceBonusOfferId);
    const kind = (c.status === 'confirmed' || c.status === 'completed') ? 'confirmed' : 'hypothetical';
    if (c.status === 'completed') continue; // completed commitments no longer tie up funds
    applyCommitment(amount, cs, ce, kind);
  }

  // 2. Virtual commitments from bonus offers
  for (const o of state.offers) {
    if (!offerIsActiveForProjection(o, includedOverride)) continue;
    if (offerIdsWithCommitments.has(o.id)) continue; // suppressed by explicit commitment
    const start = parseDate(lockStartDate(o));
    const end = parseDate(withdrawalEligibleDate(o));
    if (!start || !end || start >= end) continue;
    const kind = CONFIRMED_OFFER_STATUSES.has(o.status) ? 'confirmed' : 'hypothetical';
    applyCommitment(Number(o.requiredFundingAmount), start, end, kind);
  }

  // 3. Capital events — accumulate net through each day
  const validEvents = state.events
    .filter(e => e.includeInProjection && e.date && parseDate(e.date) && typeof e.amount === 'number' && e.amount !== 0)
    .map(e => ({ idx: indexFor(parseDate(e.date)), amount: Number(e.amount) }))
    .filter(e => e.idx < horizon)
    .sort((a, b) => a.idx - b.idx);

  let cumul = 0;
  let evIdx = 0;
  for (let i = 0; i < horizon; i++) {
    while (evIdx < validEvents.length && validEvents[evIdx].idx <= i) {
      cumul += validEvents[evIdx].amount;
      evIdx++;
    }
    const d = days[i];
    d.netEventsToDate = cumul;
    d.totalTiedUp = d.confirmedTiedUp + d.hypotheticalTiedUp;
    d.availableCapital = d.startingLiquidCapital + cumul - d.totalTiedUp;
    d.belowBuffer = d.availableCapital < buffer;
    d.shortfall = d.availableCapital < 0;
    d.dateISO = isoDate(d.date);
    if (earlyExit && d.shortfall) {
      // Optimizer hint: still finish for stats, but mark early-exit info
    }
  }

  return days;
}

/* ============================================================
   PROJECTION SUMMARY (for the Overview view)
   ============================================================ */
function summarizeProjection(projection, settings) {
  if (!projection.length) return {};
  let lowest = projection[0];
  let lowestIdx = 0;
  let shortfallDays = 0;
  let belowBufferDays = 0;
  for (let i = 0; i < projection.length; i++) {
    const d = projection[i];
    if (d.availableCapital < lowest.availableCapital) { lowest = d; lowestIdx = i; }
    if (d.shortfall) shortfallDays++;
    if (d.belowBuffer) belowBufferDays++;
  }
  return {
    today: projection[0],
    lowest,
    lowestIdx,
    shortfallDays,
    belowBufferDays,
    feasible: shortfallDays === 0,
    horizonDays: projection.length
  };
}

/* ============================================================
   OFFER → COMMITMENT CONVERSION
   ============================================================ */
function convertOfferToCommitment(offer) {
  const start = lockStartDate(offer);
  const end = withdrawalEligibleDate(offer);
  if (!start || !end) return null;
  return {
    id: uid('cmt'),
    commitmentName: `${offer.bankName} — ${offer.offerName || 'Bonus'}`,
    sourceBonusOfferId: offer.id,
    amount: Number(offer.requiredFundingAmount),
    startDate: start,
    endDate: end,
    type: 'minimum balance',
    status: CONFIRMED_OFFER_STATUSES.has(offer.status) ? 'confirmed' : 'hypothetical',
    includeInProjection: true,
    expectedBonus: Number(offer.signupBonusAmount) || 0,
    notes: ''
  };
}

/* ============================================================
   OPTIMIZER
   ============================================================
   Brute-force search over candidate offers (status in
   {prospect, selected}, complete, dates within projection horizon).

   For up to maxOptimizerCandidates offers, evaluate every 2^n subset.
   For each subset:
     - Generate the daily projection with that subset selected.
     - A combination is feasible if availableCapital >= 0 every day.
     - Track total bonus, lowest available capital, days below buffer,
       and any breach dates.

   Ranking (feasible only):
     1. Highest total expected bonus.
     2. Highest blended annualized return.
     3. Highest lowest-available-capital (largest safety margin).

   Note: For n=15 this is 32,768 evaluations × 365 days ≈ 12M ops,
   which is fast in modern JS. We always run synchronously and then
   render. If candidates exceed the configured limit, we ask the user
   to deselect some via the planner cards.
   ============================================================ */
function runOptimizer(state) {
  const horizonStart = parseDate(state.settings.projectionStartDate) || TODAY;
  const horizonEnd = addDays(horizonStart, effectiveHorizonDays(state));

  const candidates = state.offers.filter(o => {
    if (!HYPOTHETICAL_OFFER_STATUSES.has(o.status)) return false;
    if (!isOfferComplete(o)) return false;
    const start = parseDate(lockStartDate(o));
    const end = parseDate(withdrawalEligibleDate(o));
    if (!start || !end) return false;
    if (end <= horizonStart || start >= horizonEnd) return false;
    return true;
  });

  const max = state.settings.maxOptimizerCandidates || 15;

  if (candidates.length > max) {
    return {
      tooMany: true,
      candidateCount: candidates.length,
      max,
      candidates,
      results: [],
      evaluated: 0,
      infeasibleCount: 0
    };
  }

  const buffer = Number(state.settings.minimumCashBuffer) || 0;
  const total = 1 << candidates.length;
  const results = [];
  let infeasibleCount = 0;

  for (let mask = 0; mask < total; mask++) {
    const includedIds = [];
    let totalBonus = 0;
    let totalRequired = 0;
    let weightedAnnReturnNum = 0;
    let weightedAnnReturnDen = 0;
    for (let i = 0; i < candidates.length; i++) {
      if (mask & (1 << i)) {
        const o = candidates[i];
        includedIds.push(o.id);
        totalBonus += Number(o.signupBonusAmount) || 0;
        totalRequired += Number(o.requiredFundingAmount) || 0;
        const ar = annualizedReturn(o);
        if (ar != null) {
          // Weight by required capital × duration to get a blended rate
          const weight = Number(o.requiredFundingAmount) * Number(o.daysFundsMustRemain);
          weightedAnnReturnNum += ar * weight;
          weightedAnnReturnDen += weight;
        }
      }
    }

    const proj = generateProjection(state, { includedOfferIds: includedIds });
    let lowest = Infinity;
    let belowBufferDays = 0;
    let shortfallDays = 0;
    const breachDates = [];
    for (const d of proj) {
      if (d.availableCapital < lowest) lowest = d.availableCapital;
      if (d.shortfall) { shortfallDays++; breachDates.push(d.dateISO); }
      else if (d.belowBuffer) belowBufferDays++;
    }
    const feasible = shortfallDays === 0 && belowBufferDays === 0;
    if (!feasible) infeasibleCount++;
    results.push({
      mask,
      includedIds,
      offerCount: includedIds.length,
      totalBonus,
      totalRequired,
      lowestAvailable: lowest,
      belowBufferDays,
      shortfallDays,
      feasible,
      blendedAnnReturn: weightedAnnReturnDen > 0 ? weightedAnnReturnNum / weightedAnnReturnDen : null,
      breachDates: breachDates.slice(0, 5)
    });
  }

  // Rank feasible: bonus desc → annReturn desc → lowestAvailable desc
  const feasibleResults = results
    .filter(r => r.feasible && r.offerCount > 0)
    .sort((a, b) => {
      if (b.totalBonus !== a.totalBonus) return b.totalBonus - a.totalBonus;
      const ar = (a.blendedAnnReturn ?? 0), br = (b.blendedAnnReturn ?? 0);
      if (br !== ar) return br - ar;
      return b.lowestAvailable - a.lowestAvailable;
    });

  return {
    tooMany: false,
    candidates,
    results: feasibleResults.slice(0, 10),
    allResults: results,
    evaluated: total,
    infeasibleCount,
    candidateCount: candidates.length
  };
}

/* ============================================================
   RENDERING — top-level shell
   ============================================================ */
function render() {
  const root = document.getElementById('app');
  // Preserve focus + caret on inputs across full re-renders. Without this,
  // typing/backspacing in the search box loses focus on every keystroke
  // because innerHTML destroys the input element.
  const focused = document.activeElement;
  const focusedId = focused && focused.id ? focused.id : null;
  const selStart = focused && focused.selectionStart != null ? focused.selectionStart : null;
  const selEnd = focused && focused.selectionEnd != null ? focused.selectionEnd : null;

  root.innerHTML = renderShell();

  if (focusedId) {
    const el = document.getElementById(focusedId);
    if (el) {
      el.focus({ preventScroll: true });
      try { if (selStart != null && el.setSelectionRange) el.setSelectionRange(selStart, selEnd); } catch {}
    }
  }
  bindViewEvents();
  // Re-render charts that need actual DOM measurements
  renderChartsAfterMount();
}

/* ============================================================
   OVERVIEW VIEW
   ============================================================ */
function renderOverview() {
  const proj = generateProjection(App.state);
  const summary = summarizeProjection(proj, App.state.settings);

  const today = summary.today;
  const lowest = summary.lowest;

  const includedOffers = App.state.offers.filter(o => offerIsActiveForProjection(o));
  const expectedBonusTotal = includedOffers.reduce((s, o) => s + (Number(o.signupBonusAmount) || 0), 0);
  const tiedUpToday = today ? today.totalTiedUp : 0;
  const liquidCapital = App.state.settings.currentLiquidCapital;

  const heroAvailable = today ? today.availableCapital : liquidCapital;
  const heroLowest = lowest ? lowest.availableCapital : heroAvailable;
  const buffer = Number(App.state.settings.minimumCashBuffer) || 0;

  // Tone for any "lowest" or "available" dollar value: red if it would go
  // negative, buffer-yellow if it dips into the buffer zone (positive but
  // under the buffer floor), normal text otherwise. Used for both the hero
  // amount and the inline "Lowest $X" line.
  function shortfallTone(v) {
    if (v < 0) return 'var(--danger)';
    if (v < buffer) return '#c88b2c'; // matches .stat-value.warn / Buffer line
    return 'var(--text)';
  }
  const heroAmountTone = shortfallTone(heroAvailable);
  const heroLowestTone = shortfallTone(heroLowest);

  const lowestPill = summary.shortfallDays > 0
    ? `<span class="pill danger">${summary.shortfallDays} shortfall day${summary.shortfallDays === 1 ? '' : 's'}</span>`
    : summary.belowBufferDays > 0
      ? `<span class="pill warn">${summary.belowBufferDays} day${summary.belowBufferDays === 1 ? '' : 's'} below buffer</span>`
      : `<span class="pill">Healthy through horizon</span>`;

  const ACTIONS_PER_PAGE = 6;
  const allUpcomingActions = computeUpcomingActions(App.state, 200);
  const upcomingPageCount = Math.max(1, Math.ceil(allUpcomingActions.length / ACTIONS_PER_PAGE));
  if (typeof App._upcomingPage !== 'number') App._upcomingPage = 0;
  App._upcomingPage = Math.min(App._upcomingPage, upcomingPageCount - 1);
  const upcomingActions = allUpcomingActions.slice(App._upcomingPage * ACTIONS_PER_PAGE, (App._upcomingPage + 1) * ACTIONS_PER_PAGE);

  return `
    <section class="hero">
      <div class="hero-numbers">
        <div class="hero-label">Available capital today</div>
        <div class="hero-amount" style="color:${heroAmountTone};">
          <span class="currency-symbol">${heroAvailable < 0 ? '-$' : '$'}</span>${Math.abs(Math.round(heroAvailable)).toLocaleString('en-US')}
        </div>
        <div class="hero-meta">
          ${lowestPill}
          ${lowest && summary.lowestIdx > 0 ? `<span style="color:var(--text-tertiary);">Lowest <strong style="color:${heroLowestTone};">${formatCompactCurrency(heroLowest)}</strong> on ${formatDateMedium(lowest.date)}</span>` : ''}
        </div>
      </div>
      <div class="chart-wrap" id="hero-chart-wrap">
        <svg class="chart-svg" id="hero-chart" viewBox="0 0 800 280" preserveAspectRatio="xMidYMid meet"></svg>
        <div class="chart-tooltip" id="chart-tooltip"></div>
      </div>
      <div class="chart-legend">
        <span class="chart-legend-item"><span class="legend-line" style="background:var(--accent);"></span> Available capital</span>
        <span class="chart-legend-item"><span class="legend-line dashed" style="color:var(--warning);"></span> Buffer (${formatCompactCurrency(App.state.settings.minimumCashBuffer)})</span>
        <span class="chart-legend-item"><span class="legend-swatch" style="background:#5b5cf6;"></span> Funding date</span>
        <span class="chart-legend-item"><span class="legend-swatch" style="background:#10b981;"></span> Withdrawal</span>
      </div>
    </section>

    <div class="grid grid-cols-3" style="margin-bottom: var(--space-6);">
      ${statCard('Tied up today', formatCurrency(tiedUpToday), `${(today ? Math.round((today.confirmedTiedUp / Math.max(1, today.totalTiedUp)) * 100) : 0)}% confirmed`, 'accent', 'goto-timeline')}
      ${statCard('Selected bonuses', formatCurrency(expectedBonusTotal), `${includedOffers.length} offer${includedOffers.length === 1 ? '' : 's'} included`, 'success', 'goto-offers-included')}
      ${statCard('Lowest projected', formatCompactCurrency(heroLowest), lowest ? formatDateMedium(lowest.date) : '—', summary.shortfallDays > 0 ? 'danger' : (summary.belowBufferDays > 0 ? 'warn' : 'lighten'), lowest ? 'goto-lowest' : null)}
    </div>

    <div class="overview-side">
      <section class="card">
        <div class="card-header">
          <h2>Upcoming actions</h2>
          ${upcomingPageCount > 1 ? `
            <div class="upcoming-pager">
              <button class="upcoming-pg-btn" data-action="upcoming-prev" ${App._upcomingPage === 0 ? 'disabled' : ''} aria-label="Previous">‹</button>
              <span class="upcoming-pg-label">${App._upcomingPage + 1} / ${upcomingPageCount}</span>
              <button class="upcoming-pg-btn" data-action="upcoming-next" ${App._upcomingPage === upcomingPageCount - 1 ? 'disabled' : ''} aria-label="Next">›</button>
            </div>
          ` : ''}
        </div>
        ${upcomingActions.length === 0
          ? `<div style="padding:var(--space-6);text-align:center;color:var(--text-tertiary);font-size:14px;">No upcoming dates yet. Add an offer to get started.</div>`
          : `<div class="action-list upcoming-fade" key="${App._upcomingPage}">${upcomingActions.map(renderActionRow).join('')}</div>`}
      </section>

      <aside class="card snapshot-card">
        <div class="snapshot-title">At a glance</div>
        <div class="snapshot-grid">
          <div class="snap snap-active"><span class="snap-v">${App.state.offers.filter(o => o.status !== 'completed' && o.status !== 'skipped').length}</span><span class="snap-l">Active offers</span></div>
          <div class="snap snap-confirmed"><span class="snap-v">${App.state.commitments.filter(c => c.status === 'confirmed' && c.includeInProjection).length + App.state.offers.filter(o => CONFIRMED_OFFER_STATUSES.has(o.status)).length}</span><span class="snap-l">Confirmed</span></div>
          <div class="snap snap-events"><span class="snap-v">${App.state.events.filter(e => e.includeInProjection).length}</span><span class="snap-l">Events</span></div>
          <div class="snap snap-horizon"><span class="snap-v">${effectiveHorizonDays(App.state)}d</span><span class="snap-l">Horizon</span></div>
          <div class="snap snap-buffer"><span class="snap-v">${formatCompactCurrency(App.state.settings.minimumCashBuffer)}</span><span class="snap-l">Buffer</span></div>
          <div class="snap snap-bonus"><span class="snap-v">${formatCompactCurrency(expectedBonusTotal)}</span><span class="snap-l">Bonus pool</span></div>
        </div>
      </aside>
    </div>
  `;
}

function statCard(label, value, meta = '', variant = '', action = null) {
  // When `action` is provided, the card becomes a clickable navigation
  // surface. data-action routes through onClick(); role/tabindex make it
  // keyboard-accessible. CSS in `.stat-card[data-action]` adds the
  // pointer + hover-lift affordance.
  const navAttrs = action
    ? `data-action="${action}" role="button" tabindex="0"`
    : '';
  return `
    <div class="stat-card" ${navAttrs}>
      <div class="stat-label">${label}</div>
      <div class="stat-value ${variant}">${value}</div>
      ${meta ? `<div class="stat-meta">${meta}</div>` : ''}
    </div>
  `;
}

/* Reminder feed: a stable, machine-readable snapshot of every actionable
   date in the planner. Emitted into App.state._feed on every save so the
   same JSON the cloud Sync writes to GitHub Gist also carries the feed.
   An iOS Shortcut (Personal Automation, daily) reads the Gist, parses
   `_feed.items[]`, and merges into Reminders.app — preserving any user-
   added notes/alarms/completion via per-item stable `id`s.

   Each item has:
     id       — stable across syncs (composed of offer/event id + kind)
     title    — what shows up as the Reminder title
     dueDate  — ISO 8601 with explicit time (09:00 local), so iOS parses
                it as a date+time alarm rather than an all-day reminder
     kind     — semantic tag the Shortcut can route on (list, list color)
     notes    — short context for the Reminder body (planner-owned; the
                Shortcut should NOT overwrite a user's added notes — see
                SHORTCUT_SETUP.md for the merge logic)
*/
function computeReminderFeed(state) {
  const items = [];
  const stamp = (d) => (d && /^\d{4}-\d{2}-\d{2}/.test(d)) ? (d.slice(0, 10) + 'T09:00:00') : null;

  for (const o of state.offers || []) {
    if (!o.id) continue;
    if (o.status === 'completed' || o.status === 'skipped') continue;
    if (!offerIsActiveForProjection(o)) continue;
    const name = `${o.bankName}${o.offerName ? ' — ' + o.offerName : ''}`;

    if (o.offerExpirationDate) {
      const due = stamp(o.offerExpirationDate);
      if (due) items.push({
        id: `yv-offer-${o.id}-expires`,
        title: `${name} — offer expires`,
        dueDate: due,
        kind: 'offer-expires',
        notes: `Bonus ${formatCompactCurrency(o.signupBonusAmount)}; required funding ${formatCompactCurrency(o.requiredFundingAmount)}.`
      });
    }

    const dd = depositDeadline(o);
    if (dd && (o.status === 'applied' || o.status === 'selected' || o.status === 'prospect')) {
      const due = stamp(dd);
      if (due) items.push({
        id: `yv-offer-${o.id}-deposit`,
        title: `${name} — fund ${formatCompactCurrency(o.requiredFundingAmount)}`,
        dueDate: due,
        kind: 'deposit-deadline',
        notes: `Deposit by this date to qualify for the ${formatCompactCurrency(o.signupBonusAmount)} bonus.`
      });
    }

    const we = withdrawalEligibleDate(o);
    if (we && (o.status === 'funded' || o.status === 'applied')) {
      const due = stamp(we);
      if (due) items.push({
        id: `yv-offer-${o.id}-withdraw`,
        title: `${name} — withdraw ${formatCompactCurrency(o.requiredFundingAmount)}`,
        dueDate: due,
        kind: 'withdrawal',
        notes: `Funds released; bonus ${formatCompactCurrency(o.signupBonusAmount)}.`
      });
    }
  }

  for (const c of state.commitments || []) {
    if (!c.id) continue;
    if (c.status === 'cancelled' || c.status === 'completed') continue;
    if (c.endDate) {
      const due = stamp(c.endDate);
      if (due) items.push({
        id: `yv-cmt-${c.id}-end`,
        title: `${c.commitmentName} — release`,
        dueDate: due,
        kind: 'commitment-end',
        notes: `${formatCurrency(c.amount)} (${c.type}).`
      });
    }
  }

  for (const e of state.events || []) {
    if (!e.id) continue;
    if (!e.includeInProjection) continue;
    if (e.date) {
      const due = stamp(e.date);
      if (due) items.push({
        id: `yv-evt-${e.id}`,
        title: e.eventName,
        dueDate: due,
        kind: Number(e.amount) >= 0 ? 'inflow' : 'outflow',
        notes: `${formatCurrency(e.amount)}${e.category ? ' (' + e.category + ')' : ''}.`
      });
    }
  }

  items.sort((a, b) => a.dueDate.localeCompare(b.dueDate));
  return {
    schema: 1,
    generatedAt: new Date().toISOString(),
    horizonDays: effectiveHorizonDays(state),
    items
  };
}

function computeUpcomingActions(state, limit = 12) {
  const horizonEnd = addDays(TODAY, 90);
  const items = [];
  for (const o of state.offers) {
    if (o.status === 'completed' || o.status === 'skipped') continue;
    if (o.offerExpirationDate) {
      const d = parseDate(o.offerExpirationDate);
      if (d && d >= TODAY && d <= horizonEnd) {
        items.push({ date: d, kind: 'Offer expires', name: `${o.bankName}${o.offerName ? ' — ' + o.offerName : ''}`, sub: `${formatCompactCurrency(o.signupBonusAmount)} bonus`, tag: 'warn' });
      }
    }
    const dd = depositDeadline(o);
    if (dd) {
      const d = parseDate(dd);
      if (d && d >= TODAY && d <= horizonEnd && (o.status === 'applied' || o.status === 'selected' || o.status === 'prospect')) {
        items.push({ date: d, kind: 'Deposit deadline', name: `${o.bankName}${o.offerName ? ' — ' + o.offerName : ''}`, sub: `Fund ${formatCompactCurrency(o.requiredFundingAmount)}`, tag: 'danger' });
      }
    }
    const we = withdrawalEligibleDate(o);
    if (we && (o.status === 'funded' || o.status === 'applied')) {
      const d = parseDate(we);
      if (d && d >= TODAY && d <= horizonEnd) {
        items.push({ date: d, kind: 'Withdrawal', name: `${o.bankName}${o.offerName ? ' — ' + o.offerName : ''}`, sub: `Release ${formatCompactCurrency(o.requiredFundingAmount)}`, tag: 'success' });
      }
    }
  }
  for (const c of state.commitments) {
    if (c.status === 'cancelled' || c.status === 'completed') continue;
    if (c.endDate) {
      const d = parseDate(c.endDate);
      if (d && d >= TODAY && d <= horizonEnd) {
        items.push({ date: d, kind: 'Commitment release', name: c.commitmentName, sub: formatCompactCurrency(c.amount), tag: 'success' });
      }
    }
  }
  for (const e of state.events) {
    if (!e.includeInProjection) continue;
    const d = parseDate(e.date);
    if (d && d >= TODAY && d <= horizonEnd) {
      items.push({ date: d, kind: e.amount >= 0 ? 'Inflow' : 'Outflow', name: e.eventName, sub: formatCurrency(e.amount), tag: e.amount >= 0 ? 'success' : '' });
    }
  }
  items.sort((a, b) => a.date - b.date);
  return items.slice(0, limit);
}

/* Targeted update for the Upcoming-Actions pager. A full render() would
   rebuild every section on the overview page, which (a) burns work and
   (b) reflows enough surrounding DOM that the document's scroll position
   gets nudged upward when the new page has fewer rows. Swapping just the
   action-list innerHTML keeps the section height pinned (min-height in CSS)
   and the page stays exactly where the user left it. */
function updateUpcomingPage(nextPage) {
  const ACTIONS_PER_PAGE = 6;
  const all = computeUpcomingActions(App.state, 200);
  const pageCount = Math.max(1, Math.ceil(all.length / ACTIONS_PER_PAGE));
  const clamped = Math.max(0, Math.min(pageCount - 1, nextPage));
  if (clamped === App._upcomingPage) return;
  App._upcomingPage = clamped;
  const slice = all.slice(clamped * ACTIONS_PER_PAGE, (clamped + 1) * ACTIONS_PER_PAGE);
  const list = document.querySelector('.action-list');
  if (list) {
    list.innerHTML = slice.map(renderActionRow).join('');
    // Re-trigger the fade-in animation for the new page
    list.classList.remove('upcoming-fade');
    void list.offsetWidth; // force reflow so the animation restarts
    list.classList.add('upcoming-fade');
    list.setAttribute('key', clamped);
  }
  // Update pager controls in place
  const pager = document.querySelector('.upcoming-pager');
  if (pager) {
    const prev = pager.querySelector('[data-action="upcoming-prev"]');
    const next = pager.querySelector('[data-action="upcoming-next"]');
    const label = pager.querySelector('.upcoming-pg-label');
    if (prev) prev.toggleAttribute('disabled', clamped === 0);
    if (next) next.toggleAttribute('disabled', clamped === pageCount - 1);
    if (label) label.textContent = `${clamped + 1} / ${pageCount}`;
  }
}

function renderActionRow(item) {
  const month = item.date.toLocaleDateString('en-US', { month: 'short' }).toUpperCase();
  const day = item.date.getDate();
  return `
    <div class="action-row">
      <div class="action-day">
        <span class="month">${month}</span>
        <span class="day">${day}</span>
      </div>
      <div class="action-body">
        <div class="action-title">${escapeHtml(item.name)}</div>
        <div class="action-sub">${escapeHtml(item.sub)} · ${relativeDays(item.date)}</div>
      </div>
      <span class="action-tag ${item.tag || ''}">${escapeHtml(item.kind)}</span>
    </div>
  `;
}

function renderPlanner() {
  const offers = App.state.offers
    .filter(o => o.status !== 'completed' && o.status !== 'skipped')
    .slice()
    .sort((a, b) => {
      const ar = annualizedReturn(a) ?? 0;
      const br = annualizedReturn(b) ?? 0;
      return br - ar;
    });

  const proj = generateProjection(App.state);
  const summary = summarizeProjection(proj, App.state.settings);
  const includedCount = offers.filter(o => offerIsActiveForProjection(o)).length;
  const includedBonus = offers.filter(o => offerIsActiveForProjection(o)).reduce((s, o) => s + (o.signupBonusAmount || 0), 0);

  const candidates = offers.filter(o => HYPOTHETICAL_OFFER_STATUSES.has(o.status) && isOfferComplete(o));

  const optResult = App.optimizer.results;

  return `
    <div class="section-header">
      <div>

      </div>
      <div style="display:flex;gap:var(--space-2);">

      </div>
    </div>

    <div class="optimizer-bar">
      <div class="optimizer-summary">
        <div class="metric">
          <span class="label">Selected</span>
          <span class="value">${includedCount} <span style="font-size:13px;color:var(--text-tertiary);font-weight:500;">of ${offers.length}</span></span>
        </div>
        <div class="metric">
          <span class="label">Expected bonus</span>

        </div>

        </div>

        </div>
      </div>

          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg>
          Find feasible combinations
        </button>
        ${optResult ? `<button class="btn btn-ghost btn-sm" data-action="clear-optimizer">Clear results</button>` : ''}
      </div>
    </div>

    ${optResult ? renderOptimizerResults(optResult) : ''}

    ${offers.length === 0

function renderOptimizerResults(result) {
  if (result.tooMany) {
    return `
      <div class="banner warn">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="9"/><line x1="12" y1="8" x2="12" y2="13"/><line x1="12" y1="17" x2="12" y2="17.01"/></svg>
        <div>
          <strong>Too many candidates for brute force:</strong> ${result.candidateCount} offers (limit ${result.max}). Mark some offers as "skipped" or convert them to commitments first, or raise the limit in Settings.
        </div>
      </div>
    `;
  }
  if (result.results.length === 0) {
    return `
      <div class="banner danger">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="9"/><line x1="12" y1="8" x2="12" y2="13"/><line x1="12" y1="17" x2="12" y2="17.01"/></svg>
        <div>
          <strong>No feasible combinations.</strong> Of ${result.evaluated} subsets evaluated, all ${result.infeasibleCount} would breach your buffer or go negative. Try raising your liquid capital, lowering your buffer floor, or removing high-capital offers.
        </div>
      </div>
    `;
  }
  // Compute which combo (if any) matches the user's current includeInScenario state.
  const currentMask = currentlyAppliedComboMask(result.candidates);
  return `
    <section class="card" style="margin-bottom:var(--space-5);">
      <div class="card-header">
        <h2>Top feasible combinations</h2>
        <span style="font-size:12px;color:var(--text-tertiary);">Evaluated ${result.evaluated.toLocaleString()} subsets · ${result.infeasibleCount} infeasible · click a combo to apply it</span>
      </div>
      <div class="combo-grid">
        ${result.results.map((r, i) => renderComboCard(r, i, result.candidates, currentMask)).join('')}
      </div>
      <p style="margin-top:var(--space-3);font-size:12px;color:var(--text-tertiary);">Only combinations that never dip below your buffer are shown. Ranking: highest total bonus → highest blended APY → highest lowest-available cash. <strong>Low cash</strong> is how thin you'd run at the worst point.</p>
    </section>
  `;
}

function currentlyAppliedComboMask(candidates) {
  let mask = 0;
  for (let i = 0; i < candidates.length; i++) {
    const o = App.state.offers.find(x => x.id === candidates[i].id);
    if (o && o.includeInScenario) mask |= (1 << i);
  }
  return mask;
}

function renderComboCard(r, rank, candidates, currentMask) {
  const offers = r.includedIds.map(id => candidates.find(o => o.id === id)).filter(Boolean);
  const isSelected = r.mask === currentMask;
  return `
    <div class="combo-card ${isSelected ? 'selected' : ''}" data-action="apply-combo" data-mask="${r.mask}" role="button" tabindex="0">
      <div class="combo-header">
        <div>
          <div class="combo-rank">#${rank + 1}${rank === 0 ? ' · <span class="recommended-tag">Recommended</span>' : ''}${isSelected ? ' · <span style="color:var(--accent);">Applied</span>' : ''}</div>
          <div class="combo-bonus">${formatCurrency(r.totalBonus)}</div>
        </div>
      </div>
      <div class="combo-meta">
        <span><strong>${formatCompactCurrency(r.totalRequired)}</strong> capital</span>
        <span><strong>${formatCompactCurrency(r.lowestAvailable)}</strong> low cash</span>
        ${r.blendedAnnReturn != null ? `<span><strong>${formatPercent(r.blendedAnnReturn)}</strong> APY blended</span>` : ''}
        ${r.belowBufferDays > 0 ? `<span style="color:#b45309;">${r.belowBufferDays}d below buffer</span>` : ''}
      </div>
      <div class="combo-offers">
        ${offers.map(o => `
          <div class="combo-offer">
            <span class="name">${escapeHtml(o.bankName)}${o.offerName ? ' · ' + escapeHtml(o.offerName) : ''}</span>

          </div>
        `).join('')}
      </div>
    </div>
  `;
}

/* ============================================================
   TIMELINE VIEW
   ============================================================ */
function renderTimeline() {
  const settings = App.state.settings;
  const start = parseDate(settings.projectionStartDate) || TODAY;
  const horizon = effectiveHorizonDays(App.state);
  const end = addDays(start, horizon);

  // Collect "rows" — manual commitments + virtual offer commitments
  const rows = [];
  const offerWithCommitment = new Set();
  for (const c of App.state.commitments) {
    if (c.sourceBonusOfferId) offerWithCommitment.add(c.sourceBonusOfferId);
    if (!App.filters.timelineShowCancelled && c.status === 'cancelled') continue;
    if (!App.filters.timelineShowCompleted && c.status === 'completed') continue;
    rows.push({
      id: c.id,
      label: c.commitmentName,
      sub: `${formatCurrency(c.amount)} · ${c.type}`,
      start: parseDate(c.startDate),
      end: parseDate(c.endDate),
      status: c.status,
      isVirtual: false
    });
  }
  for (const o of App.state.offers) {
    if (offerWithCommitment.has(o.id)) continue;
    if (!isOfferComplete(o)) continue;
    if (!offerIsActiveForProjection(o) && o.status !== 'completed') continue;
    if (o.status === 'completed' && !App.filters.timelineShowCompleted) continue;
    if (o.status === 'skipped') continue;
    const sStart = parseDate(lockStartDate(o));
    const sEnd = parseDate(withdrawalEligibleDate(o));
    if (!sStart || !sEnd) continue;
    rows.push({
      id: o.id,
      label: `${o.bankName}${o.offerName ? ' — ' + o.offerName : ''}`,
      sub: `${formatCurrency(o.requiredFundingAmount)} · ${STATUS_LABELS[o.status] || o.status}`,
      start: sStart,
      end: sEnd,
      status: CONFIRMED_OFFER_STATUSES.has(o.status) ? 'confirmed' : (o.status === 'completed' ? 'completed' : 'hypothetical'),
      isVirtual: true
    });
  }
  rows.sort((a, b) => (a.start || 0) - (b.start || 0));

  // Compute shortfall bands
  const proj = generateProjection(App.state);
  const shortfallBands = [];
  let bandStart = null;
  for (let i = 0; i < proj.length; i++) {
    const d = proj[i];
    if (d.shortfall && bandStart === null) bandStart = i;
    if ((!d.shortfall || i === proj.length - 1) && bandStart !== null) {
      shortfallBands.push({ from: bandStart, to: d.shortfall ? i + 1 : i });
      bandStart = null;
    }
  }

  // Generate axis ticks (one per month within horizon)
  const ticks = [];
  let cursor = new Date(start.getFullYear(), start.getMonth(), 1);
  if (cursor < start) cursor = new Date(start.getFullYear(), start.getMonth() + 1, 1);
  while (cursor < end) {
    ticks.push({
      pct: ((cursor - start) / (end - start)) * 100,
      label: cursor.toLocaleDateString('en-US', { month: 'short', year: cursor.getFullYear() !== TODAY.getFullYear() ? '2-digit' : undefined })
    });
    cursor = new Date(cursor.getFullYear(), cursor.getMonth() + 1, 1);
  }

  const totalDays = horizon;
  function pctFor(d) {
    if (!d) return null;
    const days = (d - start) / 86400000;
    return Math.max(0, Math.min(100, (days / totalDays) * 100));
  }

  const todayPct = (TODAY >= start && TODAY < end) ? pctFor(TODAY) : null;

  return `
    <div class="section-header">
      <div>
        <h2>Timeline</h2>
        <p>Capital commitments over the next ${horizon} days. Confirmed bars are solid, hypothetical bars are dashed.</p>
      </div>
      <div style="display:flex;gap:var(--space-3);align-items:center;flex-wrap:wrap;">
        <label class="checkbox-row">
          <input type="checkbox" data-action="toggle-filter" data-filter="timelineShowCompleted" ${App.filters.timelineShowCompleted ? 'checked' : ''} />
          <span style="font-size:13px;color:var(--text-secondary);">Show completed</span>
        </label>
        <label class="checkbox-row">
          <input type="checkbox" data-action="toggle-filter" data-filter="timelineShowCancelled" ${App.filters.timelineShowCancelled ? 'checked' : ''} />
          <span style="font-size:13px;color:var(--text-secondary);">Show cancelled</span>
        </label>
      </div>
    </div>

    ${rows.length === 0
      ? renderEmptyState('No commitments to plot', 'When you add offers or capital commitments, they will appear here as horizontal bars across time.')
      : (() => {
          const validRows = rows.filter(r => {
            const sPct = pctFor(r.start);
            const ePct = pctFor(r.end);
            return sPct != null && ePct != null && ePct > sPct;
          });
          const labelHtml = validRows.map(r => `
            <div class="timeline-row-label">
              <span style="overflow:hidden;text-overflow:ellipsis;white-space:nowrap;">${escapeHtml(r.label)}</span>
              <span class="sub">${escapeHtml(r.sub)}</span>
            </div>
          `).join('');
          const trackHtml = validRows.map(r => {
            const sPct = pctFor(r.start);
            const ePct = pctFor(r.end);
            const w = ePct - sPct;
            return `
              <div class="timeline-row-track">
                ${ticks.map(t => `<div class="tl-grid-line" style="left:${t.pct}%;"></div>`).join('')}
                ${shortfallBands.map(b => {
                  const left = (b.from / totalDays) * 100;
                  const right = (b.to / totalDays) * 100;
                  return `<div class="tl-shortfall-band" style="left:${left}%;right:${100 - right}%;"></div>`;
                }).join('')}
                <div class="tl-bar ${r.status}" style="left:${sPct}%;width:${w}%;" title="${escapeHtml(r.label)}: ${formatDateMedium(r.start)} → ${formatDateMedium(r.end)}">
                  ${w > 8 ? formatCompactCurrency((function(){ if (r.isVirtual) { const o = App.state.offers.find(x=>x.id===r.id); return o ? o.requiredFundingAmount : 0; } const c = App.state.commitments.find(x=>x.id===r.id); return c ? c.amount : 0; })()) : ''}
                </div>
                ${todayPct != null ? `<div class="tl-today" style="left:${todayPct}%;"></div>` : ''}
              </div>
            `;
          }).join('');
          return `
            <div class="timeline-wrap">
              <div class="timeline-labels-col">
                <div class="timeline-row-label axis">${formatDateShort(start)} → ${formatDateShort(end)}</div>
                ${labelHtml}
              </div>
              <div class="timeline-tracks-scroll">
                <div class="timeline-tracks-col">
                  <div class="timeline-row-track axis">
                    <div class="tl-axis">
                      ${ticks.map(t => `<span class="tl-axis-tick" style="left:${t.pct}%;">${t.label}</span>`).join('')}
                      ${todayPct != null ? `<div class="tl-today" style="left:${todayPct}%;"></div>` : ''}
                    </div>
                  </div>
                  ${trackHtml}
                </div>
              </div>
            </div>

            <div class="chart-legend" style="margin-top:var(--space-4);">
              <span class="chart-legend-item"><span class="legend-swatch" style="background:rgba(91,92,246,0.2);border:1.5px solid var(--accent);"></span> Confirmed</span>
              <span class="chart-legend-item"><span class="legend-swatch" style="background:repeating-linear-gradient(45deg,rgba(91,92,246,0.10),rgba(91,92,246,0.10) 4px,rgba(91,92,246,0.18) 4px,rgba(91,92,246,0.18) 8px);border:1.5px dashed var(--accent);"></span> Hypothetical</span>
              <span class="chart-legend-item"><span class="legend-swatch" style="background:var(--bg);border:1.5px solid var(--border-strong);"></span> Completed</span>
              <span class="chart-legend-item"><span class="legend-swatch" style="background:rgba(232,113,113,0.22);"></span> Shortfall day</span>
            </div>
          `;
        })()
      }
  `;
}

/* ============================================================
   OFFERS VIEW
   ============================================================ */
function renderOffers() {
  const all = App.state.offers.slice();
  const filtered = all.filter(o => {
    // 'included' is a synthetic status used by the "Selected bonuses" stat-
    // card click-through — it filters to offers that are currently part of
    // the projection (confirmed status OR scenario flag), spanning multiple
    // raw status values. Anything else is a literal status match.
    if (App.filters.offersStatus === 'included') {
      if (!offerIsActiveForProjection(o)) return false;
    } else if (App.filters.offersStatus !== 'all' && o.status !== App.filters.offersStatus) {
      return false;
    }
    if (App.filters.offersSearch) {
      const q = App.filters.offersSearch.toLowerCase();
      if (!(o.bankName + ' ' + (o.offerName || '') + ' ' + (o.notes || '')).toLowerCase().includes(q)) return false;
    }
    return true;
  });

  const advanced = App.filters.offersAdvanced;

  return `
    <div class="section-header">
      <div>
        <h2>Offers</h2>
        <p>${all.length} total · ${all.filter(o => isOfferComplete(o)).length} complete · ${all.filter(o => !isOfferComplete(o)).length} drafts</p>
      </div>
      <div style="display:flex;gap:var(--space-2);">
        <button class="btn btn-secondary" data-action="toggle-advanced">${advanced ? 'Card view' : 'Table view'}</button>
        <button class="btn btn-primary" data-action="add-offer">+ Add offer</button>
      </div>
    </div>

    <div class="toolbar">
      <input id="offers-search-input" type="search" class="input" placeholder="Search offers..." style="max-width:280px;" data-action="offers-search" value="${escapeAttr(App.filters.offersSearch)}" autocomplete="off" />
      <select class="select" style="max-width:200px;" data-action="offers-status">
        <option value="all" ${App.filters.offersStatus === 'all' ? 'selected' : ''}>All statuses</option>
        <option value="included" ${App.filters.offersStatus === 'included' ? 'selected' : ''}>Included in projection</option>
        ${STATUSES.map(s => `<option value="${s}" ${App.filters.offersStatus === s ? 'selected' : ''}>${STATUS_LABELS[s]}</option>`).join('')}
      </select>
    </div>

    ${filtered.length === 0
      ? renderEmptyState(all.length === 0 ? 'No offers yet' : 'No offers match', all.length === 0 ? 'Add your first bank bonus to start planning.' : 'Try changing the filter or search query.', all.length === 0 ? 'add-offer' : null, all.length === 0 ? 'Add an offer' : null)
      : (advanced ? renderOffersTable(filtered) : `<div class="planner-grid">${filtered.map(renderOfferCardWithActions).join('')}</div>`)
    }
  `;
}

function renderOfferCardWithActions(o) {
  const card = renderOfferCard(o);
  const actions = `
    <div class="offer-actions" style="margin-top:var(--space-3);padding-top:var(--space-3);border-top:1px solid var(--border-soft);">
      <button class="btn btn-ghost btn-sm" data-action="edit-offer" data-id="${o.id}">Edit</button>
      <button class="btn btn-ghost btn-sm" data-action="duplicate-offer" data-id="${o.id}">Duplicate</button>
      <button class="btn btn-ghost btn-sm" data-action="convert-offer" data-id="${o.id}">Convert</button>
      <select class="select" style="height:30px;padding:4px 8px;font-size:12px;width:auto;flex:1;min-width:120px;" data-action="change-status" data-id="${o.id}">
        ${STATUSES.map(s => `<option value="${s}" ${o.status === s ? 'selected' : ''}>${STATUS_LABELS[s]}</option>`).join('')}
      </select>
      <button class="btn btn-ghost btn-sm btn-danger" data-action="delete-offer" data-id="${o.id}" aria-label="Delete">×</button>
    </div>
  `;
  // Insert actions inside the offer-card, just before its closing tag.
  const lastIdx = card.lastIndexOf('</div>');
  return card.slice(0, lastIdx) + actions + card.slice(lastIdx);
}

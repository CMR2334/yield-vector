<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#5b5cf6">
<title>Yield Vector</title>
<!-- iOS PWA: lets the page launch full-screen when added to Home Screen -->
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Yield Vector">
<meta name="mobile-web-app-capable" content="yes">
<meta name="format-detection" content="telephone=no">
<!-- Icon + manifest hrefs are set at runtime via canvas-generated PNG -->
<link rel="apple-touch-icon" id="apple-icon" href="">
<link rel="icon" id="favicon" href="">
<link rel="manifest" id="manifest" href="">
<style>
/* ============================================================
   DESIGN TOKENS
   ============================================================ */
:root {
  --bg: #f5f5f7;
  --bg-elevated: #ffffff;
  --card: #ffffff;
  --card-soft: #fafafc;

  --text: #2a2e3d;
  /* Round 58: dedicated "body-strong" tone for input VALUE text — one shade
     lighter than --text so values (the primary data) read as distinct from
     heading-weight --text while staying unmistakably darker than every
     label tone below. No existing token sat between --text and
     --text-secondary, so this is a deliberate addition, not a --text swap
     (card titles/modal titles/stat-values keep using --text, untouched). */
  --text-strong: #374151;
  --text-secondary: #5b6374;
  --text-tertiary: #9099a8;
  --text-inverse: #ffffff;

  --accent: #5b5cf6;
  --accent-hover: #4f50e0;
  --accent-soft: #eef0fe;
  --accent-mid: #c8c9fa;
  --accent-strong: #3f40c4;

  --warning: #f59e0b;
  --warning-soft: #fff5e0;
  /* Lightened red — matches .stat-value.danger and .action-tag.danger so
     every red in the UI reads as the same softer shade. */
  --danger: #e87171;
  --danger-soft: #fee5e5;
  --success: #10b981;
  --success-soft: #d6f5e7;

  --border: #e5e7eb;
  --border-soft: #eef0f2;
  --border-strong: #d1d5db;

  --radius-sm: 8px;
  --radius-md: 12px;
  --radius-lg: 16px;
  --radius-xl: 20px;
  --radius-pill: 999px;

  --space-1: 4px;
  --space-2: 8px;
  --space-3: 12px;
  --space-4: 16px;
  --space-5: 20px;
  --space-6: 24px;
  --space-7: 28px;
  --space-8: 32px;
  --space-10: 40px;
  --space-12: 48px;
  --space-16: 64px;

  --shadow-sm: 0 1px 2px rgba(15, 23, 42, 0.04);
  --shadow-card: 0 1px 3px rgba(15, 23, 42, 0.04), 0 4px 16px rgba(15, 23, 42, 0.05);
  --shadow-card-hover: 0 1px 3px rgba(15, 23, 42, 0.06), 0 12px 28px rgba(15, 23, 42, 0.08);
  --shadow-modal: 0 24px 64px rgba(15, 23, 42, 0.18);
  --shadow-fab: 0 8px 24px rgba(91, 92, 246, 0.35);

  --font-sans: -apple-system, BlinkMacSystemFont, 'SF Pro Display', 'SF Pro Text', 'Segoe UI', Roboto, 'Helvetica Neue', sans-serif;
  --font-mono: 'SF Mono', 'Menlo', 'Monaco', 'Consolas', monospace;

  --header-height: 56px;
  --bottom-nav-height: 46px;
  --content-max-width: 1280px;
}

/* (BrokenDollar @font-face removed — the substitute fonts rendered the $
   glyph taller than SF Pro's digits, so amounts looked uneven. SF Pro's
   default $ has a continuous vertical line, but its cap-height matches
   the digits exactly.) */

/* ============================================================
   RESET & BASE
   ============================================================ */
* { box-sizing: border-box; margin: 0; padding: 0; }

html { -webkit-text-size-adjust: 100%; }

body {
  font-family: var(--font-sans);
  font-size: 15px;
  line-height: 1.5;
  color: var(--text);
  background: var(--bg);
  -webkit-font-smoothing: antialiased;
  -moz-osx-font-smoothing: grayscale;
  font-feature-settings: 'tnum' 1, 'cv11' 1;
  min-height: 100vh;
  overflow-x: hidden;
}

button { font: inherit; color: inherit; background: none; border: none; cursor: pointer; }
input, select, textarea { font: inherit; color: inherit; }
ul, ol { list-style: none; }
a { color: inherit; text-decoration: none; }

/* ============================================================
   LAYOUT
   ============================================================ */
.app-shell {
  display: flex;
  flex-direction: column;
  min-height: 100vh;
}

.app-header {
  position: sticky;
  top: 0;
  z-index: 30;
  display: flex;
  align-items: center;
  gap: var(--space-6);
  height: var(--header-height);
  padding: 0 var(--space-6);
  background: rgba(245, 245, 247, 0.85);
  backdrop-filter: saturate(1.6) blur(14px);
  -webkit-backdrop-filter: saturate(1.6) blur(14px);
  border-bottom: 1px solid var(--border-soft);
}

.brand {
  display: inline-flex;
  align-items: center;
  gap: 8px;
}

.brand-flourish {
  flex-shrink: 0;
  display: block;
}

.brand-name {
  /* Hold the deep indigo across most of "Yield" and only let the lift bloom
     during "Vector" — sharper diagonal, late stops. */
  background: linear-gradient(115deg, #312e81 0%, #4338ca 58%, #5b4fd8 78%, #7c5fef 92%, #a78bfa 100%);
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
  background-clip: text;
  /* Apple-system text feel: SF Pro Display via the existing font stack,
     semibold (600) instead of bold (700), slightly looser tracking. */
  font-family: 'SF Pro Display', 'SF Pro Text', -apple-system, BlinkMacSystemFont, var(--font-sans);
  font-weight: 600;
  font-size: 17px;
  letter-spacing: -0.018em;
  line-height: 1;
}

.primary-nav {
  display: flex;
  gap: var(--space-1);
  margin-left: var(--space-6);
}

.nav-btn {
  padding: 8px 14px;
  border-radius: var(--radius-pill);
  font-size: 14px;
  font-weight: 500;
  color: var(--text-secondary);
  transition: background 0.15s, color 0.15s;
  display: inline-flex;
  align-items: center;
  gap: 6px;
}

.nav-btn:hover { color: var(--text); background: var(--accent-soft); }
.nav-btn.active { color: var(--accent); background: var(--accent-soft); font-weight: 600; }

.header-trailing {
  margin-left: auto;
  display: flex;
  gap: var(--space-3);
  align-items: center;
}
.header-actions {
  display: flex;
  gap: var(--space-2);
  align-items: center;
}

/* Overview unified grid: all 5 cells share the same 3-column track so
   the right edge of Upcoming actions and Selected bonuses align exactly.
   Stat cards occupy cols 1-3 naturally; Upcoming spans cols 1-2;
   At-a-glance sits in col 3. */
.overview-grid {
  display: grid;
  grid-template-columns: repeat(3, minmax(0, 1fr));
  gap: var(--space-4);
  align-items: start;
}
.overview-main { grid-column: span 2; }
@media (max-width: 720px) {
  /* Stat cards stay 3-per-row; Upcoming and At-a-glance span full width */
  .overview-main  { grid-column: 1 / -1; }
  .overview-aside { grid-column: 1 / -1; }
}
@media (max-width: 480px) {
  .overview-grid  { grid-template-columns: 1fr; }
  .overview-main  { grid-column: auto; }
  .overview-aside { grid-column: auto; }
}

.snapshot-card {
  padding: var(--space-5);
  background: var(--card);
  border: 1px solid var(--border-soft);
  box-shadow: var(--shadow-card);
}
.snapshot-title {
  font-size: 12px;
  font-weight: 600;
  text-transform: uppercase;
  letter-spacing: 0.02em;
  color: var(--text-tertiary);
  margin-bottom: var(--space-4);
  display: flex;
  align-items: center;
  gap: 6px;
}
.snapshot-title::after {
  content: '';
  flex: 1;
  height: 1px;
  background: var(--border-soft);
}
.snapshot-grid {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: var(--space-3);
}
/* Each stat cell: subtle left accent stripe (color-coded per stat),
   value above label, slightly more padding, and a hover lift so the
   panel reads as a designed dashboard component rather than a flat
   list of key/values. */
.snap {
  display: flex;
  flex-direction: column-reverse;  /* value on top, label below */
  gap: 2px;
  padding: var(--space-3) var(--space-3) var(--space-3) calc(var(--space-3) + 4px);
  background: var(--card-soft);
  border-radius: var(--radius-md);
  border: 1px solid var(--border-soft);
  position: relative;
  overflow: hidden;
  transition: background 0.12s, transform 0.12s;
}
.snap::before {
  content: '';
  position: absolute;
  left: 0; top: 8px; bottom: 8px;
  width: 3px;
  border-radius: 2px;
  background: var(--accent-mid);
}
.snap.snap-active::before  { background: #7c5fef; }
.snap.snap-actions::before { background: #e87171; }
.snap.snap-confirmed::before { background: #10b981; }
.snap.snap-events::before    { background: #f59e0b; }
.snap.snap-horizon::before   { background: #6b7280; }
.snap.snap-buffer::before    { background: #d97706; }
.snap.snap-bonus::before     { background: #10b981; }
.snap-l {
  font-size: 11px;
  color: var(--text-tertiary);
  font-weight: 600;
  text-transform: uppercase;
  letter-spacing: 0.02em;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}
.snap-v {
  font-size: 19px;
  font-weight: 700;
  letter-spacing: -0.015em;
  color: var(--text);
  font-feature-settings: 'tnum' 1;
  line-height: 1.1;
}
.snap.snap-bonus .snap-v { color: var(--success); }
/* R62: un-abbreviated money values (e.g. Bonus pool now shows the full
   "$12,450" instead of "$12K") can run long in a half-width snap cell.
   Step the font down one notch for long strings (≥8 glyphs, i.e. 6-digit
   dollar amounts and up) so the full number fits without resizing the
   card. Applied via a length-conditional class set at render time. */
.snap-v.snap-v-sm { font-size: 16px; letter-spacing: -0.02em; }

/* Sync indicator chip in the header — flatter & lighter than a pill:
   rounded-square radius, no shadow, very-light translucent background,
   no border. Sits unobtrusively at top-right while still readable. */
.sync-indicator {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  padding: 5px 10px;
  border-radius: 8px;
  font-size: 12px;
  font-weight: 500;
  cursor: pointer;
  background: rgba(13, 20, 33, 0.04);
  color: var(--text-tertiary);
  border: none;
  box-shadow: none;
  transition: background 0.15s, color 0.15s;
  white-space: nowrap;
}
.sync-indicator:hover { background: rgba(13, 20, 33, 0.07); color: var(--text-secondary); }
.sync-dot {
  width: 7px; height: 7px;
  border-radius: 50%;
  background: var(--text-tertiary);
  flex-shrink: 0;
  /* No halo box-shadow — flat single-color dot. */
}
.sync-indicator[data-status="synced"] .sync-dot { background: var(--success); }
.sync-indicator[data-status="syncing"] .sync-dot { background: var(--warning); animation: sync-pulse 1.1s ease-in-out infinite; }
.sync-indicator[data-status="pending"] .sync-dot { background: var(--warning); }
.sync-indicator[data-status="error"] .sync-dot { background: var(--danger); }
.sync-indicator[data-status="unconfigured"] .sync-dot { background: var(--text-tertiary); }
.sync-indicator[data-status="error"] { color: var(--danger); background: rgba(232, 113, 113, 0.08); }

@keyframes sync-pulse {
  0%, 100% { opacity: 1; transform: scale(1); }
  50% { opacity: 0.5; transform: scale(0.85); }
}

@media (max-width: 480px) {
  .sync-indicator .sync-text { display: none; }
  .sync-indicator { padding: 8px; }
}

.app-main {
  flex: 1;
  padding: var(--space-8) var(--space-6) var(--space-12);
  max-width: var(--content-max-width);
  width: 100%;
  margin: 0 auto;
}

/* Mobile bottom nav */
.mobile-nav {
  display: none;
  position: fixed;
  bottom: 0;
  left: 0;
  right: 0;
  /* Height must grow to include safe-area-inset-bottom so padding
     doesn't eat into the content area (border-box accounting). */
  height: calc(var(--bottom-nav-height) + env(safe-area-inset-bottom, 0px));
  background: rgba(255, 255, 255, 0.95);
  backdrop-filter: saturate(1.6) blur(14px);
  border-top: 1px solid var(--border-soft);
  padding: 8px 4px calc(3px + env(safe-area-inset-bottom, 0px));
  z-index: 30;
  justify-content: space-around;
}

.mobile-nav .nav-btn {
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: flex-start;
  gap: 2px;
  padding: 0 8px;
  font-size: 11px;
  background: transparent;
  border-radius: var(--radius-md);
  color: var(--text-tertiary);
  font-weight: 500;
}

.mobile-nav .nav-btn.active {
  color: var(--accent);
  background: transparent;
}

.mobile-nav .nav-btn svg { width: 22px; height: 22px; stroke-width: 1.7; }

.fab {
  position: fixed;
  display: none;
  bottom: calc(var(--bottom-nav-height) + env(safe-area-inset-bottom, 0px) + 12px);
  right: 16px;
  width: 56px;
  height: 56px;
  border-radius: 50%;
  background: var(--accent);
  color: white;
  box-shadow: var(--shadow-fab);
  z-index: 25;
  align-items: center;
  justify-content: center;
  transition: transform 0.15s;
}
.fab:active { transform: scale(0.95); }

/* ============================================================
   BUTTONS
   ============================================================ */
.btn {
  display: inline-flex;
  align-items: center;
  gap: var(--space-2);
  padding: 9px 16px;
  border-radius: var(--radius-pill);
  font-size: 14px;
  font-weight: 500;
  transition: background 0.12s, color 0.12s, transform 0.05s, box-shadow 0.12s;
  white-space: nowrap;
  border: 1px solid transparent;
}
.btn:active { transform: translateY(0.5px); }

.btn-primary { background: var(--accent); color: white; }
.btn-primary:hover { background: var(--accent-hover); }

.btn-secondary { background: var(--bg-elevated); color: var(--text); border-color: var(--border); }
.btn-secondary:hover { background: var(--card-soft); border-color: var(--border-strong); }

.btn-ghost { color: var(--text-secondary); padding: 8px 12px; }
.btn-ghost:hover { background: var(--accent-soft); color: var(--accent); }

.btn-danger { color: var(--danger); }
.btn-danger:hover { background: var(--danger-soft); }

/* Outlined danger pill: for a destructive-adjacent action (e.g. "Disconnect")
   that needs to sit inside a row of bordered .btn-secondary pills without
   reading as either a primary action (solid) or a borderless ghost link
   (the plain .btn-ghost.btn-danger combo has no border, so it looked
   visually unaligned next to its bordered siblings — Round 60). Border
   uses the --danger token per the app's danger color; background stays
   transparent so it doesn't compete with the destructive-but-not-primary
   "Clear all data" / "Delete" solid-danger buttons elsewhere. */
.btn-outline-danger { background: transparent; color: var(--danger); border-color: var(--danger); }
.btn-outline-danger:hover { background: var(--danger-soft); }

.btn-sm { padding: 6px 12px; font-size: 13px; }
.btn-lg { padding: 12px 22px; font-size: 15px; }

.btn-icon {
  width: 36px; height: 36px;
  border-radius: var(--radius-md);
  padding: 0;
  display: inline-grid;
  place-items: center;
  color: var(--text-secondary);
  transition: background 0.12s, color 0.12s;
}
.btn-icon:hover { background: var(--accent-soft); color: var(--accent); }

/* ============================================================
   CARDS
   ============================================================ */
.card {
  background: var(--card);
  border-radius: var(--radius-xl);
  padding: var(--space-6);
  box-shadow: var(--shadow-card);
}

.card-soft { background: var(--card-soft); border: 1px solid var(--border-soft); box-shadow: none; }

.card-title {
  font-size: 13px;
  font-weight: 600;
  text-transform: uppercase;
  letter-spacing: 0.02em;
  color: var(--text-tertiary);
  margin-bottom: var(--space-4);
}

.card-header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: var(--space-3);
  margin-bottom: var(--space-4);
}

.card-header h2 {
  font-size: 18px;
  font-weight: 600;
  letter-spacing: -0.01em;
}

/* ============================================================
   OVERVIEW: HERO
   ============================================================ */
.hero {
  background: var(--card);
  border-radius: var(--radius-xl);
  padding: var(--space-8);
  box-shadow: var(--shadow-card);
  margin-bottom: var(--space-4);
}

.hero-numbers {
  display: flex;
  flex-direction: column;
  gap: var(--space-3);
  margin-bottom: var(--space-6);
}

/* Tile-style label — same casing/letter-spacing as the stat-card labels
   below so the hero reads as the leading tile in a coherent row. Slightly
   larger and pushed away from the dollar amount for breathing room. */
.hero-label {
  font-size: 14px;
  font-weight: 600;
  text-transform: uppercase;
  /* R62: tightened from 0.06em — the wide letterspacing pushed
     "AVAILABLE CAPITAL TODAY" apart enough to read as loose/disjointed.
     0.02em keeps it clearly an uppercase label while letting the words
     hold together. Matched on .timeline-row-label.axis for consistency. */
  letter-spacing: 0.02em;
  color: var(--text-tertiary);
  margin-bottom: var(--space-1);
  /* Allow the label to wrap so it never truncates mid-word on narrow
     viewports ("AVAILABLE CAPI..." was being cut off on phones). */
  white-space: normal;
  overflow-wrap: anywhere;
}

.hero-amount {
  /* 38 px (5% smaller than the prior 40 px), weight 600, lighter color
     (#2a3245 vs #1a2235) for less visual heft. The whole value renders
     as a single string ("$175,000") inside one <span> for the digits +
     one for the symbol — both inline with margin/padding 0 so the gap
     between $ and the first digit is exactly typographic kerning, not
     a pixel of CSS margin. Other dollar displays in the app (stat
     cells, tooltips, "Tied up today") use plain string concat
     ("$" + n.toLocaleString()), so this matches them by virtue of
     having no CSS-injected gap either. */
  font-size: 38px;
  font-weight: 600;
  letter-spacing: -0.025em;
  line-height: 1;
  color: #2a3245;
}

/* Currency symbol: same size, same weight, ZERO margin between $ and
   the first digit. Consistent with formatCurrency() / formatCompact-
   Currency() output everywhere else in the app, which produces "$X"
   as a single string with no separator. */
.hero-amount .currency-symbol {
  font-weight: inherit;
  opacity: 1;
  margin: 0;
  padding: 0;
  font-size: 1em;
  vertical-align: baseline;
  display: inline;
  letter-spacing: 0;
}
.hero-amount .currency-symbol + * { margin-left: 0; padding-left: 0; }

.hero-meta {
  font-size: 15px;
  color: var(--text-secondary);
  display: flex;
  flex-wrap: wrap;
  gap: 12px;
  align-items: center;
}

.hero-meta .pill {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  padding: 4px 10px;
  border-radius: var(--radius-pill);
  font-size: 13px;
  background: var(--accent-soft);
  color: var(--accent);
  font-weight: 500;
}
.hero-meta .pill.warn { background: var(--warning-soft); color: #b45309; }
.hero-meta .pill.danger { background: var(--danger-soft); color: var(--danger); }

/* ============================================================
   CHART
   ============================================================ */
.chart-wrap {
  position: relative;
  width: 100%;
  margin-top: var(--space-4);
}
/* The plot scrolls horizontally inside .chart-scroll; the Y-axis
   (.chart-yaxis) is a sticky sibling pinned to the left so the dollar
   labels stay frozen while the X-axis scrolls. The tooltip lives in
   .chart-wrap (overflow visible) so it is never clipped by the scroll.
   Do NOT add `-webkit-overflow-scrolling: touch` to .chart-scroll — it
   breaks horizontal `position: sticky` on iOS Safari. */
.chart-scroll {
  display: flex;
  align-items: stretch;
  overflow-x: auto;
  overflow-y: visible;
  scrollbar-width: thin;
}
.chart-yaxis {
  position: -webkit-sticky;
  position: sticky;
  left: 0;
  z-index: 2;
  flex: 0 0 36px;
  width: 36px;
  background: var(--card);
  pointer-events: none;
}
.chart-yaxis .ylab {
  position: absolute;
  right: 6px;
  transform: translateY(-50%);
  font-size: 12px;
  font-weight: 500;
  color: #9099a8;
  font-feature-settings: 'tnum' 1;
  white-space: nowrap;
}
.chart-svg { flex: 1 1 auto; min-width: 0; display: block; overflow: visible; }
.chart-svg text {
  font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Display', 'SF Pro Text', 'Segoe UI', Roboto, 'Helvetica Neue', sans-serif;
  font-feature-settings: 'tnum' 1;
  -webkit-font-smoothing: antialiased;
}

/* Mobile portrait: chart needs BOTH a min-width (so the user has
   content to scroll through) AND a horizontally-scrollable wrapper.
   Tooltip is appended to <body> in JS (Round 18) so it renders above
   the wrap regardless of overflow — no need for `overflow: visible`. */
@media (max-width: 720px) and (orientation: portrait) {
  .chart-svg {
    flex: 0 0 auto;
    width: 540px;           /* wider than viewport → scroll X; Y stays pinned */
    height: auto;
    display: block;
  }
}

/* Mobile landscape: viewport is wide & short — chart fits without scroll
   and capped at a moderate height so the rest of the page is reachable. */
@media (max-width: 1024px) and (orientation: landscape) {
  .chart-wrap { margin-top: var(--space-3); }
  .chart-scroll { max-height: 360px; }
  /* Landscape is wide: let the plot fill (flex:1 from base) so it fits
     without scroll; the Y-axis is visible regardless. */
}

.chart-tooltip {
  position: absolute;
  pointer-events: none;
  background: rgba(13, 20, 33, 0.94);
  color: white;
  padding: 10px 14px;
  border-radius: 10px;
  font-size: 12px;
  line-height: 1.5;
  transform: translate(-50%, -110%);
  white-space: nowrap;
  box-shadow: 0 6px 20px rgba(0,0,0,0.18);
  opacity: 0;
  transition: opacity 0.1s;
  z-index: 5;
}
.chart-tooltip.visible { opacity: 1; }
/* On mobile, lock the tooltip to a fixed width so it doesn't visually
   reflow into different-sized boxes day-to-day based on which markers
   happen to be near the cursor. Long event names truncate cleanly
   inside the fixed box rather than pushing the box wider. */
@media (max-width: 720px) {
  .chart-tooltip {
    white-space: normal;
    width: 220px;
    min-width: 220px;
    max-width: min(220px, calc(100vw - 24px));
  }
  .chart-tooltip .tt-row > span:last-child {
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
    min-width: 0;
    flex: 1 1 auto;
    text-align: right;
  }
  .chart-tooltip .tt-row .label { flex: 0 0 auto; }
}
.chart-tooltip .tt-date { font-weight: 600; margin-bottom: 4px; opacity: 0.85; }
.chart-tooltip .tt-row { display: flex; justify-content: space-between; gap: 16px; min-width: 0; }
.chart-tooltip .tt-row .label { opacity: 0.7; }

.chart-legend {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 6px 12px;
  margin-top: var(--space-4);
  font-size: 12px;
  color: var(--text-secondary);
}
.chart-legend-item { display: flex; align-items: center; gap: 6px; }
.legend-swatch { width: 10px; height: 10px; border-radius: 3px; display: inline-block; }
.legend-line { width: 16px; height: 2px; display: inline-block; border-radius: 1px; }
.legend-line.dashed { border-top: 2px dashed currentColor; height: 0; }

/* ============================================================
   GRID & STAT CARDS
   ============================================================ */
.grid {
  display: grid;
  gap: var(--space-4);
}

.grid-cols-1 { grid-template-columns: 1fr; }
.grid-cols-2 { grid-template-columns: repeat(2, minmax(0, 1fr)); }
.grid-cols-3 { grid-template-columns: repeat(3, minmax(0, 1fr)); }
.grid-cols-4 { grid-template-columns: repeat(4, minmax(0, 1fr)); }

.stat-card {
  background: var(--card);
  border-radius: var(--radius-lg);
  padding: var(--space-5);
  box-shadow: var(--shadow-card);
  display: flex;
  flex-direction: column;
  gap: var(--space-2);
  transition: box-shadow 0.18s, transform 0.08s;
}
.stat-card:hover { box-shadow: var(--shadow-card-hover); }
/* Clickable affordance: cursor + a tiny lift on hover, settle on press.
   Activated by adding data-action to the stat-card so any <div> with a
   navigation action automatically reads as a button. */
.stat-card[data-action] { cursor: pointer; }
.stat-card[data-action]:hover { transform: translateY(-1px); }
.stat-card[data-action]:active { transform: translateY(0); }
.stat-card[data-action]:focus-visible {
  outline: 2px solid var(--accent);
  outline-offset: 2px;
}
.stat-label { font-size: 12px; color: var(--text-tertiary); font-weight: 600; text-transform: uppercase; letter-spacing: 0.02em; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.stat-value { font-size: 26px; font-weight: 600; letter-spacing: -0.02em; line-height: 1.15; }
/* Mid amber — sits between the Offer-expires tag's pale background
   (#fff5e0) and its deep brown text (#b45309). Used when Lowest projected
   touches the buffer zone (positive but below buffer). */
.stat-value.warn { color: #c88b2c; }
/* Lighter red — softened from raw #ef4444 to match the Deposit Deadline tag */
.stat-value.danger { color: #e87171; }
/* Brighter mint green, in lockstep with .action-tag.success */
.stat-value.success { color: #0ea968; }
/* Slightly deeper than the prior #8284f7 — closer to the wordmark indigo */
.stat-value.accent { color: #6c6ce5; }
/* Same mid amber as .stat-value.warn so "healthy but lighten" reads coherent */
.stat-value.lighten { color: #c88b2c; }
.stat-meta { font-size: 12px; color: var(--text-tertiary); margin-top: var(--space-1); }

/* ============================================================
   UPCOMING ACTIONS
   ============================================================ */
.action-list {
  display: flex;
  flex-direction: column;
  gap: var(--space-1);
  /* Reserve a full page worth of vertical space so paging to a partial last
     page doesn't shrink the card and yank the page upward. 6 rows × ~52px. */
  min-height: 312px;
}
@media (max-width: 480px) {
  .action-list { min-height: 360px; } /* mobile rows wrap an extra line */
}

.action-row {
  display: grid;
  grid-template-columns: 56px minmax(0, 1fr) auto;
  align-items: center;
  gap: var(--space-3);
  padding: var(--space-3) var(--space-4);
  border-radius: var(--radius-md);
  transition: background 0.1s;
  position: relative;
  /* Reserve 6px on the left so the optional offer-color stripe doesn't
     shove the day/title columns inward when present. */
  padding-left: calc(var(--space-4) + 2px);
}
.action-row:hover { background: var(--bg); }
.action-row.clickable { cursor: pointer; }
.action-row.clickable:active { transform: translateY(0.5px); }
.action-row.clickable:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
/* Per-offer color stripe — 3px vertical bar pinned to the row's left
   edge. Only appears when the action's offer has a color set; rows for
   commitments and capital events stay un-striped. */
.action-row.has-color::before {
  content: '';
  position: absolute;
  left: 4px;
  top: 8px;
  bottom: 8px;
  width: 3px;
  border-radius: 2px;
  background: var(--offer-color);
}

/* Mobile: tighter columns, tag wraps under the title so nothing collides */
@media (max-width: 480px) {
  .action-row {
    grid-template-columns: 48px minmax(0, 1fr);
    gap: var(--space-2);
    padding: var(--space-2) var(--space-3);
  }
  .action-row .action-tag {
    grid-column: 2;
    grid-row: 2;
    justify-self: start;
    margin-top: 2px;
    font-size: 10px;
    padding: 2px 7px;
  }
}

/* Upcoming churn dates (F6) — bottom-of-Overview section. Mounts after
   .overview-grid as a block-level sibling, so it's naturally full-width (no
   grid-column needed — the parent isn't a grid). Rows reuse the offer-color
   stripe + tap-to-edit idiom from .action-row but with a simpler two-line body. */
.churn-section { margin-top: var(--space-4); }
.churn-list { display: flex; flex-direction: column; gap: 2px; }
.churn-group-label {
  font-size: 10px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.02em;
  color: var(--text-tertiary); margin: var(--space-3) 0 2px;
}
.churn-group-label:first-child { margin-top: 0; }
/* Each row is a wrap: the clickable nav area + a trailing snooze-control
   cluster as siblings, so tapping a snooze button never opens the offer. */
.churn-row-wrap { position: relative; }
.churn-row {
  display: grid; grid-template-columns: minmax(0, 1fr) auto; align-items: center;
  gap: var(--space-3); padding: var(--space-3) var(--space-4);
  padding-left: calc(var(--space-4) + 2px);
  border-radius: var(--radius-md); position: relative; transition: background 0.1s;
}
.churn-row:hover { background: var(--bg); }
.churn-row.clickable { cursor: pointer; }
.churn-row.clickable:active { transform: translateY(0.5px); }
.churn-row.clickable:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.churn-row-wrap[style*="--offer-color"] .churn-row::before {
  content: ''; position: absolute; left: 4px; top: 8px; bottom: 8px;
  width: 3px; border-radius: 2px; background: var(--offer-color);
}
.churn-row-main { min-width: 0; }
.churn-row-name {
  font-size: 14px; font-weight: 600; color: var(--text);
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
}
.churn-row-date { font-size: 12px; color: var(--text-secondary); font-feature-settings: 'tnum' 1; }
.churn-row-date.success { color: #047857; font-weight: 600; }
.churn-row-date.muted { color: var(--text-tertiary); }
.churn-wait-chip { flex: 0 0 auto; white-space: nowrap; }

/* Snooze affordance — a subtle trailing control cluster under each row. The
   "Snooze" button reveals an inline row of duration choices (no modal). */
.churn-snooze {
  display: flex; align-items: center; gap: var(--space-2);
  padding: 0 var(--space-4) 2px calc(var(--space-4) + 2px);
  min-height: 22px; flex-wrap: wrap;
}
.churn-snooze-btn, .churn-unsnooze-btn, .churn-snoozed-toggle {
  color: var(--text-tertiary); padding: 2px 6px; font-size: 11px; font-weight: 600;
}
.churn-snooze-btn:hover, .churn-unsnooze-btn:hover, .churn-snoozed-toggle:hover {
  color: var(--accent); background: var(--accent-soft);
}
.churn-snooze-menu { display: flex; align-items: center; gap: var(--space-2); flex-wrap: wrap; }
.churn-snooze-menu[hidden] { display: none; }
.churn-snooze-menu .btn { font-size: 11px; padding: 2px 8px; }
.churn-snoozed-reveal-wrap { margin-top: var(--space-3); }
.churn-snoozed-list[hidden] { display: none; }
.churn-snoozed-list { margin-top: 2px; }
.churn-row-snoozed .churn-row-name { color: var(--text-secondary); font-weight: 500; }

/* iOS calendar-icon-style date block: bright red month, large dark day */
.action-day {
  text-align: center;
  line-height: 1;
  padding: 2px 0;
}
.action-day .month {
  display: block;
  font-size: 10px;
  font-weight: 700;
  color: #ff3b30;  /* iOS systemRed */
  text-transform: uppercase;
  letter-spacing: 0.02em;
  line-height: 1.4;
  margin-bottom: 1px;
}
.action-day .day {
  display: block;
  font-size: 24px;
  /* Mac Calendar feel: semibold, not heavy bold */
  font-weight: 500;
  color: var(--text);
  line-height: 1;
  letter-spacing: 0;
  /* Proportional (not tabular) figures so a narrow "1" doesn't carry extra
     left-side bearing — under tabular-nums "16" looked right-shifted vs
     "30" because the "1" sat in a fixed-width box with empty space on
     its left. Proportional widths size each number to its actual glyphs
     so the block centers naturally in the 56px cell. */
  font-variant-numeric: proportional-nums;
  font-feature-settings: 'pnum' 1;
}
.action-day .month { font-weight: 600; }

.action-body { display: flex; flex-direction: column; gap: 2px; min-width: 0; }
.action-title { font-weight: 500; font-size: 14px; color: var(--text); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.action-sub { font-size: 12px; color: var(--text-tertiary); }

.action-tag {
  font-size: 11px;
  padding: 3px 8px;
  border-radius: var(--radius-pill);
  background: var(--accent-soft);
  /* Default (Outflow / generic) — slightly deeper purple, in lockstep with
     the Tied-up-today stat color so the two read as the same hue. */
  color: #6c6ce5;
  font-weight: 600;
  text-transform: uppercase;
  letter-spacing: 0.02em;
}
.action-tag.warn { background: var(--warning-soft); color: #b45309; }
/* Brighter mint green — softer than #10b981, deeper than #059669; the same
   tone is used by .stat-value.success so Selected bonuses and the Withdrawal
   tag read as one hue. */
.action-tag.success { background: var(--success-soft); color: #0ea968; }
/* Lightened red — matches .stat-value.danger so Lowest Projected and the
   Deposit Deadline tag read as the same shade. */
.action-tag.danger { background: var(--danger-soft); color: #e87171; }

.upcoming-pager { display: inline-flex; align-items: center; gap: 6px; }
.upcoming-pg-btn {
  width: 24px; height: 24px; border-radius: 50%;
  background: var(--accent-soft); color: var(--accent);
  font-size: 14px; font-weight: 600; line-height: 1;
  display: inline-flex; align-items: center; justify-content: center;
  border: none; cursor: pointer; transition: background 0.12s, opacity 0.12s;
}
.upcoming-pg-btn:hover:not(:disabled) { background: var(--accent-mid); }
.upcoming-pg-btn:disabled { opacity: 0.35; cursor: default; }
.upcoming-pg-label { font-size: 12px; color: var(--text-tertiary); font-variant-numeric: tabular-nums; min-width: 30px; text-align: center; }
.upcoming-fade { animation: upcoming-fade-in 0.22s ease-out; }
@keyframes upcoming-fade-in {
  from { opacity: 0; transform: translateY(4px); }
  to { opacity: 1; transform: translateY(0); }
}

/* ============================================================
   OFFER CARDS
   ============================================================ */
.offer-card {
  background: var(--card);
  border-radius: var(--radius-lg);
  padding: var(--space-5);
  /* Reserve a 4 px left strip for the per-offer color accent. When
     unset, the strip is transparent and the card looks normal. */
  padding-left: calc(var(--space-5) - 2px);
  box-shadow: var(--shadow-card);
  border: 1.5px solid transparent;
  border-left: 4px solid transparent;
  transition: border-color 0.15s, box-shadow 0.15s, transform 0.05s;
  position: relative;
}
.offer-card.included { border-color: var(--accent); }
.offer-card.included { border-left-color: var(--offer-color, var(--accent)); }
.offer-card[style*="--offer-color"]:not(.included) { border-left-color: var(--offer-color); }
.offer-card.draft { opacity: 0.85; border-style: dashed; border-color: var(--warning); }

/* Color picker (Add/Edit Offer modal). Twelve circular swatches plus
   a "no color" cross at the start. Used swatches dim to 0.18 alpha
   and become non-interactive. Selected swatch gets a ring. */
.color-picker {
  display: flex;
  flex-wrap: wrap;
  gap: 8px;
  /* Horizontal padding ≥ the 4px selection ring so the first swatch's
     ring (and the X "no color" swatch when selected) isn't clipped by
     the field/modal edge. */
  padding: 5px 6px;
}
.color-swatch {
  width: 28px;
  height: 28px;
  border-radius: 50%;
  border: none;
  cursor: pointer;
  padding: 0;
  position: relative;
  transition: transform 0.1s, box-shadow 0.1s, opacity 0.12s;
  flex-shrink: 0;
}
.color-swatch:hover:not(:disabled) { transform: scale(1.08); }
.color-swatch.selected {
  box-shadow: 0 0 0 2px var(--card), 0 0 0 4px var(--text);
}
.color-swatch.used,
.color-swatch:disabled {
  opacity: 0.22;
  cursor: not-allowed;
}
.color-swatch.swatch-none {
  background: var(--card);
  border: 1.5px solid var(--border-strong);
  color: var(--text-tertiary);
  display: flex;
  align-items: center;
  justify-content: center;
}
.color-swatch.swatch-none.selected {
  box-shadow: 0 0 0 2px var(--card), 0 0 0 4px var(--text);
  border-color: var(--text);
  color: var(--text);
}

/* Custom date picker popover */
.yv-date { cursor: pointer; }
.yv-dp {
  /* Responsive width so the popover never exceeds a narrow phone screen. */
  width: min(280px, calc(100vw - 16px));
  box-sizing: border-box;
  background: var(--card);
  border: 1px solid var(--border);
  border-radius: 14px;
  box-shadow: var(--shadow-modal);
  padding: 12px;
  z-index: 300;
  font-family: var(--font-sans);
}
.yv-dp-head { display: flex; align-items: center; justify-content: space-between; margin-bottom: 8px; }
.yv-dp-head span { font-size: 14px; font-weight: 600; }
.yv-dp-head button { width: 30px; height: 30px; border-radius: 8px; border: 1px solid var(--border); background: var(--card); font-size: 15px; cursor: pointer; color: var(--text-secondary); }
.yv-dp-head button:hover { background: var(--bg); }
.yv-dp-dow { display: grid; grid-template-columns: repeat(7, 1fr); gap: 3px; margin-bottom: 3px; }
.yv-dp-dow span { text-align: center; font-size: 10px; font-weight: 600; color: var(--text-tertiary); }
/* FIXED row height (not aspect-ratio) + always 6 rows. aspect-ratio on
   grid items creates a width↔height feedback loop: in a 5-week month the
   rows stretch taller, which (via aspect-ratio:1) makes cells wider and
   overflows the card — the exact July-vs-August bug. minmax(0,1fr) lets
   columns shrink so they never overflow. */
.yv-dp-grid { display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); grid-auto-rows: 34px; gap: 3px; }
.yv-dp-day {
  height: 34px; border: 1.5px solid transparent; border-radius: 8px;
  background: var(--card); cursor: pointer; display: flex; flex-direction: column;
  align-items: center; justify-content: center; position: relative; padding: 0;
  font-family: inherit; min-width: 0; overflow: hidden;
}
.yv-dp-day b { font-size: 13px; font-weight: 600; }
.yv-dp-day i { font-size: 8.5px; font-weight: 700; font-style: normal; margin-top: -1px; }
.yv-dp-day:hover { box-shadow: 0 2px 8px rgba(15,23,42,.12); }
.yv-dp-day.muted { color: var(--text-tertiary); background: var(--bg); }
.yv-dp-day.good  { background: var(--success-soft); } .yv-dp-day.good b, .yv-dp-day.good i { color: #047857; }
.yv-dp-day.mid   { background: #fff5e0; }            .yv-dp-day.mid b, .yv-dp-day.mid i { color: #b45309; }
.yv-dp-day.amber { background: #fff5e0; }            .yv-dp-day.amber b { color: #b45309; }
.yv-dp-day.bad   { background: #fde8e8; }            .yv-dp-day.bad b, .yv-dp-day.bad i { color: #c0392b; }
.yv-dp-day.sel   { border-color: var(--accent); box-shadow: 0 0 0 2px rgba(91,92,246,.2); }
.yv-dp-day.holiday::after { content: ''; position: absolute; top: 4px; right: 4px; width: 4px; height: 4px; border-radius: 50%; background: var(--danger); }
.yv-dp-legend { display: flex; gap: 10px; flex-wrap: wrap; margin-top: 10px; font-size: 10.5px; color: var(--text-secondary); }
.yv-dp-legend span { display: inline-flex; align-items: center; gap: 4px; }
.yv-dp-legend .s { width: 10px; height: 10px; border-radius: 3px; display: inline-block; }
.yv-dp-legend .s.good { background: var(--success-soft); } .yv-dp-legend .s.mid, .yv-dp-legend .s.amber { background: #fff5e0; } .yv-dp-legend .s.bad { background: #fde8e8; }
.yv-dp-foot { display: flex; justify-content: space-between; margin-top: 10px; }
.yv-dp-foot button { font-size: 12px; color: var(--accent); background: none; border: none; cursor: pointer; padding: 4px 6px; font-weight: 500; }
.yv-dp-foot button:hover { text-decoration: underline; }

.offer-card-header {
  display: flex;
  align-items: flex-start;
  gap: var(--space-3);
  margin-bottom: var(--space-4);
}

.offer-include {
  appearance: none;
  -webkit-appearance: none;
  width: 22px; height: 22px;
  border: 2px solid var(--border-strong);
  border-radius: 7px;
  cursor: pointer;
  position: relative;
  flex-shrink: 0;
  margin-top: 2px;
  transition: background 0.1s, border-color 0.1s;
}
.offer-include:checked {
  background: var(--accent);
  border-color: var(--accent);
}
.offer-include:checked::after {
  content: '';
  position: absolute;
  left: 5px; top: 1px;
  width: 6px; height: 11px;
  border: solid white;
  border-width: 0 2.5px 2.5px 0;
  transform: rotate(45deg);
}
.offer-include:disabled { opacity: 0.5; cursor: not-allowed; }

.offer-name { font-size: 16px; font-weight: 600; line-height: 1.25; letter-spacing: -0.01em; }
.offer-bank { font-size: 13px; color: var(--text-tertiary); margin-top: 2px; }

.offer-stats {
  display: grid;
  grid-template-columns: repeat(2, 1fr);
  gap: var(--space-3) var(--space-4);
  padding: var(--space-3) 0;
  border-top: 1px solid var(--border-soft);
  border-bottom: 1px solid var(--border-soft);
  margin-bottom: var(--space-4);
}
.offer-stat { display: flex; flex-direction: column; }
.offer-stat-label { font-size: 11px; color: var(--text-tertiary); font-weight: 600; text-transform: uppercase; letter-spacing: 0.02em; }
.offer-stat-value { font-size: 15px; font-weight: 600; color: var(--text); margin-top: 2px; }
.offer-stat-value.success { color: var(--success); }
.offer-stat-value.muted { color: var(--text-tertiary); font-weight: 500; }

.offer-dates { font-size: 13px; color: var(--text-secondary); margin-bottom: var(--space-3); display: flex; flex-direction: column; gap: 4px; }
.offer-dates span { display: flex; align-items: center; gap: 4px; line-height: 1.4; }

/* Muted "$N/mo" fee detail tucked under the Bonus stat — quiet supporting
   info (BonusFlow parity), never a chip. */
.offer-monthly-fee { display: block; margin-top: 2px; font-size: 11px; font-weight: 500; color: var(--text-tertiary); }

/* Quiet freshness stamp — smallest tier, tertiary text, right-aligned so it
   reads as a corner annotation rather than card content. */
.offer-updated { margin-top: var(--space-2); font-size: 10px; letter-spacing: 0.02em; text-transform: uppercase; color: var(--text-tertiary); text-align: right; }

.offer-chips {
  display: flex;
  flex-wrap: wrap;
  gap: var(--space-2);
  /* Top margin so the chip row never abuts the lifecycle-info lines above it
     (which carry margin-bottom:0). Collapses with a preceding block's own
     bottom margin, so it never double-spaces when chips follow .offer-dates. */
  margin-top: var(--space-3);
  margin-bottom: var(--space-3);
}

.chip {
  display: inline-block;
  font-size: 11px;
  padding: 3px 9px;
  border-radius: var(--radius-pill);
  background: var(--bg);
  color: var(--text-secondary);
  font-weight: 600;
  text-transform: uppercase;
  letter-spacing: 0.02em;
}
.chip-accent { background: var(--accent-soft); color: var(--accent); }
.chip-warn { background: var(--warning-soft); color: #b45309; }
.chip-success { background: var(--success-soft); color: #047857; }
.chip-danger { background: var(--danger-soft); color: var(--danger); }
.chip-muted { background: var(--bg); color: var(--text-tertiary); }

/* Offer-type chips: visually distinguish the three offer-type semantics
   so a glance at the card communicates how the lock works. DD gets a
   teal/blue tone (transfer/movement metaphor); Held gets the indigo
   accent (the existing "single locked block" feel); Other is neutral. */
.chip-offer-type-direct-deposit { background: rgba(45, 156, 219, 0.12); color: #1f7a99; }
.chip-offer-type-new-funds-held { background: var(--accent-soft); color: var(--accent); }
.chip-offer-type-held-and-dd    { background: rgba(120, 80, 220, 0.10); color: #6b3fc4; }
.chip-offer-type-other          { background: var(--bg);          color: var(--text-tertiary); }

/* Direct-deposit list on the offer card — one compact row per planned
   DD. Reads as "DD N · $X · Mon Jan 5" with a faint shift arrow if
   the planned date was nudged forward to the next business day. */
.offer-dds {
  display: flex;
  flex-direction: column;
  gap: 4px;
  margin: var(--space-3) 0;
  padding: var(--space-2) var(--space-3);
  background: rgba(45, 156, 219, 0.06);
  border-radius: var(--radius-md);
  border-left: 3px solid rgba(45, 156, 219, 0.4);
}
.offer-dd-row {
  display: grid;
  grid-template-columns: 56px 1fr auto;
  gap: 8px;
  align-items: baseline;
  font-size: 12px;
}
.offer-dd-num { font-weight: 600; color: #1f7a99; font-size: 11px; text-transform: uppercase; letter-spacing: 0.02em; }
.offer-dd-amount { font-weight: 600; color: var(--text); font-feature-settings: 'tnum' 1; }
.offer-dd-date { color: var(--text-secondary); font-feature-settings: 'tnum' 1; }
.offer-dd-adj { color: var(--text-tertiary); }

/* DD-method datapoint panel (Doctor of Credit) on the offer card.
   Two-column layout: title + source on the left, method pills stacked
   vertically on the right — matches the visual weight of other chips. */
.ddm-panel { margin: var(--space-3) 0; padding: var(--space-2) var(--space-3); background: var(--card-soft); border: 1px solid var(--border-soft); border-radius: var(--radius-md); }
.ddm-panel.ddm-loading, .ddm-panel.ddm-empty { font-size: 11px; color: var(--text-tertiary); }
.ddm-inner { display: flex; align-items: flex-start; justify-content: space-between; gap: 8px; }
.ddm-left  { display: flex; flex-direction: column; gap: 2px; flex-shrink: 0; }
.ddm-title { font-size: 11px; font-weight: 600; color: var(--text-secondary); text-transform: uppercase; letter-spacing: 0.02em; }
.ddm-src   { font-weight: 500; color: var(--text-tertiary); text-transform: none; letter-spacing: 0; font-size: 10px; }
.ddm-list  { display: flex; flex-direction: column; gap: 3px; align-items: flex-end; }
.ddm-pill  { display: inline-flex; align-items: center; font-size: 11px; padding: 2px 4px 2px 7px; border-radius: var(--radius-pill); background: var(--bg); color: var(--text-secondary); border: 1px solid var(--border-soft); white-space: nowrap; }
.ddm-method { overflow: hidden; text-overflow: ellipsis; }
/* Datapoint count as a separated badge so "Business checking" + "2 DP"
   never read as one phrase ("Business checking 2"). */
.ddm-dp { flex-shrink: 0; margin-left: 6px; padding: 0 5px; border-radius: var(--radius-pill); background: var(--border-soft); color: var(--text-tertiary); font-weight: 700; font-size: 10px; font-feature-settings: 'tnum' 1; }
.ddm-pill.mine { background: var(--success-soft); color: #047857; border-color: rgba(16,185,129,0.3); }
.ddm-pill.mine .ddm-dp { background: rgba(16,185,129,0.18); color: #047857; }
.ddm-foot { font-size: 11px; color: var(--text-tertiary); margin-top: 5px; }
.ddm-foot strong { color: #047857; }

/* DD entry rows inside the Add-Offer modal — same compact grid as the
   card display but inputs instead of text. Defined here so the row
   layout survives the modal's blast-radius `.modal .form-grid > *
   { width: 100% !important }` rule (grid-template-columns is honored
   inside the row, not at the row level). */
.dd-row { width: 100%; max-width: 100%; box-sizing: border-box; }
.dd-row > * { min-width: 0; }
/* Slimmed field-box variant (R57) for the DD entry rows: each row has no
   per-input label (the "Planned direct deposits *" field label above the
   whole list is the group label — a full label-in-container box per row
   would repeat that label N times), so give the inputs a compact rounded
   border instead of the full container treatment. Same border/radius/
   focus language as .field-box, smaller padding to fit the dense grid. */
.dd-row .input,
.dd-row .input-group {
  background: var(--card-soft);
  border: 1px solid var(--border-soft);
  border-radius: var(--radius-md);
}
/* Round 58: match .field-box's value-text tone (--text-strong, ~line 28) —
   this slimmed variant has no per-row label but is still VALUE text, so it
   gets the same body-strong color as boxed values, not the heading-tone
   --text default it inherited from the base .input rule. Font-weight was
   already 400 (default, no override existed), so only color moves here. */
.dd-row .input { padding: 8px 10px; color: var(--text-strong); }
/* The amount input lives INSIDE .input-group, which already carries the
   border/background above — without this it doubled up (border nested
   in border). Strip them from the inner input so only the group's outer
   edge shows. */
.dd-row .input-group .input {
  background: transparent;
  border: none;
}
/* Same prefix-overlap fix as .field-box (see that block, ~line 1496):
   flex row instead of absolute-positioned prefix + padding-left clearance
   guess, so the "$" glyph can't sit on top of the value's first digit. */
.dd-row .input-group {
  display: flex;
  align-items: baseline;
  padding-left: 10px;
}
.dd-row .input-group .input {
  padding-left: 0;
  flex: 1 1 auto;
  min-width: 0;
}
.dd-row .input-group .input-prefix {
  position: static;
  flex: 0 0 auto;
  transform: none;
  /* R62: same "$"-ties-to-value treatment as the field-box variant —
     snug gap + value-tone color (overrides the base muted tertiary). */
  margin-right: 4px;
  color: var(--text-strong);
}
.dd-row .input:focus,
.dd-row .input-group:focus-within {
  border-color: var(--accent);
  box-shadow: 0 0 0 3px var(--accent-soft);
}
.dd-row .input-group:focus-within .input { box-shadow: none; }

/* ============================================================
   REQUIREMENTS SECTION (step 3) — modal editor rows + card checklist.
   Shares the app's tokens/radii; derived rows carry a subtle "auto" tag,
   user rows a remove button. Rows wrap to a stacked layout on narrow
   viewports (no horizontal scroll on phones).
   ============================================================ */
.req-section .field-hint { margin-top: 8px; }
#req-rows { display: flex; flex-direction: column; gap: 8px; }
.req-row {
  border: 1px solid var(--border-soft);
  border-radius: var(--radius-md);
  padding: 8px 10px;
  background: var(--card-soft);
}
.req-row.req-derived { border-left: 3px solid var(--accent-mid); }
.req-row.req-user { border-left: 3px solid var(--success); }
.req-row-main {
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  gap: 8px;
}
.req-cell { min-width: 0; }
.req-cell-type { flex: 1 1 130px; min-width: 120px; }
.req-cell-label { flex: 1 1 120px; min-width: 110px; }
.req-cell-amount { flex: 0 1 120px; min-width: 96px; }
.req-cell-count { flex: 0 1 88px; min-width: 78px; }
.req-cell-deadline { flex: 0 1 88px; min-width: 74px; }
.req-cell-freq { flex: 0 1 120px; min-width: 100px; }
.req-cell-remove { flex: 0 0 auto; margin-left: auto; }
.req-row .select, .req-row .input { height: 34px; padding: 6px 8px; font-size: 13px; color: var(--text-strong); }
.req-row .input-group { width: 100%; }
.req-row .input-group.with-suffix .input { padding-right: 26px; }
.req-row .input-group.with-suffix .input-suffix { right: 6px; font-size: 12px; color: var(--text-tertiary); }
.req-row .input-group .input-prefix { color: var(--text-strong); margin-right: 3px; }
.req-type-label {
  display: inline-flex; align-items: center; gap: 6px;
  font-size: 13px; font-weight: 500; color: var(--text-strong);
}
.req-auto-tag {
  font-size: 9px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.02em;
  color: var(--accent); background: var(--accent-soft);
  padding: 1px 5px; border-radius: var(--radius-pill);
}
.req-deadline-ro { font-size: 12px; color: var(--text-tertiary); font-feature-settings: 'tnum' 1; }
.req-row-date { font-size: 11px; color: var(--text-secondary); margin-top: 6px; }
.req-row-date strong { color: var(--text-strong); }
.req-row-date .req-nodate { color: var(--text-tertiary); }
.req-add-row { display: flex; gap: 8px; margin-top: 8px; align-items: center; }
.req-add-row .select { flex: 1 1 auto; max-width: 240px; }
.req-empty { font-size: 12px; color: var(--text-tertiary); padding: 6px 2px; }

/* ---- DoC import (Phase 6): paste area + preview/confirm panel ------------- */
.doc-import {
  border: 1px solid var(--border-soft);
  border-radius: var(--radius-md);
  background: var(--card-soft);
  overflow: hidden;
}
.doc-import-toggle {
  display: flex; align-items: center; gap: 8px; width: 100%;
  padding: 10px 12px; background: none; border: none; cursor: pointer;
  font-size: 12px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.02em;
  color: var(--accent); text-align: left;
  -webkit-tap-highlight-color: transparent;
}
.doc-import-toggle:hover { color: var(--accent-hover); }
.doc-import-toggle svg { flex: 0 0 auto; }
.doc-import-body { padding: 0 12px 12px; border-top: 1px solid var(--border-soft); }
.doc-import-help { font-size: 12px; color: var(--text-secondary); margin: 10px 0 8px; line-height: 1.45; }
.doc-import-paste {
  width: 100%; min-height: 96px; resize: vertical; font-size: 13px;
  font-family: var(--font-mono); line-height: 1.4; color: var(--text-strong);
}
.doc-import-actions { display: flex; align-items: center; gap: 8px; margin-top: 8px; flex-wrap: wrap; }
/* Fetch-from-URL mode (Phase 7 v2). Only rendered when a Worker URL is
   configured — see the gated block in showOfferModal. */
.doc-fetch { margin: 4px 0 12px; padding-bottom: 12px; border-bottom: 1px dashed var(--border-soft); }
.doc-fetch-row { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
.doc-fetch-url { flex: 1 1 220px; min-width: 0; font-size: 13px; }
.doc-fetch-btn[aria-busy="true"] { opacity: 0.7; pointer-events: none; }
.doc-fetch-err { font-size: 12px; color: var(--text-tertiary); margin-top: 6px; line-height: 1.4; }
.doc-fetch-or { font-size: 11px; color: var(--text-tertiary); text-transform: uppercase; letter-spacing: 0.02em; margin: 8px 0 2px; }
/* "AI" badge + failed-verification note on preview fields sourced from the LLM. */
.doc-ai-badge {
  flex: 0 0 auto; font-size: 9px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.02em;
  color: var(--accent); border: 1px solid var(--accent); border-radius: 4px; padding: 0 4px; line-height: 1.5;
}
.doc-ai-note { font-size: 11px; color: var(--text-tertiary); line-height: 1.4; margin-top: 8px; }
.doc-import-status { font-size: 12px; }
.doc-import-status.muted { color: var(--text-tertiary); }
.doc-import-status.success { color: var(--success); }
.doc-import-status.danger { color: var(--danger); }
.doc-import-preview:empty { display: none; }
.doc-import-preview { margin-top: 12px; }
.doc-preview-head, .doc-import-empty {
  font-size: 12px; color: var(--text-secondary); line-height: 1.45; margin-bottom: 10px;
}
.doc-import-empty { color: var(--text-tertiary); }
.doc-fields { display: flex; flex-direction: column; gap: 6px; }
.doc-field {
  display: flex; align-items: flex-start; gap: 10px;
  padding: 8px 10px; border: 1px solid var(--border-soft);
  border-radius: var(--radius-md); background: var(--bg-elevated); cursor: pointer;
}
.doc-field .doc-check { flex: 0 0 auto; margin-top: 3px; width: 15px; height: 15px; }
.doc-field-main { display: flex; flex-direction: column; gap: 3px; min-width: 0; flex: 1 1 auto; }
.doc-field-head { display: flex; align-items: center; gap: 6px; }
.doc-field-label {
  font-size: 10px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.02em;
  color: var(--text-tertiary);
}
.doc-conf { flex: 0 0 auto; width: 7px; height: 7px; border-radius: 50%; display: inline-block; }
.doc-conf-high { background: var(--success); }
.doc-conf-medium { background: var(--warning); }
.doc-conf-low { background: var(--text-tertiary); }
.doc-field-val {
  font-size: 14px; color: var(--text-strong); font-weight: 500;
  display: flex; align-items: center; gap: 6px; flex-wrap: wrap; min-width: 0;
}
.doc-field-val .doc-new { word-break: break-word; }
.doc-overwrite { display: inline-flex; align-items: center; gap: 4px; color: var(--text-tertiary); }
.doc-overwrite .doc-old { text-decoration: line-through; font-size: 13px; }
.doc-note { font-size: 11px; color: var(--warning); line-height: 1.35; }
.doc-snippet {
  font-size: 11px; color: var(--text-tertiary); font-style: italic;
  line-height: 1.4; word-break: break-word;
}
.doc-leftovers {
  margin-top: 12px; padding: 8px 10px;
  border: 1px dashed var(--border-strong); border-radius: var(--radius-md);
  background: var(--card-soft);
}
.doc-leftovers-head {
  font-size: 10px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.02em;
  color: var(--text-tertiary); margin-bottom: 6px;
}
.doc-leftover { font-size: 12px; color: var(--text-secondary); line-height: 1.5; word-break: break-word; }
.doc-apply-row { display: flex; align-items: center; gap: 10px; margin-top: 12px; flex-wrap: wrap; }
.doc-apply-hint { font-size: 11px; color: var(--text-tertiary); }
/* F5: "also save as template" opt-in below the DoC apply button. */
.doc-tpl-save { display: flex; align-items: center; gap: 7px; margin-top: 10px; font-size: 12px; color: var(--text-secondary); cursor: pointer; }
.doc-tpl-save input { flex: 0 0 auto; }

/* Tier picker (step 4b): a "Select your tier" radio group ABOVE the field rows
   when a >=2 bonus ladder was parsed. A left accent border sets it apart from
   the ordinary .doc-field rows without leaving the .doc-* idiom. */
.doc-tier-group {
  margin-bottom: 14px; padding: 10px 12px;
  border: 1px solid var(--accent-mid); border-left: 3px solid var(--accent);
  border-radius: var(--radius-md); background: var(--accent-soft);
}
.doc-tier-head {
  font-size: 11px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.02em;
  color: var(--accent-strong);
}
.doc-tier-sub { font-size: 11px; color: var(--text-secondary); line-height: 1.4; margin: 4px 0 10px; }
.doc-tier-opts { display: flex; flex-direction: column; gap: 6px; }
.doc-tier-opt {
  display: flex; align-items: flex-start; gap: 10px;
  padding: 8px 10px; border: 1px solid var(--border-soft);
  border-radius: var(--radius-md); background: var(--bg-elevated); cursor: pointer;
  -webkit-tap-highlight-color: transparent;
}
.doc-tier-opt:hover { border-color: var(--accent-mid); }
.doc-tier-radio { flex: 0 0 auto; margin-top: 2px; width: 15px; height: 15px; accent-color: var(--accent); }
.doc-tier-body { display: flex; flex-direction: column; gap: 3px; min-width: 0; flex: 1 1 auto; }
.doc-tier-line { display: flex; align-items: center; gap: 7px; flex-wrap: wrap; min-width: 0; }
.doc-tier-thresh { font-size: 13px; font-weight: 600; color: var(--text-strong); word-break: break-word; }
.doc-tier-arrow { flex: 0 0 auto; color: var(--text-tertiary); }
.doc-tier-bonus { font-size: 14px; font-weight: 700; color: var(--accent); }
.doc-tier-target {
  font-size: 10px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.02em;
  color: var(--text-tertiary);
}
.doc-tier-snippet { font-size: 11px; color: var(--text-tertiary); font-style: italic; line-height: 1.4; word-break: break-word; }
.doc-tier-none .doc-tier-thresh { font-weight: 500; color: var(--text-secondary); }

/* Template picker (F5): "Start from a template" affordance at the top of the
   NEW-offer modal. Mirrors the .doc-import card idiom (bordered soft card,
   uppercase toggle) so the two in-modal affordances read as a family. */
.tpl-picker {
  grid-column: 1 / -1;
  border: 1px solid var(--border-soft);
  border-radius: var(--radius-md);
  background: var(--card-soft);
  overflow: hidden;
}
.tpl-picker-toggle {
  display: flex; align-items: center; gap: 8px; width: 100%;
  padding: 10px 12px; background: none; border: none; cursor: pointer;
  font-size: 12px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.02em;
  color: var(--accent); text-align: left;
  -webkit-tap-highlight-color: transparent;
}
.tpl-picker-toggle:hover { color: var(--accent-hover); }
.tpl-picker-toggle svg { flex: 0 0 auto; transition: transform 0.15s ease; }
.tpl-picker-toggle[aria-expanded="true"] .tpl-chevron { transform: rotate(180deg); }
.tpl-picker-body { padding: 10px 12px 12px; border-top: 1px solid var(--border-soft); }
.tpl-search { width: 100%; font-size: 13px; margin-bottom: 10px; }
.tpl-list { display: flex; flex-direction: column; gap: 8px; max-height: 320px; overflow-y: auto; }
.tpl-row {
  display: grid;
  grid-template-columns: minmax(0, 1fr) auto;
  gap: 8px 10px; align-items: center;
  padding: 9px 10px;
  border: 1px solid var(--border-soft);
  border-radius: var(--radius-md);
  background: var(--card);
}
.tpl-row-main { min-width: 0; }
.tpl-row-title { font-size: 13px; font-weight: 600; color: var(--text-strong); word-break: break-word; }
.tpl-row-chips { display: flex; flex-wrap: wrap; gap: 5px; margin-top: 5px; }
.tpl-row-meta { font-size: 11px; color: var(--text-tertiary); margin-top: 4px; }
.tpl-row-actions { display: flex; align-items: center; gap: 6px; flex: 0 0 auto; }
.tpl-del {
  display: inline-flex; align-items: center; justify-content: center;
  width: 28px; height: 28px; padding: 0;
  border: 1px solid var(--border-soft); border-radius: var(--radius-sm);
  background: none; color: var(--text-tertiary); cursor: pointer;
  -webkit-tap-highlight-color: transparent;
}
.tpl-del:hover { color: var(--danger); border-color: var(--danger-soft); background: var(--danger-soft); }
.tpl-empty { font-size: 12px; color: var(--text-tertiary); padding: 8px 2px; line-height: 1.45; }
/* At narrow widths let the actions wrap under the details rather than squeeze. */
@media (max-width: 420px) {
  .tpl-row { grid-template-columns: 1fr; }
  .tpl-row-actions { justify-content: flex-start; }
}

/* Card checklist (step 3): compact requirement list on the offer card. */
.offer-req-checklist {
  display: flex; flex-direction: column; gap: 2px;
  margin: var(--space-3) 0;
  padding: var(--space-2) var(--space-3);
  background: var(--card-soft);
  border: 1px solid var(--border-soft);
  border-radius: var(--radius-md);
}
.offer-req-title { font-size: 10px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.02em; color: var(--text-tertiary); margin-bottom: 4px; }
.offer-req-item {
  display: flex; align-items: baseline; gap: 8px;
  font-size: 12px; padding: 3px 0; cursor: pointer;
  border-radius: var(--radius-sm);
  -webkit-tap-highlight-color: transparent;
}
.offer-req-check {
  flex: 0 0 auto; width: 15px; height: 15px; margin-top: 1px;
  border: 1.5px solid var(--border-strong); border-radius: 4px;
  display: inline-flex; align-items: center; justify-content: center;
  color: var(--text-inverse);
}
.offer-req-item.done .offer-req-check { background: var(--success); border-color: var(--success); }
.offer-req-label { flex: 1 1 auto; min-width: 0; color: var(--text); }
.offer-req-item.done .offer-req-label { text-decoration: line-through; color: var(--text-tertiary); }
.offer-req-date { flex: 0 0 auto; color: var(--text-secondary); font-feature-settings: 'tnum' 1; font-size: 11px; }
.offer-req-item.done .offer-req-date { color: var(--text-tertiary); }
.offer-req-count { font-weight: 500; color: var(--text-tertiary); }

/* ============================================================
   ACCOUNT LIFECYCLE PIPELINE (F3) — derived-view strip on the offer
   card + modal. 4 equal segments joined by a progress rail; filled
   segments (done/current) tint with --accent, idle stay neutral.
   Mobile: labels shrink and the track stays a single row that
   compresses (no horizontal scroll) down to ~320px.
   ============================================================ */
.yv-pipeline { margin: var(--space-3) 0; }
.yv-pipeline.slim { margin: var(--space-2) 0 0; }
.yv-pl-track { display: flex; align-items: flex-start; gap: 0; }
.yv-pl-seg {
  flex: 1 1 0; min-width: 0; position: relative;
  display: flex; flex-direction: column; align-items: center; gap: 5px;
  text-align: center;
}
/* Connecting rail: a line to the LEFT of every segment except the first,
   drawn from the dot leftwards to meet the previous dot. */
.yv-pl-seg::before {
  content: ''; position: absolute; top: 6px; left: -50%; width: 100%; height: 2px;
  background: var(--border-strong); z-index: 0;
}
.yv-pl-seg:first-child::before { display: none; }
/* A filled segment (done/current) tints its incoming rail too. */
.yv-pl-seg.done::before, .yv-pl-seg.current::before { background: var(--accent-mid); }
.yv-pl-dot {
  position: relative; z-index: 1; flex: 0 0 auto;
  width: 13px; height: 13px; border-radius: var(--radius-pill);
  background: var(--bg-elevated); border: 2px solid var(--border-strong);
}
.yv-pl-seg.done .yv-pl-dot { background: var(--accent); border-color: var(--accent); }
.yv-pl-seg.current .yv-pl-dot {
  background: var(--accent); border-color: var(--accent);
  box-shadow: 0 0 0 4px var(--accent-soft);
}
.yv-pl-label {
  font-size: 10px; line-height: 1.2; letter-spacing: 0.02em;
  color: var(--text-tertiary); max-width: 100%; overflow-wrap: anywhere;
}
.yv-pl-seg.done .yv-pl-label { color: var(--text-secondary); }
.yv-pl-seg.current .yv-pl-label { color: var(--accent-strong); font-weight: 600; }
.yv-pipeline.inactive .yv-pl-label { color: var(--text-tertiary); opacity: 0.7; }
.yv-pl-caption {
  margin-top: 7px; font-size: 11px; color: var(--text-secondary);
  text-align: center;
}
.yv-pipeline.slim .yv-pl-label { font-size: 9px; }
.yv-pipeline.slim .yv-pl-dot { width: 11px; height: 11px; }
.yv-pipeline.slim .yv-pl-seg::before { top: 5px; }

/* Expected-bonus + safe-to-close info lines. */
.yv-life-info {
  display: flex; flex-direction: column; gap: 3px;
  margin: var(--space-2) 0 0;
  font-size: 12px;
}
.yv-life-line { display: flex; align-items: baseline; gap: 8px; }
.yv-life-k {
  flex: 0 0 auto; font-size: 10px; font-weight: 700; text-transform: uppercase;
  letter-spacing: 0.02em; color: var(--text-tertiary); min-width: 96px;
}
.yv-life-v { flex: 1 1 auto; color: var(--text); font-feature-settings: 'tnum' 1; }
.yv-life-v.success { color: #047857; font-weight: 600; }
.yv-life-v.warn { color: #b45309; font-weight: 600; }
.yv-life-v.muted { color: var(--text-tertiary); }
.yv-life-snooze { color: var(--text-tertiary); font-weight: 400; }
.yv-life-tag {
  font-size: 9px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.02em;
  color: var(--text-tertiary); background: var(--bg); padding: 1px 5px;
  border-radius: var(--radius-pill); margin-left: 2px;
}

/* Auto-suggest transition banner (subtle, dismissable). */
.yv-life-suggest {
  display: flex; align-items: center; justify-content: space-between; gap: var(--space-2);
  margin: var(--space-2) 0 0; padding: 7px 8px 7px 11px;
  background: var(--accent-soft); border: 1px solid var(--accent-mid);
  border-radius: var(--radius-md);
}
.yv-life-suggest-text { font-size: 12px; color: var(--accent-strong); min-width: 0; }
.yv-life-suggest-actions { flex: 0 0 auto; display: flex; align-items: center; gap: 4px; }
.yv-life-suggest-x { width: 24px; height: 24px; color: var(--text-tertiary); }
.btn-xs { padding: 4px 10px; font-size: 12px; border-radius: var(--radius-sm); }

/* DD transfer-timing row (Settings → "Direct-deposit transfer timing"):
   the three mini inputs ("in"/"season"/"back") previously sized by a
   per-item max-width guess (130/150/140px) tuned to roughly fit each
   suffix word — close but never exactly equal, and wrapped untidily on
   phones since nothing forced equal widths once they broke to new rows.
   Round 58: a real 3-equal-column grid instead. `auto-fit` + `minmax`
   lets the browser collapse to fewer columns (down to 1) on narrow
   viewports while every column in a row is still forced equal width by
   the grid itself — no hardcoded breakpoint needed, and identical widths
   hold at every size by construction rather than by three coincidentally
   close magic numbers. 132px min: the base .input-group.with-suffix .input
   rule (~line 1721) reserves 28px left + 60px right padding for the
   prefix/suffix mechanism, so anything much narrower clips the value
   itself before it ever reaches the suffix — checked against a
   defensively-typed 3-digit value ("999", beyond the inputs' own max="10")
   at 320px viewport width to confirm no crowding/clipping. */
.dd-timing-row {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(132px, 1fr));
  gap: 10px;
  margin-top: 6px;
}
.dd-timing-row .input-group { width: 100%; max-width: 100%; }

/* Uniform action-button grid: same auto-fit/minmax approach as
   .dd-timing-row above, applied to rows of standalone buttons (Settings
   sync-actions row, data-management row) that previously used
   `display:flex; flex-wrap:wrap`, which let buttons keep their intrinsic
   (label-driven) widths and wrap into ragged, mismatched-width rows on
   phones — e.g. "Save & test" (narrow) next to "Restore from history"
   (wide) breaking untidily at 375px. `auto-fit` + `minmax` forces every
   button in a row to the same width and collapses to fewer columns as
   the viewport narrows, with no hardcoded breakpoint (Round 60). 140px
   min comfortably fits the longest label ("Restore from history") at
   1-per-row on the narrowest supported phone width without truncation. */
.btn-grid {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(140px, 1fr));
  gap: var(--space-2);
}
.btn-grid .btn { width: 100%; justify-content: center; }

.offer-actions {
  display: flex;
  gap: var(--space-1);
  align-items: center;
  flex-wrap: wrap;
  margin-top: auto;
}

/* ============================================================
   TIMELINE — labels and tracks live in TWO SEPARATE CONTAINERS
   side-by-side. The labels column never scrolls; the tracks column
   scrolls horizontally on its own. They share no scroll parent, so
   bars can never bleed visually behind the labels.
   ============================================================ */
/* Timeline: single scroll container; labels use position:sticky left:0
   so the Y-axis stays frozen while the X-axis (tracks) scrolls. */
.timeline-wrap {
  background: var(--card);
  border-radius: var(--radius-xl);
  box-shadow: var(--shadow-card);
  overflow-x: auto;
  overflow-y: visible;
  scrollbar-width: thin;
}
/* NOTE: do NOT add `-webkit-overflow-scrolling: touch` here. On iOS Safari
   it forces a UIScrollView compositing layer that breaks horizontal
   `position: sticky` on the label column — the Y-axis would scroll off.
   iOS 13+ has momentum scrolling by default, so it isn't needed. */

.timeline-row {
  display: flex;
  border-bottom: 1px solid var(--border-soft);
  min-height: 44px;
  /* width:100% fills the wrap on desktop (track stretches); min-width:
     max-content forces the row to span label+track (≥ track min-width) when
     narrower than the content, so the sticky label can stay pinned across
     the FULL horizontal scroll range. Without this the row is clamped to the
     viewport width and the sticky label gets dragged off near the scroll end. */
  width: 100%;
  min-width: max-content;
}
.timeline-row:last-child { border-bottom: none; }
.timeline-row.axis-row { min-height: 32px; }

.timeline-row-label {
  flex: 0 0 157px;
  width: 157px;
  min-width: 0;
  overflow: hidden;
  position: -webkit-sticky; /* iOS Safari fallback — see .timeline-wrap note */
  position: sticky;
  left: 0;
  z-index: 2;
  display: flex;
  flex-direction: column;
  justify-content: flex-start;
  padding: 5px var(--space-3) 6px;
  font-size: 13px;
  font-weight: 500;
  color: var(--text);
  background: var(--card);
  border-right: 1px solid var(--border-soft);
  box-sizing: border-box;
}
.timeline-row-label.axis {
  height: 32px;
  min-height: 32px;
  font-size: 11px;
  color: var(--text-tertiary);
  text-transform: uppercase;
  /* R62: tightened from 0.05em to match the hero label — the uppercase
     date-range row ("JUL 13 → AUG 22") read too spaced-apart. */
  letter-spacing: 0.02em;
  justify-content: center;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}
/* Name span: truncate with ellipsis; line-height 1.35 ensures descenders (g,y,p) aren't clipped */
.tl-row-name {
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
  line-height: 1.35;
  min-width: 0;
}
.timeline-row-label .sub { font-size: 11px; color: var(--text-tertiary); margin-top: 1px; line-height: 1.3; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

.timeline-row-track {
  flex: 1 1 0;
  min-width: 600px;
  position: relative;
  box-sizing: border-box;
}
.timeline-row-track.axis { min-height: 32px; }

.tl-bar {
  position: absolute;
  top: 50%;
  height: 22px;
  min-width: 28px;
  transform: translateY(-50%);
  border-radius: 7px;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 0 6px;
  font-size: 11px;
  font-weight: 600;
  color: var(--accent-strong);
  background: var(--accent-soft);
  border: 1.5px solid var(--accent-mid);
  white-space: nowrap;
  overflow: hidden;
}
.tl-bar.confirmed { background: rgba(91, 92, 246, 0.16); border-color: var(--accent); color: var(--accent-strong); }
.tl-bar.hypothetical { background: repeating-linear-gradient(45deg, rgba(91,92,246,0.10), rgba(91,92,246,0.10) 6px, rgba(91,92,246,0.18) 6px, rgba(91,92,246,0.18) 12px); border: 1.5px dashed var(--accent); color: var(--accent-strong); }
.tl-bar.completed { background: var(--bg); border-color: var(--border-strong); color: var(--text-tertiary); }
.tl-bar.cancelled { opacity: 0.4; }

/* Per-offer color: override the bar's left border with the offer's
   identity color. Keeps the status fill intact (so confirmed vs
   hypothetical vs completed still reads) but adds a vertical color
   stripe at the start of each bar matching the chart marker stroke
   and the offer card border. */
.tl-bar.has-color {
  border-left: 4px solid var(--offer-color);
  border-left-color: var(--offer-color);
}

.tl-axis {
  position: relative;
  height: 32px;
  border-bottom: 1px solid var(--border);
  font-size: 11px;
  color: var(--text-tertiary);
}
.tl-axis-tick { position: absolute; transform: translateX(-50%); padding-top: 4px; font-weight: 500; }
.tl-axis-tick::before {
  content: '';
  position: absolute;
  top: -4px; left: 50%;
  width: 1px; height: 6px;
  background: var(--border-strong);
}

.tl-grid-line {
  position: absolute;
  top: 0; bottom: 0;
  width: 1px;
  background: var(--border-soft);
}

/* Today indicator on Timeline — neutral gray (not accent purple) so it
   doesn't compete with Outflow purple bubbles or the included-offer accent.
   Same family as the chart's Today marker (#9099a8 line, #6b7280 pill). */
.tl-today {
  position: absolute;
  top: 0; bottom: 0;
  width: 1px;
  background: #9099a8;
  pointer-events: none;
}
.tl-today::before {
  content: 'Today';
  position: absolute;
  top: 4px;
  left: 0;
  transform: translateX(-50%);
  background: #6b7280;
  color: white;
  font-size: 10px;
  font-weight: 600;
  padding: 1px 6px;
  border-radius: 4px;
  white-space: nowrap;
}
/* Only the axis row gets the "Today" pill — suppress on data bars */
.timeline-row-track .tl-today::before {
  content: none;
}

.tl-shortfall-band {
  position: absolute;
  top: 0; bottom: 0;
  background: rgba(239, 68, 68, 0.08);
  border-left: 1px dashed rgba(239, 68, 68, 0.5);
  border-right: 1px dashed rgba(239, 68, 68, 0.5);
  pointer-events: none;
}

/* ============================================================
   FORMS
   ============================================================ */
.form-section {
  background: var(--card);
  border-radius: var(--radius-xl);
  padding: var(--space-6);
  box-shadow: var(--shadow-card);
}

.form-section + .form-section { margin-top: var(--space-4); }

.form-section h2 {
  font-size: 17px;
  font-weight: 600;
  letter-spacing: -0.01em;
  margin-bottom: var(--space-1);
}
.form-section .section-desc { font-size: 13px; color: var(--text-secondary); margin-bottom: var(--space-5); }

.form-grid {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
  gap: var(--space-4);
  /* Stretch each field to fill its cell so the input within can pin to
     the bottom — that way labels of different lengths (one-liner vs
     wrapped two-liner) don't push their inputs onto different baselines. */
  align-items: stretch;
}

.field {
  display: flex;
  flex-direction: column;
  gap: 6px;
  /* `min-width: 0` lets the field shrink below the intrinsic size of its
     contents (e.g. long hint text). Without this, flex/grid items have
     `min-width: auto` which forces the cell wider than the parent and
     creates the modal-wide horizontal-scroll bug on phones. */
  min-width: 0;
}
/* Round 58: one step lighter (--text-secondary → --text-tertiary) and one
   weight step down (600 → 500) so these read as quiet wayfinding — never
   competing with the darker, heavier input VALUE text below. */
.field label, .field-label {
  font-size: 12px;
  font-weight: 500;
  color: var(--text-tertiary);
  text-transform: uppercase;
  letter-spacing: 0.02em;
  line-height: 1.25;
}
/* OFFER-FORM ONLY: the dense 2-column offer modal needs reserved label
   height + bottom-pinned inputs so a 2-line label and a 1-line label in
   the same row keep their inputs on one baseline. Scoped to #offer-form
   so it doesn't distort the single-column Settings forms (which have
   hints in varying positions and were rendering at uneven heights). */
#offer-form .field label { min-height: 30px; display: flex; align-items: flex-end; }
/* Round 58: the bottom-pin rule above is meant for the GROUP-level label
   ("Offer type *") sitting outside a box, but `label` also matches every
   individual segment `<label>` inside a nested .radio-group (Offer type,
   DD-requirement mode, Funded/Open date) — its `align-items: flex-end`
   was winning over .radio-group label's own `align-items: center` (same
   specificity elsewhere, but here the shared #offer-form .field ID+class
   prefix ties them, and source order decided it), bottom-anchoring text
   in the pill instead of centering it. Needed one more class than the
   rule above to win on specificity within #offer-form; the plain
   `.radio-group label` rule (~line 1808) already centers correctly for
   the one segmented control outside #offer-form (Settings → Default lock
   interval start), so this override only needs to exist here. */
#offer-form .field .radio-group label {
  min-height: 40px;
  display: flex;
  align-items: center;
  justify-content: center;
}
#offer-form .field > .input,
#offer-form .field > .select,
#offer-form .field > .textarea,
#offer-form .field > .input-group,
#offer-form .field > .radio-group {
  margin-top: auto;
}

/* ============================================================
   FIELD-BOX — single-value text/number/date/select container
   ============================================================
   Fintech-settings-style pattern (owner-provided reference, Round 57):
   the label moves INSIDE a rounded bordered "well" that sits above the
   value on its own line, borderless input beneath it. Scoped to fields
   whose primary control is a single input/select/textarea (or an
   .input-group wrapping one) — radio-groups, checkbox stacks, and the
   color picker keep their existing look (per AGENTS.md: don't touch
   what isn't broken, and those controls don't map to a "label above
   value" shape). Uses the app's own --card-soft/--border-soft "recessed
   panel" pairing already established by .card-soft/.ddm-panel/table
   headers — NOT the reference screenshot's literal colors. */
.field-box {
  display: flex;
  flex-direction: column;
  gap: 6px;
  width: 100%;
  min-width: 0;
  box-sizing: border-box;
  padding: 10px 18px;
  background: var(--card-soft);
  border: 1px solid var(--border-soft);
  border-radius: var(--radius-lg);
  transition: border-color 0.15s, box-shadow 0.15s;
}
.field-box:focus-within {
  border-color: var(--accent);
  box-shadow: 0 0 0 3px var(--accent-soft);
}
/* Label inside the box: small, muted, normal weight, sits above the
   value — overrides the uppercase/letter-spaced look used by labels
   OUTSIDE a box (radio-group headings, checkbox rows, etc). Round 58:
   color matched to the same --text-tertiary muted tone as the outside-box
   group labels (was --text-secondary, one shade darker than the group
   labels — now both label registers read as the same quiet wayfinding). */
.field-box label, .field-box .field-label {
  font-size: 12px;
  font-weight: 500;
  color: var(--text-tertiary);
  text-transform: none;
  letter-spacing: 0;
  line-height: 1.3;
  min-height: 0;
  display: block;
}
.field-box:focus-within label { color: var(--accent); }
/* The control itself becomes borderless/transparent — the box IS the
   border now. Re-declared with higher specificity than the base
   .input/.select/.textarea rule rather than stripping border there,
   since plain (non-boxed) inputs don't exist in this app after R57 but
